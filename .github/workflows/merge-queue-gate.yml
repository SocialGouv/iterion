# Mirrors Revi's `revi/review` verdict from a pull request's head onto the
# merge-queue branch built from it.
#
# Why this exists: `revi/review` is a REQUIRED status check, and it is posted by
# the iterion server's forge client in response to a `pull_request` event (see
# pkg/server/forge_publish.go postGateStatus, which resolves the PR head SHA).
# A merge-queue branch — `gh-readonly-queue/main/pr-<n>-<base>` — is created by
# a `merge_group` event and is not a pull request, so no review ever runs on it
# and no status is ever posted. The queue then waits for a context that cannot
# arrive, times out after `check_response_timeout_minutes` (60), and dequeues
# the PR. Measured 2026-07-28 on PR #307: all eight Actions checks green on the
# queue branch, commit status `pending` with zero contexts, 62 minutes in
# AWAITING_CHECKS. Every PR behind it was stuck too.
#
# It MIRRORS the verdict rather than asserting success. A PR can only enter the
# queue once its head is CLEAN, which already requires `revi/review` to have
# passed there, so reading the real status is both honest and free — and if that
# invariant ever changes, this propagates the actual verdict instead of hiding
# it. A head carrying no `revi/review` at all posts nothing: the context is not
# part of that repository's gate, and inventing a `failure` would create a block
# that did not exist.
#
# WHERE it runs: this job is repo-owned glue reading public API state, so it
# takes the same self-hosted routing expression as every required job in
# tests.yml (byte-equality pinned by internal/ciguard's routing guard, which
# reads this file alongside tests.yml as of the aggregator split) and frees
# one of the org's 20
# GitHub-hosted slots per queue entry. The trade-off, said plainly: when the
# scale set is down, this job now queues behind that outage instead of failing
# fast on ubuntu-latest — the entry waits up to check_response_timeout_minutes
# rather than learning immediately. The same `CI_SELF_HOSTED=off` lever that
# moves tests.yml to GitHub-hosted moves this job too; it is the rollback, not
# a separate decision. The API calls go through curl + jq rather than `gh`
# because the runner image (ci/arc-runner) ships neither gh nor a pin for it,
# and jq/curl ship with the upstream image.
name: merge queue gate

on:
  merge_group:

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  mirror-revi-verdict:
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    timeout-minutes: 5
    steps:
      - name: Mirror the PR head's revi/review verdict onto the queue branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com"
          auth="Authorization: Bearer $GH_TOKEN"

          # refs/heads/gh-readonly-queue/<base>/pr-<number>-<base-sha>
          pr="$(printf '%s' "$HEAD_REF" | sed -n 's|.*/pr-\([0-9]\+\)-[0-9a-f]\+$|\1|p')"
          if [ -z "$pr" ]; then
            echo "::error::could not read a PR number out of head_ref '$HEAD_REF'"
            exit 1
          fi
          echo "queue branch belongs to PR #$pr; queue sha $QUEUE_SHA"

          head_sha="$(curl -fsSL -H "$auth" "$api/repos/$REPO/pulls/$pr" | jq -r '.head.sha')"
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "::error::PR #$pr has no head sha"
            exit 1
          fi

          # Newest status first, so this reads the current verdict on the head.
          status="$(curl -fsSL -H "$auth" "$api/repos/$REPO/commits/$head_sha/status")"
          verdict="$(jq -r '[.statuses[] | select(.context=="revi/review")][0] | (.state // empty)' <<<"$status")"
          target="$(jq -r '[.statuses[] | select(.context=="revi/review")][0] | (.target_url // empty)' <<<"$status")"

          if [ -z "$verdict" ]; then
            echo "PR #$pr head ($head_sha) carries no revi/review status — the gate is not" \
                 "in use for it, so nothing to mirror. Posting nothing on purpose:" \
                 "a fabricated failure would block what was never gated."
            exit 0
          fi

          echo "mirroring revi/review=$verdict from $head_sha onto $QUEUE_SHA"
          body="$(jq -n --arg state "$verdict" --arg desc "mirrored from PR #$pr head ${head_sha:0:9}" --arg target "$target" \
            '{state: $state, context: "revi/review", description: $desc} + (if $target != "" then {target_url: $target} else {} end)')"
          # No -f: a rejected status (422) must surface GitHub's reason, not
          # just curl's error number — capture the code, print the body on
          # anything but 2xx. (gh printed the body; parity is the point.)
          http="$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$body" -o /tmp/mirror-status.out -w '%{http_code}' "$api/repos/$REPO/statuses/$QUEUE_SHA")"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::status POST answered HTTP $http:"
            cat /tmp/mirror-status.out
            exit 1
          fi

          if [ "$verdict" != "success" ]; then
            echo "::error::PR #$pr head carries revi/review=$verdict — mirrored, so the queue" \
                 "will reject this entry rather than wait for a status that never comes."
            exit 1
          fi
