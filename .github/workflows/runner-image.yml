name: 🏃 Runner Image

# The cloud runner image (`iterion-runner-devbox`), amd64, on its OWN signal.
# Prod's runner pods track `iterion-runner-devbox:edge` (a rolling main tag),
# so the runner's deploy-critical path is main pushes — decoupled here from the
# server image (image.yml) so neither waits on the other.
#
# It bakes the iterion binary via COPY --from=iterion:edge, so it MUST run
# AFTER the server image is published: triggered by image.yml's completion
# (workflow_run) on main. Its own completion = the "runner ready to redeploy"
# signal. Release (`:vX.Y.Z`, multi-arch, signed) is produced off the critical
# path by release-images.yml — prod's runner doesn't track the release tag.

on:
  # Fires when image.yml finishes; guarded below to a successful main build.
  workflow_run:
    workflows: ["🐳 Container Image"]
    types: [completed]
  # PR validation when the runner Dockerfile (or its inputs) changes — builds
  # against the published :edge server image, validate-only (no push).
  pull_request:
    paths:
      - "Dockerfile.runner-devbox"
      - "docker/**"
      - ".github/workflows/runner-image.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the latest binary matters for the rolling :edge, and there is no base
  # build to protect here — cancel a superseded refold instead of queueing it.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prep:
    # workflow_run fires for every image.yml run (main, tags, PRs). Only build
    # the runner for a SUCCESSFUL MAIN build (the rolling :edge the prod runner
    # tracks); tags go through release-images.yml, PRs never publish.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           (github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
    steps:
      - id: vars
        run: echo "owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-runner-devbox:
    needs: prep
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit
    with:
      image-name: iterion-runner-devbox
      routing-name: iterion-runner-devbox
      context: .
      file: Dockerfile.runner-devbox
      # :edge — the tag image.yml just published on main, and the tag prod runs.
      build-args: ITERION_IMAGE=ghcr.io/${{ needs.prep.outputs.owner_lc }}/iterion:edge
      is-pr: ${{ github.event_name == 'pull_request' }}
      multiarch: false
