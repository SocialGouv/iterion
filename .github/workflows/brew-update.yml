name: 🍺 Brew Tap Update

# The tap update runs ONCE PER DAY on a schedule, not once per release.
# Measured on #2241 (2026-10): one tap PR per release meant one main commit
# per release, and the release train's cadence kept evicting the head of
# the merge queue — a PR sat CLEAN for three days without merging, each
# tap commit re-running the group behind it.
#
# A scheduled run resolves the NEWEST v* tag newer than what the tap
# formula already carries (intermediate releases never need tap entries —
# the formula points at the latest), downloads that release's artefacts,
# and opens ONE tap PR carrying the day's update. The skip only fires
# when BOTH the formula and the cask already carry the tag: a release
# whose desktop artefacts landed after the last run re-taps its formula
# side the next day, and update-brew-tap.sh's all-or-nothing guard keeps
# a partial download from advancing anything.
#
# `workflow_dispatch` stays for backfill (replay an old tag with `tag`,
# or force a run without one to process the latest pending).

on:
  schedule:
    # 04:37 UTC — before the workday, away from the merge queue's busy
    # hours. The minute is deliberately off the round marks.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to tap (e.g. v0.5.0). Empty = the newest tag newer than the tap's version."
        required: false
        type: string

concurrency:
  # Serialise tap updates: concurrent runs would race on the tap branch
  # and its PR. Never cancel — a run carries artefacts that need to land
  # in the tap.
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write   # required by SocialGouv/token-bureau (OIDC exchange)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub App Token
        id: token
        uses: SocialGouv/token-bureau@453f0eeb5add59489df124a0aedcb20a9b7fb027 # main
        with:
          token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
          audience: socialgouv

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          # Need tags to resolve the newest release tag.
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin >/dev/null
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            # The newest v* tag; skipped when the tap formula already
            # carries it (nothing released since the last update).
            tag="$(git tag --sort=-creatordate | grep '^v' | head -n1 || true)"
          fi
          if [ -z "$tag" ]; then
            echo "no v* tag found; nothing to tap"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "resolved tag=$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          current_formula="$(sed -n 's/^[[:space:]]*version[[:space:]]*"\(.*\)".*/\1/p' Formula/iterion.rb | head -n1 || true)"
          current_cask="$(sed -n 's/^[[:space:]]*version[[:space:]]*"\(.*\)".*/\1/p' Cask/iterion-desktop.rb | head -n1 || true)"
          vtag="${tag#v}"
          # Downgrade guard: a maintenance tag created AFTER a newer
          # release (a hotfix cut from an older branch) must not walk the
          # tap backwards. sort -V compares semver, not strings.
          newest="$(printf '%s\n%s\n' "${current_formula:-0}" "$vtag" | sort -V | tail -n1)"
          if [ "$newest" != "$vtag" ]; then
            echo "tag $tag is not newer than the tap's $current_formula — nothing to update"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip only when BOTH files carry the tag: skipping on the
          # formula alone froze the desktop cask for a whole release
          # cycle once (measured). A release without the desktop ZIP
          # costs a no-op run, never a stale cask.
          if [ "$vtag" = "$current_formula" ] && { [ -z "$current_cask" ] || [ "$vtag" = "$current_cask" ]; }; then
            echo "the tap already carries $vtag (formula and cask); nothing to update"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the tap branch
        # The tap change lands as its OWN queued PR, not as a push to main:
        # a direct push invalidates the merge group at the head of the queue
        # and makes every PR behind it rebuild (~20-25 min, measured on
        # #766).
        if: steps.tag.outputs.skip != '1'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/brew-tap-pr.sh branch "$TAG"

      - name: Download release assets
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          # CLI binaries ship with .sha256 sidecars (see release.yml).
          # The desktop ZIP does not — update-brew-tap.sh computes the
          # hash locally when the sidecar is missing.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern 'iterion-darwin-*' \
            --pattern 'iterion-linux-*' \
            --pattern 'iterion-desktop-darwin-universal.zip' \
            || true
          ls -la artifacts/ || true

      - name: Update tap
        if: steps.tag.outputs.skip != '1'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          bash scripts/update-brew-tap.sh "$VERSION" artifacts

      - name: Open (or update) the tap PR
        # GH_TOKEN is the token-bureau App installation token, not
        # GITHUB_TOKEN: a PR opened by GITHUB_TOKEN gets no workflow runs, so
        # its required checks would never report and auto-merge would wait
        # forever. The App token needs `pull_requests: write` on top of the
        # `contents: write` the push already uses — if the bureau's grant is
        # narrower, `gh pr create` fails here rather than silently leaving
        # the tap behind.
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/brew-tap-pr.sh publish "$TAG"
