name: 🍺 Brew Tap Update

# The tap update runs ONCE A NIGHT, right after version.yml's nightly run
# completes, not once per release. Measured on #2241 (2026-10): one tap PR
# per release meant one main commit per release, and the release train's
# cadence kept evicting the head of the merge queue — a PR sat CLEAN for
# three days without merging, each tap commit re-running the group behind it.
#
# Chained to the nightly rather than on a cron of its own, because that is
# what lands it at night. GitHub fires this repository's schedules 1.5 to 8
# hours late: a 04:37 UTC cron here fired between 10:46 and 12:21 UTC, inside
# the queue's working hours, while the nightly (22:27 UTC) fired between 00:03
# and 02:21 UTC on each of its 27 runs since 2026-09-11. Over 2026-09-12..10-12
# each hour from 00:00 to 05:59 UTC saw 2-7 merges in all — about one a week —
# against 19-37 for each hour from 06:00 to 21:59, about one a day. A nightly
# GitHub drops (four in a row, 2026-10-02..05) delays the tap just as long.
#
# A run resolves the NEWEST v* tag, at or above what the tap formula carries,
# whose release holds the four CLI binaries (intermediate releases never need
# tap entries — the formula points at the latest). The nightly's own tag is
# usually still building when this runs: it is passed over and tapped the
# next night, instead of stalling every night it builds. The skip only fires
# when BOTH the formula and the cask already carry the tag: a cask left
# behind catches up with that release's desktop ZIP once it exists, and
# update-brew-tap.sh's all-or-nothing guard keeps a partial download from
# advancing anything. Nothing ever walks the tap back, and a pre-release is
# never tapped. A desktop-only release (its CLI build red) reaches the cask
# only through a dispatch with its tag, while the formula is still below it.
#
# The PR it opens skips tests.yml's heavy jobs: its header says why, and how
# `brand` verifies that the PR touches the tap alone.
#
# `workflow_dispatch` stays for backfill (replay an old tag with `tag`,
# or force a run without one to process the latest pending).

on:
  workflow_run:
    # version.yml's `name:`, byte for byte (the emoji carries a variation
    # selector): a workflow_run naming a workflow that does not exist never
    # fires, and says nothing. internal/ciguard compares the two.
    workflows: ["🏷️ Version"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to tap (e.g. v0.5.0). Empty = the newest tag, at or above the tap's version, whose release holds the CLI binaries."
        required: false
        type: string

concurrency:
  # Serialise tap updates: concurrent runs would race on the tap branch
  # and its PR. Never cancel — a run carries artefacts that need to land
  # in the tap.
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write   # required by SocialGouv/token-bureau (OIDC exchange)

jobs:
  update:
    # version.yml also completes once per merged pull request; only its
    # nightly run taps. Any conclusion: a nightly that failed to release
    # leaves the earlier releases to tap all the same.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub App Token
        id: token
        uses: SocialGouv/token-bureau@453f0eeb5add59489df124a0aedcb20a9b7fb027 # main
        with:
          token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
          audience: socialgouv

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          # Need tags to resolve the newest release tag.
          fetch-depth: 0

      - name: Resolve tag
        # The newest tag with complete CLI artefacts, at or above the tap's
        # version — scripts/brew-tap-resolve.sh says why each rule is there.
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags origin >/dev/null
          bash scripts/brew-tap-resolve.sh

      - name: Prepare the tap branch
        # The tap change lands as its OWN queued PR, not as a push to main:
        # a direct push invalidates the merge group at the head of the queue
        # and makes every PR behind it rebuild (~20-25 min, measured on
        # #766). The script reads whether the tag's PR is open, hence gh.
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/brew-tap-pr.sh branch "$TAG"

      - name: Download release assets
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          # CLI binaries ship with .sha256 sidecars (see release.yml).
          # The desktop ZIP does not — update-brew-tap.sh computes the
          # hash locally when the sidecar is missing.
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern 'iterion-darwin-*' \
            --pattern 'iterion-linux-*' \
            --pattern 'iterion-desktop-darwin-universal.zip' \
            || true
          ls -la artifacts/ || true

      - name: Update tap
        if: steps.tag.outputs.skip != '1'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          bash scripts/update-brew-tap.sh "$VERSION" artifacts

      - name: Open (or update) the tap PR
        # GH_TOKEN is the token-bureau App installation token, not
        # GITHUB_TOKEN: a PR opened by GITHUB_TOKEN gets no workflow runs, so
        # its required checks would never report and auto-merge would wait
        # forever. The App token needs `pull_requests: write` on top of the
        # `contents: write` the push already uses — if the bureau's grant is
        # narrower, `gh pr create` fails here rather than silently leaving
        # the tap behind.
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/brew-tap-pr.sh publish "$TAG"
