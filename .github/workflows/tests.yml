name: 🧪 Tests

# One run per commit, not two. An unfiltered `push:` alongside `pull_request:`
# ran the whole suite twice for every PR commit — same sha, two runs, escaping
# each other's concurrency group because their refs differ
# (refs/heads/<branch> vs refs/pull/N/merge). That doubled the runner cost and,
# worse, doubled the exposure to a timing-sensitive test: one run green, the
# other red on the same commit is enough to redden the PR and disarm auto-merge.
#
# `merge_group` is load-bearing: test/vendor-check/golangci/brand are
# REQUIRED checks, and the queue branch
# (gh-readonly-queue/main/...) used to get them from that unfiltered push. A
# queue build with no checks waits for a context that never arrives and
# dequeues the PR after the 60-minute timeout.
# A release commit does not cancel the merge it followed (#3161). A
# concurrency group with cancel-in-progress is the SAME group for every commit
# on `main`, so each push kills the run before it. A merge is immediately
# followed by the release bot's `chore: release`, landing with no PR, so that
# release cancelled the witness of the merge that triggered it. Measured over
# 100 `main` pushes under a ref-keyed cancelling group: 51 runs cancelled, 26
# by a release push and 25 by an ordinary merge. The concurrency block below
# never cancels a push run in progress; it keeps one push group, so at most
# one push run is in flight and one pending, a newer pending run replacing the
# older one: the heavy load after merges is one witness of the merged batch at
# a time (ADR-173), not one heavy run per merge.
#
# `paths-ignore` keeps a release from costing a heavy run: no run is CREATED
# for a release commit. It is scoped to `push` alone — a pull request or a
# queue build touching these files
# still runs the full suite, and the nine other workflows that fire on push
# (images, release, docs) are untouched, which `[skip ci]` in the release
# message could not have said.
#
# The paths are what a release writes, each by a declared writer: package.json
# (release-it's bump), CHANGELOG.md (.release-it.mjs `infile`),
# charts/iterion/Chart.yaml (scripts/sync-chart-version.sh at after:bump) and
# internal/mdcode/testdata/committed-reading.txt (cmd/corpus-reading --cut at
# before:git:beforeRelease). Over the last 100 releases: package.json,
# CHANGELOG.md and the chart 100/100, the reading golden 72/100 — a release
# that writes only the first three is a SUBSET of this list, so it is skipped
# too. Exactly two releases ever carried a fifth path, both from
# `cmd/release-floors --apply` realigning syntax-floor pins.
#
# A release touching anything outside the list simply creates its own run: the
# failure mode of this filter is one extra run, never a new defect. What WOULD break it silently is renaming one of these paths, so
# internal/ciguard pins them against the tree — and pins the one direction that
# breaks a MERGE rather than a convenience: a path filter must never reach
# `pull_request:` or `merge_group:`, which produce the required checks.
#
# The residual, measured at push level because that is what GitHub filters: of
# the last 55 pushes to `main`, 17 would be skipped and all 17 are
# `chore: release` — no ordinary push lost a witness. A path filter reads the
# WHOLE push diff rather than the tip commit, so a landing train that happens
# to END on a corpus re-pin still runs. And a bad release cut cannot hide in
# the gap: internal/mdcode re-derives the reading from the tree and compares it
# byte for byte, on every pull request branched after the release, not merely
# on `main`'s next commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - charts/iterion/Chart.yaml
      - internal/mdcode/testdata/committed-reading.txt
      - package.json
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  # The nightly full suite (ADR-173), a BACKSTOP: GitHub delays this repo's
  # crons by hours or drops them, so the debounced push (heavy-gate below)
  # carries the heavy cadence, and a nightly that fires costs one heavy run.
  # 01:47 UTC — off the :00/:30 marks where every scheduled workflow in the
  # fleet lands, and away from test-quarantine's 03:17.
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed by event as well as ref: the nightly and a dispatch run on `main`'s
# ref, and sharing push's group would let a merge displace the nightly — or the
# nightly a merge's witness. Every push to `main` shares one group, and a push
# never cancels the run in progress: GitHub keeps that run, holds at most one
# pending run behind it and replaces the pending one with each newer push. So
# the post-merge witness runs one at a time, of the batch merged since the
# last run started (ADR-173), whatever the merge rate, and the heavy-gate of a
# pending run reads a history in which the run before it has completed; a
# release push landing behind a merge displaces only a run still pending. No
# `queue:` key: it would keep every pending run. Every other
# event cancels in progress, so a newer commit of a pull request still cancels
# the older run, and so does a label (#3738): a `labeled` run is a
# synchronize of the same head, judged on the labels it carries, so the run
# it replaces loses nothing the new one does not redo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# EXPERIMENTAL DELIVERY MODE (docs/adr/173-experimental-delivery-mode.md,
# #3691): while the project is experimental the merge queue gates on the
# LIGHT layer — unit, studio, native exec, lint, vendor, brand, fmt and Revi —
# and the HEAVY layer (`race-shard`, `test-e2e`, `mongo-conformance`,
# `cloud-e2e`) runs after the merge instead: on the DEBOUNCED PUSH — the
# first push to `main` after CI_HEAVY_EVERY_HOURS hours (default 6) without a
# completed heavy run on main, decided by the `heavy-gate` job (#3737) — on
# the nightly schedule above, on a dispatch and on a pull request labelled
# `ci:full`. Every other push to `main` is a LIGHT witness of its batch. ONE
# literal decides it, the heavy jobs' own condition:
#
#   ((github.event_name != 'pull_request' && github.event_name != 'merge_group'
#       && (github.event_name != 'push'
#           || needs.heavy-gate.outputs.heavy != 'false'))
#     || contains(github.event.pull_request.labels.*.name, 'ci:full'))
#
# true on schedule and dispatch — any event that is neither a pull request, a
# queue build nor a push, so a trigger added later runs the full suite by
# default — on a push the gate did not decide light (`false` is the only
# light answer: a gate that failed or never answered leaves the output empty,
# and the push runs heavy), and on a labelled pull request; false in
# `merge_group`, on an unlabelled pull request and on a push inside the heavy
# window, the LIGHT runs. Every job that reads it `needs:` heavy-gate, and
# the heavy jobs prefix it with `!cancelled()`, so they still run where the
# gate skips (every event but push) or fails.
#
# PULL REQUEST CI ON DEMAND (#3738): a pull request runs the light layer only
# when it asks. A second literal, the LIGHT literal, sits in front of every
# job but `brand`, `heavy-gate` and the two aggregators:
#
#   (github.event_name != 'pull_request'
#     || contains(github.event.pull_request.labels.*.name, 'ci:run')
#     || contains(github.event.pull_request.labels.*.name, 'ci:full')
#     || github.event.pull_request.user.type == 'Bot'
#     || github.event.pull_request.head.repo.full_name != github.repository)
#
# It is true on every event that is no pull request — the merge queue, push,
# the nightly and a dispatch keep their layers untouched — and on a pull
# request labelled `ci:run` (or `ci:full`, which keeps meaning the heavy layer
# too), opened by a bot (an App's user is of type `Bot`: renovate,
# tokenbureau, dependabot) or from a fork. It reads the labels the pull
# request CARRIES, the same way on every activity type: `labeled` is a
# trigger so that labelling starts the run, and a `labeled` payload already
# holds the new label, so ANY label is a synchronize of the same head —
# `epic:…` on a `ci:run` pull request reruns the light layer, on an
# unlabelled one it refuses again. On a session pull request that did not
# ask, `test` and `race` FAIL with a message that names the policy and both
# ways out — the `ci:run` label or the train (`task ci:train`, which refuses
# a pull request touching .github/, scripts/ci/, Taskfile.yml or devbox.*:
# those need the label) — rather than skip: a skipped required check reports
# SUCCESS, and a pull request nothing tested would be green. They learn it
# from PR_CI, `refused` or `run`, rendered from the same literal. `brand`
# runs on every pull request as before: it is the tap skip's verifier, and
# nothing skips it. `vendor-check` and `golangci` (required) and `fmt-check`
# (staged: ruleset 18857412 requires test, vendor-check, golangci,
# revi/review and brand), skipped on a refusal, `needs: brand`: a skipped job reports SUCCESS the
# moment it is created, and `test` is created only when its legs concluded,
# so a skipped required job created first would be the newest — green —
# check of its name before the refusal exists. Behind brand they are created
# only after brand, whose check run is pending from the run's first instant,
# ran its steps on a runner, while `test`, whose legs all skip at that
# instant, is created as soon as they do.
#
# Jobs pick one of THREE sides of the merge queue, and internal/ciguard holds
# each side to its contract:
#
#   1. REQUIRED — the names ruleset 18857412 requires: test, vendor-check,
#      golangci, brand, revi/review, plus the STAGED `fmt-check` (in the
#      queue from day one, so its context exists the day the ruleset names
#      it). `test` is an AGGREGATOR: it runs no tests, it `needs:` its legs
#      and re-verifies every leg's conclusion, so the required NAME survives
#      while the work scales sideways. The ruleset lives outside this repo and
#      keeps its names — a PR that renamed a required job could never pass its
#      own queue build (the check would never report and the entry would hang
#      60 minutes). `race` and `mongo-conformance` left the ruleset with this
#      mode and return to it when the mode ends (ADR-173's exit criteria):
#      `race` stays an aggregator of the same shape, so its context keeps
#      reporting, and `mongo-conformance` runs with the heavy layer.
#   2. GATED LEGS — `test-unit`, `test-e2e`, `studio`, `test-native-exec`,
#      `race-shard`: the real work. They are deliberately NOT required — their
#      aggregator speaks for them. The only `if:` a leg carries is the light
#      literal above combined with the tap skip below, byte for byte (its
#      aggregator carries the tap skip too, and reads the light literal
#      through PR_CI): a leg that grew any other `if:` would skip silently in
#      the queue while its
#      aggregator re-verifies a `skipped` into red, and on pull requests the
#      guarantee would die without any queue signal — which is why ciguard
#      refuses any other `if:` on a leg outright, and refuses a leg without
#      the skip (it would spend the heavy minutes the skip exists to save).
#      The HEAVY legs, `race-shard` and `test-e2e`, carry `!cancelled()`
#      and the heavy literal above on top of it, byte for byte, so a LIGHT
#      run skips them (#3683 for the pull request, #3691 for the queue, #3737
#      for a push inside the heavy window). Their aggregators read LIGHT_RUN,
#      the negation of that same literal evaluated by GitHub, and forgive a
#      heavy leg's `skipped` only when it is `true`: on a heavy push,
#      `schedule`, a dispatch and a `ci:full` pull request it is `false`, and
#      a skipped heavy leg is red like a failed one. ciguard runs each
#      aggregator under both. To run the heavy legs on a pull request, add
#      the `ci:full` label: labelling starts the run (#3738).
#   3. ADVISORY — the jobs that cannot block a merge. Running one inside the
#      queue buys a verdict nobody can act on while holding a runner slot the
#      queue needs, so they run on the pull request and on main and skip in
#      `merge_group`. `cloud-e2e` and `mongo-conformance`, heavy, carry
#      `!cancelled()`, the light literal and the heavy literal: they skip the
#      queue, a light pull request and a light push. The other advisory jobs
#      carry `github.event_name != 'merge_group'` and the light literal.
#      `heavy-gate`, the decider, runs on push alone, so it skips the queue
#      too.

# The trap the aggregator design answers, twice over: a job skipped by a
# job-level `if:` reports SUCCESS, so a required check that never ran
# satisfies the gate — every queue entry would merge green on a check that
# did not execute. (A workflow-level filter is the opposite — the check never
# reports and the queue hangs. Same word, opposite failure.) The same trap
# reappears one level up with `needs:`: a plain `needs:` job is SKIPPED when
# a leg fails — so both aggregators carry `!cancelled()`, the one evaluated
# spelling (it reads only run-cancellation state, which cannot differ inside
# a merge_group run), combined with the tap skip their legs carry (an
# aggregator skips exactly the entries its legs skip, and nothing else), and
# re-verify every leg's `result == success` in their own step, turning any
# leg failure into a red REQUIRED check. ciguard's
# TestAggregatorsReVerifyEveryLeg pins that trio.
# Promoting an advisory job to required means deleting its skip in the same
# change — the skip and the ruleset entry are one decision, never two. The
# list lives in a ruleset, outside this repo, so nothing here can assert it —
# docs/merge-policy.md carries the same warning beside the required list.

# ONE condition is sanctioned on a required job, and that is exactly why it is
# verified rather than trusted. A Homebrew tap update — the
# `chore(brew): update tap to …` pull request brew-update.yml opens — moves
# the version and sha256 values of Formula/iterion.rb and
# Cask/iterion-desktop.rb, and no heavy job's verdict depends on those values
# (internal/ciguard's tap tests rewrite them); running them would spend ~57
# minutes of compute on each pass, on the pull request and again in the queue
# (measured on #2314). So the gated legs (`test-unit`, `test-e2e`, `studio`,
# `test-native-exec`, `race-shard`), the aggregators `test` and `race` that
# speak for them, `golangci`, `vendor-check` and `fmt-check` skip it.
# (`mongo-conformance` carries the heavy literal alone: no light run reaches
# it.) A title is only a claim, and a
# skipped job reports SUCCESS: `brand` — required, never skipped, and a
# reader of both tap files — receives the same predicate, evaluated, and
# scripts/ci/tap-entry-check.sh fails the pull request or the queue entry
# unless its diff moves those values and nothing else, and the queue groups
# ALLGREEN. Entries stack, so a skipped entry vouches for nothing ahead of it;
# ALLGREEN is what makes every entry pass on its own checks. internal/ciguard
# holds the expression, its copies and the verifier step together. `push` to
# main evaluates the predicate false: a push to main never skips on a tap
# title, and heavy-gate alone decides its heavy layer.

# WHERE these jobs run. The organisation shares 20 concurrent GitHub-hosted
# jobs across every repository, which is what makes a cycle here take 40
# minutes of wall clock for 30 minutes of compute. The self-hosted scale set
# `arc-runners` (org-scoped, ovh-dev) has no such cap.
#
# Two kinds of pull request stay on GitHub-hosted runners, and this is the
# security argument rather than a detail — the repository is PUBLIC and the
# self-hosted runners sit inside the cluster:
#
#   - a FORK PR: arbitrary code from anyone.
#   - a DEPENDENCY-UPDATE PR: its author has write access, but its CONTENT is
#     arbitrary upstream code. `pnpm install` and `go test` execute it, on the
#     very pull request proposing it, before a human has read the diff. Write
#     access is what the author holds; it says nothing about what npm shipped.
#
# The second is matched on the bot's IDENTITY, not on its branch prefix: a
# prefix is configuration, and a guard that reads configuration stops guarding
# the day someone changes it, silently. `endsWith` rather than an equality,
# because renovate runs here under a self-hosted App and its author is
# `socialgouv-renovate[bot]` (renovate.yml says so) — an equality on
# `renovate[bot]` matches nothing at all, and a guard that matches nothing
# looks exactly like a guard that works. `dependabot[bot]` is listed although
# Dependabot is retired here (no .github/dependabot.yml): a carve-out that
# covers a lane before it opens costs one literal, and the alternative is
# remembering this file the day someone turns it back on.
#
# The lever when the scale set stops serving is documented in
# docs/merge-policy.md, not only here — an operator hitting a fleet-wide merge
# stall reads the policy, not a workflow comment.
#
# A same-repo branch from a human or from one of this repository's own agents
# is a different thing: pushing it already requires write access, and its
# content is first-party.
#
# THE ESCAPE HATCH: setting the repository variable CI_SELF_HOSTED to `off`
# sends every job back to GitHub-hosted runners. It exists because REQUIRED
# checks route here on merge_group, so a scale set that stops serving
# makes every queue entry wait check_response_timeout_minutes (60) for a check
# that never reports, and then fail — all pull requests at once. A variable is
# deliberately the mechanism rather than an edit to this file: repairing by
# merging does not work when merging is what is broken. Unset means on.
#
# Two jobs carry a GitHub-hosted label whatever the ref: desktop-vet-linux
# (the platform-specific build) and docs-links (advisory and outside the queue).
# Every REQUIRED job routes through the expression below. One gated leg,
# test-native-exec, ends it on `vars.CI_NATIVE_EXEC_RUNNER || 'ubuntu-latest'`
# instead of the scale set: its Bubblewrap mount needs a namespace-capable VM,
# which ARC pods are not; its other clauses are this expression's, byte for
# byte (internal/ciguard's native_exec_runner_test.go).
# Measured 2026-09-08, on the six jobs routed self-hosted at
# the time: all six passed there, nine runner pods starting at once with no
# queueing.
#
# So the expression below reads, in three clauses:
#
#   CI_SELF_HOSTED == 'off'        -> GitHub-hosted   (the operator's lever)
#   fork pull request              -> GitHub-hosted   (arbitrary code, anyone)
#   dependency-bot pull request    -> GitHub-hosted   (arbitrary upstream code)
#   everything else                -> arc-runners
#
# It comes in THREE spellings, one per runner class, identical up to the
# variable of the last alternative, each `vars.CI_<CLASS>_RUNNER ||
# 'arc-runners'`: the repository variable names the class's scale set, and
# while it is unset the job lands on `arc-runners`, so an unset variable moves
# no job. SMALL (`CI_SMALL_RUNNER`): the `test` and `race` aggregators,
# fmt-check, vendor-check, govulncheck, docs-build, nats-conformance,
# desktop-vet-cross, brand, helm-lint. LARGE (`CI_LARGE_RUNNER`), the heavy
# jobs the merge queue requires: test-unit, golangci, studio. HEAVY
# (`CI_HEAVY_RUNNER`), the heavy layer the merge queue does not require, run
# after the merge (a `ci:full` pull request's `test` and `race` still wait on
# it): race-shard, test-e2e, mongo-conformance, cloud-e2e. The three clauses above
# apply to every spelling unchanged.
#
# It is repeated per job because `runs-on` cannot read workflow-level `env`,
# and routing it through a `needs:` job would put every job behind one
# GitHub-hosted slot — reintroducing the queue this exists to escape. That
# repetition is a drift risk on a SECURITY decision, so the copies are
# pinned against each other by TestSelfHostedRoutingExpressionsAgree in
# internal/ciguard: one copy edited alone turns it red, and so does a job on
# another class's spelling or a self-hosted job it does not classify.

jobs:
  # ---- the heavy decider: does this push to main run the heavy layer? ----

  heavy-gate:
    # The DEBOUNCED PUSH (ADR-173, #3737): a push to main stays light only
    # behind a GREEN heavy run on main inside the last CI_HEAVY_EVERY_HOURS
    # hours (default 6, at most 720); every other push runs the heavy layer.
    # GitHub's crons are delayed by hours or dropped on this repository, so
    # the push itself carries the heavy cadence and the nightly stays a
    # backstop. scripts/ci/heavy-gate.sh reads the run history; the newest
    # run whose heavy legs ran decides: a push, schedule or dispatch run of
    # this repository, created inside the window plus two hours, concluded
    # success, every `race-shard (N)` job a success. A red heavy run keeps
    # every push heavy until a green one lands. A rerun (GITHUB_RUN_ATTEMPT
    # above 1) decides heavy without reading the history, which cannot hold
    # the run being rerun. On an unreadable history or window it warns and
    # decides heavy — failing toward more testing.
    # CI_HEAVY_EVERY_HOURS=0 runs the heavy layer on every push.
    #
    # Push only: every other event decides by itself (the heavy literal reads
    # this job's output only under `github.event_name == 'push'`), and the
    # merge queue never spends a slot here. The heavy jobs and the aggregators
    # `needs:` it to read its output; the heavy jobs carry `!cancelled()`, so
    # where it skips they still run, and where it FAILS its output is empty,
    # which the heavy literal reads as heavy.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      heavy: ${{ steps.decide.outputs.heavy }}
    steps:
      - name: Checkout the decider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/heavy-gate.sh
          sparse-checkout-cone-mode: false

      - name: Decide heavy or light
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAVY_EVERY_HOURS: ${{ vars.CI_HEAVY_EVERY_HOURS || '6' }}
        run: scripts/ci/heavy-gate.sh

  # ---- gated legs: the real work, one side each, aggregated by `test` ----

  test-unit:
    # The Go unit half of what `test` ran as one mega-job. Split so the wall
    # clock stops stacking studio, e2e and unit on one pod (2026-10-04: the
    # mega-job was 24-26 min; unit alone was ~10, dominated by the single
    # `bots` package). Runs in the merge queue behind the required `test`
    # aggregator; carries the light literal and the tap skip, nothing else —
    # see the header.
    #
    # SHARDED three ways, like race-shard (#3402). Unsharded, the suite grew
    # to a 24.5-min `go test` step under a 30-min job ceiling: a slow runner
    # cut the next step and a suite whose every package passed read red in the
    # merge queue. Every package still runs: `./...` minus e2e and
    # pkg/sandbox/kubernetes (each proved by its own leg), partitioned by
    # scripts/ci/testshards with the UNIT weights table, a pure function of the
    # commit, so the three legs of one entry pick complementary sets. LPT seats
    # the heaviest row (`bots`) on shard 0; the one-time steps — the freshness
    # gate, gofmt, vet, the census and the live compile, ~5 min together — run
    # on the LAST shard, away from it. Should the weights ever put them
    # together, that shard still fits the ceiling.
    # A Homebrew tap update skips this leg: the header says why, and `brand` verifies it.
    if: "${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    # On the scale set: the namespace-bound package (pkg/sandbox/kubernetes,
    # whose native witnesses need a Bubblewrap mount ARC pods refuse) is
    # excluded from the partition and proved by test-native-exec instead.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_LARGE_RUNNER || 'arc-runners' }}
    # The ceiling leaves `go test -timeout 1500s` its room: on the scale set a
    # leg reaches the Unit tests step after up to ~11 min (2026-11-25, 335
    # successful ARC legs; the last shard's one-time steps are most of it),
    # and the successful legs' wall reached 29.9 min (shard 1, run
    # 45568468302), while a 30-min ceiling cancelled legs whose packages were
    # all still inside their own timeout. A package's 25 min count from its own
    # test binary's start, not the step's: a hung package panics inside the
    # ceiling only when its binary starts within the ceiling minus 25 min minus
    # setup of the step's start, about 4 min on the slowest-setup leg and more
    # on the others; one
    # that starts later can still be cut bare (run 45572758932, pkg/runview
    # started ~4.4 min into the step).
    # The tail is pool load, not the weights: the shards' slowest legs sat
    # between 27.1 and 29.9 min while their medians spread from 16 to 22 min,
    # so rebalancing the shards would not have saved those legs.
    # The ceiling is bounded by the queue's margin: its
    # check_response_timeout_minutes (60) runs from the group's creation and
    # also covers the leg's pod wait and the `test` aggregator's (at most
    # 13.9 + 3.8 min on 2026-11-25, heavy layer out of the queue), so a leg
    # hung past its packages' timeout reports after the ceiling plus those
    # waits, just short of a checks_timed_out that dequeues every entry behind
    # it. With the heavy layer back the waits grow past that margin.
    # internal/ciguard (TestUnitLegCeilingLeavesThePackageTimeoutRoom) holds
    # the ceiling above the package timeout plus setup, under race-shard's,
    # and under the queue timeout minus the measured waits.
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache on the organisation's runners (ADR-105): the archive
          # setup-go restores holds modules and no build, and restoring it
          # costs minutes there. GitHub-hosted runs (forks, dependency bots)
          # keep it.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Go came from the runner image
        # On the organisation's runners, setup-go finds go.mod's Go in the
        # image's tool cache (ci/arc-runner) instead of downloading it. A
        # download still works — ~30 s a job — so this warns rather than
        # fails; the fix is a new image and its pin in infra-apps.
        if: runner.environment == 'self-hosted'
        run: |
          baked="$RUNNER_TOOL_CACHE/iterion-ci-runner.env"
          running="$(go env GOVERSION)"
          if [ ! -f "$baked" ]; then
            echo "::warning::this runner's image bakes no toolchain ($baked is missing): setup-go downloaded ${running}"
          elif ! grep -qx "GO_VERSION=${running#go}" "$baked"; then
            echo "::warning::the runner image bakes $(tr '\n' ' ' < "$baked")but this job runs ${running}, downloaded by setup-go: publish a new ci/arc-runner image and bump its pin in infra-apps"
          else
            echo "${running} from the runner image"
          fi

      - name: Generated artefacts are fresh (fail fast)
        if: matrix.shard == 2
        # Two pull requests that each regenerate the same committed artefact
        # can merge clean and stale together — the queue's most frequent
        # failure. The freshness tests that catch it take seconds, but the
        # unit step reaches them fifteen minutes in; run them first, so such
        # an entry leaves the queue in minutes. The unit step still runs them.
        # A `-run` pattern that matches nothing passes, so the step also
        # checks that every test it names ran.
        shell: bash
        run: |
          set -euo pipefail
          tests=(TestGeneratedMapsAreFresh TestGeneratedDSLDocsAreFresh)
          pattern="^($(IFS='|'; echo "${tests[*]}"))\$"
          log="$RUNNER_TEMP/fresh.log"
          status=0
          go test -mod=vendor -count=1 -v -run "$pattern" ./pkg/repomap/ ./pkg/dsl/spec/ > "$log" 2>&1 || status=$?
          cat "$log"
          [ "$status" -eq 0 ] || exit "$status"
          for t in "${tests[@]}"; do
            grep -q -- "^--- PASS: ${t} " "$log" || { echo "::error::${t} did not PASS — skipped, renamed or moved? A freshness gate that does not run proves nothing."; exit 1; }
          done

      - name: Watcher resource limits
        # Read-only evidence for #1198. inotify EMFILE can be a process FD
        # ceiling or a UID-wide instance ceiling shared by runner pods.
        run: |
          python3 - <<'PYWATCH'
          import json, os, pathlib, resource
          def read(path):
              try:
                  return pathlib.Path(path).read_text().strip()
              except OSError:
                  return "unavailable"
          print(json.dumps({
              "real_uid": os.getuid(),
              "nofile": resource.getrlimit(resource.RLIMIT_NOFILE),
              "max_user_instances": read("/proc/sys/fs/inotify/max_user_instances"),
              "max_user_watches": read("/proc/sys/fs/inotify/max_user_watches"),
              "uid_map": read("/proc/self/uid_map"),
              "cpu_max": read("/sys/fs/cgroup/cpu.max"),
              "cpu_count": os.cpu_count(),
          }, sort_keys=True))
          PYWATCH

      # The modernize bot-level tests execute the bot's real plan_read /
      # lot_verify / mark_done scripts, which read the programme contract
      # through yq. Without it on PATH they SKIP — and a skipped guard test is
      # a green no-op, the very class those guards refuse. Pinned by version
      # and digest (mikefarah/yq, the same implementation the bundles pin).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # Bot-level tests execute `script:` nodes written in js, which exec
      # `node`; without it they fail or skip. The old mega-job got Node
      # transitively from its studio steps — this job runs none, so the
      # dependency is explicit.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install the pinned ultra11y engine
        # The rgaa-audit engine contract tests (bots/rgaa_audit_engine_contract_test.go)
        # run the REAL pinned ultra11y offline. The version and the sha256 of its
        # entry file come from bots/rgaa-audit/ultra11y.pin; the install is
        # --ignore-scripts and the resolver refuses any file whose hash differs.
        # Without ULTRA11Y_BIN those tests skip locally and FAIL in CI on purpose.
        run: |
          ULTRA11Y_BIN="$(scripts/ultra11y-engine.sh)"
          echo "ULTRA11Y_BIN=$ULTRA11Y_BIN" >> "$GITHUB_ENV"
          node "$ULTRA11Y_BIN" --version

      - name: gofmt (check)
        if: matrix.shard == 2
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -name '*.go' -not -path './vendor/*' -print)
          if [[ -n "${files}" ]]; then
            unformatted=$(gofmt -l ${files})
            if [[ -n "${unformatted}" ]]; then
              echo "gofmt needed on:"
              echo "${unformatted}"
              exit 1
            fi
          fi

      - name: go vet
        if: matrix.shard == 2
        run: go vet -mod=vendor ./...

      - name: Test capability census
        if: always() && matrix.shard == 2
        # Static inventory is identical locally; runner observations contain
        # boolean prerequisite presence only, never credential values.
        run: |
          go run -mod=vendor ./scripts/ci/testcaps -observe
          cat .iterion/test-capabilities/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test capabilities
        if: always() && matrix.shard == 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-capabilities-unit
          path: .iterion/test-capabilities/
          include-hidden-files: true # the census lives under .iterion
          if-no-files-found: error
          retention-days: 30

      - name: Prepare installed Helm chart dependencies
        # Hosted VMs include Helm, so chart tests execute there as well as in
        # helm-lint. Prepare the declared archives before either Go suite.
        run: |
          if command -v helm >/dev/null 2>&1; then
            sh scripts/chart-check-deps.sh charts/iterion
          fi

      - name: Unit tests
        # `./...` includes the e2e package, which has its own job (test-e2e)
        # with its own budget; running it here too doubled the wall-clock AND
        # ran the suite under Go's implicit per-package 10m first — the
        # timeout that actually ejected PRs from the merge queue. Unit tests
        # are everything but e2e; test-e2e is the only e2e run.
        #
        # The explicit -timeout is here for the same reason: the implicit 10m
        # is a budget a healthy run can reach, and did — ./bots carried the
        # whole job to the panic at 10m0s while the same commit passed on a
        # faster machine (measured: 521.8s on CI at one commit, a timeout at
        # 10m0s on the next). The same bots sources later passed in 1007s
        # on the PR and reached the 1200s aggregate limit in its merge group
        # while a test had run for only 9s (#2745). Allow 25m per package,
        # still bounded by the job's 40m including setup and live compilation.
        # Individual test deadlines and all assertions remain in force.
        #
        # The partition goes through an ASSIGNMENT, never inline `$( )`:
        # inline substitution loses the splitter's exit code, and an
        # empty-shard refusal would degrade into `go test` with no package.
        # pkg/sandbox/kubernetes is test-native-exec's; the quarantined flakes
        # (scripts/ci/test-quarantine.tsv) are skipped here and run nightly.
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(go run -mod=vendor ./scripts/ci/testshards -n 3 -i ${{ matrix.shard }} -skip '^github\.com/SocialGouv/iterion/(e2e|pkg/sandbox/kubernetes)$' -weights scripts/ci/test-shards-unit-weights.tsv)
          quarantine=$(go run -mod=vendor ./scripts/ci/testquarantine -list scripts/ci/test-quarantine.tsv -skip)
          echo "shard ${{ matrix.shard }} runs $(echo "$pkgs" | wc -w) packages"
          go test -mod=vendor -count=1 -timeout 1500s -skip "$quarantine" $pkgs

      - name: Live e2e compile check
        if: matrix.shard == 2
        # Builds every -tags=live test in the repo and runs NONE of them
        # (`-run '^$'`). No credentials, no model call, no network — pure
        # compilation. The paid live layer would otherwise bit-rot green
        # under any required check: a rename, a moved package, a
        # signature change would only surface weeks later to whoever
        # pays to run a live target, and would look like their change.
        # Cheap half of #1423's guarantee — see #1432.
        #
        # ./... rather than ./e2e/...: `./e2e/...` misses live-tagged
        # tests outside the e2e package (pkg/webhooks/gitlab/client_live_test.go
        # today; any future sibling too — a live-tagged file added under
        # pkg/, cmd/ or bots/ would otherwise be invisible to this
        # check, defeating the purpose of the step). Measured locally on
        # a warm cache: ./... = 11.4 s wall, ./e2e/... + ./pkg/webhooks/gitlab/...
        # = 3.3 s wall — the 8 s premium buys coverage at the CLASS and
        # avoids the periodic hunt for the next live-tagged package.
        run: go test -mod=vendor -tags live -count=1 -run '^$' ./...

  test-e2e:
    # Partition top-level test families across four pods: the growing e2e
    # package exceeded its 900s ceiling in one pod (#2911). Each rebuilds the studio
    # frontend because `pkg/server/static/` is gitignored and embedded with
    # `//go:embed all:static` — the e2e server boots against nothing without
    # it, and artifact-sharing would serialize this job behind `studio`
    # through the cache service ADR-105 measured at 1-3 MB/s. Feeds the
    # required `test` aggregator.
    #
    # UNDER -race (#3664): this is the package's only run, so the data-race
    # detector proves it here, on the scale set, and race-shard leaves it out
    # of its partition. The `test` aggregator speaks for it: a race this leg
    # finds reddens `test`. -race needs cgo, which the scale set's image
    # (ci/arc-runner) and ubuntu-latest both build with. The whole package
    # ran under -race in 1468-1785 s (2026-11-23) on GitHub-hosted
    # ubuntu-latest (race-shard, runs 45180564490 and 45186345093), not on
    # ARC; the shards are hash-split and uneven (the heaviest holds about a
    # third of the package). So each shard keeps race-shard's proven -race
    # bounds, 2400 s per package and a 50-minute job, until ARC -race shard
    # walls are measured.
    # HEAVY (#3683, #3691, #3737): a light run — a merge-queue build, a pull
    # request without `ci:full` or a push inside the heavy window — skips
    # this leg; the debounced push, the nightly and a dispatch run it. `test`
    # forgives that skip on a light run only.
    # A Homebrew tap update skips it too: the header says why, and `brand`
    # verifies it.
    needs: [heavy-gate]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_HEAVY_RUNNER || 'arc-runners' }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Go came from the runner image
        if: runner.environment == 'self-hosted'
        run: |
          baked="$RUNNER_TOOL_CACHE/iterion-ci-runner.env"
          running="$(go env GOVERSION)"
          if [ ! -f "$baked" ]; then
            echo "::warning::this runner's image bakes no toolchain ($baked is missing): setup-go downloaded ${running}"
          elif ! grep -qx "GO_VERSION=${running#go}" "$baked"; then
            echo "::warning::the runner image bakes $(tr '\n' ' ' < "$baked")but this job runs ${running}, downloaded by setup-go: publish a new ci/arc-runner image and bump its pin in infra-apps"
          else
            echo "${running} from the runner image"
          fi

      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Build studio frontend
        # Duplicated from the `studio` job on purpose: the e2e server embeds
        # pkg/server/static (gitignored) and boots it. See the job comment.
        working-directory: studio
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vite build
          rm -rf ../pkg/server/static/assets ../pkg/server/static/index.html
          cp -r dist/* ../pkg/server/static/

      - name: E2E tests (shard ${{ matrix.shard }} of 4)
        # Discovery includes Test, Example and Fuzz corpus names. Subtests
        # stay with their parent. All legs use one commit and Go's own
        # inventory; a discovery failure must stop before running any test.
        # Discovery is the cold -race compile on an ARC pod with no Go cache:
        # its bound is ten minutes, and the run below reuses the compile.
        # The per-shard hang bound and e2e/main_test.go's parallel cap stay.
        # The quarantined flakes (scripts/ci/test-quarantine.tsv) are skipped
        # here and run nightly.
        shell: bash
        run: |
          set -euo pipefail
          # Discovery lists under -race, the build execution runs: a file
          # tagged `//go:build race` exists only in that variant.
          pattern=$(GOFLAGS=-race go run -mod=vendor ./scripts/ci/testshards -tests ./e2e -n 4 -i ${{ matrix.shard }} -list-timeout 10m)
          quarantine=$(go run -mod=vendor ./scripts/ci/testquarantine -list scripts/ci/test-quarantine.tsv -skip)
          go test -race -mod=vendor -count=1 -v -run "$pattern" -skip "$quarantine" -timeout 2400s ./e2e

  studio:
    # The studio half: eslint + tsc -b + vitest, plus the two drift checks
    # that reuse its node_modules (OpenAPI client, Helm chart version).
    # ~3 min that used to sit serially inside the mega-job. Runs in the merge
    # queue behind the required `test` aggregator; carries the light literal
    # and the tap skip, nothing else.
    # A Homebrew tap update skips this leg: the header says why, and `brand` verifies it.
    if: "${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_LARGE_RUNNER || 'arc-runners' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Studio lint + typecheck + unit tests
        # Mirror of `task studio:check` (eslint / tsc -b / vitest), inlined so
        # the job doesn't pull go-task. Installs its own node_modules: the
        # frontend build that used to precede it now lives in test-e2e.
        working-directory: studio
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec eslint .
          pnpm exec tsc -b
          pnpm exec vitest run

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: OpenAPI spec + client drift check
        # The committed openapi.json (offline-generated from the in-code route
        # table) and studio/src/api/schema.ts (typed client surface) must match
        # the code. Mirror of `task openapi:check`, inlined so the job doesn't
        # pull go-task. Reuses the studio node_modules installed above.
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=vendor ./cmd/iterion openapi -o openapi.json
          pnpm -C studio exec openapi-typescript ../openapi.json -o src/api/schema.ts
          if ! git diff --quiet -- openapi.json studio/src/api/schema.ts; then
            echo "::error::OpenAPI spec / client drift — run 'task openapi:gen' and commit the result."
            git --no-pager diff --stat -- openapi.json studio/src/api/schema.ts
            exit 1
          fi

      - name: Helm chart version drift check
        # Mirror of `task chart:check-version`, inlined so we don't pull
        # go-task. release-it bumps package.json on release; if Chart.yaml's
        # `version` or `appVersion` isn't synced (via `task
        # chart:sync-version`), the OCI publish ships a chart whose image tag
        # points to a stale build. Fail the PR before that happens.
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CHART_VER=$(awk '/^version:/ {print $2; exit}' charts/iterion/Chart.yaml)
          CHART_APP=$(awk '/^appVersion:/ {gsub(/"/,""); print $2; exit}' charts/iterion/Chart.yaml)
          if [ "$PKG" != "$CHART_VER" ] || [ "$PKG" != "$CHART_APP" ]; then
            echo "::error::Chart.yaml drift: version=$CHART_VER appVersion=$CHART_APP package.json=$PKG"
            echo "Run 'task chart:sync-version' to align them, then commit the result."
            exit 1
          fi

  test-native-exec:
    # The one package the scale set cannot prove: pkg/sandbox/kubernetes's
    # native transport witnesses run the real host/guest pair under a
    # Bubblewrap read-only mount, and ARC pods refuse that mount (#3189). So
    # test-unit and race-shard leave the package out of their partitions and
    # this small job proves ALL of it — plain, as test-unit would, then under
    # -race, as race-shard would — on a namespace-capable VM
    # (CI_NATIVE_EXEC_RUNNER may select a qualified private runner). Fork,
    # dependency-bot and global-off guards still win. Both required
    # aggregators `needs:` it: `test` for the plain run, `race` for the race
    # run, so neither verdict loses the package (#3662).
    # A Homebrew tap update skips this leg: the header says why, and `brand` verifies it.
    if: "${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_NATIVE_EXEC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Native exec environment prerequisites
        # The native transport tests execute the real pair on a read-only mount.
        # Missing isolation is a failure, not permission to skip the witness.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential
          bwrap --version
          bwrap --die-with-parent --ro-bind / / --dev /dev --proc /proc /bin/true

      - name: Native exec tests
        # test-unit's flags: -count=1, CGO_ENABLED=0, 1500 s per package.
        shell: bash
        run: |
          set -euo pipefail
          quarantine=$(go run -mod=vendor ./scripts/ci/testquarantine -list scripts/ci/test-quarantine.tsv -skip)
          go test -mod=vendor -count=1 -timeout 1500s -skip "$quarantine" ./pkg/sandbox/kubernetes/

      - name: Native exec tests under -race
        # race-shard's flags: -race (cgo on), -count=1, 2400 s per package.
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          quarantine=$(go run -mod=vendor ./scripts/ci/testquarantine -list scripts/ci/test-quarantine.tsv -skip)
          go test -race -mod=vendor -count=1 -timeout 2400s -skip "$quarantine" ./pkg/sandbox/kubernetes/

  # ---- required aggregator: the name the ruleset requires, no tests of its own ----

  test:
    # REQUIRED — the ruleset requires the NAME `test`, and this job is what
    # reports it. It runs no tests: the four legs above do the work, and
    # this job turns their conclusions into one required verdict.
    #
    # `!cancelled()` is load-bearing. With plain `needs:` and no `if:`,
    # GitHub SKIPS this job when any leg fails — and a skipped check reports
    # SUCCESS, the exact catastrophe the header describes. That spelling
    # reads only run-cancellation state, which cannot differ inside a
    # merge_group run, unlike every event-dependent condition. It is combined
    # with the ONE verified condition the legs carry — a Homebrew tap update
    # skips them, `brand` verifies it — so this job skips exactly the entries
    # its legs skip and runs on every other one; ciguard pins the spelling
    # byte for byte. The step then re-verifies each leg's result rather than
    # trusting the needs-graph, so a red leg can only ever produce a red
    # required check.
    #
    # ONE forgiven result (#3683, #3691, #3737): on a LIGHT run — a
    # merge-queue build, a pull request without the `ci:full` label, or a
    # push heavy-gate decided light — test-e2e skips by design and runs on
    # the debounced push instead, so `skipped` from it is accepted there and
    # nowhere else. LIGHT_RUN is the negation of the very expression the
    # heavy leg runs on, evaluated by GitHub: `false` on a heavy push,
    # schedule, dispatch and a `ci:full` pull request, where a skipped
    # test-e2e is as red as a failed one. heavy-gate is needed for its output
    # alone: it is no leg, and its result is not re-verified — where it fails
    # its output is empty, the run is heavy, and every heavy leg must pass.
    #
    # PULL REQUEST CI ON DEMAND (#3738): before any leg, the step reads PR_CI,
    # rendered from the light literal (the header). `run` verifies the legs
    # as above. `refused` — a session's pull request without `ci:run` or
    # `ci:full`, neither a bot's nor a fork's, whose legs all skipped — FAILS
    # with the policy and both ways out (the label, or the train): a skip
    # here would be a green required check over nothing. Any other value is
    # red.
    needs: [heavy-gate, test-unit, test-e2e, studio, test-native-exec]
    if: "${{ !cancelled() && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 5
    env:
      TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
      TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
      STUDIO_RESULT: ${{ needs.studio.result }}
      TEST_NATIVE_EXEC_RESULT: ${{ needs.test-native-exec.result }}
      PR_CI: ${{ (!(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && 'refused') || 'run' }}
      LIGHT_RUN: ${{ !((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    steps:
      - name: Every leg reported success
        shell: bash
        run: |
          set -euo pipefail
          case "${PR_CI:-}" in
            run) ;;
            refused)
              echo "::error::pull request CI on demand (#3738, docs/merge-policy.md#pull-request-ci-on-demand): a session's pull request runs no CI unless it asks, and this one carries neither \`ci:run\` nor \`ci:full\` and is neither a bot's nor a fork's. This check is red by POLICY, not by a test: nothing ran. Two ways out: add the \`ci:run\` label (\`ci:full\` for the heavy layer too) — labelling starts a run, while re-running this one does not, it reads the labels of the event that started it — or land it through the train (\`task ci:train\`, scripts/ci/train), which runs the gate locally — except a pull request that touches .github/, scripts/ci/, Taskfile.yml or devbox.*, which the train refuses and only the label serves. If this pull request already carries \`ci:run\` or \`ci:full\`, a run that started from an older snapshot superseded the labelled one: push, or remove and re-add the label."
              exit 1
              ;;
            *)
              echo "::error::PR_CI is '${PR_CI:-}', neither run nor refused — red rather than a guess."
              exit 1
              ;;
          esac
          fail=0
          for pair in "test-unit:${TEST_UNIT_RESULT}" "test-e2e:${TEST_E2E_RESULT}" "studio:${STUDIO_RESULT}" "test-native-exec:${TEST_NATIVE_EXEC_RESULT}"; do
            leg="${pair%%:*}"
            result="${pair#*:}"
            if [ "$leg" = "test-e2e" ] && [ "$result" = "skipped" ] && [ "$LIGHT_RUN" = "true" ]; then
              echo "::notice::leg ${leg} skipped on a light run (merge queue, a pull request without ci:full, or a push to main inside the heavy window) — the first push to main after CI_HEAVY_EVERY_HOURS without a heavy run, the nightly and a dispatch run it, so this green is not admin-mergeable; label the pull request ci:full and push to run it there."
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::leg ${leg} reported ${result} — the required verdict is red because its leg is red."
              fail=1
            fi
          done
          exit "$fail"

  # ---- gated leg: the full suite under the detector, split across pods ----

  race-shard:
    # Data-race detector pass, SHARDED. The `test` legs run CGO_ENABLED=0 with
    # no -race, so they cannot surface the concurrency races that only the
    # race detector finds — and the engine is concurrency-heavy (fan-out
    # branch scheduling in pkg/runtime, the dispatcher actor in
    # pkg/dispatcher, the store's parallel-branch turn writes in pkg/store).
    # Without this leg a data race regresses silently until it flakes a
    # developer's machine.
    #
    # Sharding is purely mechanical and the guarantee is untouched: EVERY
    # package still runs under -race — `./...` minus e2e (under -race in
    # test-e2e, #3664) and pkg/sandbox/kubernetes (under -race in
    # test-native-exec, #3662) — partitioned three ways by
    # scripts/ci/testshards — a pure function of the commit, so the three
    # legs of one merge-queue entry always pick complementary sets. The
    # partition goes through an ASSIGNMENT (`pkgs=$(...)`), never inline
    # `$( )`: inline substitution loses the splitter's exit code, and an
    # empty-shard refusal would degrade into `go test` with no package
    # arguments. The weights table carries measured -race package durations;
    # LPT packs the three shards to near-equal weight, and the three heaviest
    # rows (bots, pkg/server, internal/fswatch) each lead one shard. The leg's
    # wall is the larger of its heaviest package (bots, one sequential test
    # binary) and its shard's load spread over the runner's parallel test
    # slots; LPT balances the second, only splitting bots lowers the first.
    #
    # -race REQUIRES cgo, so this leg overrides the repo-wide CGO_ENABLED=0;
    # the scale set's image (ci/arc-runner) and ubuntu-latest both ship gcc.
    # `runs-on` stays at the JOB level, outside the matrix, where the
    # ciguard regex and the fork guard can read it (the desktop-vet-cross
    # lesson: a matrix over runs-on diverges from its id silently).
    # HEAVY (#3683, #3691, #3737): a light run — a merge-queue build, a pull
    # request without `ci:full` or a push inside the heavy window — skips
    # this leg; the debounced push, the nightly and a dispatch run it. `race`
    # forgives that skip on a light run only.
    # A Homebrew tap update skips it too: the header says why, and `brand`
    # verifies it.
    needs: [heavy-gate]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    # On the scale set: the namespace-bound package (pkg/sandbox/kubernetes,
    # whose native witnesses need a Bubblewrap mount ARC pods refuse) is
    # excluded from the partition and proved by test-native-exec instead.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_HEAVY_RUNNER || 'arc-runners' }}
    timeout-minutes: 50
    env:
      CGO_ENABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache (#1839, like fmt-check): the restore is keyed on go.sum
          # and carries whichever job saved first — a build -race recompiles
          # anyway — and on the scale set a slow restore of that ~400 MB
          # archive has run past ten minutes.
          cache: false

      # Tests that run a real `script:` node (language js) exec `node`, and
      # without it they fail (TestLiteralTemplateRealScriptAndRecipe) or skip.
      # GitHub-hosted images ship Node; the scale set's image does not.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install the pinned ultra11y engine
        # `./...` includes ./bots, whose engine contract tests FAIL under CI
        # without ULTRA11Y_BIN (see the same step in the test-unit job).
        run: |
          ULTRA11Y_BIN="$(scripts/ultra11y-engine.sh)"
          echo "ULTRA11Y_BIN=$ULTRA11Y_BIN" >> "$GITHUB_ENV"
          node "$ULTRA11Y_BIN" --version

      # The modernize bot-level tests execute the bot's real plan_read /
      # lot_verify / mark_done scripts, which read the programme contract
      # through yq. Without it on PATH they SKIP — and a skipped guard test is
      # a green no-op, the very class those guards refuse. Pinned by version
      # and digest (mikefarah/yq, the same implementation the bundles pin).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Prepare installed Helm chart dependencies
        # Hosted VMs include Helm, so chart tests execute there as well as in
        # helm-lint. Prepare the declared archives before either Go suite.
        run: |
          if command -v helm >/dev/null 2>&1; then
            sh scripts/chart-check-deps.sh charts/iterion
          fi

      - name: Race tests (shard ${{ matrix.shard }} of 3)
        # Each package gets 2400 s under -race, inside the job's 50-minute
        # ceiling (#2789). See the scripts/ci/testshards doc for why the
        # assignment form is load-bearing. The quarantined flakes
        # (scripts/ci/test-quarantine.tsv) are skipped here and run nightly.
        run: |
          set -euo pipefail
          pkgs=$(go run -mod=vendor ./scripts/ci/testshards -n 3 -i ${{ matrix.shard }} -skip '^github\.com/SocialGouv/iterion/(e2e|pkg/sandbox/kubernetes)$' -weights scripts/ci/test-shards-weights.tsv)
          quarantine=$(go run -mod=vendor ./scripts/ci/testquarantine -list scripts/ci/test-quarantine.tsv -skip)
          echo "shard ${{ matrix.shard }} runs $(echo "$pkgs" | wc -w) packages"
          go test -race -mod=vendor -count=1 -timeout 2400s -skip "$quarantine" $pkgs

  # ---- held aggregator: a name the ruleset requires again when ADR-173 ends ----

  race:
    # HELD — ruleset 18857412 required the NAME `race` until the experimental
    # delivery mode (ADR-173) and requires it again when the mode ends, so
    # the context keeps reporting, held to the required aggregator's contract.
    # In the merge queue it vouches for test-native-exec alone: race-shard
    # skips there, and a notice says so. This job reports the name and
    # re-verifies the three shards' conclusions and test-native-exec's, whose
    # second step runs pkg/sandbox/kubernetes under -race. Every package but
    # e2e runs under -race behind this verdict; e2e runs under -race in
    # test-e2e, behind `test` (#3664).
    #
    # A matrix `needs:` aggregates its legs' results: `success` only when
    # EVERY leg succeeded. `!cancelled()` is load-bearing — a plain `needs:`
    # job is SKIPPED when a leg fails, and a skipped check reports SUCCESS
    # (the header's catastrophe, one level up). Combined with the tap skip
    # the shards carry, so this job skips exactly the entries they skip and
    # re-verifies every other one; ciguard pins the spelling byte for byte.
    #
    # ONE forgiven result (#3683, #3691, #3737): on a light run race-shard
    # skips by design, so `skipped` from it is accepted there and nowhere
    # else — the `test` aggregator's rule, through the same LIGHT_RUN, read
    # from heavy-gate's output. test-native-exec is not heavy: it runs on
    # every event the light literal admits.
    #
    # PULL REQUEST CI ON DEMAND (#3738): the `test` aggregator's PR_CI rule,
    # byte for byte — `refused` fails with the policy — so the context keeps
    # the required contract it returns to when the experimental mode ends.
    needs: [heavy-gate, race-shard, test-native-exec]
    if: "${{ !cancelled() && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 5
    env:
      RACE_SHARD_RESULT: ${{ needs.race-shard.result }}
      TEST_NATIVE_EXEC_RESULT: ${{ needs.test-native-exec.result }}
      PR_CI: ${{ (!(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && 'refused') || 'run' }}
      LIGHT_RUN: ${{ !((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    steps:
      - name: Every shard reported success
        shell: bash
        run: |
          set -euo pipefail
          case "${PR_CI:-}" in
            run) ;;
            refused)
              echo "::error::pull request CI on demand (#3738, docs/merge-policy.md#pull-request-ci-on-demand): a session's pull request runs no CI unless it asks, and this one carries neither \`ci:run\` nor \`ci:full\` and is neither a bot's nor a fork's. This check is red by POLICY, not by a test: nothing ran. Two ways out: add the \`ci:run\` label (\`ci:full\` for the heavy layer too) — labelling starts a run, while re-running this one does not, it reads the labels of the event that started it — or land it through the train (\`task ci:train\`, scripts/ci/train), which runs the gate locally — except a pull request that touches .github/, scripts/ci/, Taskfile.yml or devbox.*, which the train refuses and only the label serves. If this pull request already carries \`ci:run\` or \`ci:full\`, a run that started from an older snapshot superseded the labelled one: push, or remove and re-add the label."
              exit 1
              ;;
            *)
              echo "::error::PR_CI is '${PR_CI:-}', neither run nor refused — red rather than a guess."
              exit 1
              ;;
          esac
          fail=0
          for pair in "race-shard:${RACE_SHARD_RESULT}" "test-native-exec:${TEST_NATIVE_EXEC_RESULT}"; do
            leg="${pair%%:*}"
            result="${pair#*:}"
            if [ "$leg" = "race-shard" ] && [ "$result" = "skipped" ] && [ "$LIGHT_RUN" = "true" ]; then
              echo "::notice::leg ${leg} skipped on a light run (merge queue, a pull request without ci:full, or a push to main inside the heavy window) — the first push to main after CI_HEAVY_EVERY_HOURS without a heavy run, the nightly and a dispatch run it, so this green is not admin-mergeable; label the pull request ci:full and push to run it there."
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::leg ${leg} reported ${result} — the required verdict is red because its leg is red."
              fail=1
            fi
          done
          exit "$fail"

  mongo-conformance:
    # Runs the pkg/store/mongo conformance harness against a real Mongo
    # replica set (change-streams + transactions). The harness is gated
    # on ITERION_TEST_MONGO_URI in-tree so a developer's plain `go test
    # ./...` skips it; CI provides the URI explicitly so the contract
    # stays enforced. Without this job, every store/mongo + queue/nats
    # change ships untested.
    #
    # Runs in parallel with `test`: this job is self-contained (its own
    # checkout + go build) and a compile error here surfaces the same
    # failure the `test` job would. Sequential `needs: test` cost 3-4
    # min of wall-clock without catching anything earlier.
    # HEAVY (#3691, #3737): out of the merge queue, of a light pull request
    # and of a light push, it runs on the debounced push, the nightly, a
    # dispatch and a `ci:full` pull request — `!cancelled()` and the heavy
    # literal, byte for byte, alone: no light run reaches it, so the tap skip
    # has nothing left to skip. Out of ruleset 18857412 while the
    # experimental delivery mode lasts (ADR-173); a regression in the Mongo
    # store lands on `main` and the next heavy push run is what reddens.
    needs: [heavy-gate]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_HEAVY_RUNNER || 'arc-runners' }}
    # The sum of the inner `go test -timeout`s (20m + 15m + 5m + 5m, and the
    # subbot step's 5m) plus setup, kept under the merge queue's 60-minute
    # check_response_timeout: a hang is named by go test's own timeout, and
    # this ceiling only backstops the steps around it. At 15 it cut a green
    # 11-14 min suite whenever two runs shared the runners (#3390).
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache (#1839, like fmt-check): -mod=vendor needs no module
          # cache, the build cache it restores is another job's, and on the
          # scale set a slow restore of that ~400 MB archive has taken eleven
          # minutes of a fifteen-minute job (nats-conformance, the same setup,
          # cancelled twice on 2026-09-29).
          cache: false

      - name: Start mongo as a replica set
        # No services: block — a service container cannot be given
        # --replSet. The step runs mongod with --replSet rs0 + rs.initiate()
        # so change-streams and transactions work — both required by the
        # conformance suite (event seq monotonicity + LockExclusivity). Same
        # docker-run pattern as nats-conformance.
        run: |
          set -euo pipefail
          docker run -d --name mongo-rs \
            -p 127.0.0.1:27017:27017 \
            mongo:8.0 \
            --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval '
            try { rs.status() } catch(e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
            }
          '
          # Wait for primary election before letting tests connect. No
          # PRIMARY within the window fails the STEP: falling through would
          # let the harness connect to a set with no primary and report the
          # failure as a store bug on whatever PR happens to be in the queue.
          STATE=""
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo-rs mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null || true)
            if [ "$STATE" = "PRIMARY" ]; then
              echo "rs0 primary elected"
              break
            fi
            sleep 2
          done
          if [ "$STATE" != "PRIMARY" ]; then
            echo "rs0: no PRIMARY after 60s (last state: ${STATE:-unknown})" >&2
            docker exec mongo-rs mongosh --quiet --eval 'printjson(rs.status())' || true
            docker logs --tail 100 mongo-rs || true
            exit 1
          fi

      - name: Mongo conformance harness
        # Alongside the pkg/store/mongo harness, run EVERY suite gated on
        # this URI. A Mongo-only test that no job runs is a test that
        # cannot fail: the list below must stay in sync with
        #   grep -rl ITERION_TEST_MONGO_URI --include='*_test.go' pkg/
        # Several suites (secrets, orgusage, botsource, runstream,
        # orgsweep) were silently outside it — which matters because these
        # are exactly the semantics the memory stores do not model
        # (tenant filters, CAS, change streams).
        env:
          ITERION_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
        run: |
          # This includes the complete server suite, which already exceeds
          # five minutes without Mongo and reached the old 10m package budget
          # with it under queue load (600.6s, #3390). The budget stays below
          # the job's ceiling without shortening any test coverage.
          go test -mod=vendor -count=1 -v -timeout 20m \
            ./pkg/internal/storekit/... ./pkg/audit/... ./pkg/pat/... \
            ./pkg/connection/... \
            ./pkg/cloudsched/... ./pkg/auth/... \
            ./pkg/secrets/... ./pkg/orgusage/... ./pkg/credusage/... ./pkg/credpool/... \
            ./pkg/botsource/... ./pkg/pricefeed/... \
            ./pkg/runview/runstream/... ./pkg/cloud/orgsweep/... \
            ./pkg/usagecap/... ./pkg/dispatcher/boardmongo/... ./pkg/identity/... ./pkg/usernotify/... ./pkg/configshare/... \
            ./pkg/pluginsource/... ./pkg/assistantmission/... ./pkg/runwatch/... ./pkg/webhooks/... ./pkg/server/cloudpublisher/... \
            ./pkg/forge/... ./pkg/trigger/... ./pkg/lease/... ./pkg/platformcfg/... ./pkg/server/... \
            ./pkg/connector/intake/... ./pkg/connector/poller/...
          # The store harness runs alone on the replica set: its transactions
          # and change streams saturate a shared mongod, which starves the
          # suites beside it, so it carries its own budget.
          go test -mod=vendor -count=1 -v -timeout 15m ./pkg/store/mongo/...
          # Exercise the public cloud coordinator against the durable outbox,
          # including tenants that only subscribe to custom/run events.
          go test -mod=vendor -count=1 -v -timeout 5m ./pkg/server/ \
            -run '^TestRound3CloudCoordinatorBusHoldRecovery$'
          # BuildSnapshot's run-origin matrix, the merge doors' expected
          # birth and the run listings' indexed window against the native
          # Mongo store. The `/...` form keeps pkg/runview visible to
          # pkg/store/mongo's gated-package guard; -run leaves the rest of
          # it to `test`.
          go test -mod=vendor -count=1 -v -timeout 5m ./pkg/runview/... \
            -run '^(TestSnapshotOriginNativeMongo|TestMergeExpectedBirthNativeMongo|TestRunListingWindowNativeMongo)$'

      - name: Subbot lease Mongo and NATS witness
        env:
          ITERION_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
          ITERION_TEST_NATS_URI: nats://localhost:4222
        run: |
          set -euo pipefail
          test -n "$ITERION_TEST_MONGO_URI"
          test -n "$ITERION_TEST_NATS_URI"
          trap 'docker rm -f nats-child-lease >/dev/null 2>&1 || true' EXIT
          docker run -d --name nats-child-lease \
            -p 127.0.0.1:4222:4222 nats:2.14-alpine -js
          ready=0
          for i in $(seq 1 30); do
            logs="$(docker logs nats-child-lease 2>&1)"
            if grep -Fq 'Server is ready' <<<"$logs" && grep -Fq 'JetStream' <<<"$logs"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs nats-child-lease
            echo 'Owned NATS fixture failed to start' >&2
            exit 1
          fi
          go test -mod=vendor -count=1 -v -timeout 5m ./pkg/store/mongo \
            -run '^TestSubbotLeaseMongoNATS$'

      - name: Mongo diagnostics on failure
        # A harness failure that reads "ReplicaSetNoPrimary" AFTER the
        # election step printed "primary elected" is a broker-side event
        # (a step-down, a restart, a late handshake under load), not a
        # store regression. Capture what the set and the container saw
        # so the failure can be attributed without re-running the job.
        if: failure()
        run: |
          echo "::group::rs.status()"
          docker exec mongo-rs mongosh --quiet --eval 'printjson(rs.status())' || true
          echo "::endgroup::"
          echo "::group::container state"
          docker inspect mongo-rs --format 'status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}} oom={{.State.OOMKilled}}' || true
          echo "::endgroup::"
          echo "::group::docker logs mongo-rs (tail 300)"
          docker logs --tail 300 mongo-rs || true
          echo "::endgroup::"

  nats-conformance:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    # Runs the JetStream integration tests (mixed-version schema rollout,
    # issue #481) against a real broker. Gated on ITERION_TEST_NATS_URI
    # in-tree so a developer's plain `go test ./...` skips them; CI
    # provides the URI explicitly so the contract stays enforced.
    # Mirror of the mongo-conformance job above.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_LARGE_RUNNER || 'arc-runners' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache, same reason as mongo-conformance (#1839).
          cache: false

      - name: Start NATS with JetStream
        # No services: block — it cannot pass `-js` to the container
        # command. Same docker-run pattern as the mongo replica-set step.
        run: |
          set -euo pipefail
          docker run -d --name nats-js -p 127.0.0.1:4222:4222 nats:2.14-alpine -js
          ready=0
          for i in $(seq 1 30); do
            logs="$(docker logs nats-js 2>&1)"
            if grep -Fq "Server is ready" <<<"$logs"; then
              echo "nats ready"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs nats-js
            echo "NATS did not become ready"
            exit 1
          fi
          logs="$(docker logs nats-js 2>&1)"
          grep -Fq "JetStream" <<<"$logs" || { echo "JetStream not enabled"; exit 1; }

      - name: JetStream integration tests
        # Alongside pkg/runner's schema-rollout test, run EVERY suite
        # gated on this URI — a NATS-only test that no job runs is a
        # test that cannot fail. Keep in sync with:
        #   grep -rl ITERION_TEST_NATS_URI --include='*_test.go' pkg/
        env:
          ITERION_TEST_NATS_URI: nats://localhost:4222
        run: |
          go test -mod=vendor -count=1 -v -timeout 5m ./pkg/runner/... ./pkg/queue/...

  cloud-e2e:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file. Heavy too (#3683, #3691,
    # #3737): `!cancelled()` and the heavy literal alone keep it out of the
    # merge queue, of a light pull request and of a light push, so it runs on
    # the debounced push, the nightly, a dispatch and a pull request that
    # carries the `ci:full` label.
    needs: [heavy-gate]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || needs.heavy-gate.outputs.heavy != 'false')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}"
    # Builds the iterion image, spins kind + Helm-installs the cloud
    # stack with its dev Mongo + NATS + SeaweedFS (values-dev.yaml), then
    # exercises the full chain (server → NATS → runner → Mongo →
    # /metrics). Catches regressions that helm lint cannot — wrong
    # ConfigMap key, broken probe path, RBAC drift, missing image,
    # /readyz logic.
    #
    # Runs in parallel with `test`: this job builds its own iterion
    # image and a Go compile error surfaces here too. The previous
    # `needs: test` was purely defensive and cost 3-4 min of
    # wall-clock per push.
    # ARC kind + kubectl proven usable on 2026-11-03 (#981):
    # https://github.com/SocialGouv/iterion/actions/runs/41671007928
    # Keep the same fork/bot isolation and operator escape hatch as every
    # other job using the scale set.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_HEAVY_RUNNER || 'arc-runners' }}
    # 79 m sits 3 m above the 76 m floor (25 + 32 + 19, witnessed in
    # charts/iterion/kind_wait_test.go): a 25 m budget for the preamble
    # (checkout, Go setup, image build, kind up, image load, chart deps),
    # sized on arc-runners, where it measured 5.9-20.3 m over 90 runs of
    # 3-4 Nov 2026 — 15 m for its steps (worst 14.8 m) and the 10 m Setup
    # Go's cache restore stalls before its own segment timeout gives up (5 of
    # those runs); the ubuntu-latest fallback measured 3.7-5.4 m (38 runs).
    # Then the 32 m helm cap the install derives from the deadline its own
    # render gives the server Deployment (values-dev's 1800 s, read by
    # scripts/chart-kind-wait.sh); and the steps after the install, which a
    # slow install that succeeds still runs, each capped by its own
    # timeout-minutes (19 m together). The install and those steps end on a
    # message — helm's timeout or a step's own. The preamble, the job's
    # setup and its post steps carry no timeout-minutes of their own: a slow run
    # ends on a message rather than the runner kill's silence only while
    # they fit the budget and the 3 m above the floor.
    timeout-minutes: 79
    env:
      KIND_CLUSTER: iterion-e2e
      IMG: iterion-e2e:ci
      NS: iterion
      RELEASE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build iterion image (local)
        # Build the local image only — no push. kind loads it directly
        # via `kind load docker-image` so the test is hermetic and
        # doesn't depend on image.yml succeeding first.
        # The Dockerfile's `studio-builder` stage runs pnpm + vite
        # build itself, so a separate host-side studio build step is
        # redundant; saves ~30s and a Node 24 setup.
        run: |
          docker build -t "${IMG}" .

      - name: Set up kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: Load image into kind
        run: |
          kind load docker-image "${IMG}" --name "${KIND_CLUSTER}"

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The wait helper reads the install's own render through yq
      # (scripts/chart-kind-wait.sh). Pinned by version and digest
      # (mikefarah/yq, the implementation its expressions are written for),
      # not taken from the runner image's inventory, at the version the root
      # devbox locks — every yq download of the workflows alike
      # (TestChartKindWaitToolchainPinsYq reds on a drift).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Build chart dependencies
        # The sub-charts declared in Chart.yaml are not vendored in git
        # (charts/iterion/charts/ is gitignored). Mirror what `task chart:kind`
        # does locally so values-dev.yaml's stack resolves at install time.
        run: helm dependency update ./charts/iterion

      - name: Helm install (values-dev.yaml)
        # CI-specific overrides on top of values-dev.yaml: the image built
        # above, metrics on, auth off. The dev stores (devStack.*) run on
        # emptyDirs: no PVC binding to wait for. One argument list feeds the
        # wait helper and the install: the client wait derives from the
        # deadline this install's own render gives the server Deployment
        # (scripts/chart-kind-wait.sh runs `helm template` on the same
        # arguments), so a slow-registry day exhausts the deadline's budget
        # instead of a fixed cap while the workload is still Progressing.
        run: |
          set -euo pipefail
          install=(
            "${RELEASE}" ./charts/iterion
            --namespace "${NS}"
            --values ./charts/iterion/values-dev.yaml
            --set "image.repository=$(echo ${IMG} | cut -d: -f1)"
            --set "image.tag=$(echo ${IMG} | cut -d: -f2)"
            --set "image.pullPolicy=Never"
            --set "metrics.enabled=true"
            --set "config.disableAuth=true"
          )
          KIND_WAIT=$(sh scripts/chart-kind-wait.sh "${install[@]}")
          kubectl create namespace "${NS}"
          helm install "${install[@]}" --wait --timeout "${KIND_WAIT}"

      - name: Wait for /readyz on server
        # `iterion.fullname` renders as `<release>-iterion` for the
        # server (no `-server` suffix); the runner template appends
        # `-runner`. Mismatched names here would silently hang for the
        # full --timeout before erroring.
        # Each step after the install carries its own cap (the job cap's
        # floor sums them): here the two 180 s waits.
        timeout-minutes: 7
        run: |
          set -euo pipefail
          kubectl -n "${NS}" wait --for=condition=Available --timeout=180s \
            deployment/${RELEASE}-iterion
          kubectl -n "${NS}" wait --for=condition=Available --timeout=180s \
            deployment/${RELEASE}-iterion-runner

      - name: Port-forward server
        timeout-minutes: 2 # 30 probes a second apart
        run: |
          kubectl -n "${NS}" port-forward svc/${RELEASE}-iterion 4891:4891 &
          # Give port-forward a moment to come up before curl-ing.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4891/readyz; then
              echo
              echo "ready after $i tries"
              break
            fi
            sleep 1
          done

      - name: Launch tool-only workflow inline
        # Exercises server → NATS → runner → Mongo end-to-end. Tool node
        # avoids any LLM dependency so the test stays hermetic. Auth is
        # disabled at install time (config.disableAuth=true) so we don't
        # need to bootstrap a user + JWT just to launch a smoke run.
        # DSL shape (see docs/grammar/iterion_v1.ebnf + examples/*.bot):
        #   - top-level node decls, schemas, then `workflow` block
        #   - tool nodes use `output: <schema>` (singular) referencing a
        #     declared schema, not an inline `outputs:` map — and a node
        #     that declares one prints that schema's fields as ONE JSON
        #     object: plain text there fails the node (ADR-171)
        #   - edges live INSIDE the workflow block as `src -> dst`,
        #     not in a separate `edges:` list
        #   - entry point is `entry:`, not `start:`
        # The previous source mixed YAML idioms with the DSL and 400'd
        # at parse time on `:8` — see commit history for the parse
        # error trace from the cloud-e2e diagnostics.
        timeout-minutes: 3 # the 90 s poll and its requests
        run: |
          set -euo pipefail
          SOURCE=$'schema result:\n  stdout: string\n\ntool t1:\n  command: `printf \'{"stdout": "hello cloud"}\'`\n  output: result\n\nworkflow ci_smoke:\n  entry: t1\n  t1 -> done\n'
          BODY=$(jq -n --arg src "$SOURCE" '{source: $src}')
          RUN_ID=$(curl -sf \
            -H "Content-Type: application/json" \
            -X POST http://localhost:4891/api/runs \
            -d "$BODY" | jq -r '.run_id')
          echo "run_id=$RUN_ID"
          # Poll until the run reaches a terminal status (or 90s).
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:4891/api/runs/$RUN_ID \
              | jq -r '.run.status // .status')
            echo "iter $i: status=$STATUS"
            case "$STATUS" in
              finished) exit 0 ;;
              failed|cancelled|failed_resumable) echo "::error::run terminated as $STATUS"; exit 1 ;;
            esac
            sleep 3
          done
          echo "::error::run did not finish within 90s"
          exit 1

      - name: Verify metrics emission
        # Confirms N1 wiring (post-fix from cloud_ready_review.md): the
        # registered counters are actually incremented by the live
        # cloudpublisher / runner code paths, not just declared.
        timeout-minutes: 2 # a 3 s settle and two scrapes
        run: |
          set -euo pipefail
          kubectl -n "${NS}" port-forward svc/${RELEASE}-iterion 9090:9090 &
          sleep 3
          if ! curl -sf http://localhost:9090/metrics | grep -E '^iterion_runs_created_total\{' | grep -v ' 0$'; then
            echo "::error::iterion_runs_created_total never incremented (server-side metrics regression)"
            curl -sf http://localhost:9090/metrics | grep -E '^iterion_' || true
            exit 1
          fi

      - name: Dump diagnostics on failure
        if: failure()
        timeout-minutes: 5 # pods, events, descriptions and logs
        run: |
          kubectl -n "${NS}" get pods -o wide
          # Events sorted by timestamp surface image-pull, probe, and
          # scheduling failures before having to read pod descriptions.
          kubectl -n "${NS}" get events --sort-by='.lastTimestamp' | tail -50
          # Echo the rendered ITERION_* keys so a service-name mismatch
          # between the ConfigMap and the actual subchart Service shows
          # up immediately (the failure mode the d80c66d follow-up fix
          # addresses).
          kubectl -n "${NS}" get cm "${RELEASE}-iterion-config" -o yaml \
            | grep -E "ITERION_(MONGO|NATS|S3)" || true
          kubectl -n "${NS}" describe pods
          for d in ${RELEASE}-iterion ${RELEASE}-iterion-runner; do
            echo "=== logs $d (current) ==="
            kubectl -n "${NS}" logs deployment/$d --tail=200 || true
            # --previous catches the actual startup error from a
            # CrashLoopBackOff'd container (e.g. runner's nats.Connect
            # failure) — the message is gone after restart otherwise.
            echo "=== logs $d (previous) ==="
            kubectl -n "${NS}" logs deployment/$d --tail=200 --previous || true
          done
          for selector in app.kubernetes.io/component=dev-mongodb app.kubernetes.io/name=nats app.kubernetes.io/component=dev-seaweedfs app.kubernetes.io/component=dev-seaweedfs-init; do
            echo "=== logs label $selector ==="
            kubectl -n "${NS}" logs --tail=200 -l "$selector" || true
          done

  # ─── Hardening jobs (Sprint-8) ────────────────────────────────────
  #
  # These run in parallel with `test` and gate any push/PR independently
  # of the heavier cloud-e2e cluster spin-up. They are intentionally
  # cheap (~1 min each) so they catch their failure class fast.

  vendor-check:
    # `go mod vendor` regenerates vendor/ from the module cache. A
    # divergence between go.mod and vendor/ silently changes what the
    # CI runner compiles vs what a fresh clone compiles — the kind of
    # drift that caused Sprint-8 to find 14h-old modules.txt against a
    # fresher go.mod. Fail the PR before the drift lands.
    # A Homebrew tap update skips this job: the header says why, and `brand` verifies it.
    # It waits for brand and runs behind `!cancelled()` (#3738): skipped on a
    # refused pull request, it must not be created before that run's `test`.
    needs: [brand]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # ADR-105 — see the test job.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: go mod verify
        run: go mod verify
      - name: Vendor + go.mod / go.sum freshness
        run: |
          set -euo pipefail
          go mod tidy
          go mod vendor
          # `git diff --exit-code` fails when the previous two commands
          # changed anything — that's exactly the condition we want to
          # surface as a CI error rather than as a silent build skew.
          git diff --exit-code go.mod go.sum vendor/

  helm-lint:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    # Catches values typing drift cheaply (~30s) so a broken values.yaml
    # surfaces before the cloud-e2e kind cluster bootstrap. The
    # --strict pass on values-prod.yaml additionally rejects unknown
    # keys, the most common foot-gun on a Helm chart upgrade.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm dependency update
        run: helm dependency update charts/iterion
      - name: helm lint (values-dev.yaml)
        run: helm lint charts/iterion -f charts/iterion/values-dev.yaml
      - name: helm lint --strict (values-prod.yaml)
        run: helm lint charts/iterion -f charts/iterion/values-prod.yaml --strict
      # `helm lint` renders nothing image-shaped, and cloud-e2e only ever
      # installs via image.tag — so without these two the digest branch of
      # `iterion.image` is exercised by no CI job at all, and a refactor could
      # drop it (or its shape guard) silently. A malformed digest is the case
      # that matters: it renders a string helm accepts and only kubelet
      # rejects, so the rollout stalls instead of failing.
      - name: image.digest renders and rejects a malformed value
        run: |
          set -euo pipefail
          digest="sha256:$(printf 'a%.0s' $(seq 64))"
          # `--set image.tag=edge` also pins the documented precedence
          # (digest wins), the property a refactor of the `if` is likeliest to
          # invert. Render to a FILE: `grep -q` exits on its first match, which
          # SIGPIPEs helm mid-write and, under `pipefail`, reddens the step on
          # an assertion that actually passed.
          helm template t charts/iterion --set image.tag=edge \
            --set "image.digest=$digest" > /tmp/render-digest.yaml
          # The render has two shared-reference containers (server + runner
          # fallback): count them, so a refactor routing only one through the
          # digest goes red. The patterns accept the reference quoted or bare,
          # so a quoting change in a template cannot blind either check.
          pinned=$(grep -cE "image: \"?ghcr\.io/socialgouv/iterion@$digest\"?$" /tmp/render-digest.yaml || true)
          if [ "$pinned" -lt 2 ]; then
            echo "::error::$pinned container(s) resolved to the digest reference, want the server and the runner (2)"
            exit 1
          fi
          # ...and that NOTHING still resolves through a tag.
          if grep -qE 'image: "?ghcr\.io/socialgouv/iterion:' /tmp/render-digest.yaml; then
            echo "::error::a container still resolved through image.tag despite image.digest being set"
            exit 1
          fi
          if helm template t charts/iterion --set image.digest=deadbeef >/dev/null 2>&1; then
            echo "::error::a malformed image.digest rendered instead of failing"
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # The kind-wait witnesses run scripts/chart-kind-wait.sh, which reads
      # the render through yq; without it on PATH they would SKIP, and the
      # chart gate requires its tools here (REQUIRE=1 below). Pinned by
      # version and digest (mikefarah/yq), at the version the root devbox
      # locks (TestChartKindWaitToolchainPinsYq reds on a drift).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: chart render tests (dead selectors, backup and alert guards)
        # The Go half of `task chart:check`: renders the chart (dev, prod,
        # pools) and confronts every anti-affinity / spread / PDB selector with
        # the labels of its own pods (internal/rendergate — the valkeyha defect
        # of #2012), then the render guards of the backup CronJob and the alert
        # packs. REQUIRE=1: on this job a missing helm is a red step, never a
        # skip (the `test` job has Go but no helm, and skips them by design).
        run: ITERION_CHART_RENDER_REQUIRE=1 go test -mod=vendor -count=1 -run 'TestChart' ./charts/iterion/

  golangci:
    # Curated golangci-lint pass (.golangci.yml): errcheck, govet,
    # ineffassign, staticcheck, unconvert, unused. misspell is deliberately
    # OFF — it flags French comments as misspelled English (1097 false
    # positives). Runs in parallel with `test`; ~1-2 min. Add to the
    # branch-protection required checks to gate merges on a clean lint.
    # A Homebrew tap update skips this job: the header says why, and `brand` verifies it.
    # It waits for brand and runs behind `!cancelled()` (#3738): skipped on a
    # refused pull request, it must not be created before that run's `test`.
    needs: [brand]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_LARGE_RUNNER || 'arc-runners' }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # ADR-105 — see the test job.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install golangci-lint (pinned release binary)
        # Prebuilt upstream release instead of `go install` (which compiles
        # from source, ~70 s cold). Digest-pinned inline like the yq step —
        # and like yq, Renovate does not follow this pin: bumping the version
        # means bumping version and digest by hand. The runner image bakes
        # only Go and Node (ci/arc-runner/Dockerfile); golangci-lint stays a
        # per-run install because its compiled analysis is coupled to the Go
        # version — baking it would silently skew at every Go bump.
        run: |
          set -eu
          curl -fsSL -o /tmp/gcl.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  /tmp/gcl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gcl.tar.gz -C /tmp
          sudo install -m 0755 /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          golangci-lint version
      - name: Run golangci-lint
        # Cold package loading exceeded five minutes on the shared runners,
        # and the self-hosted pods have no Go cache: measured 235–592 s on
        # green runs (2026-11-26), so ten minutes timed out loaded pods with
        # zero issues. Keep every analyzer enabled within the 20-minute job
        # budget.
        run: golangci-lint run --timeout 15m

  brand:
    # The positioning guard: every public surface must carry the product
    # definition verbatim (assets/brand/positioning.md). It lived only in
    # `task check`, which NO workflow runs — so it never executed between a
    # pull request and main. Pure shell + grep, no toolchain, seconds.
    #
    # REQUIRED, so it carries no merge_group skip — deliberately, and the two
    # go together. A job skipped by a job-level `if:` reports SUCCESS, so a
    # required check that never ran would satisfy the gate on every queue
    # entry; the skip and the ruleset entry are one decision, never two. The
    # header comment carries the full argument.
    #
    # It is the cheapest thing in the queue to hold a slot for: shell, grep and
    # sha256, no toolchain, no service, ~40 s.
    #
    # It is also the one required job a Homebrew tap update runs, so the
    # check that keeps the tap skip honest (the header) lives here, where
    # nothing skips it: the job carries no `if:` and no `needs:`, and the
    # step no `if:`.
    #
    # Deliberately NOT `task brand:check` (the asset-drift guard): that one
    # needs magick/pngquant/oxipng from devbox and is a different cost.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    # The other required jobs carry a timeout budget; brand is the one
    # required job without one. Two shell scripts, ~40 s: 10 minutes is ~15x
    # headroom, and a hung script fails this queue entry instead of holding
    # the ruleset's check_response_timeout_minutes (60).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tap verifier diffs a pull request's test merge against its
          # first parent, so it needs the merge's parents, not the merge alone.
          fetch-depth: 2
      - name: A Homebrew tap update changes only the tap
        # The verifier of the tap skip. TAP_ONLY is the skip predicate itself,
        # evaluated — never the title to match a second time: startsWith
        # ignores case, and two matchers that disagree make a hole.
        # internal/ciguard pins this step: no `if:`, no continue-on-error,
        # and TAP_ONLY byte-equal to the predicate the heavy jobs skip on.
        env:
          TAP_ONLY: "${{ startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          # A workflow- or job-level BASH_ENV would be sourced before the
          # check runs; the step's own value wins.
          BASH_ENV: ""
        run: ./scripts/ci/tap-entry-check.sh
      - name: Positioning
        run: ./scripts/brand/positioning-check.sh
      - name: Setup prompt parity
        # bash + awk + diff, all present on a bare runner — the same shape as
        # the two checks above: content guards run DIRECTLY in the required
        # job, because `task check` is not wired into any workflow (a guard
        # that only a local session can run protects nothing between a PR
        # and main).
        run: ./scripts/prompt-parity.sh
      - name: OpenGraph card is not stale
        # bash + coreutils + python3, all present on a bare runner — no
        # browser, no fonts, no devbox. The script says why it checks the
        # source hash AND the artefact rather than comparing pixels.
        run: ./scripts/brand/og-check.sh

  desktop-vet-linux:
    # cmd/iterion-desktop sits behind `//go:build desktop`, so `go build ./...`,
    # `task test`, `race` and `golangci` (which excludes the directory outright)
    # ALL skip it. Nothing compiled that package on a pull request: a type error
    # reached main and surfaced only when desktop-release.yml ran, on a `v*` tag
    # — i.e. during a release, which is the worst moment to discover it.
    #
    # Type-check only: packaging, signing and the artefact matrix stay in the
    # release workflow. This answers one question — does it still compile.
    #
    # ubuntu-22.04, not ubuntu-latest, and pinned for a reason: this is the leg
    # that compiles CGO against the system gtk/webkit headers, and it is only
    # worth running if it sees the SAME headers the release does.
    # desktop-release.yml builds linux/amd64 on ubuntu-22.04; on 24.04 a cgo
    # type error that exists only against 22.04's headers would still reach a
    # release first. Move this the day that one moves. Its dev packages mirror
    # that workflow's Linux step for the same reason.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: Vet the desktop package
        # Same tags the Taskfile pins for a Linux desktop build.
        run: go vet -tags desktop,webkit2_41 ./cmd/iterion-desktop/

  desktop-vet-cross:
    # The other half of the same gap. `go vet` on Linux skips every
    # `*_darwin.go` and `*_windows.go` in the package, so a Linux-only check
    # would leave path_fix_darwin.go, updater_apply_windows.go,
    # single_instance_windows.go and daemon_spawn_windows.go compiling for the
    # first time during a release — the gap narrowed rather than shut.
    #
    # A SEPARATE job rather than two more legs of the one above, and that is
    # the point: these legs need no apt and no cgo, so they belong on the
    # self-hosted scale set — and the routing expression must sit on a
    # job-level `runs-on:` where TestSelfHostedRoutingExpressionsAgree can read
    # it. Inside a matrix `include:` it would be invisible to that guard, which
    # would trade two runner slots for a blind spot in a fork guard.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    name: desktop-vet-cross (${{ matrix.goos }})
    env:
      GOOS: ${{ matrix.goos }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # ADR-105 — see the test job.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Vet the desktop package
        # No webkit2_41: that tag selects the Linux bindings. These GOOS legs
        # type-check with cgo off, measured, so they need no system libraries.
        run: go vet -tags desktop ./cmd/iterion-desktop/

  govulncheck:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    # govulncheck is call-graph aware (only reports CVEs whose vulnerable
    # functions are actually reachable from this codebase). Trivy's
    # filesystem scan catches the broader set including unused-import
    # noise — we keep both. Advisory-only for now: a zero-day disclosure
    # mid-release shouldn't gate a hotfix; results surface in the GitHub
    # Security tab via SARIF so an operator can still triage.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # ADR-105 — see the test job.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (SARIF)
        # `|| true` keeps the step non-blocking. The findings flow to the
        # Security tab via the upload step below. A govulncheck error mid-run
        # leaves a truncated/empty file that upload-sarif rejects with
        # "Unexpected end of JSON input"; fall back to a valid empty SARIF so
        # the upload always has well-formed input.
        run: |
          govulncheck -format sarif ./... > govulncheck.sarif || true
          if ! python3 -c 'import json; json.load(open("govulncheck.sarif"))' 2>/dev/null; then
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > govulncheck.sarif
          fi
      - name: Deduplicate SARIF stacks
        # govulncheck emits the same call stack twice for some findings; the
        # SARIF schema requires uniqueItems and upload-sarif validates the
        # whole file before publishing, refusing it with "stacks contains
        # duplicate item". Deduplicate (unique sorts; the UI order does not
        # matter) so the file passes validation. The update is scoped to the
        # result, not to `.stacks`: assigning through a missing key would
        # create `"stacks": null` on every stack-less result, which the
        # schema refuses just as hard. `results[]?`: a run's `results` key is
        # optional in SARIF 2.1.0 (only `tool` is required), and iterating a
        # missing one would abort jq and red the job with nothing to publish.
        run: |
          jq '.runs[].results[]? |= (if (.stacks | type) == "array" then .stacks |= unique else . end)' \
            govulncheck.sarif > govulncheck.dedup.sarif && mv govulncheck.dedup.sarif govulncheck.sarif
      - name: Upload SARIF
        # The job is advisory (not a required check): findings themselves
        # never red it — the run step above swallows govulncheck's exit code.
        # The upload is the opposite concern and stays LOUD: a red here means
        # vulnerabilities were found and their results are not published, the
        # one failure nobody would notice otherwise. It still cannot block a
        # merge — the job is not in the ruleset.
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  fmt-check:
    # Its own name in the checks list, so a verdict about the catalogue's
    # shape is not buried inside `test`. NOT a required check yet — add it
    # to the ruleset when you want it blocking — but it runs in the merge
    # queue from day one all the same: a required context that only starts
    # existing when it is promoted leaves the queue waiting for a check
    # that never arrives (the note at the top of this file).
    #
    # It is GREEN today, and red only on something worth acting on: a
    # formattable bot that drifted, a file that newly cannot be formatted,
    # or a line in `.fmt-refused` that nothing refuses any more (the
    # ratchet — the list stands empty since #1612 gave the writer its
    # multi-line forms, and stays as the guard). `task fmt:check` runs
    # exactly this command.
    # The org's runners, like every other pure-Go job that stays in the
    # queue: a GitHub-hosted slot is one of the 20 the org shares, and this
    # job needs nothing a self-hosted image lacks. The expression is the
    # small one, copied byte-for-byte from vendor-check —
    # TestSelfHostedRoutingExpressionsAgree asserts every copy is identical.
    # A Homebrew tap update skips this job: the header says why, and `brand` verifies it.
    # It waits for brand and runs behind `!cancelled()` (#3738): skipped on a
    # refused pull request, it must not be created before that run's `test`.
    needs: [brand]
    if: "${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) && !startsWith(github.event.merge_group.head_commit.message || github.event.pull_request.title, 'chore(brew): update tap to ') }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache here, on purpose (#1839): the restore is keyed on
          # go.sum and carries the build cache of the whole suite — ~400 MB
          # measured — for a job that runs ONE vendored command. A slow
          # restore ate the job's whole 10-minute budget and fmt-check was
          # cancelled before checking anything. The `go run` below rebuilds
          # cmd/iterion in a couple of minutes, inside the budget; the
          # module cache is not needed at all (-mod=vendor).
          cache: false
      # Mirror of `task fmt:check`, inlined so the job does not pull go-task
      # for one command. internal/ciguard asserts the two stay identical.
      - name: Shipped bots and examples are canonical
        run: go run -mod=vendor ./cmd/iterion fmt --check --baseline .fmt-refused bots examples

  docs-links:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file. It reports what a change ADDS
    # to the documentation's broken links (#1233), never the backlog it
    # inherited: the head tree is compared against the base tree, so a page
    # the change did not touch cannot redden it. `task docs:links` is the
    # whole-tree check. To promote this to a required check: delete the
    # merge_group skip and the step-level continue-on-error in the same
    # change, and add it to the ruleset.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No Go cache, same reason as fmt-check (#1839): one vendored
          # `go run`, no module downloads — a slow restore of a ~400 MB
          # archive is pure overhead against this job's 10-minute budget.
          cache: false
      - name: Links broken by this change
        # Only pull_request and push carry a base (base.sha, before): on the
        # nightly and a dispatch SINCE would render empty and docslinks would
        # report the whole backlog as broken by this change. The whole-tree
        # step below covers those runs.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # Step-level rather than job-level on purpose: a job-level
        # continue-on-error still paints the job red on the pull request,
        # which is the one thing an advisory verdict must not do. Here the
        # step fails, each new broken link lands as an annotation on its line,
        # and the job stays green.
        continue-on-error: true
        env:
          # The base tree, not a merge base: a shallow clone has no history to
          # walk, and one fetched commit is all the comparison needs. On a
          # pull request HEAD is the merge of the change onto its base, so
          # the difference is exactly what the change adds.
          SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$SINCE"
          go run -mod=vendor ./scripts/docslinks -since "$SINCE" -format github
      - name: Site slugifier held to the GitHub-verified anchors
        run: node docs/scripts/check-anchor-slugs.mjs
      - name: Whole-tree backlog (informational)
        continue-on-error: true
        run: go run -mod=vendor ./scripts/docslinks

  docs-build:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file. It builds the documentation
    # site the way the `docs` workflow builds it before deploying, and that is
    # the only check that sees a link dead ON THE SITE: `docs-links` resolves
    # a link the way github.com does, and a link can be valid there and dead
    # on the site, whose root is docs/. Measured (#1508): 318 such links rode
    # main for three days, green on every required check, while the site
    # stopped publishing. To promote this to a required check: delete the
    # pull-request pin and add it to the ruleset.
    #
    # On the pull request AND on main, like every other advisory job. Main is
    # not covered by `docs.yml`: its push trigger is path-filtered to docs/**,
    # CHANGELOG.md, pnpm-workspace.yaml and itself, while the build reads the
    # root package.json, pnpm-lock.yaml, .npmrc and every workspace manifest.
    # Measured over 400 commits touching those files, 120 matched none of the
    # filtered paths — a dependency bump can stop the site rebuilding and
    # leave main green, which is the silence this job exists to break.
    #
    # No path filter here, deliberately: the change that broke the site was a
    # Go change under pkg/, and the generated pages in docs/references/ are
    # exactly where a Go change lands.
    if: "${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:run') || contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.pull_request.user.type == 'Bot' || github.event.pull_request.head.repo.full_name != github.repository) }}"
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, corepack and the build invocation are docs.yml's, copied rather
      # than restated: a check that builds the site differently from the
      # deploy proves nothing about the deploy.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Before the install, because it needs none: the checker is plain node,
      # and its verdict is worth having even on a run whose dependencies do
      # not resolve. Mirror of `task docs:links:test`; internal/ciguard
      # asserts the two stay identical. The file is named rather than globbed
      # — a glob that matches nothing exits 0 having run nothing.
      - name: Link checker self-test
        run: node --test docs/scripts/check-links.test.mjs

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      # No continue-on-error: an advisory job that cannot go red is a job that
      # reports nothing. It does not block the merge; it is meant to be SEEN.
      - name: Build VitePress site
        run: pnpm --filter @iterion/docs build
