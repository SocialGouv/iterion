name: 🧪 Tests

# One run per commit, not two. An unfiltered `push:` alongside `pull_request:`
# ran the whole suite twice for every PR commit — same sha, two runs, escaping
# each other's concurrency group because their refs differ
# (refs/heads/<branch> vs refs/pull/N/merge). That doubled the runner cost and,
# worse, doubled the exposure to a timing-sensitive test: one run green, the
# other red on the same commit is enough to redden the PR and disarm auto-merge.
#
# `merge_group` is load-bearing: test/race/vendor-check/mongo-conformance/
# golangci are REQUIRED checks, and the queue branch
# (gh-readonly-queue/main/...) used to get them from that unfiltered push. A
# queue build with no checks waits for a context that never arrives and
# dequeues the PR after the 60-minute timeout.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A job that is NOT a required status check cannot block a merge, so running
# it inside the merge queue buys a verdict nobody can act on — while holding a
# runner slot the queue needs. The org shares 20 concurrent jobs across every
# repository, and a queue entry is a full CI cycle, so those slots are what
# decides how long a merge takes. The four advisory jobs below therefore run
# on the pull request and on main, and skip in `merge_group`.
#
# The line to hold: the jobs carrying that skip are exactly the complement of
# the ruleset's required checks (test, race, vendor-check, mongo-conformance,
# golangci, revi/review). Promoting one of them to required means deleting its
# skip in the same change — and the reason is worse than a stalled queue. A
# job skipped by a job-level `if:` reports SUCCESS, so a required check that
# never ran satisfies the gate: every queue entry would merge green on a check
# that did not execute. (A workflow-level filter is the opposite — the check
# never reports and the queue hangs. Same word, opposite failure.)
# The list lives in a ruleset, outside this repo, so nothing here can assert
# it — docs/merge-policy.md carries the same warning beside the required list.

# WHERE these jobs run. The organisation shares 20 concurrent GitHub-hosted
# jobs across every repository, which is what makes a cycle here take 40
# minutes of wall clock for 30 minutes of compute. The self-hosted scale set
# `arc-runners` (org-scoped, ovh-dev) has no such cap.
#
# Two kinds of pull request stay on GitHub-hosted runners, and this is the
# security argument rather than a detail — the repository is PUBLIC and the
# self-hosted runners sit inside the cluster:
#
#   - a FORK PR: arbitrary code from anyone.
#   - a DEPENDENCY-UPDATE PR: its author has write access, but its CONTENT is
#     arbitrary upstream code. `pnpm install` and `go test` execute it, on the
#     very pull request proposing it, before a human has read the diff. Write
#     access is what the author holds; it says nothing about what npm shipped.
#
# The second is matched on the bot's IDENTITY, not on its branch prefix: a
# prefix is configuration, and a guard that reads configuration stops guarding
# the day someone changes it, silently. `endsWith` rather than an equality,
# because renovate runs here under a self-hosted App and its author is
# `socialgouv-renovate[bot]` (renovate.yml says so) — an equality on
# `renovate[bot]` matches nothing at all, and a guard that matches nothing
# looks exactly like a guard that works. `dependabot[bot]` is listed although
# Dependabot is retired here (no .github/dependabot.yml): a carve-out that
# covers a lane before it opens costs one literal, and the alternative is
# remembering this file the day someone turns it back on.
#
# The lever when the scale set stops serving is documented in
# docs/merge-policy.md, not only here — an operator hitting a fleet-wide merge
# stall reads the policy, not a workflow comment.
#
# A same-repo branch from a human or from one of this repository's own agents
# is a different thing: pushing it already requires write access, and its
# content is first-party.
#
# THE ESCAPE HATCH: setting the repository variable CI_SELF_HOSTED to `off`
# sends every job back to GitHub-hosted runners. It exists because three
# REQUIRED checks route here on merge_group, so a scale set that stops serving
# makes every queue entry wait check_response_timeout_minutes (60) for a check
# that never reports, and then fail — all pull requests at once. A variable is
# deliberately the mechanism rather than an edit to this file: repairing by
# merging does not work when merging is what is broken. Unset means on.
#
# Three jobs stay GitHub-hosted whatever the ref. One of them for a settled
# reason — the upstream image ships no C compiler, which -race needs — and two
# because of a startup race and an unexplained kind failure. Each says what is
# measured at its own definition, and what is not; #981 carries the remedy.
# Measured 2026-09-08: the other six pass on self-hosted, nine runner pods
# starting at once with no queueing at all.
#
# So the expression below reads, in three clauses:
#
#   CI_SELF_HOSTED == 'off'        -> GitHub-hosted   (the operator's lever)
#   fork pull request              -> GitHub-hosted   (arbitrary code, anyone)
#   dependency-bot pull request    -> GitHub-hosted   (arbitrary upstream code)
#   everything else                -> arc-runners
#
# It is repeated per job because `runs-on` cannot read workflow-level `env`,
# and routing it through a `needs:` job would put every job behind one
# GitHub-hosted slot — reintroducing the queue this exists to escape. That
# repetition is a drift risk on a SECURITY decision, so the six copies are
# pinned against each other by TestSelfHostedRoutingExpressionsAgree in
# internal/ciguard: one copy edited alone turns it red.

jobs:
  test:
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The modernize bot-level tests execute the bot's real plan_read /
      # lot_verify / mark_done scripts, which read the programme contract
      # through yq. Without it on PATH they SKIP — and a skipped guard test is
      # a green no-op, the very class those guards refuse. Pinned by version
      # and digest (mikefarah/yq, the same implementation the bundles pin).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          echo "0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Build studio frontend
        working-directory: studio
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec vite build
          rm -rf ../pkg/server/static/assets ../pkg/server/static/index.html
          cp -r dist/* ../pkg/server/static/

      - name: Studio lint + typecheck + unit tests
        # Mirror of `task studio:check` (eslint / tsc -b / vitest), inlined so
        # the test job doesn't pull go-task. Reuses the node_modules installed
        # by the build step above.
        working-directory: studio
        run: |
          pnpm exec eslint .
          pnpm exec tsc -b
          pnpm exec vitest run

      - name: OpenAPI spec + client drift check
        # The committed openapi.json (offline-generated from the in-code route
        # table) and studio/src/api/schema.ts (typed client surface) must match
        # the code. Mirror of `task openapi:check`, inlined so the test job
        # doesn't pull go-task. Reuses the studio node_modules installed above.
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=vendor ./cmd/iterion openapi -o openapi.json
          pnpm -C studio exec openapi-typescript ../openapi.json -o src/api/schema.ts
          if ! git diff --quiet -- openapi.json studio/src/api/schema.ts; then
            echo "::error::OpenAPI spec / client drift — run 'task openapi:gen' and commit the result."
            git --no-pager diff --stat -- openapi.json studio/src/api/schema.ts
            exit 1
          fi

      - name: Helm chart version drift check
        # Mirror of `task chart:check-version`, inlined so we don't pull
        # go-task into the test job. release-it bumps package.json on
        # release; if Chart.yaml's `version` or `appVersion` isn't synced
        # (via `task chart:sync-version`), the OCI publish ships a chart
        # whose image tag points to a stale build. Fail the PR before that
        # happens.
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CHART_VER=$(awk '/^version:/ {print $2; exit}' charts/iterion/Chart.yaml)
          CHART_APP=$(awk '/^appVersion:/ {gsub(/"/,""); print $2; exit}' charts/iterion/Chart.yaml)
          if [ "$PKG" != "$CHART_VER" ] || [ "$PKG" != "$CHART_APP" ]; then
            echo "::error::Chart.yaml drift: version=$CHART_VER appVersion=$CHART_APP package.json=$PKG"
            echo "Run 'task chart:sync-version' to align them, then commit the result."
            exit 1
          fi

      - name: gofmt (check)
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -name '*.go' -not -path './vendor/*' -print)
          if [[ -n "${files}" ]]; then
            unformatted=$(gofmt -l ${files})
            if [[ -n "${unformatted}" ]]; then
              echo "gofmt needed on:"
              echo "${unformatted}"
              exit 1
            fi
          fi

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: Unit tests
        # `./...` includes the e2e package, which has its own step below with
        # its own budget; running it here too doubled the job's wall-clock
        # AND ran the suite under Go's implicit per-package 10m first — the
        # timeout that actually ejected PRs from the merge queue. Unit tests
        # are everything but e2e; the e2e step is the only e2e run.
        run: go test -mod=vendor $(go list -mod=vendor ./... | grep -v '/e2e$')

      - name: E2E tests
        # The ONLY run of the e2e package in this job (the unit step excludes
        # it). The number bounds a HANG, not a slow machine: a timeout that a
        # healthy run can reach is a coin flip that ejects PRs from the merge
        # queue with a panic dump naming whichever test happened to be in
        # flight.
        #
        # The suite runs its tests in parallel (t.Parallel() on every row that
        # owns its state; e2e/main_test.go caps how many run at once, because
        # these tests wait on background loops and oversubscription starves
        # them). Measured 2026-09-07 on a 32-core box, whole package, the two
        # runs back to back: 503.8 s at -parallel 1, 114.5 s capped — a 4.4x
        # cut, so the wall clock no longer tracks the suite's size the way the
        # 568-572 s merge-group builds of 2026-09-06 did. Slowest parallel run
        # observed across six measurements: 259 s, on a box shared with other
        # builds. 900 s is past 2x that, so it stays as the hang bound rather
        # than being re-tightened onto the new figure.
        run: go test -mod=vendor -v -timeout 900s ./e2e/...

  race:
    # Data-race detector pass. The `test` job runs CGO_ENABLED=0 with no
    # -race, so it cannot surface the concurrency races that only the race
    # detector finds — and the engine is concurrency-heavy (fan-out branch
    # scheduling in pkg/runtime, the dispatcher actor in pkg/dispatcher, the
    # store's parallel-branch turn writes in pkg/store). Without this job a
    # data race regresses silently until it flakes a developer's machine.
    #
    # -race REQUIRES cgo, so this job overrides the repo-wide CGO_ENABLED=0
    # (ubuntu-latest ships gcc). Runs in parallel with `test`; a compile error
    # surfaces here too, so no `needs:` ordering. ~2-3x slower than the plain
    # test job, hence the wider -timeout and job budget.
    # GitHub-hosted: -race needs cgo, and the self-hosted image has no C
    # compiler (`cgo: C compiler "gcc" not found`, every package build-failed).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The modernize bot-level tests execute the bot's real plan_read /
      # lot_verify / mark_done scripts, which read the programme contract
      # through yq. Without it on PATH they SKIP — and a skipped guard test is
      # a green no-op, the very class those guards refuse. Pinned by version
      # and digest (mikefarah/yq, the same implementation the bundles pin).
      - name: Install yq (pinned)
        run: |
          set -eu
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.52.4/yq_linux_amd64
          echo "0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Race tests (unit + e2e)
        # 1800s bounds a HANG, not a slow machine. -race runs the e2e package
        # 2-3x slower than the plain job; before the suite went parallel that
        # measured 862 s on a green merge-group build and crossed 900 s
        # (panic) on 2026-09-06. With t.Parallel() the same package measures
        # 153.8 s under -race (2026-09-07, 32-core box, race detector clean),
        # so the budget now carries an order of magnitude of headroom and
        # stays as the hang bound. The 45-minute job budget caps the run.
        run: go test -race -mod=vendor -timeout 1800s ./...

  mongo-conformance:
    # Runs the pkg/store/mongo conformance harness against a real Mongo
    # replica set (change-streams + transactions). The harness is gated
    # on ITERION_TEST_MONGO_URI in-tree so a developer's plain `go test
    # ./...` skips it; CI provides the URI explicitly so the contract
    # stays enforced. Without this job, every store/mongo + queue/nats
    # change ships untested.
    #
    # Runs in parallel with `test`: this job is self-contained (its own
    # checkout + go build) and a compile error here surfaces the same
    # failure the `test` job would. Sequential `needs: test` cost 3-4
    # min of wall-clock without catching anything earlier.
    # GitHub-hosted: the runner agent's container-init phase races the dind
    # sidecar. Measured — runner up 14:34:57, `dial unix
    # /run/docker/docker.sock` at 14:35:05, eight seconds in — while a sibling
    # job's `docker run` succeeds 76 s after ITS start. So the daemon does come
    # up; the agent just asks too early. A dind-readiness gate would move this
    # job; see #981.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Plain mongo here because GitHub-Actions service containers can't
      # run `rs.initiate()` ergonomically. The init step below brings up
      # the replica set explicitly via docker exec on the same container.
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Reconfigure mongo as a replica set
        # The default service container starts plain mongod. We restart
        # it with --replSet rs0 + run rs.initiate() so change-streams
        # and transactions work — both required by the conformance suite
        # (event seq monotonicity + LockExclusivity).
        run: |
          set -euo pipefail
          # Find the running mongo container started by the service block.
          CID=$(docker ps -q --filter "ancestor=mongo:8.0")
          docker stop "$CID"
          docker rm "$CID"
          docker run -d --name mongo-rs \
            -p 27017:27017 \
            mongo:8.0 \
            --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval '
            try { rs.status() } catch(e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
            }
          '
          # Wait for primary election before letting tests connect. No
          # PRIMARY within the window fails the STEP: falling through would
          # let the harness connect to a set with no primary and report the
          # failure as a store bug on whatever PR happens to be in the queue.
          STATE=""
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo-rs mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null || true)
            if [ "$STATE" = "PRIMARY" ]; then
              echo "rs0 primary elected"
              break
            fi
            sleep 2
          done
          if [ "$STATE" != "PRIMARY" ]; then
            echo "rs0: no PRIMARY after 60s (last state: ${STATE:-unknown})" >&2
            docker exec mongo-rs mongosh --quiet --eval 'printjson(rs.status())' || true
            docker logs --tail 100 mongo-rs || true
            exit 1
          fi

      - name: Mongo conformance harness
        # Alongside the pkg/store/mongo harness, run EVERY suite gated on
        # this URI. A Mongo-only test that no job runs is a test that
        # cannot fail: the list below must stay in sync with
        #   grep -rl ITERION_TEST_MONGO_URI --include='*_test.go' pkg/
        # Several suites (secrets, orgusage, botsource, runstream,
        # orgsweep) were silently outside it — which matters because these
        # are exactly the semantics the memory stores do not model
        # (tenant filters, CAS, change streams).
        env:
          ITERION_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
        run: |
          go test -mod=vendor -v -timeout 5m ./pkg/store/mongo/... \
            ./pkg/internal/storekit/... ./pkg/audit/... ./pkg/pat/... \
            ./pkg/cloudsched/... ./pkg/auth/desktopsso/... ./pkg/auth/wsticket/... \
            ./pkg/secrets/... ./pkg/orgusage/... ./pkg/credusage/... \
            ./pkg/botsource/... \
            ./pkg/runview/runstream/... ./pkg/cloud/orgsweep/... \
            ./pkg/usagecap/... ./pkg/dispatcher/boardmongo/... ./pkg/identity/... \
            ./pkg/pluginsource/... ./pkg/webhooks/... ./pkg/server/cloudpublisher/... \
            ./pkg/forge/... ./pkg/trigger/...

      - name: Mongo diagnostics on failure
        # A harness failure that reads "ReplicaSetNoPrimary" AFTER the
        # election step printed "primary elected" is a broker-side event
        # (a step-down, a restart, a late handshake under load), not a
        # store regression. Capture what the set and the container saw
        # so the failure can be attributed without re-running the job.
        if: failure()
        run: |
          echo "::group::rs.status()"
          docker exec mongo-rs mongosh --quiet --eval 'printjson(rs.status())' || true
          echo "::endgroup::"
          echo "::group::container state"
          docker inspect mongo-rs --format 'status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}} oom={{.State.OOMKilled}}' || true
          echo "::endgroup::"
          echo "::group::docker logs mongo-rs (tail 300)"
          docker logs --tail 300 mongo-rs || true
          echo "::endgroup::"

  nats-conformance:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: github.event_name != 'merge_group'
    # Runs the JetStream integration tests (mixed-version schema rollout,
    # issue #481) against a real broker. Gated on ITERION_TEST_NATS_URI
    # in-tree so a developer's plain `go test ./...` skips them; CI
    # provides the URI explicitly so the contract stays enforced.
    # Mirror of the mongo-conformance job above.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Start NATS with JetStream
        # No services: block — it cannot pass `-js` to the container
        # command. Same docker-run pattern as the mongo replica-set step.
        run: |
          set -euo pipefail
          docker run -d --name nats-js -p 4222:4222 nats:2.14-alpine -js
          ready=0
          for i in $(seq 1 30); do
            logs="$(docker logs nats-js 2>&1)"
            if grep -Fq "Server is ready" <<<"$logs"; then
              echo "nats ready"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs nats-js
            echo "NATS did not become ready"
            exit 1
          fi
          logs="$(docker logs nats-js 2>&1)"
          grep -Fq "JetStream" <<<"$logs" || { echo "JetStream not enabled"; exit 1; }

      - name: JetStream integration tests
        # Alongside pkg/runner's schema-rollout test, run EVERY suite
        # gated on this URI — a NATS-only test that no job runs is a
        # test that cannot fail. Keep in sync with:
        #   grep -rl ITERION_TEST_NATS_URI --include='*_test.go' pkg/
        env:
          ITERION_TEST_NATS_URI: nats://localhost:4222
        run: |
          go test -mod=vendor -v -timeout 5m ./pkg/runner/... ./pkg/queue/...

  cloud-e2e:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: github.event_name != 'merge_group'
    # Builds the iterion image, spins kind + Helm-installs the cloud
    # stack with bundled Mongo + NATS + MinIO (values-dev.yaml), then
    # exercises the full chain (server → NATS → runner → Mongo →
    # /metrics). Catches regressions that helm lint cannot — wrong
    # ConfigMap key, broken probe path, RBAC drift, missing image,
    # /readyz logic.
    #
    # Runs in parallel with `test`: this job builds its own iterion
    # image and a Go compile error surfaces here too. The previous
    # `needs: test` was purely defensive and cost 3-4 min of
    # wall-clock per push.
    # GitHub-hosted: kind comes up, kubectl cannot authenticate to it. The
    # cause is NOT established — it is not the image's docker access, which a
    # sibling job uses successfully. See #981.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER: iterion-e2e
      IMG: iterion-e2e:ci
      NS: iterion
      RELEASE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build iterion image (local)
        # Build the local image only — no push. kind loads it directly
        # via `kind load docker-image` so the test is hermetic and
        # doesn't depend on image.yml succeeding first.
        # The Dockerfile's `studio-builder` stage runs pnpm + vite
        # build itself, so a separate host-side studio build step is
        # redundant; saves ~30s and a Node 24 setup.
        run: |
          docker build -t "${IMG}" .

      - name: Set up kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: Load image into kind
        run: |
          kind load docker-image "${IMG}" --name "${KIND_CLUSTER}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build chart dependencies
        # Sub-charts (mongodb, nats, minio) are declared in Chart.yaml but
        # not vendored in git (charts/iterion/charts/ is gitignored). Mirror
        # what `task chart:kind` does locally so values-dev.yaml's bundled
        # stack resolves at install time.
        run: helm dependency update ./charts/iterion

      - name: Helm install (values-dev.yaml)
        # CI-specific overrides on top of values-dev.yaml:
        #   - mongodb.arbiter.enabled=false: a 1-data-replica set doesn't
        #     need an arbiter; bitnami's chart spawns one by default in
        #     architecture=replicaset, which adds a pod that waits forever.
        #   - {mongodb,minio}.persistence.enabled=false: PVC binding via
        #     kind's local-path-provisioner adds 30-60s for no benefit
        #     in a hermetic test.
        # Combined with --timeout 10m these eliminated the 5m install
        # deadline overruns observed in CI.
        run: |
          set -euo pipefail
          kubectl create namespace "${NS}"
          helm install "${RELEASE}" ./charts/iterion \
            --namespace "${NS}" \
            --values ./charts/iterion/values-dev.yaml \
            --set "image.repository=$(echo ${IMG} | cut -d: -f1)" \
            --set "image.tag=$(echo ${IMG} | cut -d: -f2)" \
            --set "image.pullPolicy=Never" \
            --set "metrics.enabled=true" \
            --set "mongodb.arbiter.enabled=false" \
            --set "mongodb.persistence.enabled=false" \
            --set "minio.persistence.enabled=false" \
            --set "config.disableAuth=true" \
            --wait --timeout 10m

      - name: Wait for /readyz on server
        # `iterion.fullname` renders as `<release>-iterion` for the
        # server (no `-server` suffix); the runner template appends
        # `-runner`. Mismatched names here would silently hang for the
        # full --timeout before erroring.
        run: |
          set -euo pipefail
          kubectl -n "${NS}" wait --for=condition=Available --timeout=180s \
            deployment/${RELEASE}-iterion
          kubectl -n "${NS}" wait --for=condition=Available --timeout=180s \
            deployment/${RELEASE}-iterion-runner

      - name: Port-forward server
        run: |
          kubectl -n "${NS}" port-forward svc/${RELEASE}-iterion 4891:4891 &
          # Give port-forward a moment to come up before curl-ing.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4891/readyz; then
              echo
              echo "ready after $i tries"
              break
            fi
            sleep 1
          done

      - name: Launch tool-only workflow inline
        # Exercises server → NATS → runner → Mongo end-to-end. Tool node
        # avoids any LLM dependency so the test stays hermetic. Auth is
        # disabled at install time (config.disableAuth=true) so we don't
        # need to bootstrap a user + JWT just to launch a smoke run.
        # DSL shape (see docs/grammar/iterion_v1.ebnf + examples/*.bot):
        #   - top-level node decls, schemas, then `workflow` block
        #   - tool nodes use `output: <schema>` (singular) referencing a
        #     declared schema, not an inline `outputs:` map
        #   - edges live INSIDE the workflow block as `src -> dst`,
        #     not in a separate `edges:` list
        #   - entry point is `entry:`, not `start:`
        # The previous source mixed YAML idioms with the DSL and 400'd
        # at parse time on `:8` — see commit history for the parse
        # error trace from the cloud-e2e diagnostics.
        run: |
          set -euo pipefail
          SOURCE=$'schema result:\n  stdout: string\n\ntool t1:\n  command: "echo hello cloud"\n  output: result\n\nworkflow ci_smoke:\n  entry: t1\n  t1 -> done\n'
          BODY=$(jq -n --arg src "$SOURCE" '{source: $src}')
          RUN_ID=$(curl -sf \
            -H "Content-Type: application/json" \
            -X POST http://localhost:4891/api/runs \
            -d "$BODY" | jq -r '.run_id')
          echo "run_id=$RUN_ID"
          # Poll until the run reaches a terminal status (or 90s).
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:4891/api/runs/$RUN_ID \
              | jq -r '.run.status // .status')
            echo "iter $i: status=$STATUS"
            case "$STATUS" in
              finished) exit 0 ;;
              failed|cancelled|failed_resumable) echo "::error::run terminated as $STATUS"; exit 1 ;;
            esac
            sleep 3
          done
          echo "::error::run did not finish within 90s"
          exit 1

      - name: Verify metrics emission
        # Confirms N1 wiring (post-fix from cloud_ready_review.md): the
        # registered counters are actually incremented by the live
        # cloudpublisher / runner code paths, not just declared.
        run: |
          set -euo pipefail
          kubectl -n "${NS}" port-forward svc/${RELEASE}-iterion 9090:9090 &
          sleep 3
          if ! curl -sf http://localhost:9090/metrics | grep -E '^iterion_runs_created_total\{' | grep -v ' 0$'; then
            echo "::error::iterion_runs_created_total never incremented (server-side metrics regression)"
            curl -sf http://localhost:9090/metrics | grep -E '^iterion_' || true
            exit 1
          fi

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "${NS}" get pods -o wide
          # Events sorted by timestamp surface image-pull, probe, and
          # scheduling failures before having to read pod descriptions.
          kubectl -n "${NS}" get events --sort-by='.lastTimestamp' | tail -50
          # Echo the rendered ITERION_* keys so a service-name mismatch
          # between the ConfigMap and the actual subchart Service shows
          # up immediately (the failure mode the d80c66d follow-up fix
          # addresses).
          kubectl -n "${NS}" get cm "${RELEASE}-iterion-config" -o yaml \
            | grep -E "ITERION_(MONGO|NATS|S3)" || true
          kubectl -n "${NS}" describe pods
          for d in ${RELEASE}-iterion ${RELEASE}-iterion-runner; do
            echo "=== logs $d (current) ==="
            kubectl -n "${NS}" logs deployment/$d --tail=200 || true
            # --previous catches the actual startup error from a
            # CrashLoopBackOff'd container (e.g. runner's nats.Connect
            # failure) — the message is gone after restart otherwise.
            echo "=== logs $d (previous) ==="
            kubectl -n "${NS}" logs deployment/$d --tail=200 --previous || true
          done
          for app in mongodb nats minio; do
            echo "=== logs label app.kubernetes.io/name=$app ==="
            kubectl -n "${NS}" logs --tail=200 -l "app.kubernetes.io/name=$app" || true
          done

  # ─── Hardening jobs (Sprint-8) ────────────────────────────────────
  #
  # These run in parallel with `test` and gate any push/PR independently
  # of the heavier cloud-e2e cluster spin-up. They are intentionally
  # cheap (~1 min each) so they catch their failure class fast.

  vendor-check:
    # `go mod vendor` regenerates vendor/ from the module cache. A
    # divergence between go.mod and vendor/ silently changes what the
    # CI runner compiles vs what a fresh clone compiles — the kind of
    # drift that caused Sprint-8 to find 14h-old modules.txt against a
    # fresher go.mod. Fail the PR before the drift lands.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: Vendor + go.mod / go.sum freshness
        run: |
          set -euo pipefail
          go mod tidy
          go mod vendor
          # `git diff --exit-code` fails when the previous two commands
          # changed anything — that's exactly the condition we want to
          # surface as a CI error rather than as a silent build skew.
          git diff --exit-code go.mod go.sum vendor/

  helm-lint:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: github.event_name != 'merge_group'
    # Catches values typing drift cheaply (~30s) so a broken values.yaml
    # surfaces before the 25-minute cloud-e2e kind cluster bootstrap. The
    # --strict pass on values-prod.yaml additionally rejects unknown
    # keys, the most common foot-gun on a Helm chart upgrade.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm dependency update
        run: helm dependency update charts/iterion
      - name: helm lint (values-dev.yaml)
        run: helm lint charts/iterion -f charts/iterion/values-dev.yaml
      - name: helm lint --strict (values-prod.yaml)
        run: helm lint charts/iterion -f charts/iterion/values-prod.yaml --strict
      # `helm lint` renders nothing image-shaped, and cloud-e2e only ever
      # installs via image.tag — so without these two the digest branch of
      # `iterion.image` is exercised by no CI job at all, and a refactor could
      # drop it (or its shape guard) silently. A malformed digest is the case
      # that matters: it renders a string helm accepts and only kubelet
      # rejects, so the rollout stalls instead of failing.
      - name: image.digest renders and rejects a malformed value
        run: |
          set -euo pipefail
          digest="sha256:$(printf 'a%.0s' $(seq 64))"
          # `--set image.tag=edge` also pins the documented precedence
          # (digest wins), the property a refactor of the `if` is likeliest to
          # invert. Render to a FILE: `grep -q` exits on its first match, which
          # SIGPIPEs helm mid-write and, under `pipefail`, reddens the step on
          # an assertion that actually passed.
          helm template t charts/iterion --set image.tag=edge \
            --set "image.digest=$digest" > /tmp/render-digest.yaml
          grep -q "image: ghcr.io/socialgouv/iterion@$digest" /tmp/render-digest.yaml
          # ...and that NOTHING still resolves through the tag. The render has
          # two iterion.image containers (server + runner fallback) and grep -q
          # stops at the first, so a refactor routing only one of them through
          # the digest would otherwise still pass.
          if grep -q "image: ghcr.io/socialgouv/iterion:edge" /tmp/render-digest.yaml; then
            echo "::error::a container still resolved through image.tag despite image.digest being set"
            exit 1
          fi
          if helm template t charts/iterion --set image.digest=deadbeef >/dev/null 2>&1; then
            echo "::error::a malformed image.digest rendered instead of failing"
            exit 1
          fi

  golangci:
    # Curated golangci-lint pass (.golangci.yml): errcheck, govet,
    # ineffassign, staticcheck, unconvert, unused. misspell is deliberately
    # OFF — it flags French comments as misspelled English (1097 false
    # positives). Runs in parallel with `test`; ~1-2 min. Add to the
    # branch-protection required checks to gate merges on a clean lint.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  govulncheck:
    # Advisory: not a required check, so it cannot block a merge — see the
    # merge-queue note at the top of this file.
    if: github.event_name != 'merge_group'
    # govulncheck is call-graph aware (only reports CVEs whose vulnerable
    # functions are actually reachable from this codebase). Trivy's
    # filesystem scan catches the broader set including unused-import
    # noise — we keep both. Advisory-only for now: a zero-day disclosure
    # mid-release shouldn't gate a hotfix; results surface in the GitHub
    # Security tab via SARIF so an operator can still triage.
    runs-on: ${{ (vars.CI_SELF_HOSTED == 'off' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || endsWith(github.event.pull_request.user.login, 'renovate[bot]') || github.event.pull_request.user.login == 'dependabot[bot]'))) && 'ubuntu-latest' || 'arc-runners' }}
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (SARIF)
        # `|| true` keeps the step non-blocking. The findings flow to the
        # Security tab via the upload step below. A govulncheck error mid-run
        # leaves a truncated/empty file that upload-sarif rejects with
        # "Unexpected end of JSON input"; fall back to a valid empty SARIF so
        # the upload always has well-formed input.
        run: |
          govulncheck -format sarif ./... > govulncheck.sarif || true
          if ! python3 -c 'import json; json.load(open("govulncheck.sarif"))' 2>/dev/null; then
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > govulncheck.sarif
          fi
      - name: Upload SARIF
        # Advisory-only (see job header): a SARIF-upload hiccup must not red
        # the suite, so the result is informational, not a gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
