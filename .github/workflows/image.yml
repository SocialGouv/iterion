name: 🐳 Container Image

# THE SERVER IMAGE ONLY (`iterion`), amd64, published fast — this workflow's
# completion is THE "server ready to redeploy" signal a CD watcher keys on.
# Nothing deploy-irrelevant rides here: the runner image, the sandbox
# finalizes, and the release arm64+sign each live in their own downstream
# workflow so this signal never waits on them (docs/ci-pipeline-topology.md).
#
#   this (image.yml)        → iterion (server) amd64      ⟹ SIGNAL "server ready"
#   runner-image.yml        → runner-devbox amd64          ⟹ SIGNAL "runner ready"  (workflow_run)
#   sandbox-images.yml      → bases + finalizes            (off deploy path)
#   release-images.yml      → everything multiarch+signed  (tags only, off deploy path)
#
# amd64-only on purpose, main AND tags: the OVH clusters are amd64 (12/12
# nodes), so the deployable tag must not wait on the slower arm64 leg. arm64 is
# kept but folded into a signed multi-arch index later by release-images.yml —
# the deploy pulls the amd64 manifest throughout. PR events validate locally
# (amd64 --load, no operator/secrets). See _build-image.yml for the rationale.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/image.yml"
      - ".github/workflows/_build-image.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel obsolete iterations on PRs; serialise on main/tag pushes so
  # concurrent builds never clobber a `:edge` or `:vX.Y.Z` tag mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # cosign keyless OIDC signing + the operator's GitHub OIDC /route auth need an
  # OIDC token at workflow level; reusable-workflow jobs request it per-job.
  id-token: write

jobs:
  # Shared values: lowercase owner (OCI refs must be lowercase) + the image
  # tag this run builds against — the release tag on a tag push, else the
  # rolling `edge` (also `edge` on PRs, which reference published images).
  prep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      base_tag: ${{ steps.vars.outputs.base_tag }}
      app_version: ${{ steps.vars.outputs.app_version }}
    steps:
      - id: vars
        run: |
          echo "owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "base_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "base_tag=edge" >> "$GITHUB_OUTPUT"
          fi
          # Clean semver for appinfo.Version (the Dockerfile prepends the
          # single "v"). github.ref_name is the wrong source: a tag is
          # already v-prefixed ("v0.32.0" → binary reports "vv0.32.0") and a
          # branch push is its name ("main" → "vmain", which also flips
          # appinfo.SandboxImageTag() onto a phantom ":vmain" sandbox tag).
          # package.json is the single source of truth — release tags are
          # release-it bumps of it, so tag builds and main builds agree.
          echo "app_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" --jq '.content' | base64 -d | jq -r '.version')" >> "$GITHUB_OUTPUT"

  # The iterion server image — the deployable tag, published as soon as it is
  # built; this job finishing = the workflow finishing = the deploy signal.
  #   - main: `:edge`, amd64-only + unsigned (OVH prod is amd64, :edge is
  #     ephemeral) → the fast test→fix→redeploy loop, ~2-3 min.
  #   - tag:  `:vX.Y.Z`+`:maj.min`, multi-arch + cosign-signed — the release
  #     server artifact prod deploys. arm64 IS the artifact here (a signed
  #     multi-arch index), so it is built in-line; releases are infrequent.
  # The runner image + sandbox finalizes (main) and the release runner/sandbox
  # multi-arch tags are built in their own downstream workflows so this signal
  # never waits on them.
  build:
    needs: prep
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit
    with:
      image-name: iterion
      routing-name: iterion
      context: .
      file: Dockerfile
      build-args: |
        VERSION=${{ needs.prep.outputs.app_version }}
        COMMIT=${{ github.sha }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      multiarch: ${{ startsWith(github.ref, 'refs/tags/v') }}
