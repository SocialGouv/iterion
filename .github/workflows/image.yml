name: 🐳 Container Image

# App-side images only: the main iterion image, the runner-devbox image, and
# the cheap sandbox finalizes (binary stamped onto the published *-base tool
# images via _finalize.yml). The heavy tool bases build in the independent
# sandbox-images.yml — its own trigger paths and concurrency queue, so app
# iteration never waits on the sandbox chain.
#
# Each image is built by the reusable _build-image.yml: amd64 on the in-house
# buildkit-operator warm daemon, arm64 natively on a GitHub arm runner, merged
# into one multi-arch index and cosign-signed. PR events validate locally
# (amd64 --load, no operator/secrets). See _build-image.yml for the rationale.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.runner-devbox"
      - "docker/**"
      - ".github/workflows/image.yml"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/_finalize.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel obsolete iterations on PRs; serialise on main/tag pushes so
  # concurrent builds never clobber a `:edge` or `:vX.Y.Z` tag mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # cosign keyless OIDC signing + the operator's GitHub OIDC /route auth need an
  # OIDC token at workflow level; reusable-workflow jobs request it per-job.
  id-token: write

jobs:
  # Shared values: lowercase owner (OCI refs must be lowercase) + the image
  # tag this run builds against — the release tag on a tag push, else the
  # rolling `edge` (also `edge` on PRs, which reference published images).
  prep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      base_tag: ${{ steps.vars.outputs.base_tag }}
      app_version: ${{ steps.vars.outputs.app_version }}
    steps:
      - id: vars
        run: |
          echo "owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "base_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "base_tag=edge" >> "$GITHUB_OUTPUT"
          fi
          # Clean semver for appinfo.Version (the Dockerfile prepends the
          # single "v"). github.ref_name is the wrong source: a tag is
          # already v-prefixed ("v0.32.0" → binary reports "vv0.32.0") and a
          # branch push is its name ("main" → "vmain", which also flips
          # appinfo.SandboxImageTag() onto a phantom ":vmain" sandbox tag).
          # package.json is the single source of truth — release tags are
          # release-it bumps of it, so tag builds and main builds agree.
          echo "app_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" --jq '.content' | base64 -d | jq -r '.version')" >> "$GITHUB_OUTPUT"

  # Main iterion image.
  build:
    needs: prep
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit
    with:
      image-name: iterion
      routing-name: iterion
      context: .
      file: Dockerfile
      build-args: |
        VERSION=${{ needs.prep.outputs.app_version }}
        COMMIT=${{ github.sha }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      # Full multi-arch (+ sign + SBOM) ONLY on release tags. main's `:edge` is
      # amd64-only + unsigned: the OVH clusters are amd64, `:edge` is ephemeral,
      # and dropping the arm64 leg + cosign/SBOM keeps the test→fix loop fast
      # (~5-6 min). A `docker pull :edge` on an arm Mac won't resolve — pull a
      # tagged release there instead.
      multiarch: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Sandbox finalizes — stamp the freshly-built iterion binary onto the
  # published *-base tool images (cheap COPY layers, all four in parallel), so
  # the sandbox `:edge` images track every app push. On release tags this same
  # job produces the multiarch+signed iterion-sandbox-*:vX.Y.Z images from the
  # always-multiarch *-base:edge (bases are versioned by content, not by
  # release — sandbox-images.yml rebuilds them only when sandbox/ changes).
  finalize:
    needs: [prep, build]
    uses: ./.github/workflows/_finalize.yml
    secrets: inherit
    with:
      owner_lc: ${{ needs.prep.outputs.owner_lc }}
      iterion_tag: ${{ needs.prep.outputs.base_tag }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      multiarch: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # iterion-runner-devbox — the devbox-first-class cloud runner image: Nix +
  # devbox on top of the runner toolset, so a build-needing bot (Billy /
  # feature-dev) runs `devbox run -- <build>` and the TARGET repo's devbox.json
  # provisions its exact toolchain (cross-language, cross-version). Bakes the
  # iterion binary via COPY --from, so it needs the iterion image published
  # first. Builds every push so the runner tracks the latest code — a stale
  # runner would run bots on old code.
  build-runner-devbox:
    needs: [prep, build]
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit
    with:
      image-name: iterion-runner-devbox
      routing-name: iterion-runner-devbox
      context: .
      file: Dockerfile.runner-devbox
      build-args: ITERION_IMAGE=ghcr.io/${{ needs.prep.outputs.owner_lc }}/iterion:${{ needs.prep.outputs.base_tag }}
      is-pr: ${{ github.event_name == 'pull_request' }}
      multiarch: ${{ startsWith(github.ref, 'refs/tags/v') }}
