name: 🏷️ Release Images (runner + sandbox)

# The RELEASE multi-arch tags for the images image.yml does NOT build on a tag:
# the runner (`iterion-runner-devbox:vX.Y.Z`) and the sandbox finalizes
# (`iterion-sandbox-*:vX.Y.Z`). The server (`iterion:vX.Y.Z`, multi-arch +
# signed) is built by image.yml itself — kept out of here so the two never race
# on the same tag.
#
# Triggered by the tag push directly (github.ref is the tag, so checkout + the
# semver tag naming are correct — a workflow_run event would carry the default
# branch instead). The runner + finalizes COPY the iterion binary from the
# tagged server image, so `await-server` polls until image.yml has published
# `iterion:vX.Y.Z` before they build — resolving the cross-workflow dependency
# without either workflow racing to publish the server tag.
#
# Entirely OFF the deploy critical path: prod's runner tracks `:edge` (a main
# tag), and sandbox images are pulled at bot-run time. These `:vX.Y.Z` tags
# exist for completeness + the released binary's `sandbox: auto` resolution
# (appinfo.SandboxImageTag). See docs/ci-pipeline-topology.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prep:
    # Tag refs only. A workflow_dispatch from a branch (e.g. main) would set
    # base_tag=main, find iterion:main, and republish the runner/sandbox `:edge`
    # tags as multi-arch+signed — breaking the "edge = amd64-only/unsigned"
    # invariant. Re-run a release by dispatching from the tag ref.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      base_tag: ${{ steps.vars.outputs.base_tag }}
    steps:
      - id: vars
        run: |
          echo "owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "base_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  # Wait until image.yml has published the multi-arch server image for this tag
  # (the runner + finalizes COPY the binary from it). Polls the registry rather
  # than chaining on image.yml's workflow, so a manual re-run or a slow server
  # build both just work.
  await-server:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Wait for iterion:<tag> (published by image.yml)
        env:
          REF: ghcr.io/${{ needs.prep.outputs.owner_lc }}/iterion:${{ needs.prep.outputs.base_tag }}
        run: |
          set -eu
          # 90×20s = 30min — covers image.yml's multi-arch server build (~9min)
          # plus GitHub-runner queueing under slot contention on a release.
          for i in $(seq 1 90); do
            if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
              echo "server image published: $REF"
              exit 0
            fi
            echo "waiting for $REF (attempt $i/90)…"
            sleep 20
          done
          echo "::error::timed out after 30min waiting for $REF — is image.yml green for this tag?"
          exit 1

  # Runner image at :vX.Y.Z — multi-arch, FROM the tagged multi-arch server
  # image so each arch COPYs its own arch's binary.
  build-runner-devbox:
    needs: [prep, await-server]
    uses: ./.github/workflows/_build-image.yml
    secrets: inherit
    with:
      image-name: iterion-runner-devbox
      routing-name: iterion-runner-devbox
      context: .
      file: Dockerfile.runner-devbox
      build-args: ITERION_IMAGE=ghcr.io/${{ needs.prep.outputs.owner_lc }}/iterion:${{ needs.prep.outputs.base_tag }}
      is-pr: false
      multiarch: true

  # Sandbox finalizes at :vX.Y.Z — multi-arch, from the always-multi-arch
  # *-base:edge + the tagged server binary. What the released binary's
  # `sandbox: auto` resolves to.
  finalize:
    needs: [prep, await-server]
    uses: ./.github/workflows/_finalize.yml
    secrets: inherit
    with:
      owner_lc: ${{ needs.prep.outputs.owner_lc }}
      iterion_tag: ${{ needs.prep.outputs.base_tag }}
      is-pr: false
      multiarch: true
