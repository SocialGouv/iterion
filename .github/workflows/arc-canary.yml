name: ARC canary

# Probes runner dispatch on the arc-runners scale set every 30 minutes and
# reports on itself, docs.yml-style: one open issue while dispatch is stalled,
# closed again by the first green probe.
#
# Why: on the nights of 2026-10-14..18, queue entries and main replays waited
# 5-8 hours for a runner while the cluster had CPU to spare. The measured
# mechanism is a ghost registration — the Actions service believes an idle
# runner exists after its pod is long gone (the listener then reconciles
# `currentRunnerCount=1` against zero real runners for hours, patchID
# incrementing every ~50 s), and jobs dispatched to such a phantom wait for
# the service to give up on it. Upstream tracks the class open (#4307 stuck
# ephemeral runners on canceled/interrupted jobs, #4027 listener unaware of
# pending work); the controller here is 0.11.0. Until that is fixed at the
# root, this probe is the detection layer: a healthy scale set starts this
# job in seconds, a poisoned one leaves it queued.
#
# What red means: the previous period's probe did not start within 25 minutes
# of creation, took more than 25 minutes from creation to start, or ran and
# failed. 25 minutes sits above the observed contention p90 for runner wait
# (~19 minutes on the busiest bursts) so ordinary load does not page, and
# below the ghost time scale (tens of minutes to hours) so poisoning does.
# Worst-case detection is therefore ~60-65 minutes after dispatch stops
# being trustworthy (interval + threshold + the watchdog's head start).
#
# The VERDICT is not here: `scripts/ci/arc-canary-verdict.sh` holds it, and
# `internal/ciguard/arc_canary_test.go` runs that script over crafted probes.
# This file reads the Actions API and acts on the answer; the thresholds and
# the exemptions are a program a harness can redden.
#
# The probe deliberately routes with the same lever as the required jobs
# (`CI_SELF_HOSTED=off` sends it to ubuntu-latest): during a deliberate
# fallback the canary goes quiet instead of alerting on a state the operator
# chose. The arc image ships no `gh`, but the probe runs nothing but the
# runner agent, so this file needs no API calls from the arc side at all —
# the watchdog, on ubuntu-latest, does the reading.

on:
  schedule:
    # Off the :00/:30 marks where every scheduled workflow in the fleet lands.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One probe per runner pool (small / large / heavy, routed by
  # vars.CI_{SMALL,LARGE,HEAVY}_RUNNER, #3694): a pool that hands out no job
  # blocks the checks routed to it however healthy the others are. Three jobs,
  # not a matrix: `runs-on` stays at the job level where the routing guards
  # read it. An empty pool variable routes the probe like the jobs it stands
  # for, to the legacy `arc-runners` set.
  #
  # Once a pool is set, its probe also checks that the pool runs the image this
  # tree defines (scripts/ci/arc-runner-freshness.sh): the pools' image is
  # pinned outside this repository, out of Renovate's sight, and a stale pin
  # fails quietly (codeload 429s, #2435; the 2025 runner-version deadlock).
  canary-small:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'off' && 'ubuntu-latest' || vars.CI_SMALL_RUNNER || 'arc-runners' }}
    timeout-minutes: 10
    steps:
      - name: Alive
        run: echo "runner $(hostname) took the small-pool probe at $(date -u +%FT%TZ)"
      - name: Checkout
        if: vars.CI_SMALL_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pool runs the image this tree defines
        if: vars.CI_SMALL_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        run: bash scripts/ci/arc-runner-freshness.sh "$GITHUB_WORKSPACE"

  canary-large:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'off' && 'ubuntu-latest' || vars.CI_LARGE_RUNNER || 'arc-runners' }}
    timeout-minutes: 10
    steps:
      - name: Alive
        run: echo "runner $(hostname) took the large-pool probe at $(date -u +%FT%TZ)"
      - name: Checkout
        if: vars.CI_LARGE_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pool runs the image this tree defines
        if: vars.CI_LARGE_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        run: bash scripts/ci/arc-runner-freshness.sh "$GITHUB_WORKSPACE"

  canary-heavy:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'off' && 'ubuntu-latest' || vars.CI_HEAVY_RUNNER || 'arc-runners' }}
    timeout-minutes: 10
    steps:
      - name: Alive
        run: echo "runner $(hostname) took the heavy-pool probe at $(date -u +%FT%TZ)"
      - name: Checkout
        if: vars.CI_HEAVY_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pool runs the image this tree defines
        if: vars.CI_HEAVY_RUNNER != '' && vars.CI_SELF_HOSTED != 'off'
        run: bash scripts/ci/arc-runner-freshness.sh "$GITHUB_WORKSPACE"

  watchdog:
    # Independent of `canary` on purpose: a probe that never starts cannot be
    # waited on (`needs:` would hang this job alongside it). The watchdog
    # judges the PREVIOUS period's run instead, which has had a full interval
    # to start.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A doubled cron would put two watchdogs in flight, both red, both opening
    # an issue. The later one waits instead of judging the same stall twice.
    concurrency:
      group: arc-canary-watchdog
      cancel-in-progress: false
    permissions:
      actions: read
      # The job-level block REPLACES the workflow default, and the verdict is
      # a script in the tree: without this the checkout below cannot read it.
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: ci:arc-canary
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        # For scripts/ci/arc-canary-verdict.sh alone: this job reads the
        # Actions API, it never builds anything.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Judge the previous probe, alert or resolve
        run: |
          set -euo pipefail
          sleep 300

          # The newest run of this workflow that is not this one. `head_sha`
          # dedupes nothing here; the workflow id path keeps it scoped.
          prev=$(gh api "repos/$GH_REPO/actions/workflows/arc-canary.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0] | select(. != null) | [.id, .status, (.conclusion // \"-\"), .created_at] | @tsv")
          if [ -z "$prev" ]; then
            echo "no previous probe yet — nothing to judge on day one"
            exit 0
          fi
          IFS=$'\t' read -r prev_id prev_status prev_conclusion prev_created <<<"$prev"
          echo "previous probe: run $prev_id status=$prev_status conclusion=$prev_conclusion created=$prev_created"

          # Each pool is judged on its own probe job, with its own threshold:
          # the heavy pool is saturated by design while the post-merge witness
          # runs (#3694), so it gets 90 minutes before a stall pages.
          # Facts cross as `|`-joined fields with `-` for empty: a tab IFS
          # would merge two empty fields and shift the rest.
          jobs_json=$(gh api "repos/$GH_REPO/actions/runs/$prev_id/jobs?per_page=100")
          verdicts=""
          while IFS=' ' read -r name stall; do
            job=$(printf '%s' "$jobs_json" | jq -r --arg n "$name" \
              '[.jobs[] | select(.name == $n)][0] | select(. != null)
               | [.status, (.conclusion // "-"), (.started_at // "-"), (.created_at // "-")] | join("|")')
            job_status="" job_conclusion="" job_started="" job_created=""
            if [ -n "$job" ]; then
              IFS='|' read -r job_status job_conclusion job_started job_created <<<"$job"
              [ "$job_conclusion" = "-" ] && job_conclusion=""
              [ "$job_started" = "-" ] && job_started=""
              [ "$job_created" = "-" ] && job_created=""
            fi
            # The verdict is ONE program in ONE file — the thresholds, the
            # cancelled exemption, the refusal to judge on a missing date — so
            # a harness can run the text that ships:
            # internal/ciguard/arc_canary_test.go.
            answer=$(CANARY_STALL_SECONDS="$stall" PREV_STATUS="$prev_status" PREV_CREATED="$prev_created" \
              JOB_STATUS="$job_status" JOB_CONCLUSION="$job_conclusion" JOB_CREATED="$job_created" JOB_STARTED="$job_started" \
              ./scripts/ci/arc-canary-verdict.sh)
            pool_verdict=$(printf '%s\n' "$answer" | sed -n 's/^verdict=//p')
            pool_detail=$(printf '%s\n' "$answer" | sed -n 's/^detail=//p')
            echo "$name: verdict=$pool_verdict detail=$pool_detail"
            verdicts+="${name#canary-}"$'\t'"$pool_verdict"$'\t'"$pool_detail"$'\n'
          done <<'POOLS'
          canary-small 1500
          canary-large 1500
          canary-heavy 5400
          POOLS

          answer=$(printf '%s' "$verdicts" | ./scripts/ci/arc-canary-aggregate.sh)
          verdict=$(printf '%s\n' "$answer" | sed -n 's/^verdict=//p')
          detail=$(printf '%s\n' "$answer" | sed -n 's/^detail=//p')
          echo "verdict=$verdict detail=$detail"

          case "$verdict" in
            skip) exit 0 ;;
            green|red) ;;
            *)
              echo "::error::arc-canary-verdict.sh answered '$verdict' — refusing to decide between paging and resolving"
              exit 1
              ;;
          esac

          if [ "$verdict" = "green" ]; then
            # A missing label is the normal before-the-first-alert state, and
            # an API failure here must not red-flag a healthy probe.
            existing=$(gh issue list --label "$LABEL" --state open --limit 1 \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            for n in $existing; do
              gh issue close "$n" --reason completed \
                --comment "ARC dispatch is healthy again (previous probe green, judged by ${RUN_URL})."
              echo "closed #$n"
            done
            exit 0
          fi

          # Red path: an API failure here stops the job rather than silently
          # duplicating the issue on the next period.
          existing=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          note=$(printf '%s\n' \
            "The ARC canary went red at $(date -u +%FT%TZ): $detail." \
            "" \
            "- Judged by: ${RUN_URL}" \
            "- Previous probe run: https://github.com/${GH_REPO}/actions/runs/${prev_id}" \
            "" \
            "A red pool is one of two things; the probe job's log tells which:" \
            "- **dispatch stalled** — the probe waited past its pool's threshold or never" \
            "  started: the scale set holds no live runner (ghost registrations, upstream" \
            "  #4307/#4027), its listener is down, or the pool is full for longer than" \
            "  expected. Check the pool's ephemeral runners and listener on the cluster" \
            "  that serves it." \
            "- **stale image** — the probe ran and its freshness step failed: the pool" \
            "  runs another runner image than ci/arc-runner/ defines; bump the pool pin." \
            "" \
            "Levers, no merge needed: clear the pool's \`CI_<POOL>_RUNNER\` variable" \
            "to route it back to the default set, or \`CI_SELF_HOSTED=off\` to send" \
            "every job to GitHub-hosted runners." \
            "" \
            "This issue closes itself on the next green probe (~30 minutes).")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "commented on #$existing"
          else
            gh label create "$LABEL" --color B60205 \
              --description "ARC runner dispatch is stalled (ghost-runner signature)" >/dev/null 2>&1 || true
            gh issue create --title "ci: ARC runner dispatch is stalled (canary red)" \
              --label "$LABEL" --body "$note"
          fi
