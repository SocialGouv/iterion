# ci-gate-map — every job of .github/workflows/tests.yml, and what runs it here.
#
# ONE file, two readers: `scripts/ci/gate.sh` enumerates the members to run,
# and `internal/ciguard`'s TestTheCIGateMapIsTotalAndHonest pins it against the
# workflow and the Taskfile. Two literals in two places drift; one file with
# two readers cannot.
#
# Keyed by JOB ID, never by line number and never by a prose transcription of a
# job body. That is not a style preference: a five-way mapping of this workflow
# was produced on 2026-11-12 in which four of five reports described a
# `test-e2e` job that had ceased to exist twenty minutes earlier, and every
# line offset they cited was off by three. A map whose rows are prose is stale
# at the next commit.
#
# `disposition` — what EXISTS here, not what is possible:
#   local         a member reproduces the job. Same tool, same flags, same scope.
#   partial       a member covers part of it; `residual` says what is left.
#   unwritten     expressible — the tool is here — but nobody has written it.
#                 This label exists because `partial` with no member hid the
#                 honest headline: two required contexts had NOTHING.
#   unexpressible it cannot run on a developer's box, and `reason` says why.
#
# `required` — yes (in ruleset 18857412) · staged (in internal/ciguard's
# requiredChecks, ahead of the ruleset) · pending (documented promotion) · no.
#
# `mutates` — the member rewrites tracked files. The runner orders those LAST,
# so no member after one compiles against a tree it rewrote mid-run.
#
# `checks` — how many check runs the job produces (its matrix). The ruleset
# keys on CONTEXTS, not on jobs: 19 jobs, 25 check runs.
#
# `inlined` — the one-command Taskfile tasks that are a `run:` of this job
# BYTE FOR BYTE. Declared here because a row that argues an identity in prose
# argues nothing: when the CI step gains a flag the identity dies in silence
# and the row keeps claiming it. internal/ciguard holds this list and the set
# it derives from the two files EQUAL, both directions — a new identity must
# be declared (that is the class that made `fmt-check` read `unwritten` while
# `task fmt:check` sat in the Taskfile), and a dead one reddens.
# An entry is NOT a claim of membership: `helm-lint` names one it
# deliberately does not run, and its `residual` says why.

# The members that answer exit 2 for "a precondition refused — not a verdict",
# so the runner can tell a machine that cannot judge from a tree that is
# broken. Declared, never inferred from the code: plenty of tools spend 2 on a
# real failure, and promoting those to "refused" is the one direction that
# turns a red into a shrug.
refusing_members: ["ci:gofmt", "ci:mongo-conformance", "ci:vendor-check"]

jobs:
  # ---- the aggregators: they read their legs' results, nothing else ----
  test:
    required: yes
    checks: 1
    disposition: unexpressible
    reason: >-
      a pure aggregator — its only step reads test-unit, test-e2e and studio's
      `result` from the workflow context and fails if any is not success. There
      is nothing to reproduce: what it aggregates is those three legs, whose
      own rows carry the members. Running their members IS running this.
    aggregates: [test-unit, test-e2e, studio]

  race:
    required: yes
    checks: 1
    disposition: unexpressible
    reason: the same shape, over race-shard alone.
    aggregates: [race-shard]

  # ---- the gated legs behind `test` ----
  test-unit:
    required: no
    feeds: test
    checks: 1
    disposition: partial
    members: [test, vet, "ci:gofmt", "test:live:compile", "map:check", "dsl:check"]
    residual: >-
      CI runs `-count=1` under `CGO_ENABLED=0` at `-timeout 1500s` over
      everything but `./e2e`, while `task test` sets no `-count` and no CGO and
      caps packages at `-timeout 1200s` — a LOWER ceiling — over `./...`; CI
      exports `CI=true`, which turns a skip into a hard failure at fourteen
      sites, and no Taskfile test task sets it. `ci:gofmt` covers the job's own
      `gofmt -l` step with two deliberate differences its header argues: the
      TRACKED file list rather than the job's `find`-derived one, and the
      WORKTREE rather than the commit (a partially staged file is green here
      and red there). Neither side pins gofmt itself: the job takes the version
      `go.mod` names, devbox pins `go@1.26` (1.26.2 today), and gofmt's output
      has changed across minors before. And the member is red where the job is
      green in one measured place: `charts/iterion`'s render tests SKIP in this
      job because it installs no helm, while devbox ships one — so locally
      they run and fail until the sub-chart archives exist. `task chart:check`
      (or `chart:dep-update`) fetches them, and it needs the network.

  test-e2e:
    required: no
    feeds: test
    checks: 4
    disposition: partial
    members: ["test:e2e"]
    residual: >-
      the job shards with `scripts/ci/testshards -tests ./e2e -n 4 -i <shard>`
      and fails the shard if discovery itself failed; one local `task test:e2e`
      covers the union of the four indices but exercises neither the splitter
      nor that refusal (internal/ciguard's e2e_shards_test.go does).

  studio:
    required: no
    feeds: test
    checks: 1
    disposition: partial
    members: ["studio:check", "openapi:check:dry"]
    residual: >-
      `studio:deps` runs `corepack pnpm install --prefer-offline` where CI runs
      `--frozen-lockfile`, so a stale pnpm-lock.yaml is green here and red
      there; and `openapi:check:dry` judges the INDEX (`git show :openapi.json`)
      while CI regenerates in place and diffs the worktree.

  race-shard:
    required: no
    feeds: race
    checks: 3
    disposition: partial
    members: ["test:race"]
    residual: >-
      `task test:race` is `-timeout 1200s` against the job's 2400s, carries no
      `-count=1`, and runs the whole suite in one process rather than the
      three shards; the job also pins yq by digest and builds the ultra11y
      engine first.

  # ---- the other required contexts ----
  vendor-check:
    required: yes
    checks: 1
    disposition: local
    members: ["ci:vendor-check"]
    mutates: true
    equivalence: >-
      the job's two steps in its order — `go mod verify`, then tidy + vendor +
      `git diff --exit-code go.mod go.sum vendor/`. The member adds a
      precondition the job does not need (a fresh checkout is never dirty) and
      refuses rather than blaming a parallel session's work in progress.

  mongo-conformance:
    required: yes
    checks: 1
    disposition: local
    members: ["ci:mongo-conformance"]
    equivalence: >-
      the same mongo:8.0 one-member replica set, and the job's `go test` lines
      READ FROM the job rather than restated — both of them, including the
      second that `docs/development.md`'s regex cannot see. Needs docker, and
      refuses with exit 2 where this process cannot reach the published port.

  golangci:
    required: yes
    checks: 1
    disposition: local
    members: ["ci:golangci"]
    inlined: ["ci:golangci"]
    equivalence: >-
      `golangci-lint run --timeout 10m`, the job's command verbatim, on the
      version devbox pins (2.12.2 — the same the job installs by digest). NOT
      `task lint`: that has `deps: [fmt, vet]` and `fmt` runs `go fmt ./...`,
      which REWRITES tracked source. A member that repairs the defect CI fails
      on, then reports green, is worse than no member.

  brand:
    required: yes
    checks: 1
    disposition: partial
    members: ["brand:positioning", "prompt:parity", "brand:og:check"]
    inlined: ["brand:positioning", "prompt:parity", "brand:og:check"]
    residual: >-
      three of the job's four `run:` steps are those three tasks, byte for
      byte. The REMAINING one — scripts/ci/tap-entry-check.sh, the verifier of
      the Homebrew-tap skip — reads the EVENT: TAP_ONLY (the skip predicate,
      evaluated by GitHub), the merge-group or pull-request shas, and a token to
      diff a test merge against its first parent. Nothing local supplies those,
      and internal/ciguard's tap_skip_test.go is what holds that step instead.
      `brand:og:check` shells a python3 heredoc and devbox.json ships no
      python, so that member runs on whatever python3 the host happens to have
      — adding python to devbox.json is the fix, and it is not this slice. NOT
      `task brand:check`: the job's own comment says it is deliberately not
      that one (the asset-drift guard needs magick/pngquant/oxipng and is a
      different cost), and a member that checks what the job does not check is
      coverage of nothing — `task check` keeps it, which is where it belongs.

  fmt-check:
    required: staged
    checks: 1
    disposition: local
    members: ["fmt:check"]
    inlined: ["fmt:check"]
    equivalence: >-
      the job's one `run:` step — `go run -mod=vendor ./cmd/iterion fmt --check
      --baseline .fmt-refused bots examples` — IS the task's single command:
      the job's own comment says so, and internal/ciguard's
      TestTheInlinedTasksMatchTheirTaskfileEntry holds the two texts
      byte-identical, so neither can gain a path or a flag alone.
      It judges the shipped `.bot` corpus and NOTHING in Go: the repository has
      two formatters, and the `gofmt -l` one is a step of `test-unit`, whose
      row carries it. Reading this job as the Go formatter is what makes a map
      claim a required context has no member while `task fmt:check` sits in
      the Taskfile.

  # ---- advisory and informational ----
  nats-conformance:
    required: pending
    checks: 1
    disposition: unwritten
    residual: >-
      docs/merge-policy.md records it as a promotion an admin has not applied
      to ruleset 18857412 yet; internal/ciguard's requiredChecks does not stage
      it. Same docker shape as mongo-conformance (nats:2.14-alpine -js), so the
      member is a sibling of one that now exists.

  helm-lint:
    required: no
    checks: 1
    disposition: partial
    members: ["chart:check"]
    inlined: ["chart:dep-update"]
    residual: >-
      the job's first `run:` step is `helm dependency update charts/iterion`,
      which is `task chart:dep-update` verbatim — declared in `inlined` so the
      identity is held, NOT run as a member; the member calls
      `scripts/chart-check-deps.sh`, which reconciles the archives against
      Chart.yaml (an undeclared one pruned, a missing declared one fetched) —
      so the fetch is covered in another form, and what is left is the network
      pull itself and the job's check that a digest-pinned render pins the
      image by digest.

  cloud-e2e:
    required: no
    checks: 1
    disposition: unexpressible
    reason: >-
      it builds the image, loads it into a kind cluster and installs the chart
      (79-minute budget). A kind cluster on a developer box is a different
      machine class, not a flag — and the job pins yq by digest and uses
      unpinned third-party actions (helm/kind-action) whose versions no member
      can match.

  govulncheck:
    required: no
    checks: 1
    disposition: unwritten
    residual: expressible — govulncheck is a go run away — but it needs the vulnerability database over the network, and nobody wrote it.

  desktop-vet-linux:
    required: no
    checks: 1
    disposition: unwritten
    residual: a `go vet` of the desktop tree with the wails tags; expressible, unwritten.

  desktop-vet-cross:
    required: no
    checks: 2
    disposition: unwritten
    residual: >-
      the same, under GOOS=windows and GOOS=darwin. Its check-run NAME carries
      the matrix value (`desktop-vet-cross (darwin)`), which is why this map
      counts contexts and not only jobs.

  docs-links:
    required: no
    checks: 1
    disposition: partial
    members: ["docs:links"]
    residual: the job compares head against base and is deliberately advisory (#1233); the member judges head alone.

  docs-build:
    required: no
    checks: 1
    disposition: partial
    members: ["docs:links:test"]
    inlined: ["docs:links:test"]
    residual: >-
      the job's first `run:` step is `docs:links:test` byte for byte (the same
      mirror TestTheInlinedTasksMatchTheirTaskfileEntry holds for fmt-check), so the
      link checker's own suite has a member. The VitePress build does not:
      there is no `docs:build`, and `docs:links` is not it — a link that
      resolves is not a site that builds. Expressible (the studio's node
      toolchain is right here) and unwritten.
