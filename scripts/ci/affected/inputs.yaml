  scripts/ci/mainwatch:
    reads: [".github/workflows/tests.yml", "scripts/ci/testquarantine/**"]
    why: "logparse and watch tests read tests.yml; validateWithTestquarantine runs go run ./scripts/ci/testquarantine"
  scripts/ci/testcaps:
