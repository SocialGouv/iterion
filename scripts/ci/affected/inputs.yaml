# Declarations of scripts/ci/affected — the test selector (#3739).
#
# Read by `task ci:affected` and held by guard_test.go. The selector derives
# what it can (the Go import graph with tests, directory ownership, embeds);
# this file says the rest:
#
#   global    a change here selects EVERYTHING. A changed file that no rule
#             of this file, no package directory and no leg claims selects
#             everything too, and says so.
#   packages  per package directory, what its tests read OUTSIDE that
#             directory: `reads` (path globs), `module` (the tests compile or
#             type-check the whole module), `reach` (the tests build these
#             package directories). guard_test.go scans every _test.go for
#             reads that climb out of their directory or reach the repository
#             root and fails on one this section does not cover.
#   legs      every job of .github/workflows/tests.yml: the `paths` that can
#             change its verdict, the Go `packages` it tests (`x/...` for a
#             subtree, `...` for all), the binaries it runs (`reach`), whether
#             a deletion selects it (`on_delete`), what it `aggregates`.
#             guard_test.go holds this section total over the workflow's jobs;
#             legsteps_test.go holds each leg's paths over what its job's
#             non-`go test` steps read (working directory, package manager
#             manifests, the scripts it runs and what they name).
#
# Globs: `**` is any number of whole segments, `*` stays within one.
# Under-selection is a false green: when in doubt, declare more. The scan is
# static and cannot see every way a test finds the repository root, so these
# declarations are not proven complete: the selector is an advisory local
# tool CI does not call (main.go, #3739).

global:
  - pattern: go.mod
    why: the module definition — every build and every package's imports
  - pattern: go.sum
    why: the module checksums every build verifies
  - pattern: vendor/**
    why: the vendored dependencies every build compiles (-mod=vendor)
  - pattern: third_party/**
    why: local replace targets, vendored into vendor/ by `go mod vendor`
  - pattern: .github/**
    why: the workflows, the gate map and the CI configuration decide what runs and how
  - pattern: scripts/ci/**
    why: the CI tooling, this selector and its declarations included
  - pattern: Taskfile.yml
    why: every task the CI and the local gates call
  - pattern: devbox.json
    why: the pinned toolchain every local gate runs on
  - pattern: devbox.lock
    why: the resolved toolchain pins
  - pattern: .gitattributes
    why: "the checkout's attributes (eol, filters) rewrite the bytes of every file they match: a `*.sh eol=crlf` breaks every shebang and every script a leg or a test runs"
  - pattern: "**/.gitattributes"
    why: a nested .gitattributes rewrites the checked-out bytes of its whole subtree the same way

