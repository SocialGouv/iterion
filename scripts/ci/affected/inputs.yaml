  scripts/ci/testshards:
    reads: ["**/*.go", ".github/workflows/tests.yml", "scripts/ci/*.tsv"]
    module: true
    why: "TestTheCommittedWeightsTablesPackTheirLegs reads the splitter calls of tests.yml and the weights tables and runs go list ./... at the root"

legs:
  test:
    aggregates: [test-unit, test-e2e, studio, test-native-exec]
    why: the required aggregator; it reads its legs' results and nothing else
  race:
    aggregates: [race-shard, test-native-exec]
    why: the aggregator of the race legs
  heavy-gate:
    paths: [scripts/ci/heavy-gate.sh]
    why: "push only: scripts/ci/heavy-gate.sh reads main's run history and decides whether the push runs the heavy layer; it tests no package, and its one input sits under scripts/ci/ (global)"
  test-unit:
    packages: ["..."]
    paths: ["**/*.go", scripts/ultra11y-engine.sh, "scripts/ultra11y-engine/**", scripts/ultra11y-pin.sh, bots/rgaa-audit/ultra11y.pin, scripts/chart-check-deps.sh]
    why: unit tests over the selected packages (minus e2e and pkg/sandbox/kubernetes), plus the one-time gofmt, go vet, live-tag compile and generated-artefact freshness steps any Go change reaches; the ultra11y engine install (scripts/ultra11y-engine.sh, its lockfile directory, ultra11y-pin.sh and the pin it reads) and the chart dependency check run before the tests
  race-shard:
    packages: ["..."]
    paths: [scripts/ultra11y-engine.sh, "scripts/ultra11y-engine/**", scripts/ultra11y-pin.sh, bots/rgaa-audit/ultra11y.pin, scripts/chart-check-deps.sh]
    why: the selected packages under -race (minus e2e and pkg/sandbox/kubernetes), after the same ultra11y engine install and chart dependency check as test-unit
  test-e2e:
    packages: [e2e]
    paths: ["studio/**", package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
    why: "go test ./e2e, after `pnpm install --frozen-lockfile` and `vite build` in studio/ whose output the server under test embeds (pkg/server/static): a studio change that breaks the build reddens this leg"
  studio:
    paths: ["studio/**", openapi.json, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, charts/iterion/Chart.yaml]
    reach: [cmd/iterion]
    why: eslint, tsc -b and vitest over studio/, the OpenAPI drift check (go run ./cmd/iterion openapi, then openapi-typescript into studio/src/api/schema.ts) and the Chart.yaml/package.json version check
  test-native-exec:
    packages: [pkg/sandbox/kubernetes]
    why: go test ./pkg/sandbox/kubernetes/, plain and under -race
  mongo-conformance:
    packages:
      - pkg/internal/storekit/...
      - pkg/audit/...
      - pkg/pat/...
      - pkg/connection/...
      - pkg/cloudsched/...
      - pkg/auth/...
      - pkg/secrets/...
      - pkg/orgusage/...
      - pkg/credusage/...
      - pkg/credpool/...
      - pkg/botsource/...
      - pkg/pricefeed/...
      - pkg/runview/runstream/...
      - pkg/cloud/orgsweep/...
      - pkg/usagecap/...
      - pkg/dispatcher/boardmongo/...
      - pkg/identity/...
      - pkg/usernotify/...
      - pkg/configshare/...
      - pkg/pluginsource/...
      - pkg/assistantmission/...
      - pkg/runwatch/...
      - pkg/webhooks/...
      - pkg/server/cloudpublisher/...
      - pkg/forge/...
      - pkg/trigger/...
      - pkg/lease/...
      - pkg/platformcfg/...
      - pkg/server/...
      - pkg/connector/intake/...
      - pkg/connector/poller/...
      - pkg/store/mongo/...
      - pkg/runview/...
      - pkg/runner/...
    why: the Mongo-gated go test lines of the job, each package pattern the job names, pkg/server and pkg/store/mongo through their .../ form (guard_test.go holds every job pattern named)
  nats-conformance:
    packages: [pkg/runner/..., pkg/queue/...]
    why: the NATS-gated go test line of the job
  cloud-e2e:
    paths: [Dockerfile, .dockerignore, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, "studio/**", "bots/**", "connectors/**", "native/**", scripts/build-execenv-capsule.sh, "docker/llm-clis/**", "charts/**", scripts/chart-kind-wait.sh, "sandbox/finalize/**"]
    reach: [cmd/iterion, cmd/iterion-execenv-guest]
    why: "builds the image from the Dockerfile's COPY set and its bind mounts (a RUN step executes sandbox/finalize/execenv-smoke.sh), loads it into kind and installs the chart"
  vendor-check:
    paths: ["**/*.go"]
    why: go mod tidy + vendor must leave go.mod, go.sum and vendor/ unchanged, and any import added or dropped can move them
  golangci:
    paths: ["**/*.go", .golangci.yml]
    why: golangci-lint run over the module
  brand:
    paths: ["assets/brand/**", "scripts/brand/**", scripts/prompt-parity.sh, README.md, CLAUDE.md, charts/iterion/README.md, charts/iterion/Chart.yaml, docs/cloud-overview.md, docs/index.md, docs/getting-started.md, docs/scripts/og-card.html, "docs/public/og.png*", docs/.vitepress/config.ts, studio/index.html, studio/public/manifest.json, "studio/src/views/CloudHome/**", "Cask/**", "Formula/**", build/linux/iterion.desktop, build/windows/info.json, cmd/iterion-desktop/wails.json, cmd/iterion/main.go]
    why: positioning-check, prompt-parity and og-check read these surfaces; tap-entry-check is under scripts/ci (global)
  fmt-check:
    paths: ["bots/**", "examples/**", .fmt-refused]
    reach: [cmd/iterion]
    why: go run ./cmd/iterion fmt --check over bots and examples
  helm-lint:
    paths: ["charts/**", "scripts/chart-*.sh"]
    packages: [charts/iterion]
    why: helm dependency update, helm lint and template over charts/iterion, then go test -run TestChart ./charts/iterion/
  govulncheck:
    paths: ["**/*.go"]
    why: the call-graph vulnerability scan over ./... (advisory)
  desktop-vet-linux:
    paths: ["cmd/iterion-desktop/**", "build/**"]
    reach: [cmd/iterion-desktop]
    why: go vet -tags desktop,webkit2_41 ./cmd/iterion-desktop/
  desktop-vet-cross:
    paths: ["cmd/iterion-desktop/**", "build/**"]
    reach: [cmd/iterion-desktop]
    why: go vet -tags desktop ./cmd/iterion-desktop/ under GOOS windows and darwin
  docs-links:
    paths: ["**/*.md", "docs/**", "internal/docsguard/testdata/github-anchors/**"]
    reach: [scripts/docslinks]
    on_delete: true
    why: every relative link of the tracked markdown against the real tree — a deleted or renamed target of any type breaks one; check-anchor-slugs.mjs replays the GitHub anchor fixtures of internal/docsguard/testdata/github-anchors
  docs-build:
    paths: ["docs/**", CHANGELOG.md, package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
    why: the link checker's self-test and the VitePress build of docs/ (which includes CHANGELOG.md)
