schema_version: 1
connector: forgejo
schemas:
  APIError:
    type: object
    description: APIError is an api error with a message
    properties:
      message:
        type: string
      url:
        type: string
  APIForbiddenError:
    type: object
    properties:
      message:
        type: string
      url:
        type: string
  APIInternalServerError:
    type: object
    properties:
      message:
        type: string
      url:
        type: string
  APIInvalidTopicsError:
    type: object
    properties:
      invalidTopics:
        type: array
        items:
          type: string
      message:
        type: string
  APINotFound:
    type: object
    properties:
      errors:
        type: array
        items:
          type: string
      message:
        type: string
      url:
        type: string
  APIRepoArchivedError:
    type: object
    properties:
      message:
        type: string
      url:
        type: string
  APIUnauthorizedError:
    type: object
    properties:
      message:
        type: string
      url:
        type: string
  APIValidationError:
    type: object
    properties:
      message:
        type: string
      url:
        type: string
  APRemoteFollowOption:
    type: object
    properties:
      target:
        type: string
  AccessToken:
    type: object
    properties:
      created_at:
        type: string
        format: date-time
      id:
        type: integer
        format: int64
      name:
        type: string
      repositories:
        type: array
        description: Indicates that an access token only has access to the specified
          repositories.  Will be null if the access token
        items:
          ref: RepositoryMeta
      scopes:
        type: array
        items:
          type: string
      sha1:
        type: string
      token_last_eight:
        type: string
  ActionArtifact:
    type: object
    description: ActionArtifact represents an artifact of a workflow run
    properties:
      archive_download_url:
        type: string
        description: the URL to download the artifact zip archive
      created_at:
        type: string
        format: date-time
      expired:
        type: boolean
        description: whether the artifact has expired
      expires_at:
        type: string
        format: date-time
      id:
        type: integer
        format: int64
        description: the artifact's ID
      name:
        type: string
        description: the artifact's name
      run_id:
        type: integer
        format: int64
        description: the ID of the workflow run that produced this artifact
      size_in_bytes:
        type: integer
        format: int64
        description: the total size of the artifact in bytes
      updated_at:
        type: string
        format: date-time
  ActionRun:
    type: object
    description: ActionRun represents an action run
    properties:
      ScheduleID:
        type: integer
        format: int64
        description: the cron id for the schedule trigger
      approved_by:
        type: integer
        format: int64
        description: who approved this action run
      commit_sha:
        type: string
        description: the commit sha the action run ran on
      created:
        type: string
        format: date-time
        description: when the action run was created
      duration:
        ref: Duration
      event:
        type: string
        description: the webhook event that causes the workflow to run
      event_payload:
        type: string
        description: the payload of the webhook event that causes the workflow to
          run
      html_url:
        type: string
        description: the url of this action run
      id:
        type: integer
        format: int64
        description: the action run id
      index_in_repo:
        type: integer
        format: int64
        description: a unique number for each run of a repository
      is_fork_pull_request:
        type: boolean
        description: If this is triggered by a PR from a forked repository or an untrusted
          user, we need to check if it is approved and limit permissions when running
          the workflow.
      is_ref_deleted:
        type: boolean
        description: has the commit/tag/… the action run ran on been deleted
      need_approval:
        type: boolean
        description: may need approval if it's a fork pull request
      prettyref:
        type: string
        description: the commit/tag/… the action run ran on
      repository:
        ref: Repository
      started:
        type: string
        format: date-time
        description: when the action run was started
      status:
        type: string
        description: the current status of this run
      stopped:
        type: string
        format: date-time
        description: when the action run was stopped
      title:
        type: string
        description: the action run's title
      trigger_event:
        type: string
        description: the trigger event defined in the `on` configuration of the triggered
          workflow
      trigger_user:
        ref: User
      updated:
        type: string
        format: date-time
        description: when the action run was last updated
      workflow_id:
        type: string
        description: the name of workflow file
  ActionRunJob:
    type: object
    description: ActionRunJob represents a job of a run
    properties:
      attempt:
        type: integer
        format: int64
        description: How many times the job has been attempted including the current
          attempt.
      handle:
        type: string
        description: Opaque identifier that uniquely identifies a single attempt of
          a job.
      id:
        type: integer
        format: int64
        description: Identifier of this job.
      name:
        type: string
        description: the action run job name
      needs:
        type: array
        description: the action run job needed ids
        items:
          type: string
      owner_id:
        type: integer
        format: int64
        description: the owner id
      repo_id:
        type: integer
        format: int64
        description: the repository id
      run_id:
        type: integer
        format: int64
        description: Identifier of the workflow run this job belongs to.
      runs_on:
        type: array
        description: the action run job labels to run on
        items:
          type: string
      status:
        type: string
        description: the action run job status
      task_id:
        type: integer
        format: int64
        description: the action run job latest task id
  ActionRunner:
    type: object
    description: ActionRunner represents a runner
    properties:
      description:
        type: string
        description: Description provides optional details about this runner.
      ephemeral:
        type: boolean
        description: Indicates if runner is ephemeral runner
      id:
        type: integer
        format: int64
        description: ID uniquely identifies this runner.
      labels:
        type: array
        description: Labels is a list of labels attached to this runner.
        items:
          type: string
      name:
        type: string
        description: Name of the runner; not unique.
      owner_id:
        type: integer
        format: int64
        description: OwnerID is the identifier of the user or organization this runner
          belongs to. O if the runner is owned by a
      repo_id:
        type: integer
        format: int64
        description: RepoID is the identifier of the repository this runner belongs
          to. 0 if the runner belongs to a user or
      status:
        type: string
        description: Status indicates whether this runner is offline, or active, for
          example.
        enum:
        - offline
        - idle
        - active
      uuid:
        type: string
        description: UUID uniquely identifies this runner.
      version:
        type: string
        description: Version is the self-reported version string of Forgejo Runner.
  ActionTask:
    type: object
    description: ActionTask represents a ActionTask
    properties:
      created_at:
        type: string
        format: date-time
      display_title:
        type: string
      event:
        type: string
      head_branch:
        type: string
      head_sha:
        type: string
      id:
        type: integer
        format: int64
      name:
        type: string
      run_number:
        type: integer
        format: int64
      run_started_at:
        type: string
        format: date-time
      status:
        type: string
      updated_at:
        type: string
        format: date-time
      url:
        type: string
      workflow_id:
        type: string
  ActionTaskResponse:
    type: object
    description: ActionTaskResponse returns a ActionTask
    properties:
      total_count:
        type: integer
        format: int64
      workflow_runs:
        type: array
        items:
          ref: ActionTask
  ActionVariable:
    type: object
    description: ActionVariable return value of the query API
    properties:
      data:
        type: string
        description: the value of the variable
      name:
        type: string
        description: the name of the variable
      owner_id:
        type: integer
        format: int64
        description: the owner to which the variable belongs
      repo_id:
        type: integer
        format: int64
        description: the repository to which the variable belongs
  Activity:
    type: object
    properties:
      act_user:
        ref: User
      act_user_id:
        type: integer
        format: int64
      comment:
        ref: Comment
      comment_id:
        type: integer
        format: int64
      content:
        type: string
      created:
        type: string
        format: date-time
      id:
        type: integer
        format: int64
      is_private:
        type: boolean
      op_type:
        type: string
        description: the type of action
        enum:
        - create_repo
        - rename_repo
        - star_repo
        - watch_repo
        - commit_repo
        - create_issue
        - create_pull_request
        - transfer_repo
        - push_tag
        - comment_issue
        - merge_pull_request
        - close_issue
        - reopen_issue
        - close_pull_request
        - reopen_pull_request
        - delete_tag
        - delete_branch
        - mirror_sync_push
        - mirror_sync_create
        - mirror_sync_delete
        - approve_pull_request
        - reject_pull_request
        - comment_pull
        - publish_release
        - pull_review_dismissed
        - pull_request_ready_for_review
        - auto_merge_pull_request
      ref_name:
        type: string
      repo:
        ref: Repository
      repo_id:
        type: integer
        format: int64
      user_id:
        type: integer
        format: int64
  ActivityPub:
    type: object
    description: ActivityPub type
    properties:
      '@context':
        type: string
  AddCollaboratorOption:
    type: object
    description: AddCollaboratorOption options when adding a user as a collaborator
      of a repository
    properties:
      permission:
        type: string
        enum:
        - read
        - write
        - admin
  AddTimeOption:
    type: object
    description: AddTimeOption options for adding time to an issue
    required:
    - time
    properties:
      created:
        type: string
        format: date-time
      time:
        type: integer
        format: int64
        description: time in seconds
      user_name:
        type: string
        description: User who spent the time (optional)
  AnnotatedTag:
    type: object
    description: AnnotatedTag represents an annotated tag
    properties:
      archive_download_count:
        ref: TagArchiveDownloadCount
      message:
        type: string
      object:
        ref: AnnotatedTagObject
      sha:
        type: string
      tag:
        type: string
      tagger:
        ref: CommitUser
      url:
        type: string
      verification:
        ref: PayloadCommitVerification
  AnnotatedTagObject:
    type: object
    description: AnnotatedTagObject contains meta information of the tag object
    properties:
      sha:
        type: string
      type:
        type: string
      url:
        type: string
  Attachment:
    type: object
    description: Attachment a generic attachment
    properties:
      browser_download_url:
        type: string
      created_at:
        type: string
        format: date-time
      download_count:
        type: integer
        format: int64
      id:
        type: integer
        format: int64
      name:
        type: string
      size:
        type: integer
        format: int64
      type:
        type: string
        enum:
        - attachment
        - external
      uuid:
        type: string
  BlockedUser:
    type: object
    properties:
      block_id:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
  Branch:
    type: object
    description: Branch represents a repository branch
    properties:
      commit:
        ref: PayloadCommit
      effective_branch_protection_name:
        type: string
      enable_status_check:
        type: boolean
      name:
        type: string
      protected:
        type: boolean
      required_approvals:
        type: integer
        format: int64
      status_check_contexts:
        type: array
        items:
          type: string
      user_can_merge:
        type: boolean
      user_can_push:
        type: boolean
  BranchProtection:
    type: object
    description: BranchProtection represents a branch protection for a repository
    properties:
      apply_to_admins:
        type: boolean
      approvals_whitelist_teams:
        type: array
        items:
          type: string
      approvals_whitelist_username:
        type: array
        items:
          type: string
      block_on_official_review_requests:
        type: boolean
      block_on_outdated_branch:
        type: boolean
      block_on_rejected_reviews:
        type: boolean
      branch_name:
        type: string
        description: 'Deprecated: true'
      created_at:
        type: string
        format: date-time
      dismiss_stale_approvals:
        type: boolean
      enable_approvals_whitelist:
        type: boolean
      enable_merge_whitelist:
        type: boolean
      enable_push:
        type: boolean
      enable_push_whitelist:
        type: boolean
      enable_status_check:
        type: boolean
      ignore_stale_approvals:
        type: boolean
      merge_whitelist_teams:
        type: array
        items:
          type: string
      merge_whitelist_usernames:
        type: array
        items:
          type: string
      protected_file_patterns:
        type: string
      push_whitelist_deploy_keys:
        type: boolean
      push_whitelist_teams:
        type: array
        items:
          type: string
      push_whitelist_usernames:
        type: array
        items:
          type: string
      require_signed_commits:
        type: boolean
      required_approvals:
        type: integer
        format: int64
      rule_name:
        type: string
      status_check_contexts:
        type: array
        items:
          type: string
      unprotected_file_patterns:
        type: string
      updated_at:
        type: string
        format: date-time
  ChangeFileOperation:
    type: object
    description: ChangeFileOperation for creating, updating or deleting a file
    required:
    - operation
    - path
    properties:
      content:
        type: string
        description: new or updated file content, must be base64 encoded
      from_path:
        type: string
        description: old path of the file to move
      operation:
        type: string
        description: indicates what to do with the file
        enum:
        - create
        - update
        - delete
      path:
        type: string
        description: path to the existing or new file
      sha:
        type: string
        description: sha is the SHA for the file that already exists, required for
          update or delete
  ChangeFilesOptions:
    type: object
    description: ChangeFilesOptions options for creating, updating or deleting multiple
      files
    required:
    - files
    properties:
      author:
        ref: Identity
      branch:
        type: string
        description: branch (optional) to base this file from. if not given, the default
          branch is used
      committer:
        ref: Identity
      dates:
        ref: CommitDateOptions
      files:
        type: array
        description: list of file operations
        items:
          ref: ChangeFileOperation
      force_overwrite_new_branch:
        type: boolean
        description: (optional) will do a force-push if the new branch already exists
      message:
        type: string
        description: message (optional) for the commit of this file. if not supplied,
          a default message will be used
      new_branch:
        type: string
        description: new_branch (optional) will make a new branch from `branch` before
          creating the file
      signoff:
        type: boolean
        description: Add a Signed-off-by trailer by the committer at the end of the
          commit log message.
  ChangedFile:
    type: object
    description: ChangedFile store information about files affected by the pull request
    properties:
      additions:
        type: integer
        format: int64
      changes:
        type: integer
        format: int64
      contents_url:
        type: string
      deletions:
        type: integer
        format: int64
      filename:
        type: string
      html_url:
        type: string
      previous_filename:
        type: string
      raw_url:
        type: string
      status:
        type: string
  CombinedStatus:
    type: object
    description: CombinedStatus holds the combined state of several statuses for a
      single commit
    properties:
      commit_url:
        type: string
      repository:
        ref: Repository
      sha:
        type: string
      state:
        ref: CommitStatusState
      statuses:
        type: array
        items:
          ref: CommitStatus
      total_count:
        type: integer
        format: int64
      url:
        type: string
  Comment:
    type: object
    description: Comment represents a comment on a commit or issue
    properties:
      assets:
        type: array
        description: The attachments to the comment
        items:
          ref: Attachment
      body:
        type: string
        description: The body of the comment
      created_at:
        type: string
        format: date-time
        description: The time of the comment's creation
      html_url:
        type: string
        description: The HTML URL of the comment
      id:
        type: integer
        format: int64
        description: The identifier of the comment
      issue_url:
        type: string
        description: The HTML URL of the issue if the comment is posted on an issue,
          else empty string
      original_author:
        type: string
        description: The original author that posted the comment if it was not posted
          locally, else empty string
      original_author_id:
        type: integer
        format: int64
        description: The ID of the original author that posted the comment if it was
          not posted locally, else 0
      pull_request_url:
        type: string
        description: The HTML URL of the pull request if the comment is posted on
          a pull request, else empty string
      updated_at:
        type: string
        format: date-time
        description: The time of the comment's update
      user:
        ref: User
  Commit:
    type: object
    properties:
      author:
        ref: User
      commit:
        ref: RepoCommit
      committer:
        ref: User
      created:
        type: string
        format: date-time
      files:
        type: array
        items:
          ref: CommitAffectedFiles
      html_url:
        type: string
      parents:
        type: array
        items:
          ref: CommitMeta
      sha:
        type: string
      stats:
        ref: CommitStats
      url:
        type: string
  CommitAffectedFiles:
    type: object
    description: CommitAffectedFiles store information about files affected by the
      commit
    properties:
      filename:
        type: string
      status:
        type: string
  CommitDateOptions:
    type: object
    description: CommitDateOptions store dates for GIT_AUTHOR_DATE and GIT_COMMITTER_DATE
    properties:
      author:
        type: string
        format: date-time
      committer:
        type: string
        format: date-time
  CommitMeta:
    type: object
    properties:
      created:
        type: string
        format: date-time
      sha:
        type: string
      url:
        type: string
  CommitStats:
    type: object
    description: CommitStats is statistics for a RepoCommit
    properties:
      additions:
        type: integer
        format: int64
      deletions:
        type: integer
        format: int64
      total:
        type: integer
        format: int64
  CommitStatus:
    type: object
    description: CommitStatus holds a single status of a single Commit
    properties:
      context:
        type: string
      created_at:
        type: string
        format: date-time
      creator:
        ref: User
      description:
        type: string
      id:
        type: integer
        format: int64
      status:
        ref: CommitStatusState
      target_url:
        type: string
      updated_at:
        type: string
        format: date-time
      url:
        type: string
  CommitStatusState:
    type: string
    description: CommitStatusState holds the state of a CommitStatus
  CommitUser:
    type: object
    properties:
      date:
        type: string
      email:
        type: string
        format: email
      name:
        type: string
  Compare:
    type: object
    properties:
      commits:
        type: array
        items:
          ref: Commit
      files:
        type: array
        items:
          ref: CommitAffectedFiles
      total_commits:
        type: integer
        format: int64
  ContentsResponse:
    type: object
    description: ContentsResponse contains information about a repo's entry's (dir,
      file, symlink, submodule) metadata and content
    properties:
      _links:
        ref: FileLinksResponse
      content:
        type: string
        description: '`content` is populated when `type` is `file`, otherwise null'
      download_url:
        type: string
      encoding:
        type: string
        description: '`encoding` is populated when `type` is `file`, otherwise null'
      git_url:
        type: string
      html_url:
        type: string
      last_commit_sha:
        type: string
      last_commit_when:
        type: string
        format: date-time
      name:
        type: string
      path:
        type: string
      sha:
        type: string
      size:
        type: integer
        format: int64
      submodule_git_url:
        type: string
        description: '`submodule_git_url` is populated when `type` is `submodule`,
          otherwise null'
      target:
        type: string
        description: '`target` is populated when `type` is `symlink`, otherwise null'
      type:
        type: string
        description: '`type` will be `file`, `dir`, `symlink`, or `submodule`'
      url:
        type: string
  CreateAccessTokenOption:
    type: object
    description: CreateAccessTokenOption options when create access token
    required:
    - name
    properties:
      name:
        type: string
      repositories:
        type: array
        description: If provided and not-empty, creates an access token with access
          only to specified repositories.
        items:
          ref: RepoTargetOption
      scopes:
        type: array
        items:
          type: string
  CreateBranchProtectionOption:
    type: object
    description: CreateBranchProtectionOption options for creating a branch protection
    properties:
      apply_to_admins:
        type: boolean
      approvals_whitelist_teams:
        type: array
        items:
          type: string
      approvals_whitelist_username:
        type: array
        items:
          type: string
      block_on_official_review_requests:
        type: boolean
      block_on_outdated_branch:
        type: boolean
      block_on_rejected_reviews:
        type: boolean
      branch_name:
        type: string
        description: 'Deprecated: true'
      dismiss_stale_approvals:
        type: boolean
      enable_approvals_whitelist:
        type: boolean
      enable_merge_whitelist:
        type: boolean
      enable_push:
        type: boolean
      enable_push_whitelist:
        type: boolean
      enable_status_check:
        type: boolean
      ignore_stale_approvals:
        type: boolean
      merge_whitelist_teams:
        type: array
        items:
          type: string
      merge_whitelist_usernames:
        type: array
        items:
          type: string
      protected_file_patterns:
        type: string
      push_whitelist_deploy_keys:
        type: boolean
      push_whitelist_teams:
        type: array
        items:
          type: string
      push_whitelist_usernames:
        type: array
        items:
          type: string
      require_signed_commits:
        type: boolean
      required_approvals:
        type: integer
        format: int64
      rule_name:
        type: string
      status_check_contexts:
        type: array
        items:
          type: string
      unprotected_file_patterns:
        type: string
  CreateBranchRepoOption:
    type: object
    description: CreateBranchRepoOption options when creating a branch in a repository
    required:
    - new_branch_name
    properties:
      new_branch_name:
        type: string
        description: Name of the branch to create
      old_branch_name:
        type: string
        description: 'Deprecated: true'
      old_ref_name:
        type: string
        description: Name of the old branch/tag/commit to create from
  CreateEmailOption:
    type: object
    description: CreateEmailOption options when creating email addresses
    properties:
      emails:
        type: array
        description: email addresses to add
        items:
          type: string
  CreateFileOptions:
    type: object
    description: CreateFileOptions options for creating files
    required:
    - content
    properties:
      author:
        ref: Identity
      branch:
        type: string
        description: branch (optional) to base this file from. if not given, the default
          branch is used
      committer:
        ref: Identity
      content:
        type: string
        description: content must be base64 encoded
      dates:
        ref: CommitDateOptions
      force_overwrite_new_branch:
        type: boolean
        description: (optional) will do a force-push if the new branch already exists
      message:
        type: string
        description: message (optional) for the commit of this file. if not supplied,
          a default message will be used
      new_branch:
        type: string
        description: new_branch (optional) will make a new branch from `branch` before
          creating the file
      signoff:
        type: boolean
        description: Add a Signed-off-by trailer by the committer at the end of the
