schema_version: 1
connector: forgejo
domain: admin
operations:
- id: forgejo.admin.add_rule_to_quota_group
  source_operation_id: adminAddRuleToQuotaGroup
  summary: Adds a rule to a quota group
  resource: admin
  verb: add_rule_to_quota_group
  tags:
  - admin
  http:
    method: PUT
    path: /admin/quota/groups/{quotagroup}/rules/{quotarule}
  params:
  - key: quotagroup
    name: quotagroup
    in: path
    type: string
    required: true
    description: quota group to add a rule to
  - key: quotarule
    name: quotarule
    in: path
    type: string
    required: true
    description: the name of the quota rule to add to the group
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 409
    class: conflict
    description: APIError is error format response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: update
  deterministic: true
- id: forgejo.admin.add_user_to_quota_group
  source_operation_id: adminAddUserToQuotaGroup
  summary: Add a user to a quota group
  resource: admin
  verb: add_user_to_quota_group
