- id: forgejo.admin.create_hook
  source_operation_id: adminCreateHook
  summary: Create a hook
  resource: admin
  verb: create_hook
  tags:
  - admin
  http:
    method: POST
    path: /admin/hooks
    request_body: json
  params:
  - key: active
    name: active
    in: body
    type: boolean
    default: false
  - key: authorization_header
    name: authorization_header
    in: body
    type: string
  - key: branch_filter
    name: branch_filter
    in: body
    type: string
  - key: config
    name: config
    in: body
    type: object
    required: true
