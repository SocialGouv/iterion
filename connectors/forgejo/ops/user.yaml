    in: body
    type: boolean
  - key: name
    name: name
    in: body
    type: string
  - key: redirect_uris
    name: redirect_uris
    in: body
    type: array
    items: string
  results:
  - status: 201
    schema_ref: OAuth2Application
    description: OAuth2Application
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  effect: create
  deterministic: true
- id: forgejo.user.create_token
  source_operation_id: userCreateToken
  summary: Generate an access token for the specified user
  resource: user
  verb: create_token
  tags:
  - user
  http:
    method: POST
    path: /users/{username}/tokens
    request_body: json
  params:
  - key: username
    name: username
    in: path
    type: string
    required: true
    description: username of user
  - key: name
    name: name
    in: body
    type: string
    required: true
  - key: repositories
    name: repositories
    in: body
    type: array
    items: object
    description: If provided and not-empty, creates an access token with access only
      to specified repositories.
    schema_ref: RepoTargetOption
  - key: scopes
    name: scopes
    in: body
    type: array
    items: string
  results:
  - status: 201
    schema_ref: AccessToken
    description: AccessToken represents an API access token.
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
- id: forgejo.user.create_user_variable
