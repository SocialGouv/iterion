    in: path
    type: string
    required: true
    description: name of the variable
  - key: value
    name: value
    in: body
    type: string
    required: true
    description: Value of the variable to create. Special characters will be retained.
      Line endings will be normalized to LF to
  results:
  - status: 201
    description: response when creating a variable
  - status: 204
    description: response when creating a variable
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
