schema_version: 1
connector: forgejo
domain: user
operations:
- id: forgejo.user.add_email
  source_operation_id: userAddEmail
  summary: Add an email addresses to the current user's account
  resource: user
  verb: add_email
  tags:
  - user
  http:
    method: POST
    path: /user/emails
    request_body: json
  params:
  - key: emails
    name: emails
    in: body
    type: array
    items: string
    description: email addresses to add
  results:
  - status: 201
    schema_ref: Email
    array: true
    description: EmailList
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: create
  deterministic: true
- id: forgejo.user.block_user
  source_operation_id: userBlockUser
  summary: Blocks a user from the doer
  resource: user
  verb: block_user
  tags:
  - user
  http:
    method: PUT
    path: /user/block/{username}
  params:
  - key: username
    name: username
    in: path
    type: string
    required: true
    description: username of the user
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: update
  deterministic: true
- id: forgejo.user.check_following
  source_operation_id: userCheckFollowing
  summary: Check if one user is following another user
  resource: user
  verb: check_following
  tags:
  - user
  http:
    method: GET
    path: /users/{username}/following/{target}
  params:
  - key: target
    name: target
    in: path
    type: string
    required: true
    description: username of followed user
  - key: username
    name: username
    in: path
    type: string
    required: true
    description: username of following user
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: read
  deterministic: true
- id: forgejo.user.check_quota
  source_operation_id: userCheckQuota
  summary: Check if the authenticated user is over quota for a given subject
  resource: user
  verb: check_quota
  tags:
  - user
  http:
    method: GET
    path: /user/quota/check
  params:
  - key: subject
    name: subject
    in: query
    type: string
    required: true
    description: subject of the quota
  results:
  - status: 200
    description: Returns true if the action is accepted.
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: read
  deterministic: true
- id: forgejo.user.create_hook
  source_operation_id: userCreateHook
  summary: Create a hook
  resource: user
  verb: create_hook
  tags:
  - user
  http:
    method: POST
    path: /user/hooks
    request_body: json
  params:
  - key: active
    name: active
    in: body
    type: boolean
    default: false
  - key: authorization_header
    name: authorization_header
    in: body
    type: string
  - key: branch_filter
    name: branch_filter
    in: body
    type: string
  - key: config
    name: config
    in: body
    type: object
    required: true
    schema_ref: CreateHookOptionConfig
  - key: events
    name: events
    in: body
    type: array
    items: string
  - key: type
    name: type
    in: body
    type: string
    enum:
    - forgejo
    - dingtalk
    - discord
    - gitea
    - gogs
    - msteams
    - slack
    - telegram
    - feishu
    - wechatwork
    - packagist
    required: true
  results:
  - status: 201
    schema_ref: Hook
    description: Hook
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  effect: create
  deterministic: true
- id: forgejo.user.create_oauth2_application
  source_operation_id: userCreateOAuth2Application
  summary: Creates a new OAuth2 application
  resource: user
