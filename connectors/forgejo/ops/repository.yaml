schema_version: 1
connector: forgejo
domain: repository
operations:
- id: forgejo.repository.accept_repo_transfer
  source_operation_id: acceptRepoTransfer
  summary: Accept a repo transfer
  resource: repository
  verb: accept_repo_transfer
  tags:
  - repository
  http:
    method: POST
    path: /repos/{owner}/{repo}/transfer/accept
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo to transfer
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo to transfer
  results:
  - status: 202
    schema_ref: Repository
    description: Repository
    pending: true
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 413
    class: bad_request
    description: QuotaExceeded
  effect: create
  deterministic: true
- id: forgejo.repository.action_run
  source_operation_id: ActionRun
  summary: Get an action run
  resource: repository
  verb: action_run
  tags:
  - repository
  http:
    method: GET
    path: /repos/{owner}/{repo}/actions/runs/{run_id}
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: run_id
    name: run_id
    in: path
    type: integer
    format: int64
    required: true
    description: id of the action run
  results:
  - status: 200
    schema_ref: ActionRun
    description: ActionRun
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: read
  deterministic: true
- id: forgejo.repository.add_collaborator
  source_operation_id: repoAddCollaborator
  summary: Add a collaborator to a repository
  resource: repository
  verb: add_collaborator
  tags:
  - repository
  http:
    method: PUT
    path: /repos/{owner}/{repo}/collaborators/{collaborator}
    request_body: json
  params:
  - key: collaborator
    name: collaborator
    in: path
    type: string
    required: true
    description: username of the collaborator to add
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: permission
    name: permission
    in: body
    type: string
    enum:
    - read
    - write
    - admin
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: update
  deterministic: true
- id: forgejo.repository.add_flag
  source_operation_id: repoAddFlag
  summary: Add a flag to a repository
  resource: repository
