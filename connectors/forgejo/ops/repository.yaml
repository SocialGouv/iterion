- id: forgejo.repository.search
  source_operation_id: repoSearch
  summary: Search for repositories
  resource: repository
  verb: search
  tags:
  - repository
  http:
    method: GET
    path: /repos/search
  params:
  - key: archived
    name: archived
    in: query
    type: boolean
    description: show only archived, non-archived or all repositories (defaults to
      all)
  - key: exclusive
    name: exclusive
    in: query
    type: boolean
    description: if `uid` is given, search only for repos that the user owns
  - key: includeDesc
    name: includeDesc
    in: query
    type: boolean
    description: include search of keyword within repository description
  - key: is_private
    name: is_private
    in: query
    type: boolean
    description: show only public, private or all repositories (defaults to all)
  - key: limit
    name: limit
    in: query
    type: integer
    description: page size of results
  - key: mode
    name: mode
    in: query
    type: string
    description: type of repository to search for. Supported values are "fork", "source",
      "mirror" and "collaborative"
  - key: order
    name: order
    in: query
    type: string
    enum:
    - asc
    - desc
    description: sort order, either "asc" (ascending) or "desc" (descending). Default
      is "asc", ignored if "sort" is not specified.
  - key: page
    name: page
    in: query
    type: integer
    description: page number of results to return (1-based)
  - key: priority_owner_id
    name: priority_owner_id
    in: query
    type: integer
    format: int64
    description: repo owner to prioritize in the results
  - key: private
    name: private
    in: query
    type: boolean
    description: include private repositories this user has access to (defaults to
      true)
  - key: q
    name: q
    in: query
    type: string
    description: keyword
  - key: sort
    name: sort
    in: query
    type: string
    enum:
    - alpha
    - created
    - updated
    - size
    - git_size
    - lfs_size
    - id
    - stars
    - forks
    description: sort repos by attribute. Supported values are "alpha", "created",
      "updated", "size", "git_size", "lfs_size", "stars", "forks" and "id". Default
      is "alpha"
  - key: starredBy
    name: starredBy
    in: query
    type: integer
    format: int64
    description: search only for repos that the user with the given id has starred
  - key: team_id
    name: team_id
    in: query
    type: integer
    format: int64
    description: search only for repos that belong to the given team id
  - key: template
    name: template
    in: query
    type: boolean
    description: show only template, non-template or all repositories (defaults to
      all)
  - key: topic
    name: topic
    in: query
    type: boolean
    description: Limit search to repositories with keyword as topic
  - key: uid
    name: uid
    in: query
    type: integer
    format: int64
    description: search only for repos that the user with the given id owns or contributes
      to
  results:
  - status: 200
    schema_ref: SearchResults
    description: SearchResults
  errors:
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: read
  deterministic: true
