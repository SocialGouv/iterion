- id: forgejo.repository.edit
  source_operation_id: repoEdit
  summary: Edit a repository's properties. Only fields that are set will be changed.
  resource: repository
  verb: edit
  tags:
  - repository
  http:
    method: PATCH
    path: /repos/{owner}/{repo}
    request_body: json
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo to edit
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo to edit
  - key: allow_fast_forward_only_merge
    name: allow_fast_forward_only_merge
    in: body
    type: boolean
    description: either `true` to allow fast-forward-only merging pull requests, or
      `false` to prevent fast-forward-only merging.
  - key: allow_manual_merge
    name: allow_manual_merge
    in: body
    type: boolean
    description: either `true` to allow mark pr as merged manually, or `false` to
      prevent it.
  - key: allow_merge_commits
    name: allow_merge_commits
    in: body
    type: boolean
    description: either `true` to allow merging pull requests with a merge commit,
      or `false` to prevent merging pull requests with merge commits.
  - key: allow_rebase
    name: allow_rebase
    in: body
    type: boolean
    description: either `true` to allow rebase-merging pull requests, or `false` to
      prevent rebase-merging.
  - key: allow_rebase_explicit
    name: allow_rebase_explicit
    in: body
    type: boolean
    description: either `true` to allow rebase with explicit merge commits (--no-ff),
      or `false` to prevent rebase with explicit merge commits.
  - key: allow_rebase_update
    name: allow_rebase_update
    in: body
    type: boolean
    description: either `true` to allow updating pull request branch by rebase, or
      `false` to prevent it.
  - key: allow_squash_merge
    name: allow_squash_merge
    in: body
    type: boolean
    description: either `true` to allow squash-merging pull requests, or `false` to
      prevent squash-merging.
  - key: archived
    name: archived
    in: body
    type: boolean
    description: set to `true` to archive this repository.
  - key: autodetect_manual_merge
    name: autodetect_manual_merge
    in: body
    type: boolean
    description: 'either `true` to enable AutodetectManualMerge, or `false` to prevent
      it. Note: In some special cases, misjudgments can occur.'
  - key: default_allow_maintainer_edit
    name: default_allow_maintainer_edit
    in: body
    type: boolean
    description: set to `true` to allow edits from maintainers by default
  - key: default_branch
    name: default_branch
    in: body
    type: string
    description: sets the default branch for this repository.
  - key: default_delete_branch_after_merge
    name: default_delete_branch_after_merge
    in: body
    type: boolean
    description: set to `true` to delete pr branch after merge by default
  - key: default_merge_style
    name: default_merge_style
    in: body
    type: string
    description: 'set to a merge style to be used by this repository: "merge", "rebase",
      "rebase-merge", "squash", "fast-forward-only", "manually-merged", or "rebase-update-only".'
  - key: default_update_style
    name: default_update_style
    in: body
    type: string
    description: 'set to a update style to be used by this repository: "rebase" or
      "merge"'
  - key: description
    name: description
    in: body
    type: string
    description: a short description of the repository.
  - key: enable_prune
    name: enable_prune
    in: body
    type: boolean
    description: enable prune - remove obsolete remote-tracking references when mirroring
  - key: external_tracker
    name: external_tracker
    in: body
    type: object
    schema_ref: ExternalTracker
  - key: external_wiki
    name: external_wiki
    in: body
    type: object
    schema_ref: ExternalWiki
  - key: globally_editable_wiki
    name: globally_editable_wiki
    in: body
    type: boolean
    description: set the globally editable state of the wiki
  - key: has_actions
    name: has_actions
    in: body
    type: boolean
    description: either `true` to enable actions unit, or `false` to disable them.
  - key: has_issues
    name: has_issues
    in: body
    type: boolean
    description: either `true` to enable issues for this repository or `false` to
      disable them.
  - key: has_packages
    name: has_packages
    in: body
    type: boolean
    description: either `true` to enable packages unit, or `false` to disable them.
  - key: has_projects
    name: has_projects
    in: body
    type: boolean
    description: either `true` to enable project unit, or `false` to disable them.
  - key: has_pull_requests
    name: has_pull_requests
    in: body
    type: boolean
    description: either `true` to allow pull requests, or `false` to prevent pull
      request.
  - key: has_releases
    name: has_releases
    in: body
    type: boolean
    description: either `true` to enable releases unit, or `false` to disable them.
  - key: has_wiki
    name: has_wiki
    in: body
    type: boolean
    description: either `true` to enable the wiki for this repository or `false` to
      disable it.
  - key: ignore_whitespace_conflicts
    name: ignore_whitespace_conflicts
    in: body
    type: boolean
