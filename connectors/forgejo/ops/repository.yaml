- id: forgejo.repository.get_action_job_logs
  source_operation_id: repoGetActionJobLogs
  summary: Download the plaintext logs of an action job
  description: Returns the plaintext log for the job. By default the log for the most
    recent attempt is returned (ActionRunJob.TaskID tracks the latest task). Pass
    `?attempt=N` to fetch the log for a specific historical attempt; the value matches
    the `attempt` field returned by the job listing endpoints.
  resource: repository
  verb: get_action_job_logs
  tags:
  - repository
  http:
    method: GET
    path: /repos/{owner}/{repo}/actions/jobs/{job_id}/logs
  params:
  - key: job_id
    name: job_id
    in: path
    type: integer
    format: int64
    required: true
    description: ID of the workflow job
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: attempt
    name: attempt
    in: query
    type: integer
    format: int64
    description: 1-based attempt number matching the value of `attempt` in the job
      listing; omit to fetch the latest attempt of the job
  results:
  - status: 200
    description: Plaintext log content
  - status: 206
    description: Partial log content (Range request)
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: read
  deterministic: true
- id: forgejo.repository.get_action_run_logs
  source_operation_id: repoGetActionRunLogs
  summary: Download a ZIP of plaintext logs for every job in an action run
  resource: repository
  verb: get_action_run_logs
  tags:
  - repository
  http:
    method: GET
    path: /repos/{owner}/{repo}/actions/runs/{run_id}/logs
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: run_id
    name: run_id
    in: path
    type: integer
    format: int64
    required: true
    description: ID of the workflow run. The ZIP contains the latest attempt of each
      job in the run, with each entry named `{job-name}-{job-id}-attempt-{N}.log`
      (the job ID prevents collisions when two jobs share a name; the attempt number
      records which run the log came from). The run itself has no attempt number —
      jobs are re-run independently, so use the per-job logs endpoint with `?attempt`
      to fetch a specific historical attempt of one job.
  results:
  - status: 200
    description: ZIP archive of per-job log files
  errors:
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: read
  deterministic: true
