  - status: 422
    class: bad_request
    description: APIInvalidTopicsError is error format response to invalid topics
  effect: update
  deterministic: true
- id: forgejo.repository.apply_diff_patch
  source_operation_id: repoApplyDiffPatch
  summary: Apply diff patch to repository
  resource: repository
  verb: apply_diff_patch
  tags:
  - repository
  http:
    method: POST
    path: /repos/{owner}/{repo}/diffpatch
    request_body: json
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: author
    name: author
    in: body
    type: object
    schema_ref: Identity
  - key: branch
    name: branch
    in: body
    type: string
    description: branch (optional) to base this file from. if not given, the default
      branch is used
  - key: committer
    name: committer
    in: body
    type: object
    schema_ref: Identity
  - key: content
    name: content
    in: body
    type: string
    required: true
    description: content must be base64 encoded
  - key: dates
    name: dates
    in: body
    type: object
    schema_ref: CommitDateOptions
  - key: force_overwrite_new_branch
    name: force_overwrite_new_branch
    in: body
    type: boolean
    description: (optional) will do a force-push if the new branch already exists
  - key: from_path
    name: from_path
    in: body
    type: string
    description: from_path (optional) is the path of the original file which will
      be moved/renamed to the path in the URL
  - key: message
    name: message
    in: body
    type: string
    description: message (optional) for the commit of this file. if not supplied,
      a default message will be used
  - key: new_branch
    name: new_branch
    in: body
    type: string
    description: new_branch (optional) will make a new branch from `branch` before
      creating the file
  - key: sha
    name: sha
    in: body
    type: string
    required: true
    description: sha is the SHA for the file that already exists
  - key: signoff
    name: signoff
    in: body
    type: boolean
    description: Add a Signed-off-by trailer by the committer at the end of the commit
      log message.
  results:
  - status: 200
    schema_ref: FileResponse
    description: FileResponse
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 413
    class: bad_request
    description: QuotaExceeded
  - status: 423
    class: bad_request
    description: APIRepoArchivedError is an error that is raised when an archived
      repo should be modified
  effect: create
  deterministic: true
- id: forgejo.repository.cancel_action_run
  source_operation_id: CancelActionRun
  summary: Cancel a pending or running workflow run.
  description: Cancel a particular workflow run. Pending or running jobs of the run
    are cancelled. A run that has already finished, whether cancelled, failed, skipped
    or succeeded, is left unchanged. In both cases the endpoint responds with HTTP
    204.
  resource: repository
  verb: cancel_action_run
  tags:
  - repository
  http:
    method: POST
    path: /repos/{owner}/{repo}/actions/runs/{run_id}/cancel
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: run_id
    name: run_id
    in: path
    type: integer
    format: int64
    required: true
    description: ID of the workflow run
  results:
  - status: 204
    description: Workflow run has been cancelled
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
- id: forgejo.repository.cancel_scheduled_auto_merge
  source_operation_id: repoCancelScheduledAutoMerge
