- id: forgejo.issue.search_issues
  source_operation_id: issueSearchIssues
  summary: Search for issues across the repositories that the user has access to
  resource: issue
  verb: search_issues
  tags:
  - issue
  http:
    method: GET
    path: /repos/issues/search
  params:
  - key: assigned
    name: assigned
    in: query
    type: boolean
    default: false
    description: Filter issues or pulls assigned to the authenticated user
  - key: before
    name: before
    in: query
    type: string
    format: date-time
    description: Only show issues updated before the given time (RFC 3339 format)
  - key: created
    name: created
    in: query
    type: boolean
    default: false
    description: Filter issues or pulls created by the authenticated user
  - key: labels
    name: labels
    in: query
    type: string
    description: Comma-separated list of label names. Fetch only issues that have
      any of these labels. Non existent labels are discarded.
  - key: limit
    name: limit
    in: query
    type: integer
    description: Number of items per page
  - key: mentioned
    name: mentioned
    in: query
    type: boolean
    default: false
    description: Filter issues or pulls mentioning the authenticated user
  - key: milestones
    name: milestones
    in: query
    type: string
    description: Comma-separated list of milestone names. Fetch only issues that have
      any of these milestones. Non existent milestones are discarded.
  - key: owner
    name: owner
    in: query
    type: string
    description: Filter by repository owner
  - key: page
    name: page
    in: query
    type: integer
    default: 1
    description: Page number of results to return (1-based)
  - key: priority_repo_id
    name: priority_repo_id
    in: query
    type: integer
    format: int64
    description: Repository ID to prioritize in the results
  - key: q
    name: q
    in: query
    type: string
    description: Search string
  - key: review_requested
    name: review_requested
    in: query
    type: boolean
    default: false
    description: Filter pull requests where the authenticated user's review was requested
  - key: reviewed
    name: reviewed
    in: query
    type: boolean
    default: false
    description: Filter pull requests reviewed by the authenticated user
  - key: since
    name: since
    in: query
    type: string
    format: date-time
    description: Only show issues updated after the given time (RFC 3339 format)
  - key: sort
    name: sort
    in: query
    type: string
    enum:
    - relevance
    - latest
    - oldest
    - recentupdate
    - leastupdate
    - mostcomment
    - leastcomment
    - nearduedate
    - farduedate
    default: latest
    description: Type of sort
  - key: state
    name: state
    in: query
    type: string
    enum:
    - open
    - closed
    - all
    default: open
    description: State of the issue
  - key: team
    name: team
    in: query
    type: string
    description: Filter by team (requires organization owner parameter)
  - key: type
    name: type
    in: query
    type: string
    enum:
    - issues
    - pulls
    description: Filter by issue type
  results:
  - status: 200
    schema_ref: Issue
    array: true
    description: IssueList
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: read
  deterministic: true
- id: forgejo.issue.start_stop_watch
