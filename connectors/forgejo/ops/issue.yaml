schema_version: 1
connector: forgejo
domain: issue
operations:
- id: forgejo.issue.add_label
  source_operation_id: issueAddLabel
  summary: Add a label to an issue
  resource: issue
  verb: add_label
  tags:
  - issue
  http:
    method: POST
    path: /repos/{owner}/{repo}/issues/{index}/labels
    request_body: json
  params:
  - key: index
    name: index
    in: path
    type: integer
    format: int64
    required: true
    description: index of the issue
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: labels
    name: labels
    in: body
    type: array
    description: Labels can be a list of integers representing label IDs
  - key: updated_at
    name: updated_at
    in: body
    type: string
    format: date-time
  results:
  - status: 200
    schema_ref: Label
    array: true
    description: LabelListWithoutPagination - Labels for a specific issue (no pagination
      headers)
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
- id: forgejo.issue.add_subscription
  source_operation_id: issueAddSubscription
  summary: Subscribe user to issue
  resource: issue
  verb: add_subscription
  tags:
  - issue
  http:
    method: PUT
    path: /repos/{owner}/{repo}/issues/{index}/subscriptions/{user}
  params:
  - key: index
    name: index
    in: path
    type: integer
    format: int64
    required: true
    description: index of the issue
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: user
    name: user
    in: path
    type: string
    required: true
    description: user to subscribe
  results:
  - status: 200
    description: Already subscribed
  - status: 201
    description: Successfully Subscribed
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: update
  deterministic: true
- id: forgejo.issue.add_time
  source_operation_id: issueAddTime
  summary: Add tracked time to a issue
  resource: issue
  verb: add_time
  tags:
  - issue
  http:
    method: POST
    path: /repos/{owner}/{repo}/issues/{index}/times
    request_body: json
  params:
  - key: index
    name: index
    in: path
    type: integer
    format: int64
    required: true
    description: index of the issue
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: created
    name: created
    in: body
    type: string
    format: date-time
  - key: time
    name: time
    in: body
    type: integer
    format: int64
    required: true
    description: time in seconds
  - key: user_name
    name: user_name
    in: body
    type: string
    description: User who spent the time (optional)
  results:
  - status: 200
    schema_ref: TrackedTime
    description: TrackedTime
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
- id: forgejo.issue.check_subscription
