    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: updated_at
    name: updated_at
    in: body
    type: string
    format: date-time
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: delete
  deterministic: true
- id: forgejo.issue.create_comment
  source_operation_id: issueCreateComment
  summary: Add a comment to an issue
  resource: issue
  verb: create_comment
  tags:
  - issue
  http:
    method: POST
    path: /repos/{owner}/{repo}/issues/{index}/comments
    request_body: json
  params:
  - key: index
    name: index
    in: path
    type: integer
    format: int64
    required: true
    description: index of the issue
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: body
    name: body
    in: body
    type: string
    required: true
    description: The body of the comment
  - key: updated_at
    name: updated_at
    in: body
    type: string
    format: date-time
    description: The time of the comment's update, needs admin or repository owner
      permission
  results:
  - status: 201
    schema_ref: Comment
    description: Comment
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 423
    class: bad_request
    description: APIRepoArchivedError is an error that is raised when an archived
      repo should be modified
  - status: 500
    class: upstream
    description: APIInternalServerError is an error that is raised when an internal
      server error occurs
  effect: create
  deterministic: true
- id: forgejo.issue.create_issue
  source_operation_id: issueCreateIssue
  summary: Create an issue. If using deadline only the date will be taken into account,
    and time of day ignored.
  resource: issue
  verb: create_issue
  tags:
  - issue
  http:
    method: POST
    path: /repos/{owner}/{repo}/issues
    request_body: json
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: assignee
    name: assignee
    in: body
    type: string
    description: deprecated
  - key: assignees
    name: assignees
    in: body
    type: array
    items: string
  - key: body
    name: body
    in: body
    type: string
  - key: closed
    name: closed
    in: body
    type: boolean
  - key: due_date
    name: due_date
    in: body
    type: string
    format: date-time
  - key: labels
    name: labels
    in: body
    type: array
    items: integer
    description: list of label ids
  - key: milestone
    name: milestone
    in: body
    type: integer
    format: int64
    description: milestone id
  - key: ref
    name: ref
    in: body
    type: string
  - key: title
    name: title
    in: body
    type: string
    required: true
  results:
  - status: 201
    schema_ref: Issue
    description: Issue
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 412
    class: bad_request
    description: APIError is error format response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  - status: 423
    class: bad_request
    description: APIRepoArchivedError is an error that is raised when an archived
      repo should be modified
  effect: create
  deterministic: true
