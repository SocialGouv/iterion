- id: forgejo.issue.list_issues
  source_operation_id: issueListIssues
  summary: List a repository's issues
  resource: issue
  verb: list_issues
  tags:
  - issue
  http:
    method: GET
    path: /repos/{owner}/{repo}/issues
  params:
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  - key: assigned_by
    name: assigned_by
    in: query
    type: string
    description: Only show items for which the given user is assigned
  - key: before
    name: before
    in: query
    type: string
    format: date-time
    description: Only show items updated before the given time. This is a timestamp
      in RFC 3339 format
  - key: created_by
    name: created_by
    in: query
    type: string
    description: Only show items which were created by the given user
  - key: labels
    name: labels
    in: query
    type: string
    description: comma separated list of labels. Fetch only issues that have any of
      this labels. Non existent labels are discarded
  - key: limit
    name: limit
    in: query
    type: integer
    description: page size of results
  - key: mentioned_by
    name: mentioned_by
    in: query
    type: string
    description: Only show items in which the given user was mentioned
  - key: milestones
    name: milestones
    in: query
    type: string
    description: comma separated list of milestone names or ids. It uses names and
      fall back to ids. Fetch only issues that have any of this milestones. Non existent
      milestones are discarded
  - key: page
    name: page
    in: query
    type: integer
    description: page number of results to return (1-based)
  - key: q
    name: q
    in: query
    type: string
    description: search string
  - key: since
    name: since
    in: query
    type: string
    format: date-time
    description: Only show items updated after the given time. This is a timestamp
      in RFC 3339 format
  - key: sort
    name: sort
    in: query
    type: string
    enum:
    - relevance
    - latest
    - oldest
    - recentupdate
    - leastupdate
    - mostcomment
    - leastcomment
    - nearduedate
    - farduedate
    default: latest
    description: Type of sort
  - key: state
    name: state
    in: query
    type: string
    enum:
    - closed
    - open
    - all
    description: whether issue is open or closed
  - key: type
    name: type
    in: query
    type: string
    enum:
    - issues
    - pulls
    description: filter by type (issues / pulls) if set
  results:
  - status: 200
    schema_ref: Issue
    array: true
    description: IssueList
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: read
  deterministic: true
