    name: index
    in: path
    type: integer
    format: int64
    required: true
    description: index of the issue
  - key: owner
    name: owner
    in: path
    type: string
    required: true
    description: owner of the repo
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo
  results:
  - status: 200
    schema_ref: WatchInfo
    description: WatchInfo
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: read
  deterministic: true
