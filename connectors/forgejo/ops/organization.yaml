- id: forgejo.organization.create_org_repo
  source_operation_id: createOrgRepo
  summary: Create a repository in an organization
  resource: organization
  verb: create_org_repo
  tags:
  - organization
  http:
    method: POST
    path: /orgs/{org}/repos
    request_body: json
  params:
  - key: org
    name: org
    in: path
    type: string
    required: true
    description: name of organization
  - key: auto_init
    name: auto_init
    in: body
    type: boolean
    description: Whether the repository should be auto-initialized?
  - key: default_branch
    name: default_branch
    in: body
    type: string
    description: DefaultBranch of the repository (used when initializes and in template)
  - key: description
    name: description
    in: body
    type: string
    description: Description of the repository to create
  - key: gitignores
    name: gitignores
    in: body
    type: string
    description: Gitignores to use, separated by commas
  - key: issue_labels
    name: issue_labels
    in: body
    type: string
    description: Label-Set to use
  - key: license
    name: license
    in: body
    type: string
    description: License to use
  - key: name
    name: name
    in: body
    type: string
    required: true
    description: Name of the repository to create
  - key: object_format_name
    name: object_format_name
    in: body
    type: string
    enum:
    - sha1
    - sha256
    description: ObjectFormatName of the underlying git repository
  - key: private
    name: private
    in: body
    type: boolean
    description: Whether the repository is private
  - key: readme
    name: readme
    in: body
    type: string
    description: Readme of the repository to create
  - key: template
    name: template
    in: body
    type: boolean
    description: Whether the repository is template
  - key: trust_model
    name: trust_model
    in: body
    type: string
    enum:
    - default
    - collaborator
    - committer
    - collaboratorcommitter
    description: TrustModel of the repository
  results:
  - status: 201
    schema_ref: Repository
    description: Repository
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
