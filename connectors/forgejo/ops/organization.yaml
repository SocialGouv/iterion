schema_version: 1
connector: forgejo
domain: organization
operations:
- id: forgejo.organization.add_team_member
  source_operation_id: orgAddTeamMember
  summary: Add a team member
  resource: organization
  verb: add_team_member
  tags:
  - organization
  http:
    method: PUT
    path: /teams/{id}/members/{username}
  params:
  - key: id
    name: id
    in: path
    type: integer
    format: int64
    required: true
    description: id of the team
  - key: username
    name: username
    in: path
    type: string
    required: true
    description: username of the user to add
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: update
  deterministic: true
- id: forgejo.organization.add_team_repository
  source_operation_id: orgAddTeamRepository
  summary: Add a repository to a team
  resource: organization
  verb: add_team_repository
  tags:
  - organization
  http:
    method: PUT
    path: /teams/{id}/repos/{org}/{repo}
  params:
  - key: id
    name: id
    in: path
    type: integer
    format: int64
    required: true
    description: id of the team
  - key: org
    name: org
    in: path
    type: string
    required: true
    description: organization that owns the repo to add
  - key: repo
    name: repo
    in: path
    type: string
    required: true
    description: name of the repo to add
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: update
  deterministic: true
- id: forgejo.organization.block_user
  source_operation_id: orgBlockUser
  summary: Blocks a user from the organization
