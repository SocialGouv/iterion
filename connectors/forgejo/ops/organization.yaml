- id: forgejo.organization.register_org_runner
  source_operation_id: registerOrgRunner
  summary: Register a new organization-level runner
  resource: organization
  verb: register_org_runner
  tags:
  - organization
  http:
    method: POST
    path: /orgs/{org}/actions/runners
    request_body: json
  params:
  - key: org
    name: org
    in: path
    type: string
    required: true
    description: name of the organization
  - key: description
    name: description
    in: body
    type: string
    description: Description of the runner to register.
  - key: ephemeral
    name: ephemeral
    in: body
    type: boolean
    description: Register as ephemeral runner https://forgejo.org/docs/latest/admin/actions/security/#ephemeral-runner
  - key: name
    name: name
    in: body
    type: string
    required: true
    description: Name of the runner to register. The name of the runner does not have
      to be unique.
  results:
  - status: 201
    schema_ref: RegisterRunnerResponse
    description: RegisterRunnerResponse contains the details of the just registered
      runner.
  errors:
  - status: 400
    class: bad_request
    description: APIError is error format response
  - status: 401
    class: unauthorized
    description: APIUnauthorizedError is a unauthorized error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
