- id: forgejo.organization.create
  source_operation_id: orgCreate
  summary: Create an organization
  resource: organization
  verb: create
  tags:
  - organization
  http:
    method: POST
    path: /orgs
    request_body: json
  params:
  - key: description
    name: description
    in: body
    type: string
  - key: email
    name: email
    in: body
    type: string
  - key: full_name
    name: full_name
    in: body
    type: string
  - key: location
    name: location
    in: body
    type: string
  - key: repo_admin_change_team_access
    name: repo_admin_change_team_access
    in: body
    type: boolean
  - key: username
    name: username
    in: body
    type: string
    required: true
  - key: visibility
    name: visibility
    in: body
    type: string
    enum:
    - public
    - limited
    - private
    description: possible values are `public` (default), `limited` or `private`
  - key: website
    name: website
    in: body
    type: string
  results:
  - status: 201
    schema_ref: Organization
    description: Organization
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: create
  deterministic: true
- id: forgejo.organization.create_hook
  source_operation_id: orgCreateHook
  summary: Create a hook
  resource: organization
  verb: create_hook
  tags:
  - organization
  http:
    method: POST
    path: /orgs/{org}/hooks
    request_body: json
  params:
  - key: org
    name: org
    in: path
    type: string
    required: true
    description: name of the organization
  - key: active
    name: active
    in: body
    type: boolean
    default: false
  - key: authorization_header
    name: authorization_header
    in: body
    type: string
  - key: branch_filter
    name: branch_filter
    in: body
    type: string
  - key: config
    name: config
    in: body
    type: object
    required: true
    schema_ref: CreateHookOptionConfig
  - key: events
    name: events
    in: body
    type: array
    items: string
  - key: type
    name: type
    in: body
    type: string
    enum:
    - forgejo
    - dingtalk
    - discord
    - gitea
    - gogs
    - msteams
    - slack
    - telegram
    - feishu
    - wechatwork
    - packagist
    required: true
  results:
  - status: 201
    schema_ref: Hook
    description: Hook
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  effect: create
  deterministic: true
