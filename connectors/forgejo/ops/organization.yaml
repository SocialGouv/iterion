    name: org
    in: path
    type: string
    required: true
    description: name of the org
  - key: username
    name: username
    in: path
    type: string
    required: true
    description: username of the user
  results:
  - status: 204
    description: APIEmpty is an empty response
  errors:
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: update
  deterministic: true
- id: forgejo.organization.check_quota
  source_operation_id: orgCheckQuota
  summary: Check if the organization is over quota for a given subject
  resource: organization
  verb: check_quota
  tags:
  - organization
  http:
    method: GET
    path: /orgs/{org}/quota/check
  params:
  - key: org
    name: org
    in: path
    type: string
    required: true
    description: name of the organization
  - key: subject
    name: subject
    in: query
    type: string
    required: true
    description: subject of the quota
  results:
  - status: 200
    description: Returns true if the action is accepted.
  errors:
  - status: 403
    class: forbidden
    description: APIForbiddenError is a forbidden error response
  - status: 404
    class: not_found
    description: APINotFound is a not found error response
  - status: 422
    class: bad_request
    description: APIValidationError is error format response related to input validation
  effect: read
  deterministic: true
