<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- This document is served at "/" too, where it is the product home: what
         a crawler or a link preview reads is THIS static head, before any
         route renders. useDocumentTitle() retitles the tab once the studio
         mounts, so the static title is the product's, not the tool's.
         No og:url: the same bundle is served from iterion.cloud, from preprod
         and from every self-hosted deployment, and a pinned URL would name the
         wrong one for all but the first. -->
    <title>Iterion — build, run and orchestrate agentic AI workflows</title>
    <meta
      name="description"
      content="Build, run and orchestrate agentic AI workflows. Define them as readable .bot files and operate every run — locally, in CI, or across a multi-tenant cloud."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iterion" />
    <meta property="og:title" content="Iterion — build, run and orchestrate agentic AI workflows" />
    <meta
      property="og:description"
      content="Build, run and orchestrate agentic AI workflows. Define them as readable .bot files and operate every run — locally, in CI, or across a multi-tenant cloud."
    />
    <meta property="og:image" content="/brand/iterion-bot-circle.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Iterion — build, run and orchestrate agentic AI workflows" />
    <meta
      name="twitter:description"
      content="Build, run and orchestrate agentic AI workflows. Define them as readable .bot files and operate every run — locally, in CI, or across a multi-tenant cloud."
    />
  </head>
  <body class="bg-surface-0 text-fg-default antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
