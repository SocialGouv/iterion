{{- if .Values.runner.enabled -}}
# The runner Deployment is rendered only when runner.enabled=true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iterion.fullname" . }}-runner
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  strategy:
    {{- toYaml .Values.runner.strategy | nindent 4 }}
  {{- if not .Values.runner.keda.enabled }}
  replicas: {{ .Values.runner.replicas }}
  {{- end }}
  {{- with .Values.runner.progressDeadlineSeconds }}
  # Lame-duck rollouts stay Progressing until the last old pod drains its
  # in-flight run; keep this above terminationGracePeriodSeconds so k8s /
  # ArgoCD don't mark the rollout degraded while new pods already serve.
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "iterion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
      annotations:
        # Roll the runner when the rendered config changes, mirroring the
        # server deployment (the runner shares the same configmap envFrom).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.runner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "iterion.serviceAccountName" . }}
      securityContext:
        {{- toYaml (default .Values.securityContext .Values.runner.podSecurityContext) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SIGTERM grace: the hard k8s bound before SIGKILL. In the default
      # lame-duck drain mode the runner lets its in-flight run FINISH
      # within this window (raise it to cover long runs); at the ceiling a
      # run is capped, checkpointed, and auto-resumed on another pod. Must
      # be >= runner.drain.timeout + checkpoint margin.
      terminationGracePeriodSeconds: {{ .Values.runner.terminationGracePeriodSeconds | default 90 }}
      {{- if .Values.runner.cache.enabled }}
      initContainers:
        # Ensure the Go cache subdirs exist and are writable by the uid-1000
        # devbox runner. Relies on the pod fsGroup (set to 1000 for the devbox
        # image) making the RWX volume group-writable; use a storageClass that
        # honours fsGroup, or pre-chown the volume.
        - name: init-runner-cache
          {{- if .Values.runner.image }}
          image: {{ .Values.runner.image | quote }}
          {{- else }}
          image: {{ include "iterion.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.runner.imagePullPolicy | default .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (default .Values.containerSecurityContext .Values.runner.containerSecurityContext) | nindent 12 }}
          command: ["sh", "-c", "mkdir -p {{ .Values.runner.cache.mountPath }}/go/pkg/mod {{ .Values.runner.cache.mountPath }}/go/build"]
          volumeMounts:
            - name: build-cache
              mountPath: {{ .Values.runner.cache.mountPath | quote }}
      {{- end }}
      containers:
        - name: iterion-runner
          {{- if .Values.runner.image }}
          image: {{ .Values.runner.image | quote }}
          {{- else }}
          image: {{ include "iterion.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.runner.imagePullPolicy | default .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (default .Values.containerSecurityContext .Values.runner.containerSecurityContext) | nindent 12 }}
          {{- with .Values.runner.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml .Values.runner.args | nindent 12 }}
          env:
            # Literal PodTemplate values are load-bearing: KEDA/proportional
            # scaling may create a new pod from an old ReplicaSet after the
            # shared ConfigMap changed. That pod must retain epoch N.
            - name: ITERION_RUNNER_EPOCH
              value: {{ .Values.config.rollout.runnerEpoch | int64 | quote }}
            - name: ITERION_RUNNER_EPOCH_MISMATCH_DELAY
              value: {{ .Values.config.rollout.epochMismatchDelay | quote }}
            {{- if .Values.runner.sandbox.enabled }}
            # Downward API: ITERION_POD_IP is required for the kubernetes
            # sandbox driver's ProxyConfig() (pkg/sandbox/kubernetes), so
            # the network proxy advertises a routable address to sibling
            # sandbox pods. The "host.docker.internal" alias used by the
            # docker driver does not exist in pure k8s pod networking.
            - name: ITERION_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Downward API: the runner pod's own name + uid, stamped as the
            # ownerReference on every per-run sandbox resource (pod, both
            # Secrets, NetworkPolicy) so the cluster cascade-GCs them when
            # this runner pod is deleted — closing the
            # plaintext-credential-at-rest leak for a runner killed mid-run
            # (ADR-068 / pkg/sandbox/kubernetes runnerPodOwner).
            - name: ITERION_RUNNER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ITERION_RUNNER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- with .Values.runner.sandbox.scheduling }}
            # Scheduling policy stamped on every per-run sandbox pod — literal
            # PodTemplate values for the same reason as the epoch above: a pod
            # created from an old ReplicaSet must keep the policy it was rolled
            # out with. Unset values are not rendered. See docs/sandbox.md
            # § "Scheduling: requests and node spread".
            {{- with .requests }}
            {{- if .cpu }}
            - name: ITERION_SANDBOX_K8S_REQUESTS_CPU
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: ITERION_SANDBOX_K8S_REQUESTS_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- with .limits }}
            {{- if .cpu }}
            - name: ITERION_SANDBOX_K8S_LIMITS_CPU
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: ITERION_SANDBOX_K8S_LIMITS_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- if .spread }}
            - name: ITERION_SANDBOX_K8S_SPREAD
              value: {{ .spread | quote }}
            {{- end }}
            {{- if .podReadyTimeout }}
            - name: ITERION_SANDBOX_K8S_POD_READY_TIMEOUT
              value: {{ .podReadyTimeout | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.runner.cache.enabled }}
            # Point Go's module + build caches at the shared RWX volume so a
            # fresh clone reuses downloaded modules and compiled objects across
            # runs and across pods (incl. scaled-up ones). `devbox run -- go …`
            # inherits these. If NFS small-file latency on GOCACHE hurts, point
            # GOCACHE at a per-pod emptyDir instead (keep GOMODCACHE shared).
            - name: GOMODCACHE
              value: {{ printf "%s/go/pkg/mod" .Values.runner.cache.mountPath | quote }}
            - name: GOCACHE
              value: {{ printf "%s/go/build" .Values.runner.cache.mountPath | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "iterion.fullname" . }}-config
            {{- if or .Values.secrets.llm.create .Values.secrets.llm.existingSecret }}
            - secretRef:
                name: {{ default (printf "%s-llm" (include "iterion.fullname" .)) .Values.secrets.llm.existingSecret }}
            {{- end }}
            {{- if or .Values.secrets.storage.create .Values.secrets.storage.existingSecret }}
            - secretRef:
                name: {{ default (printf "%s-storage" (include "iterion.fullname" .)) .Values.secrets.storage.existingSecret }}
            {{- end }}
            {{- if or .Values.secrets.auth.create .Values.secrets.auth.existingSecret }}
            # The runner needs ITERION_SECRETS_KEY (same value as
            # the server's) to unseal the per-run RunBundle that
            # cloudpublisher writes. Phase C+D.
            - secretRef:
                name: {{ default (printf "%s-auth" (include "iterion.fullname" .)) .Values.secrets.auth.existingSecret }}
            {{- end }}
            {{- if .Values.secrets.forfait.enabled }}
            # Optional forfait secret, managed MANUALLY in k8s (never sealed in
            # the chart): a Claude Code OAuth token (CLAUDE_CODE_OAUTH_TOKEN) so
            # claude_code runs execute on the subscription instead of a metered
            # API key. optional: true — a missing/absent secret never blocks the
            # runner from starting.
            - secretRef:
                name: {{ default (printf "%s-forfait" (include "iterion.fullname" .)) .Values.secrets.forfait.existingSecret }}
                optional: true
            {{- end }}
          volumeMounts:
            # Writable tmpfs for file secrets (secrets.SecretFilesMountDir =
            # /run/iterion/secrets). In a SANDBOXED run the sandbox driver
            # creates this mount inside the sibling container; an IN-POD run
            # (ITERION_SANDBOX_OVERRIDE=none — the runner IS the isolation
            # boundary) materializes the workflow's `as: file` secrets here
            # directly, but /run is root-owned and the devbox runner is uid
            # 1000, so without a group-writable mount `mkdir /run/iterion`
            # fails and e.g. forge_token never reaches the bot (no PR opened).
            # medium: Memory keeps the plaintext off disk.
            - name: run-iterion
              mountPath: /run/iterion
            {{- if .Values.runner.cache.enabled }}
            # Shared warm Go module + build cache (see runner-cache-pvc.yaml).
            - name: build-cache
              mountPath: {{ .Values.runner.cache.mountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          # The metrics listener is bound unconditionally by the runner
          # binary (the chart `metrics.enabled` flag only gates the
          # PodMonitor scrape config), and it also serves the probes.
          # Plan §F T-40.
          ports:
            - name: metrics
              containerPort: {{ default .Values.server.metricsPort .Values.runner.metricsPort }}
              protocol: TCP
          {{- if (.Values.probes.startup).enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          # /healthz reports the consume LOOP, not just an open socket: it
          # stays green while a run is in flight (the loop is blocked inside
          # it by design, for hours) and fails only when an idle loop has
          # stopped cycling — the one state a restart actually fixes. A
          # tcpSocket probe could not tell those apart, so a runner with a
          # dead consumer stayed Ready forever, consuming nothing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz goes 503 for the whole lame-duck drain, so a pod
          # finishing its run is distinguishable from one taking work.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        # In-pod file-secret scratch (see the volumeMount above). Group-writable
        # via the pod fsGroup, so the uid-1000 devbox runner can create
        # /run/iterion/secrets/<name>. Memory-backed so secret plaintext never
        # touches the node disk.
        - name: run-iterion
          emptyDir:
            medium: Memory
        {{- if .Values.runner.cache.enabled }}
        - name: build-cache
          persistentVolumeClaim:
            claimName: {{ .Values.runner.cache.existingClaim | default (printf "%s-runner-cache" (include "iterion.fullname" .)) }}
        {{- end }}
{{- end -}}
