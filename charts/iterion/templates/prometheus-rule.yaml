{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled -}}
# Alert packs for the cloud control plane. Opt-in
# (metrics.prometheusRule.enabled) because it requires the PrometheusRule
# CRD (prometheus-operator). Thresholds are deliberately conservative —
# tune per deployment.
{{- $rule := .Values.metrics.prometheusRule }}
{{- $ds := $rule.datastores | default dict }}
{{- $dsNamespace := $ds.namespace | default .Release.Namespace }}
{{- $absentFor := $ds.absentFor | default "30m" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "iterion.fullname" . }}
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    {{- with $rule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: iterion.cloud
      rules:
        - alert: IterionDLQNotEmpty
          expr: iterion_dlq_depth > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Runs are parked on the DLQ"
            description: "{{ `{{ $value }}` }} message(s) have exhausted MaxDeliver and need an operator decision: replay or discard via /api/admin/dlq."
        - alert: IterionRunnerHeartbeatErrors
          expr: increase(iterion_runner_heartbeat_errors_total[5m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "Runner lease refreshes are failing"
            description: "NATS KV lease refresh failures — runs may be cancelled to avoid split-brain. Check NATS health."
        - alert: IterionOrphanRunsRecovered
          expr: increase(iterion_runs_orphan_recovered_total[30m]) > 0
          labels:
            severity: info
          annotations:
            summary: "The sweeper recovered orphaned runs"
            description: "Runner pods are dying without terminal status writes (crash/OOM/eviction). The runs are resumable; investigate the pod churn."
        - alert: IterionLaunchDeniesSpiking
          expr: sum(rate(iterion_launch_denied_total{reason!="member_role_required"}[10m])) > 0.5
          labels:
            severity: info
          annotations:
            summary: "Run launches are being denied at a sustained rate"
            description: "Orgs are hitting quotas/caps (see reason label); the authorization refusal member_role_required is excluded, a viewer retrying a launch is not a quota page. Expected under abuse; worth a look if it's a paying tenant."
        - alert: IterionWebhookThrottling
          expr: increase(iterion_webhook_throttled_total[1h]) > 50
          labels:
            severity: info
          annotations:
            summary: "Inbound webhooks are being throttled"
            description: "Sustained rate-limit/quota rejections on inbound webhooks — a noisy forge integration or an abusive caller."
    {{- if .Values.backup.enabled }}
    {{- $fullname := include "iterion.fullname" . }}
    # The off-cluster copy (#2013): a failed Job, a tier without a success
    # within its maxAgeHours, a tier that never succeeded at all — the last
    # one is also what a kube-state-metrics nobody scrapes looks like, so a
    # silent copy cannot pass for a working one. kube-state-metrics series.
    - name: iterion.backup
      rules:
        {{- range $tier := .Values.backup.tiers }}
        # The LAST run of the tier failed: scheduled after the last success
        # and no longer active. Read from the CronJob's own status, so it
        # resolves on the next green run — a rule on kube_job_status_failed
        # counts failed PODS (1 forever on a Job that retried once and went
        # green) and one on a retained failed Job keeps paging after the copy
        # has recovered.
        - alert: IterionArtifactBackupFailed
          expr: {{ printf `(kube_cronjob_status_last_schedule_time{namespace=%q, cronjob="%s-backup-%s"} > kube_cronjob_status_last_successful_time{namespace=%q, cronjob="%s-backup-%s"}) and on(namespace, cronjob) (kube_cronjob_status_active{namespace=%q, cronjob="%s-backup-%s"} == 0)` $.Release.Namespace $fullname $tier.name $.Release.Namespace $fullname $tier.name $.Release.Namespace $fullname $tier.name | quote }}
          for: 15m
          labels:
            severity: critical
            tier: {{ $tier.name | quote }}
          annotations:
            summary: "The {{ $tier.name }} artifact copy's last run failed"
            description: "CronJob {{ $fullname }}-backup-{{ $tier.name }}: its last scheduled run is over and did not succeed (rclone exited non-zero on the copy or on the check that proves it, retries exhausted). The cluster holds the only copy until a run goes green — read the latest Job's logs: kubectl -n {{ $.Release.Namespace }} logs job/<{{ $fullname }}-backup-{{ $tier.name }}-…>."
        - alert: IterionArtifactBackupStale
          expr: {{ printf `time() - kube_cronjob_status_last_successful_time{namespace=%q, cronjob="%s-backup-%s"} > %d * 3600` $.Release.Namespace $fullname $tier.name (int $tier.maxAgeHours) | quote }}
          for: 1h
          labels:
            severity: warning
            tier: {{ $tier.name | quote }}
          annotations:
            summary: "The {{ $tier.name }} artifact copy has no success within {{ $tier.maxAgeHours }}h"
            description: "CronJob {{ $fullname }}-backup-{{ $tier.name }}: the last successful run is older than {{ $tier.maxAgeHours }}h. The off-cluster copy is falling behind its schedule ({{ $tier.schedule }})."
        # Time-based, not a `for:` of maxAgeHours: a `for:` restarts from zero
        # on every Prometheus restart and an 800 h one would never fire.
        - alert: IterionArtifactBackupNeverSucceeded
          expr: {{ printf `absent(kube_cronjob_status_last_successful_time{namespace=%q, cronjob="%s-backup-%s"}) and on() (time() - kube_cronjob_created{namespace=%q, cronjob="%s-backup-%s"} > %d * 3600)` $.Release.Namespace $fullname $tier.name $.Release.Namespace $fullname $tier.name (int $tier.maxAgeHours) | quote }}
          for: 15m
          labels:
            severity: warning
            tier: {{ $tier.name | quote }}
          annotations:
            summary: "The {{ $tier.name }} artifact copy has never succeeded"
            description: "No successful run of CronJob {{ $fullname }}-backup-{{ $tier.name }} is recorded — it never ran green, or kube-state-metrics is not scraped. Either way nothing proves a copy exists."
        {{- end }}
    {{- end }}
    {{- if $ds.enabled }}
    # The datastore alert pack (#2014): the replicated stores the deployment
    # depends on — in the cloud deployment they are OTHER charts (MongoDB,
    # NATS, valkey, SeaweedFS), so this block names them. One rule per store
    # on the ready-replica count (kube-state-metrics, present on any
    # kube-prometheus) and on restarts, then the store-level signals the
    # exporters produce — and, per exporter family, an absent() rule so a
    # signal nobody scrapes pages instead of staying silent. The loss of ONE
    # replica must be visible while it is still one: these stores survive one
    # loss (quorum of three, replication 002), not two.
    - name: iterion.datastores
      rules:
        {{- range $store := $ds.statefulsets }}
        {{- if or (not $store.match) (not (regexMatch "^[^\n]+$" $store.match)) }}
        {{- fail (printf "metrics.prometheusRule.datastores.statefulsets[%s].match must be a one-line regex (got %q)" ($store.name | default "?") ($store.match | default "")) }}
        {{- end }}
        {{- /* The match is a regex FRAGMENT: grouped, so an alternation (a|b) spans the whole name and the pod suffix applies to every branch; quoted ONCE (%q) in both rules, so a backslash stays the regex idiom it is instead of breaking the rule file — Prometheus drops a WHOLE PrometheusRule on one unparsable expression. */ -}}
        {{- $match := printf "(?:%s)" $store.match }}
        {{- $pods := printf "(?:%s)-[0-9]+" $store.match }}
        - alert: IterionDatastoreReplicasMissing
          expr: {{ printf `kube_statefulset_status_replicas_ready{namespace=%q, statefulset=~%q} < kube_statefulset_replicas{namespace=%q, statefulset=~%q}` $dsNamespace $match $dsNamespace $match | quote }}
          for: {{ $ds.forDuration | default "10m" }}
          labels:
            severity: critical
            datastore: {{ $store.name | quote }}
          annotations:
            summary: "{{ $store.name }} is missing a replica"
            description: "StatefulSet {{ `{{ $labels.statefulset }}` }}: {{ `{{ $value }}` }} ready replica(s), fewer than it asks for. One loss is survivable; the second is not — act now."
        - alert: IterionDatastoreRestarting
          expr: {{ printf `increase(kube_pod_container_status_restarts_total{namespace=%q, pod=~%q}[1h]) > %d` $dsNamespace $pods (int ($ds.restartsPerHour | default 3)) | quote }}
          labels:
            severity: warning
            datastore: {{ $store.name | quote }}
          annotations:
            summary: "{{ $store.name }} pods are restarting"
            description: "{{ `{{ $labels.pod }}` }} restarted {{ `{{ $value }}` }} times in the last hour."
        {{- end }}
        - alert: IterionDatastoreSignalAbsent
          expr: {{ printf `absent(kube_statefulset_replicas{namespace=%q})` $dsNamespace | quote }}
          for: {{ $absentFor }}
          labels:
            severity: warning
            family: kube-state-metrics
          annotations:
            summary: "No kube-state-metrics series for the datastore namespace"
            description: "The replica rules above read kube_statefulset_* and see nothing: kube-state-metrics is not scraped for namespace {{ $dsNamespace }}, so a lost replica would page nobody."
        {{- with $ds.valkey }}
        {{- if .enabled }}
        {{- include "iterion.promqlMatchers" (dict "value" .selector "path" "metrics.prometheusRule.datastores.valkey.selector") }}
        {{- $sel := printf "namespace=%q, %s" $dsNamespace .selector }}
        # valkeyfiler (the SeaweedFS filer store): redis_exporter series
        # (Valkey supported). connected_slaves is the primary's count of
        # replicas; AOF write status is 1 when the last write was ok.
        - alert: IterionValkeyReplicasDisconnected
          expr: {{ printf `max(redis_connected_slaves{%s}) < %d` $sel (int .minConnectedReplicas) | quote }}
          for: 5m
          labels:
            severity: critical
            family: valkey
          annotations:
            summary: "The valkey primary has fewer than {{ .minConnectedReplicas }} connected replicas"
            description: "{{ `{{ $value }}` }} replica(s) connected to the primary: the filer metadata is one failure away from a single copy."
        - alert: IterionValkeyAOFWriteFailing
          expr: {{ printf `redis_aof_last_write_status{%s} == 0` $sel | quote }}
          for: 5m
          labels:
            severity: critical
            family: valkey
          annotations:
            summary: "The valkey AOF is not being written"
            description: "{{ `{{ $labels.pod }}` }}: the last AOF write failed — the filer metadata is not durable until it writes again (disk full?)."
        - alert: IterionDatastoreSignalAbsent
          expr: {{ printf `absent(redis_connected_slaves{%s})` $sel | quote }}
          for: {{ $absentFor }}
          labels:
            severity: warning
            family: valkey
          annotations:
            summary: "No redis_exporter series for valkey"
            description: {{ printf "The valkey rules see nothing: no exporter is scraped for %s in namespace %s." .selector $dsNamespace | quote }}
        {{- end }}
        {{- end }}
        {{- with $ds.seaweedfs }}
        {{- if .enabled }}
        {{- include "iterion.promqlMatchers" (dict "value" .volumeSelector "path" "metrics.prometheusRule.datastores.seaweedfs.volumeSelector") }}
        {{- include "iterion.promqlMatchers" (dict "value" .masterSelector "path" "metrics.prometheusRule.datastores.seaweedfs.masterSelector") }}
        {{- $vol := printf "namespace=%q, %s" $dsNamespace .volumeSelector }}
        {{- $master := printf "namespace=%q, %s" $dsNamespace .masterSelector }}
        # SeaweedFS: the volumes registered on the volume servers, the master
        # leader, the volumes the master counts under their replica placement.
        - alert: IterionSeaweedFSVolumesMissing
          expr: {{ printf `sum(SeaweedFS_volumeServer_volumes{%s}) < %d` $vol (int .minVolumes) | quote }}
          for: 10m
          labels:
            severity: critical
            family: seaweedfs
          annotations:
            summary: "SeaweedFS has fewer than {{ .minVolumes }} registered volumes"
            description: "{{ `{{ $value }}` }} volume(s) registered across the volume servers: a volume server is gone or lost its disk."
        - alert: IterionSeaweedFSNoLeader
          expr: {{ printf `max(SeaweedFS_master_is_leader{%s}) == 0` $master | quote }}
          for: 5m
          labels:
            severity: critical
            family: seaweedfs
          annotations:
            summary: "No SeaweedFS master is leader"
            description: "No master reports is_leader=1: writes are refused until the raft group elects one."
        # The leader's gauge only: a master that stepped down keeps its last
        # non-zero value (nothing resets it), so a plain sum or max over
        # every master would page forever on a stale follower.
        - alert: IterionSeaweedFSUnderReplicated
          expr: {{ printf `sum(SeaweedFS_master_under_replicated_volumes{%s} * on(namespace, pod) group_left() (SeaweedFS_master_is_leader{%s} == 1)) > 0` $master $master | quote }}
          for: 30m
          labels:
            severity: warning
            family: seaweedfs
          annotations:
            summary: "SeaweedFS volumes are under-replicated"
            description: "{{ `{{ $value }}` }} volume(s) below their replica placement for 30 minutes: the next loss is not covered."
        - alert: IterionDatastoreSignalAbsent
          expr: {{ printf `absent(SeaweedFS_volumeServer_volumes{%s})` $vol | quote }}
          for: {{ $absentFor }}
          labels:
            severity: warning
            family: seaweedfs
          annotations:
            summary: "No SeaweedFS volume-server series"
            description: {{ printf "The SeaweedFS volume rules see nothing: the volume servers' metrics port is not scraped for %s in namespace %s." .volumeSelector $dsNamespace | quote }}
        - alert: IterionDatastoreSignalAbsent
          expr: {{ printf `absent(SeaweedFS_master_is_leader{%s})` $master | quote }}
          for: {{ $absentFor }}
          labels:
            severity: warning
            family: seaweedfs-master
          annotations:
            summary: "No SeaweedFS master series"
            description: {{ printf "The SeaweedFS leader and replication rules see nothing: the masters' metrics port is not scraped for %s in namespace %s." .masterSelector $dsNamespace | quote }}
        {{- end }}
        {{- end }}
        {{- with $ds.mongodb }}
        {{- if .enabled }}
        {{- include "iterion.promqlMatchers" (dict "value" .selector "path" "metrics.prometheusRule.datastores.mongodb.selector") }}
        {{- $sel := printf "namespace=%q, %s" $dsNamespace .selector }}
        {{- $p := .metricPrefix | default "mongodb_rs_" }}
        {{- if not (regexMatch "^[a-zA-Z_][a-zA-Z0-9_]*$" $p) }}
        {{- fail (printf "metrics.prometheusRule.datastores.mongodb.metricPrefix must be a metric-name prefix (got %q)" $p) }}
        {{- end }}
        # MongoDB: percona mongodb_exporter's view of replSetGetStatus, one
        # series per member (member_idx = host:port, member_state = its state
        # name). The prefix names the collector: mongodb_rs_ (diagnosticdata,
        # on by default) or mongodb_ (--collector.replicasetstatus).
        - alert: IterionMongoDBMemberUnhealthy
          expr: {{ printf `%smembers_health{%s} == 0` $p $sel | quote }}
          for: 5m
          labels:
            severity: critical
            family: mongodb
          annotations:
            summary: "A MongoDB replica-set member is unhealthy"
            description: "Member {{ `{{ $labels.member_idx }}` }} reports health 0 ({{ `{{ $labels.member_state }}` }}): the set is one failure from losing its majority."
        - alert: IterionMongoDBMemberOutOfSet
          expr: {{ printf `%smembers_state{%s, member_state!~"PRIMARY|SECONDARY|ARBITER"}` $p $sel | quote }}
          for: 5m
          labels:
            severity: critical
            family: mongodb
          annotations:
            summary: "A MongoDB member is out of the replica set"
            description: "Member {{ `{{ $labels.member_idx }}` }} is {{ `{{ $labels.member_state }}` }} — neither PRIMARY, SECONDARY nor ARBITER — for 5 minutes."
        - alert: IterionMongoDBNoPrimary
          expr: {{ printf `((count(%smembers_state{%s, member_state="PRIMARY"}) or vector(0)) < 1) and (count(%smembers_state{%s}) > 0)` $p $sel $p $sel | quote }}
          for: 2m
          labels:
            severity: critical
            family: mongodb
          annotations:
            summary: "The MongoDB replica set has no primary"
            description: "No member reports PRIMARY: iterion cannot write (runs stop) until an election succeeds."
        - alert: IterionDatastoreSignalAbsent
          expr: {{ printf `absent(%smembers_state{%s})` $p $sel | quote }}
          for: {{ $absentFor }}
          labels:
            severity: warning
            family: mongodb
          annotations:
            summary: "No mongodb_exporter series"
            description: {{ printf "The MongoDB rules see nothing: no exporter is scraped for %s in namespace %s." .selector $dsNamespace | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
