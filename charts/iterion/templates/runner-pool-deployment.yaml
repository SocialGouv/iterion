{{- range .Values.runnerPools }}
{{- $pool := . }}
{{- $gw := $pool.gateway | default dict }}
{{- if not $pool.name }}
{{- fail "runnerPools[]: every entry needs a name (the pool's registry name)" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,29}[a-z0-9])?$" $pool.name) }}
{{- fail (printf "runnerPools[]: pool name %q is invalid — the registry grammar is 1-31 chars of [a-z0-9-], alphanumeric at both ends (queue.ValidPoolName)" $pool.name) }}
{{- end }}
{{- if not $gw.baseUrl }}
{{- fail (printf "runnerPools[]: pool %s needs gateway.baseUrl (the pool's regional gateway URL)" $pool.name) }}
{{- end }}
{{- if not $gw.existingSecret }}
{{- fail (printf "runnerPools[]: pool %s needs gateway.existingSecret (a manual k8s Secret carrying the gateway API key)" $pool.name) }}
{{- end }}
{{- /* The pool's sandbox (ADR-162 Q3): runnerPools[].sandbox.enabled, runner.sandbox.enabled when the pool does not spell it. Where it differs from the release-wide flag the pool renders its own literals over the shared ConfigMap's (literal env beats envFrom), so a pool can resolve the kubernetes sandbox for every run without moving every trusted `sandbox:` bot of the release into sibling pods, and a pool can opt out of a release-wide sandbox. */ -}}
{{- $sandbox := include "iterion.poolSandbox" (dict "root" $ "pool" $pool) }}
{{- $releaseSandbox := "" }}
{{- if $.Values.runner.sandbox.enabled }}{{- $releaseSandbox = "true" }}{{- end }}
{{- $ownSandbox := ne $sandbox $releaseSandbox }}
{{- $poolEnv := $pool.env | default dict }}
{{- if $ownSandbox }}
{{- $owned := list "ITERION_SANDBOX_OVERRIDE" "ITERION_SANDBOX_HOST_STATE" }}
{{- if $sandbox }}
{{- /* The opted-in pool also owns the global-default tier: a bot declaring no `sandbox:` block (review-pr declares none) resolves through it, so a `none` there would run every such bot in-pod. */ -}}
{{- $owned = append $owned "ITERION_SANDBOX_DEFAULT" }}
{{- end }}
{{- range $key := $owned }}
{{- if hasKey $poolEnv $key }}
{{- fail (printf "runnerPools[%s].env.%s conflicts with runnerPools[%s].sandbox.enabled, which decides it on this pool — drop the env entry" $pool.name $key $pool.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $sandbox (not $.Values.runner.sandbox.enabled) }}
{{- /* Fail closed until ADR-154's pool shape (#2965) renders what a sandboxed pool needs beside the flag: its own ServiceAccount and Role, the pool label on its siblings, and its standing NetworkPolicy. */ -}}
{{- if $.Values.serviceAccount.create }}
{{- fail (printf "runnerPools[%s].sandbox.enabled: the pool would resolve the kubernetes sandbox where the release does not provision it, and the chart renders the sandbox Role only under runner.sandbox.enabled (runner-rbac.yaml) — the pool runs under the shared ServiceAccount %q, which then holds no grant, so every sandboxed run would fail at its first kubectl apply. The pool's own ServiceAccount and Role are ADR-154 decision 2 (#2965), not rendered yet. Leave the pool's sandbox off until it lands, or sandbox the whole release (runner.sandbox.enabled). The only interim this chart admits — serviceAccount.create=false with the sandbox driver's grants bound to the shared account by hand — hands those grants (every Secret of the namespace, pods/exec on any pod, NetworkPolicy create/delete) to EVERY pod of the release that mounts that account: docs/cloud-deployment.md § Sovereign runner pools says which, and what it costs" $pool.name (include "iterion.serviceAccountName" $)) }}
{{- end }}
{{- if not $.Values.serviceAccount.name }}
{{- fail (printf "runnerPools[%s].sandbox.enabled with serviceAccount.create=false and no serviceAccount.name: the release's pods would run under the namespace's `default` ServiceAccount, so the sandbox driver's grants the interim binds by hand would reach EVERY pod of the namespace that names no account of its own, not only this release's — name the dedicated account those grants are bound to (serviceAccount.name), or leave the pool's sandbox off until #2965" $pool.name) }}
{{- end }}
{{- if $.Values.networkPolicy.enabled }}
{{- fail (printf "runnerPools[%s].sandbox.enabled with networkPolicy.enabled: the release-wide NetworkPolicy selects this pool's runner pods and admits only the server and metrics ports, so a sandbox sibling cannot reach its runner's per-run egress proxy and every sandboxed run times out. The pool's standing policy that admits its own siblings is ADR-154 decision 3 (#2965), not rendered yet: set networkPolicy.enabled=false and bring the pool's policy yourself (docs/cloud-deployment.md § NetworkPolicy egress), or leave the pool's sandbox off" $pool.name) }}
{{- end }}
{{- end }}
---
# One runner Deployment PER sovereign pool (plan v2 D10'): the pod is
# pinned to the pool three ways — ITERION_RUNNER_POOL (the admission
# stamps it checks every delivery against), the pool's JetStream stream
# and DLQ (its only source of deliveries), and its gateway credential.
# The pod carries the gateway credential ONLY IN ITS ENV — it runs
# under the shared runner ServiceAccount, which (like the shared
# runner's) can read the namespace's Secrets for the sandbox reaper
# (ADR-068); that residual is the shared runner's own, not new here.
# No platform LLM secrets, no run-secrets ring key: the run envelope
# is self-contained (P4-b).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iterion.fullname" $ }}-runner-pool-{{ $pool.name }}
  labels:
    {{- include "iterion.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner-pool
    iterion.io/runner-pool: {{ $pool.name }}
spec:
  {{- with $.Values.runner.progressDeadlineSeconds }}
  # Same lame-duck rationale as the shared runner: keep this above
  # terminationGracePeriodSeconds so ArgoCD doesn't mark the rollout
  # degraded while the old pod legitimately drains its in-flight run.
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  # hasKey, not sprig default: default treats 0 as empty, which would
  # make scaling a pool to zero (pausing a team) impossible from values.
  replicas: {{- if hasKey $pool "replicas" }} {{ $pool.replicas }}{{- else }} 1{{- end }}
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: runner-pool
      iterion.io/runner-pool: {{ $pool.name }}
  template:
    metadata:
      labels:
        {{- include "iterion.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: runner-pool
        iterion.io/runner-pool: {{ $pool.name }}
      annotations:
        # Roll the pool's pods when the rendered config changes (the pool
        # shares the server's configmap envFrom; its own env are literal).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $pool.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "iterion.serviceAccountName" $ }}
      {{- if and $ownSandbox (not $sandbox) }}
      # runnerPools[].sandbox.enabled=false under a release-wide sandbox: this
      # pool runs every job in its own pod, while the shared ServiceAccount is
      # bound release-wide to the sandbox Role (runner-rbac.yaml). Nothing on
      # it calls the API — the override disables the sandbox driver and its
      # orphan reaper — so the pod mounts no token a run could read.
      automountServiceAccountToken: false
      {{- end }}
      {{- with $.Values.runner.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml (default $.Values.securityContext $.Values.runner.podSecurityContext) | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Same lame-duck drain contract as the shared runner: SIGTERM lets
      # the in-flight run finish within this window.
      terminationGracePeriodSeconds: {{ $.Values.runner.terminationGracePeriodSeconds | default 90 }}
      containers:
        - name: iterion-runner
          image: {{ include "iterion.runnerPoolImage" (dict "root" $ "pool" $pool) | quote }}
          imagePullPolicy: {{ $.Values.runner.imagePullPolicy | default $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (default $.Values.containerSecurityContext $.Values.runner.containerSecurityContext) | nindent 12 }}
          args:
            {{- toYaml $.Values.runner.args | nindent 12 }}
          env:
            # The pod's own pool identity — the admission stamp it checks
            # every delivery against (msg ≡ doc ≡ pod).
            - name: ITERION_RUNNER_POOL
              value: {{ $pool.name | quote }}
            - name: ITERION_RUNNER_EPOCH
              value: {{ $.Values.config.rollout.runnerEpoch | int64 | quote }}
            - name: ITERION_RUNNER_EPOCH_MISMATCH_DELAY
              value: {{ $.Values.config.rollout.epochMismatchDelay | quote }}
            # The pool's JetStream topology. Literal env beat envFrom, so
            # these override the shared configmap's default stream/DLQ.
            - name: ITERION_NATS_STREAM
              value: {{ printf "ITERION_RUNS_POOL_%s" $pool.name | quote }}
            - name: ITERION_NATS_DLQ_STREAM
              value: {{ printf "ITERION_RUNS_POOL_%s_DLQ" $pool.name | quote }}
            {{- if $sandbox }}
            - name: ITERION_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ITERION_RUNNER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ITERION_RUNNER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- with $.Values.runner.sandbox.scheduling }}
            {{- with .requests }}
            {{- if .cpu }}
            - name: ITERION_SANDBOX_K8S_REQUESTS_CPU
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: ITERION_SANDBOX_K8S_REQUESTS_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- with .limits }}
            {{- if .cpu }}
            - name: ITERION_SANDBOX_K8S_LIMITS_CPU
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: ITERION_SANDBOX_K8S_LIMITS_MEMORY
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- if .spread }}
            - name: ITERION_SANDBOX_K8S_SPREAD
              value: {{ .spread | quote }}
            {{- end }}
            {{- if .podReadyTimeout }}
            - name: ITERION_SANDBOX_K8S_POD_READY_TIMEOUT
              value: {{ .podReadyTimeout | quote }}
            {{- end }}
            {{- end }}
            {{- if $ownSandbox }}
            # runnerPools[].sandbox.enabled (ADR-162 Q3): this pool resolves
            # the kubernetes sandbox where the release does not. Literal env
            # beats the shared ConfigMap's envFrom: the empty override lifts
            # the release's ITERION_SANDBOX_OVERRIDE=none on this pool alone,
            # and host_state is pinned to none as runner.sandbox.enabled pins
            # it release-wide (the driver has no host filesystem to bind).
            - name: ITERION_SANDBOX_OVERRIDE
              value: ""
            - name: ITERION_SANDBOX_HOST_STATE
              value: "none"
            # The global-default tier too: a bot that declares no `sandbox:`
            # block resolves through it, and the shared ConfigMap's
            # config.extraEnv may set it to none for the rest of the release.
            - name: ITERION_SANDBOX_DEFAULT
              value: "auto"
            {{- end }}
            {{- else if $ownSandbox }}
            # runnerPools[].sandbox.enabled=false: this pool opts out of the
            # release's sandbox. The CLI-strength override neutralizes every
            # bot-declared `sandbox:` block on this pool, as the ConfigMap
            # does release-wide when runner.sandbox.enabled is off.
            - name: ITERION_SANDBOX_OVERRIDE
              value: "none"
            {{- end }}
            # The pool's gateway credential (P3's openai_compatible
            # escape hatch): the base URL is configuration, the API key
            # is a manually-managed k8s Secret — never rendered into
            # values. required: a pool without its gateway would admit
            # runs whose every LLM surface then refuses.
            - name: OPENAI_COMPATIBLE_BASE_URL
              value: {{ $gw.baseUrl | quote }}
            - name: OPENAI_COMPATIBLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $gw.existingSecret }}
                  key: {{ $gw.apiKeySecretKey | default "OPENAI_COMPATIBLE_API_KEY" }}
            # The cloud-mode runner validates ITERION_JWT_SECRET at boot:
            # the pool takes that ONE key from the deployment's existing
            # auth Secret, by specific key reference — the ring
            # (ITERION_SECRETS_KEY*) stays out of the pod (P4-b).
            - name: ITERION_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "iterion.fullname" $)) $.Values.secrets.auth.existingSecret }}
                  key: ITERION_JWT_SECRET
            # The authenticated Mongo URI lives in the same auth Secret and
            # the runner needs it to work; the pod's Mongo privileges are
            # the deployment's own (the accepted residual — the pods sit
            # inside the install's network boundary).
            - name: ITERION_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth" (include "iterion.fullname" $)) $.Values.secrets.auth.existingSecret }}
                  key: ITERION_MONGO_URI
            {{- $env := $pool.env | default dict }}
            {{- $pins := list }}
            {{- range $key, $value := $env }}
            {{- if ne $key "ITERION_BOT_VARS_ENV_PINS" }}
            {{- if eq $key "ITERION_SANDBOX_DEFAULT_IMAGE" }}
            {{- /* The pool's own `sandbox: auto` image overrides the ConfigMap's: same digest guard as the shared one. */ -}}
            {{- $_ := include "iterion.pinnedImage" (dict "root" $ "field" (printf "runnerPools[%s].env.ITERION_SANDBOX_DEFAULT_IMAGE" $pool.name) "ref" (toString $value)) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- if regexMatch "^ITERION_[A-Z0-9_]+$" $key }}
            {{- $pins = append $pins $key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range splitList "," (get $env "ITERION_BOT_VARS_ENV_PINS" | default "") }}
            {{- $spelled := trim . }}
            {{- if $spelled }}
            {{- $pins = append $pins $spelled }}
            {{- end }}
            {{- end }}
            {{- if $pins }}
            # The pool's own env block is pinned ahead of the platform
            # bot-vars record (platformcfg.PinnedOverlay): the record tunes
            # the shared fleet, these names are the pool's — a stored model
            # pin for the shared fleet's vendor cannot re-route a pool on a
            # name its block spells. Every ITERION_ name of the block, plus
            # the names a block spells in ITERION_BOT_VARS_ENV_PINS itself
            # (an install that pinned by hand before the chart rendered it):
            # the union, so a name added to the block is pinned the day it
            # lands.
            - name: ITERION_BOT_VARS_ENV_PINS
              value: {{ $pins | uniq | sortAlpha | join "," | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "iterion.fullname" $ }}-config
            {{- if or $.Values.secrets.storage.create $.Values.secrets.storage.existingSecret }}
            - secretRef:
                name: {{ default (printf "%s-storage" (include "iterion.fullname" $)) $.Values.secrets.storage.existingSecret }}
            {{- end }}
          volumeMounts:
            - name: run-iterion
              mountPath: /run/iterion
          resources:
            {{- toYaml (default $.Values.runner.resources $pool.resources) | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ default $.Values.server.metricsPort $.Values.runner.metricsPort }}
              protocol: TCP
          {{- if ($.Values.probes.startup).enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: run-iterion
          emptyDir:
            medium: Memory
      {{- /* The pool inherits the runner's placement knobs: nodeSelector and tolerations as wholes — a pool's own block, even empty, replaces the runner's (hasKey, not sprig default: default reads an empty block as absent, and a sovereign pool could never shed the fleet's selector or its tolerations); affinity and scheduling deep-merged key by key; the pool label joins the selector so each pool spreads its OWN replicas. */ -}}
      {{- $nodeSelector := $.Values.runner.nodeSelector }}
      {{- if hasKey $pool "nodeSelector" }}{{ $nodeSelector = $pool.nodeSelector }}{{ end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := $.Values.runner.tolerations }}
      {{- if hasKey $pool "tolerations" }}{{ $tolerations = $pool.tolerations }}{{ end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $scheduling := mergeOverwrite (deepCopy ($.Values.runner.scheduling | default dict)) (deepCopy ($pool.scheduling | default dict)) }}
      {{- $affinity := mergeOverwrite (deepCopy ($.Values.runner.affinity | default dict)) (deepCopy ($pool.affinity | default dict)) }}
      {{- with (include "iterion.scheduling" (dict "root" $ "component" "runner-pool" "extraLabels" (dict "iterion.io/runner-pool" $pool.name) "scheduling" $scheduling "affinity" $affinity)) }}
      {{- . | trim | nindent 6 }}
      {{- end }}
{{- $pdb := mergeOverwrite (deepCopy ($.Values.runner.pdb | default dict)) (deepCopy ($pool.pdb | default dict)) }}
{{- /* hasKey, not sprig default: default treats false as empty and a pool's `pdb: {enabled: false}` would be ignored. */ -}}
{{- $pdbEnabled := "auto" }}
{{- if hasKey $pdb "enabled" }}{{ $pdbEnabled = $pdb.enabled }}{{ end }}
{{- if include "iterion.pdbWanted" (dict "enabled" $pdbEnabled "replicas" ($pool.replicas | default 1)) }}
---
# A pool guaranteed more than one replica gets the same disruption budget
# as the shared runner: a node drain must not evict every replica of a
# team's pool at once. (pdb.enabled: auto never renders it on a single
# replica, where it would block the drain instead.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iterion.fullname" $ }}-runner-pool-{{ $pool.name }}
  labels:
    {{- include "iterion.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner-pool
    iterion.io/runner-pool: {{ $pool.name }}
spec:
  {{- include "iterion.pdbBudget" $pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: runner-pool
      iterion.io/runner-pool: {{ $pool.name }}
{{- end }}
{{- end }}
