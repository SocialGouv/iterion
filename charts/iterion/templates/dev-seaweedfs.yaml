{{- if (.Values.devStack.seaweedfs).enabled -}}
{{- $sw := .Values.devStack.seaweedfs -}}
{{- $name := printf "%s-seaweedfs" (include "iterion.fullname" .) -}}
{{- if not .Values.secrets.storage.create -}}
{{- fail "devStack.seaweedfs.enabled needs secrets.storage.create=true: the gateway's S3 identity is rendered from secrets.storage.s3AccessKeyId / s3SecretAccessKey so the server, the runner and the store agree on one key pair (dev only — never for production)" -}}
{{- end -}}
{{- if not (regexMatch "^[^@]+@sha256:[0-9a-f]{64}$" ($sw.image | default "")) -}}
{{- fail (printf "devStack.seaweedfs.image must be pinned by digest (<repository>:<tag>@sha256:<64 hex>), got %q" ($sw.image | default "")) -}}
{{- end -}}
{{- $backupImage := .Values.backup.image | default dict -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" ($backupImage.digest | default "")) -}}
{{- fail "devStack.seaweedfs needs backup.image.digest (the pinned rclone of the backup CronJob creates the dev bucket)" -}}
{{- end -}}
# The dev object store (#2084): SeaweedFS in one process — master + volume +
# filer + S3 gateway — the release and digest docker-compose.cloud.yml runs,
# for `task chart:kind`, the cloud-e2e CI job and ad-hoc experiments. Single
# replica, no replication, a fixed identity: never for production, whose
# store is deployed by its own chart (ADR-107). The S3 identity is the chart's
# own dev key pair (secrets.storage.*): no anonymous identity, every request
# to the S3 port is signed. -s3.autoCreateBucket=false: a PUT into a missing
# bucket fails instead of creating it, so a wrong ITERION_S3_BUCKET shows.
# -master.telemetry=false: no anonymous statistics sent to seaweedfs.com.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-s3
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs
type: Opaque
stringData:
  s3.json: {{ toJson (dict "identities" (list (dict "name" "iterion" "credentials" (list (dict "accessKey" .Values.secrets.storage.s3AccessKeyId "secretKey" .Values.secrets.storage.s3SecretAccessKey)) "actions" (list "Admin" "Read" "List" "Tagging" "Write")))) | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs
spec:
  type: ClusterIP
  selector:
    {{- include "iterion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
{{- if ($sw.persistence).enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $sw.persistence.size | default "8Gi" }}
  {{- with $sw.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs
spec:
  replicas: 1
  # One data directory, one writer: never two pods on it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dev-seaweedfs
  template:
    metadata:
      labels:
        {{- include "iterion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dev-seaweedfs
      annotations:
        checksum/s3-identity: {{ printf "%s:%s" .Values.secrets.storage.s3AccessKeyId .Values.secrets.storage.s3SecretAccessKey | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seaweedfs
          image: {{ $sw.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.autoCreateBucket=false
            - -master.volumeSizeLimitMB=1024
            - -master.telemetry=false
            - -volume.max=0
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          # The S3 gateway's own status endpoint, unauthenticated.
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml ($sw.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-identity
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          {{- if ($sw.persistence).enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: s3-identity
          secret:
            secretName: {{ $name }}-s3
---
# The bucket. Nothing in iterion creates its bucket and the gateway refuses
# to (-s3.autoCreateBucket=false), so a post-install / post-upgrade hook
# creates config.s3.bucket with rclone — the backup CronJob's pinned image —
# the way docker/s3-init.sh does for the compose stack: `rclone mkdir` is
# idempotent (an existing bucket exits 0), `rclone size` exits 3 on a bucket
# that is not there, a real read-back. The hook runs after the release's
# resources (with --wait: after they are ready); its loop covers a gateway
# still coming up.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-seaweedfs-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "iterion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dev-seaweedfs-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: s3-init
          image: {{ printf "%s@%s" ($backupImage.repository | default "rclone/rclone") $backupImage.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for i in $(seq 1 60); do
                if rclone lsd s3: >/dev/null 2>&1; then break; fi
                echo "s3-init: waiting for the gateway ($i)"
                sleep 2
              done
              rclone mkdir "s3:${BUCKET}"
              rclone size "s3:${BUCKET}"
              echo "s3-init: bucket ${BUCKET} ready"
          env:
            - name: BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: XDG_CACHE_HOME
              value: /tmp
            - name: RCLONE_CONFIG_S3_TYPE
              value: s3
            - name: RCLONE_CONFIG_S3_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_S3_ENDPOINT
              value: {{ printf "http://%s:8333" $name | quote }}
            - name: RCLONE_CONFIG_S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: RCLONE_CONFIG_S3_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "iterion.fullname" . }}-storage
                  key: ITERION_S3_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "iterion.fullname" . }}-storage
                  key: ITERION_S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end -}}
