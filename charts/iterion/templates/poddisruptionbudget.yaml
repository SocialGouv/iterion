{{- /* The replica count each workload is GUARANTEED: the autoscaler's floor
     when one owns the count, the static value otherwise. iterion.pdbWanted
     renders a budget only above one replica (or when pdb.enabled forces it):
     minAvailable 1 on a single replica refuses every eviction and holds a
     node drain forever. */ -}}
{{- $serverCount := ternary .Values.server.hpa.minReplicas .Values.server.replicas .Values.server.hpa.enabled -}}
{{- if and (eq .Values.mode "cloud") (include "iterion.pdbWanted" (dict "enabled" .Values.server.pdb.enabled "replicas" $serverCount)) -}}
# Keep at least one server pod through voluntary disruptions (node
# drains, cluster upgrades) — without this a drain can take every
# replica down simultaneously and drop the API + webhook intake.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iterion.fullname" . }}-server
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
spec:
  {{- include "iterion.pdbBudget" .Values.server.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
{{- $runnerCount := ternary .Values.runner.keda.minReplicas .Values.runner.replicas .Values.runner.keda.enabled -}}
{{- if and (eq .Values.mode "cloud") .Values.runner.enabled (include "iterion.pdbWanted" (dict "enabled" .Values.runner.pdb.enabled "replicas" $runnerCount)) }}
---
# Same guard for the runner pool. A PDB gates the Eviction API only, so it
# covers a node drain or a cluster upgrade — keeping at least one runner
# serving rather than every run draining at once — and it does NOT cover the
# frequent case: a KEDA scale-down deletes pods directly and never consults
# it. Protecting an in-flight run from THAT is the lame-duck drain's job
# (config.runner.drainMode), not this budget's.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iterion.fullname" . }}-runner
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
spec:
  {{- include "iterion.pdbBudget" .Values.runner.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "iterion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
{{- end }}
