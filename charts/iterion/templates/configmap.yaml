apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iterion.fullname" . }}-config
  labels:
    {{- include "iterion.labels" . | nindent 4 }}
data:
  ITERION_MODE: {{ .Values.mode | quote }}
  ITERION_LOG_FORMAT: {{ .Values.config.log.format | quote }}
  ITERION_LOG_LEVEL: {{ .Values.config.log.level | quote }}
  {{- if eq .Values.mode "cloud" }}
  ITERION_MONGO_URI: {{ .Values.config.mongo.uri | quote }}
  ITERION_MONGO_DB: {{ .Values.config.mongo.database | quote }}
  ITERION_MONGO_EVENTS_TTL_DAYS: {{ .Values.config.mongo.eventsTtlDays | quote }}
  ITERION_NATS_URL: {{ .Values.config.nats.url | quote }}
  ITERION_NATS_STREAM: {{ .Values.config.nats.stream | quote }}
  ITERION_NATS_KV_BUCKET: {{ .Values.config.nats.kvBucket | quote }}
  ITERION_NATS_DLQ_STREAM: {{ .Values.config.nats.dlqStream | quote }}
  ITERION_S3_ENDPOINT: {{ .Values.config.s3.endpoint | quote }}
  ITERION_S3_REGION: {{ .Values.config.s3.region | quote }}
  ITERION_S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  ITERION_S3_USE_PATH_STYLE: {{ .Values.config.s3.usePathStyle | quote }}
  {{- with .Values.config.redis }}
  # --- Valkey/Redis (distributed ephemeral state; HA via Sentinel) ----
  # Non-secret connection coordinates; the password rides the auth secret
  # (ITERION_REDIS_PASSWORD / ITERION_REDIS_SENTINEL_PASSWORD).
  {{- with .url }}
  ITERION_REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .sentinelAddrs }}
  ITERION_REDIS_SENTINEL_ADDRS: {{ . | quote }}
  {{- end }}
  {{- with .masterName }}
  ITERION_REDIS_MASTER_NAME: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  ITERION_RUNNER_WORKDIR: {{ .Values.config.runner.workdir | quote }}
  ITERION_RUNNER_CONCURRENCY: {{ .Values.config.runner.concurrency | quote }}
  ITERION_HEARTBEAT_INTERVAL: {{ .Values.config.runner.heartbeat | quote }}
  ITERION_LOCK_TTL: {{ .Values.config.runner.lockTtl | quote }}
  {{- with .Values.config.runner.drainMode }}
  ITERION_RUNNER_DRAIN_MODE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.runner.drainTimeout }}
  ITERION_RUNNER_DRAIN_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- if .Values.runner.sandbox.enabled }}
  # The kubernetes sandbox driver has no host filesystem to bind, so the
  # default host_state=auto hard-errors ("no host filesystem to bind").
  # Cloud runners pin it to none (docs/sandbox.md) — coupled to
  # runner.sandbox.enabled like ITERION_POD_IP + the sandbox RBAC.
  ITERION_SANDBOX_HOST_STATE: "none"
  {{- else }}
  # Sibling-pod sandboxing is NOT provisioned on this deployment (no sandbox
  # RBAC, no ITERION_POD_IP): neutralize any bot-declared `sandbox:` block at
  # CLI-override strength so runs execute directly in the runner pod — the
  # pod is the isolation boundary and the runner image ships the toolchain
  # (e.g. iterion-runner-devbox). Without this a bot's inline sandbox block
  # (written for local runs) hard-errors the kubernetes driver mid-run.
  ITERION_SANDBOX_OVERRIDE: "none"
  {{- end }}
  {{- if .Values.config.disableAuth }}
  ITERION_DISABLE_AUTH: "true"
  {{- end }}
  {{- if eq .Values.mode "cloud" }}
  # --- Auth (Phase A) ---------------------------------------------
  ITERION_PUBLIC_URL: {{ .Values.config.auth.publicUrl | quote }}
  ITERION_COOKIE_DOMAIN: {{ .Values.config.auth.cookieDomain | quote }}
  ITERION_COOKIE_SECURE: {{ .Values.config.auth.cookieSecure | quote }}
  ITERION_ACCESS_TTL: {{ .Values.config.auth.accessTtl | quote }}
  ITERION_REFRESH_TTL: {{ .Values.config.auth.refreshTtl | quote }}
  ITERION_SIGNUP_MODE: {{ .Values.config.auth.signupMode | quote }}
  {{- if .Values.config.marketplace.enabled }}
  # --- Hosted bot marketplace (public browse/download + submit) ----
  ITERION_CLOUD_MARKETPLACE: "true"
  {{- end }}
  {{- with .Values.config.webpush.subscriber }}
  # --- Browser push notifications (VAPID contact; the keypair lives
  # in the auth secret) --------------------------------------------
  ITERION_WEBPUSH_SUBSCRIBER: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.smtp.host }}
  # --- SMTP (transactional email) ---------------------------------
  ITERION_SMTP_HOST: {{ . | quote }}
  ITERION_SMTP_PORT: {{ $.Values.config.smtp.port | quote }}
  ITERION_SMTP_FROM: {{ $.Values.config.smtp.from | quote }}
  ITERION_SMTP_STARTTLS: {{ $.Values.config.smtp.startTLS | quote }}
  {{- end }}
  {{- with .Values.config.orgDefaults }}
  # --- Org launch limit defaults ----------------------------------
  {{- if .monthlyRunQuota }}
  ITERION_ORG_DEFAULT_MONTHLY_RUN_QUOTA: {{ .monthlyRunQuota | quote }}
  {{- end }}
  {{- if .monthlyCostCapUsd }}
  ITERION_ORG_DEFAULT_MONTHLY_COST_CAP_USD: {{ .monthlyCostCapUsd | quote }}
  {{- end }}
  {{- if .maxConcurrentRuns }}
  ITERION_ORG_DEFAULT_MAX_CONCURRENT_RUNS: {{ .maxConcurrentRuns | quote }}
  {{- end }}
  {{- if .launchRatePerMin }}
  ITERION_ORG_DEFAULT_LAUNCH_RATE_PER_MIN: {{ .launchRatePerMin | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.auth.oidc.google.enabled }}
  ITERION_OIDC_GOOGLE_ENABLED: "true"
  ITERION_OIDC_GOOGLE_CLIENT_ID: {{ .Values.config.auth.oidc.google.clientId | quote }}
  {{- end }}
  {{- if .Values.secrets.auth.oidc.github.enabled }}
  ITERION_OIDC_GITHUB_ENABLED: "true"
  ITERION_OIDC_GITHUB_CLIENT_ID: {{ .Values.config.auth.oidc.github.clientId | quote }}
  {{- with .Values.config.auth.oidc.github.ungrantedPolicy }}
  # "refuse" (default) | "submitter" — admit a GitHub login matching no
  # allow-listed team as a teamless marketplace-submitter instead of rejecting.
  ITERION_OIDC_GITHUB_UNGRANTED_POLICY: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.auth.oidc.generic.enabled }}
  ITERION_OIDC_GENERIC_ENABLED: "true"
  ITERION_OIDC_GENERIC_ISSUER_URL: {{ .Values.config.auth.oidc.generic.issuerUrl | quote }}
  ITERION_OIDC_GENERIC_CLIENT_ID: {{ .Values.config.auth.oidc.generic.clientId | quote }}
  ITERION_OIDC_GENERIC_DISPLAY_NAME: {{ .Values.config.auth.oidc.generic.displayName | quote }}
  ITERION_OIDC_GENERIC_SCOPES: {{ .Values.config.auth.oidc.generic.scopes | quote }}
  {{- end }}
  {{- with .Values.config.auth.oauthForfait.anthropicClientId }}
  ITERION_OAUTH_FORFAIT_ANTHROPIC_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.auth.oauthForfait.codexClientId }}
  ITERION_OAUTH_FORFAIT_CODEX_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
