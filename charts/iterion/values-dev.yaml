# Local-development values: the chart's own dev Mongo and SeaweedFS
# (devStack.*, pinned by digest like docker-compose.cloud.yml) plus the
# NATS sub-chart, so `helm install iterion ./charts/iterion -f
# values-dev.yaml` brings up a fully self-contained cloud-mode stack. Use
# this for `task chart:kind` and ad-hoc experiments. **Not for production**
# — the credentials are hard-coded and every store is single-replica.

mode: cloud

server:
  replicas: 1
  hpa:
    enabled: false  # disable HPA in dev, predictable single-pod

runner:
  enabled: true
  replicas: 1
  keda:
    enabled: false  # KEDA optional; the dev stack doesn't ship it

ingress:
  enabled: false  # rely on `kubectl port-forward svc/iterion 4891`

config:
  log:
    format: human
    level: debug
  mongo:
    # Empty: resolved to the dev Mongo's Service and replica set
    # (devStack.mongodb) whatever the release name — iterion.mongo.uri in
    # _helpers.tpl.
    uri: ""
    database: iterion
  nats:
    url: nats://iterion-nats:4222
  s3:
    # Empty: resolved to the dev SeaweedFS gateway (devStack.seaweedfs)
    # whatever the release name — iterion.s3.endpoint in _helpers.tpl.
    endpoint: ""
    region: us-east-1
    bucket: iterion-artifacts
    usePathStyle: true

secrets:
  llm:
    create: true
    # Override at install time: `--set secrets.llm.anthropicApiKey=...`
    anthropicApiKey: ""
    openaiApiKey: ""
  storage:
    create: true
    # The dev S3 identity — the pair docker-compose.cloud.yml uses. The dev
    # SeaweedFS renders its identity file from these two values.
    s3AccessKeyId: iterion-dev
    s3SecretAccessKey: iterion-dev-secret
  auth:
    # Dev-only: bake fixed JWT/master keys so port-forward + curl
    # works out of the box and the seal/unseal across server +
    # runner agrees. Production should manage the secret out-of-
    # band via `existingSecret` and rotate via `helm upgrade`.
    create: true
    # 48-byte deterministic dev string (base64 of "dev-jwt-secret-please-rotate-...").
    jwtSecret: "ZGV2LWp3dC1zZWNyZXQtcGxlYXNlLXJvdGF0ZS1iZWZvcmUtcHJvZHVjdGlvbi11c2U="
    # 32-byte deterministic dev key (base64 of "dev-secrets-key-rotate-in-prod!!").
    secretsKey: "ZGV2LXNlY3JldHMta2V5LXJvdGF0ZS1pbi1wcm9kISE="
    bootstrapAdminEmail: "admin@dev.local"

nats:
  enabled: true
  # Pin the sub-chart's resource names so config.nats.url above resolves
  # regardless of the Helm release name: without it `helm install ci
  # ./charts/iterion -f values-dev.yaml` names the StatefulSet `ci-nats`
  # while the server still reads `nats://iterion-nats:4222` → NXDOMAIN →
  # /readyz never goes green.
  fullnameOverride: iterion-nats
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        size: 1Gi

# The dev stores: the chart's own Mongo (a one-member replica set) and
# SeaweedFS, the releases and digests of docker-compose.cloud.yml
# (values.yaml § devStack).
devStack:
  mongodb:
    enabled: true
  seaweedfs:
    enabled: true
