apiVersion: v2
name: iterion
description: |
  Build, run and orchestrate agentic AI workflows — Kubernetes deployment.
  Server (HTTP API + studio) plus an optional runner pool that
  pulls work from NATS JetStream and persists state to MongoDB + S3.
type: application
# Chart `version` and `appVersion` are both kept in sync with package.json
# by scripts/sync-chart-version.sh (release-it after:bump hook) so that
# the OCI artifact published by .github/workflows/release.yml carries the
# same semver as the iterion binary it deploys. Consumers pin via
# `helm install ... --version <semver>`.
version: 4.7.1
appVersion: "4.7.1"
home: https://github.com/SocialGouv/iterion
sources:
  - https://github.com/SocialGouv/iterion
maintainers:
  - name: SocialGouv
keywords:
  - workflow
  - orchestration
  - llm
  - iterion
icon: https://raw.githubusercontent.com/SocialGouv/iterion/main/build/appicon.png

# The one sub-chart left, the official NATS chart: values-dev.yaml turns it
# on so `task chart:kind` is self-contained, values-prod.yaml leaves it off
# so operators bring their own managed NATS. The dev Mongo and object store
# are the chart's own templates (values.yaml § devStack), pinned by digest.
dependencies:
  - name: nats
    version: 2.14.x
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
