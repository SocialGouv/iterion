# Default values for the iterion Helm chart. Documented inline so an
# operator skimming this file can size a deployment without cross-
# referencing the README. values-dev.yaml / values-prod.yaml override.

image:
  repository: ghcr.io/socialgouv/iterion
  tag: ""              # defaults to .Chart.AppVersion when empty
  # Wins over `tag` when set (`sha256:…`). Prefer it whenever `tag` is a
  # MOVING tag (edge/main/latest): a tag is resolved per pod at that pod's own
  # start time, so a publish landing mid-rollout splits one ReplicaSet across
  # two builds, and a later HPA/KEDA scale-up from an existing ReplicaSet pulls
  # whatever the tag means then — no rollout entry, no signal. A digest is what
  # makes "one ReplicaSet = one build" true, which the rollout epoch assumes.
  # Cost: each deploy becomes an explicit digest bump instead of a rollout
  # restart. Note this pins the SHARED image only: `runner.image` below is
  # empty by default and falls back to this same reference, so a runner pool
  # given its own image must be pinned there too.
  # See docs/cloud-deployment.md#pinning-the-image.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Server (HTTP API + studio) ---------------------------------
server:
  replicas: 1
  # Full surge keeps the current serving capacity while the new ReplicaSet
  # becomes ready. It is a capacity/SLO aid; the runner epoch is the safety
  # invariant under HPA/KEDA proportional scaling.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  # Cloud-mode HTTP entry point — `iterion server` (T-30). Reads
  # ITERION_MODE + ITERION_MONGO_URI / ITERION_NATS_URL / ITERION_S3_*
  # from envFrom so no extra args are needed for the cloud wiring.
  #
  # Leave command empty so the image's ENTRYPOINT (`iterion`) stays
  # active. In Kubernetes `command:` overrides ENTRYPOINT (unlike
  # docker-compose where it overrides CMD), so passing ["server"]
  # would make kubelet exec a binary named `server` that doesn't
  # exist in the image. The args list below is appended to the
  # ENTRYPOINT, yielding `iterion server --port 4891 --bind 0.0.0.0`.
  command: []
  args:
    - "server"
    - "--port"
    - "4891"
    - "--bind"
    - "0.0.0.0"
  port: 4891
  metricsPort: 9090
  # k8s hard bound before SIGKILL. Must cover the whole exit sequence:
  #   probes.preStopDelaySeconds
  #   + config.server.shutdownDelay
  #   + config.server.shutdownTeardown
  # With the defaults: 0 + 5 + 30 = 35s, inside 60. Raise this whenever you
  # widen any of the three.
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  # PriorityClass of the server pods (empty = the cluster default). Give the
  # platform pods a class ABOVE the run pods: a sandboxed run that bursts is
  # then preempted before the server or a runner is.
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # Keep the replicas apart (#2012). The chart renders a podAntiAffinity
  # term and a topologySpreadConstraint from the server's OWN selector
  # labels — never typed by hand, so the selector cannot name a label the
  # pods do not carry: that dead-selector class is what `task chart:check`
  # (internal/rendergate) refuses, after ovh-prod's valkeyha held its three
  # replicas on three nodes by luck alone. antiAffinity: soft (preferred,
  # the default — a one-node cluster still schedules), hard (required — a
  # replica with no free node stays Pending), none. topologyKey is the node
  # label both are spread over.
  scheduling:
    antiAffinity: soft
    topologyKey: kubernetes.io/hostname
    # The spread constraint over the same key: maxSkew 1 and ScheduleAnyway
    # (soft) by default; DoNotSchedule makes it hard; enabled: false drops it.
    spread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
  # Free-form affinity merged OVER the generated one, key by key: an
  # operator's nodeAffinity is added, an operator's podAntiAffinity is
  # merged with the generated term. scheduling.antiAffinity: none renders
  # this block alone.
  affinity: {}
  # The PodDisruptionBudget. enabled auto (default): rendered only when the
  # server is guaranteed more than one replica — replicas > 1, or the HPA's
  # minReplicas > 1 when the HPA owns the count — because minAvailable 1 on
  # a single replica refuses every eviction and holds a node drain forever;
  # true / false force it either way. One of minAvailable / maxUnavailable
  # (maxUnavailable wins when set).
  pdb:
    enabled: auto
    minAvailable: 1
    maxUnavailable: ""
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# --- Runner (workflow execution pool) -------------------------------
# The runner pool consumes the shared JetStream durable. KEDA may scale old
# and new ReplicaSets proportionally during a rollout, so rollout correctness
# comes from config.rollout.runnerEpoch rather than replica ordering.
runner:
  enabled: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  # Same rationale as server.command above: keep command empty so the
  # image's `iterion` ENTRYPOINT runs and `args` becomes the subcommand.
  command: []
  args: ["runner"]
  # image (optional, full "repo:tag") overrides the shared iterion.image for the
  # RUNNER pods only — e.g. ghcr.io/socialgouv/iterion-runner-devbox:edge, the
  # devbox-first-class runner where bots `devbox run` the target repo's toolchain
  # (cross-language/version). Empty = the shared iterion.image (server + runner
  # identical, today's behaviour).
  image: ""
  imagePullPolicy: ""
  # podSecurityContext / containerSecurityContext override the shared
  # .Values.securityContext / .Values.containerSecurityContext for the RUNNER
  # only. The devbox runner image runs as uid 1000 (Nix store owned by `devbox`),
  # so set runAsUser/runAsGroup/fsGroup: 1000 when using it. Empty = inherit the
  # shared context.
  # PriorityClass of the runner pods (empty = the cluster default). Same
  # rule as server.priorityClassName: the runner outranks the run pods it
  # starts, so a bursting sandbox never evicts the process that owns its run.
  priorityClassName: ""
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  # Same knobs as server.scheduling, on the runner's own labels: soft
  # anti-affinity + a soft spread by default, so a KEDA-grown pool fills the
  # nodes evenly instead of piling on the one that holds the image. hard
  # leaves the replicas beyond the node count Pending — an operator's
  # explicit choice.
  scheduling:
    antiAffinity: soft
    topologyKey: kubernetes.io/hostname
    spread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
  affinity: {}
  # The runner's PodDisruptionBudget, same rule as server.pdb: auto renders
  # it when the pool is guaranteed more than one replica (replicas > 1, or
  # keda.minReplicas > 1 when KEDA owns the count). A KEDA pool whose floor
  # is one replica gets none — the budget would hold every node drain while
  # protecting a pod KEDA deletes without asking anyway.
  pdb:
    enabled: auto
    minAvailable: 1
    maxUnavailable: ""
  # Prometheus metrics port for the runner. Defaults to the same
  # value as server.metricsPort to keep dashboards uniform; override
  # if your platform requires distinct ports per component.
  metricsPort: 9090
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  # k8s hard bound before SIGKILL. In lame-duck drain mode
  # (config.runner.drainMode=complete) the pod finishes its in-flight run
  # within this window, so it is raised well above the 30s default. Keep it
  # >= config.runner.drainTimeout + a couple of minutes of checkpoint margin.
  terminationGracePeriodSeconds: 29100 # 8h5m
  # A lame-duck rollout stays "Progressing" until the last old pod drains
  # (possibly hours). Raise the Deployment progress deadline above the grace
  # period so k8s/ArgoCD don't flag the rollout degraded while the new pods
  # already serve. 0 disables the deadline entirely.
  progressDeadlineSeconds: 30000
  keda:
    enabled: false
    minReplicas: 1
    maxReplicas: 50
    cooldownPeriod: 60
    pollingInterval: 5
    lagThreshold: 1
    # JetStream consumer name. Override per-release in multi-tenant
    # installs to avoid collision when several iterion releases share
    # a NATS cluster.
    consumerName: iterion-runners
    # JetStream account the stream lives in. Required by the KEDA scaler;
    # single-tenant JetStream (no NATS accounts) uses the global default "$G".
    account: "$G"
  # Sandbox toggle for the runner pod. When enabled, the chart
  # provisions the additional RBAC the runner needs to create per-run
  # sibling pods via the kubernetes sandbox driver (Phase 5 V1).
  # Disabled by default for clusters that haven't opted into the
  # sandbox feature; turn on per-environment via values-prod.yaml.
  sandbox:
    enabled: false
    # Scheduling policy the kubernetes sandbox driver stamps on every
    # per-run sandbox pod, rendered as LITERAL env on the runner PodTemplate
    # (a pod from an old ReplicaSet keeps the policy it was rolled out
    # with). Empty = not rendered: the pods request nothing and, on a
    # multi-node cluster, pile onto the node that already holds the image
    # (measured: 5 of 6 runs on one 8-core worker at 89 % CPU). Set at
    # least the requests on any multi-node cluster — e.g. requests cpu "2",
    # memory "4Gi", spread "hostname" — and bump config.rollout.runnerEpoch
    # with the rollout like any runner change. Requests and limits are
    # Kubernetes quantities, podReadyTimeout a Go duration; the runner
    # refuses to start on a malformed one. See docs/sandbox.md
    # § "Scheduling: requests and node spread".
    scheduling:
      requests:
        cpu: ""
        memory: ""
      limits:
        cpu: ""
        memory: ""
      # "" or "none" = no spread constraint; "hostname" = soft spread across
      # nodes; or a prefixed label key every node carries.
      spread: ""
      # How long a run waits for its pod to be Ready, a Go duration ("" =
      # the driver's default, 10m). The wait absorbs scheduling — a cluster
      # autoscaler adding a node takes minutes — a fresh node's CNI setup
      # and the image pull; a cap shorter than their sum kills runs whose
      # container was about to start.
      podReadyTimeout: ""
  # --- Persistent build cache (warm runner pods) --------------------
  # A bot's verify gate re-clones the target repo per run into an
  # ephemeral workdir, so a fresh/scaled-up runner pod otherwise
  # re-downloads Go modules and recompiles from cold every time (the
  # dominant cost seen in live runs). Enabling this mounts a shared RWX
  # volume for GOMODCACHE + GOCACHE so every pod starts warm.
  #
  # accessModes MUST be ReadWriteMany when >1 replica (KEDA/replicas):
  # the Go module cache is read-mostly and the build cache is
  # content-addressed + concurrency-safe, so pods share one warm volume.
  # storageClass must provide RWX and honour fsGroup (OVH:
  # openebs-nfs-hspeed). The Nix toolchain store (/nix) is intentionally
  # NOT cached here — it is baked warm in the runner image; a shared RWX
  # live /nix risks store-DB corruption across the fleet, so its
  # scale-up warm-fix is a binary-cache substituter (ADR), not a mount.
  cache:
    enabled: false
    # existingClaim: use a pre-created PVC instead of the chart's own.
    existingClaim: ""
    # storageClass: leave "" to use the cluster default (must be RWX for
    # multi-replica). On OVH set openebs-nfs-hspeed.
    storageClass: ""
    accessModes:
      - ReadWriteMany
    size: 20Gi
    mountPath: /cache

# --- Sovereign runner pools (D10') ----------------------------------
# One runner Deployment PER entry, consuming that pool's JetStream
# topology (ITERION_RUNS_POOL_<name> + its DLQ + its durable consumer,
# created by the server's registry reconciler). The pool pod carries
# the pool's gateway credential ONLY in its env — never the platform
# LLM secrets, never the run-secrets ring key (the run envelope is
# self-contained since P4-b). It runs under the shared runner
# ServiceAccount, whose sandbox-reaper role can read the namespace's
# Secrets; scoping that is a follow-up. Its admission is the pod's
# own: a delivery whose msg ≡ doc ≡ pod stamps do not all name THIS
# pool is parked on the pool's DLQ, never executed. The name MUST
# match a pool registered in the server's runner-pool registry
# (PUT /api/admin/runner-pools) — the deployment without its registry
# entry consumes a stream nobody writes and only the registry
# reconciler creates.
#
# The gateway is the pool's escape hatch (P3): every LLM surface of a
# pool run resolves to `openai_compatible/<model>` through THIS
# regional gateway. baseUrl is configuration; the API key lives in a
# manually-managed k8s Secret (the chart never renders credentials).
#
# Every entry requires: name, gateway.baseUrl, gateway.existingSecret.
# Optional: replicas (default 1), image (default the shared runner
# image), resources (default runner.resources), podAnnotations,
# gateway.apiKeySecretKey (default OPENAI_COMPATIBLE_API_KEY), env (literal
# pod env — the pool's routing dials, ITERION_VIBE_MODEL_* and friends),
# nodeSelector, tolerations, affinity, scheduling and pdb (each merged over
# the runner's block key by key; the pool spreads its OWN replicas — its
# selector carries the pool label — and gets a budget once it is guaranteed
# more than one replica).
# Every ITERION_ name in `env` is also rendered into ITERION_BOT_VARS_ENV_PINS:
# the platform bot-vars record (PUT /api/admin/settings/bot-vars) does not
# reach a pinned name, so a model pin stored for the shared fleet never
# re-routes a pool on a name its block spells — spell EVERY dial the bots
# the pool runs read (docs/sovereign-pools.md lists review-pr's). Tune a
# pool here, in GitOps, not in the record. A block that spells
# ITERION_BOT_VARS_ENV_PINS itself (an install whose chart predates the
# rendering) gets the union of its spelling and its ITERION_ names.
runnerPools: []
#  - name: honorabilite
#    replicas: 1
#    # image: "ghcr.io/socialgouv/iterion-runner-devbox:v3.246.0"
#    gateway:
#      baseUrl: "https://<regional-gateway>"
#      existingSecret: "iterion-pool-honorabilite-gateway"
#      # apiKeySecretKey: "OPENAI_COMPATIBLE_API_KEY"
#    env:
#      ITERION_VIBE_MODEL_CLAUDE: "openai_compatible/<gateway model id>"
#      ITERION_VIBE_PROVIDER_CLAUDE: "openai_compatible"

# --- HTTP exposure --------------------------------------------------
service:
  type: ClusterIP
  port: 4891
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    # Long-running WS for the run console (event stream + log tail).
    # 1h matches the value the cloud-ready plan §H pins for parity
    # with the Cloud Run / nginx defaults seen in production.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: iterion.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- Mode + cloud dependencies --------------------------------------
mode: cloud   # "local" or "cloud"; "local" pins replicas=1 + PVC

config:
  # Arbitrary extra environment variables rendered into the shared
  # ConfigMap (both the server and runner deployments envFrom it).
  # e.g. TZ: Europe/Paris — the binary embeds the IANA tz database
  # (time/tzdata), so TZ works even in tzdata-less images.
  # NOT the place for generation-sensitive runner settings (the epoch, the
  # sandbox pod scheduling policy): those are literal PodTemplate values —
  # see runner.sandbox.scheduling.
  extraEnv: {}
  log:
    format: json
    level: info
  rollout:
    # Immutable per-ReplicaSet generation fence. Release A ships wire v12 at
    # epoch 0; Release B raises this to 1. Thereafter increment it for every
    # runner-code rollout. Never roll back to a lower value: restore an older
    # image as a new Helm release with a higher epoch.
    runnerEpoch: 0
    # Delayed-Nak interval for a future-epoch message. Keep
    # delay × (MaxDeliver-1) above the cold readiness time of the new fleet.
    epochMismatchDelay: 2m
  mongo:
    uri: ""           # required when mode=cloud, unless devStack.mongodb resolves it or the auth Secret carries ITERION_MONGO_URI
    database: iterion
    eventsTtlDays: 90
  nats:
    url: ""           # required when mode=cloud and nats.enabled=false
    # KEDA NATS JetStream scaler scrapes the HTTP monitoring endpoint
    # (default port 8222), NOT the client URL above. Format is
    # "host:port" — no scheme. When using the bundled nats sub-chart,
    # the default `<release>-nats:8222` works out of the box; with
    # external NATS, override here.
    monitoringEndpoint: ""
    stream: ITERION_RUNS
    kvBucket: iterion-run-locks
    dlqStream: ITERION_RUNS_DLQ
    # Clustered NATS needs this >1 for data-HA; CreateOrUpdateStream migrates existing streams in place at the next server boot.
    streamReplicas: 1
  s3:
    endpoint: ""      # required when mode=cloud, unless devStack.seaweedfs resolves it
    region: us-east-1
    bucket: iterion-artifacts
    usePathStyle: true
  server:
    # Lame-duck window on SIGTERM: /readyz answers 503 for this long while
    # the listener still accepts, giving the endpoints controller time to
    # pull the pod out of the Service before its socket closes. Otherwise
    # every rolling deploy and every HPA scale-down refuses connections
    # still routed to the terminating pod (502s, dropped forge webhooks).
    # Must fit inside server.terminationGracePeriodSeconds alongside the
    # teardown below — see the arithmetic there. Set "0s" to disable the
    # window; an EMPTY value does not disable it, it just omits the env var
    # and lets the binary's own 5s default apply.
    shutdownDelay: 5s
    # What the process spends AFTER that window: draining in-flight runs,
    # then letting in-flight HTTP requests finish. This is the ceiling on
    # an operator's own work — a large artifact upload or a streamed
    # response is cut when it expires — so raise it for a deployment that
    # serves long requests (and raise the grace period to match).
    shutdownTeardown: 30s
  runner:
    workdir: /tmp/iterion
    concurrency: 1
    heartbeat: 20s
    lockTtl: 60s
    # Graceful drain on ANY SIGTERM — a KEDA scale-down (the frequent one:
    # the pool shrinks whenever the queue drains, and the ReplicaSet picks a
    # victim without knowing which pods are busy), a node drain, or a deploy.
    # "complete" (default, lame-duck): stop claiming new runs but let the
    # in-flight one FINISH before exiting, so none of the three interrupts
    # anything. "interrupt": cancel + checkpoint for auto-resume on a healthy
    # pod. drainTimeout is the lame-duck ceiling; keep
    # runner.terminationGracePeriodSeconds >= it + checkpoint margin.
    drainMode: complete
    drainTimeout: 8h
    # Redelivery delay when a runner rejects a queue message whose schema
    # version it does not speak (mixed fleet during a rolling schema bump).
    # Must cover a rolling restart of this Deployment — with drainMode:
    # complete that can exceed the 30s default, so raise it (e.g. 2m) on
    # fleets with long in-flight runs. See docs/cloud-queue-schema-rollout.md.
    schemaMismatchDelay: 30s
  # --- Valkey/Redis (distributed ephemeral state) ------------------
  # Required for multi-replica servers: shares forge OAuth/CSRF state,
  # board-MCP run tokens and auth rate-limit across pods. Empty (the
  # default) → in-memory stores (single replica). Provide EITHER a
  # single-node url OR sentinelAddrs+masterName (HA). The password rides
  # the auth secret (ITERION_REDIS_PASSWORD / ITERION_REDIS_SENTINEL_PASSWORD).
  redis:
    url: ""           # redis://host:6379 (dev/single node)
    sentinelAddrs: "" # comma-separated host:port sentinels (HA)
    masterName: ""    # Sentinel master name (with sentinelAddrs)
  # --- Hosted bot marketplace (cloud) ------------------------------
  # Enables the hosted bot registry: public browse + .botz download +
  # authenticated submit/moderation, and seeds the image's bots/ catalog
  # as built-in entries at startup. Maps to ITERION_CLOUD_MARKETPLACE.
  marketplace:
    enabled: false
  # --- Auth disable (DEV / smoke tests ONLY) -----------------------
  # When true, the server synthesizes a super-admin identity for
  # every request and skips JWT verification — no login flow needed.
  # Equivalent to ITERION_DISABLE_AUTH=true. Never enable in
  # production; multi-tenant scoping is bypassed too. Used by the
  # cloud-e2e smoke test to launch a tool-only run without going
  # through the full auth bootstrap.
  disableAuth: false
  # --- Auth (cloud only) -------------------------------------------
  # Public, non-secret half of the multitenant auth surface. The
  # secret half (JWT signing key, AES master key, OIDC client
  # secrets) lives in secrets.auth below.
  auth:
    # Externally reachable origin used to build OIDC redirect URIs
    # and as the CookieDomain default. Empty disables OIDC.
    publicUrl: ""
    # Send browser DOCUMENT navigations arriving on any other host to
    # publicUrl, so a deployment published under several names keeps one
    # browser origin for cookies, storage, CSP and the WS origin gate.
    # /api/ is never redirected: webhooks, the CLI and the SDK go on
    # answering on every host. Off by default — publicUrl is also set on
    # deployments legitimately reached by another name (port-forward,
    # in-cluster DNS), and those must not be moved.
    canonicalRedirect: false
    # Cookie scoping. Empty = host-only (recommended). Set when
    # the SPA is served from a different host than the API.
    cookieDomain: ""
    cookieSecure: true
    # Access JWT lifetime. Refresh rotates on every use and lives
    # for refreshTtl.
    accessTtl: 15m
    refreshTtl: 720h
    # invite_only (default) requires an invitation token to register.
    # open allows public sign-up — provisions a personal team per
    # new user.
    signupMode: invite_only
    oidc:
      google:
        clientId: ""           # secret lives in secrets.auth.oidc.google
      github:
        clientId: ""
        # "" (chart omits it → server default "refuse") | "refuse" | "submitter".
        # "submitter" admits a GitHub login matching no allow-listed team as a
        # teamless marketplace-submitter instead of rejecting it.
        ungrantedPolicy: ""
      generic:
        issuerUrl: ""          # https://idp.example/realms/iterion
        clientId: ""
        displayName: "SSO"
        scopes: "openid,email,profile"
    # OAuth-forfait (Phase D) — public client ids the server uses
    # to refresh user-supplied Claude Code / Codex subscription
    # tokens. Empty disables refresh of that kind (the user must
    # re-paste credentials.json on expiry).
    oauthForfait:
      anthropicClientId: ""
      codexClientId: ""
  # --- SMTP (cloud only) -------------------------------------------
  # Transactional email: invitations + self-service password reset.
  # host empty = email disabled (the SPA hides forgot-password; reset
  # tokens land in server logs via the log-mailer fallback). Relay
  # credentials live in secrets.smtp below.
  smtp:
    host: ""
    port: 587
    # Envelope + header sender, e.g. "iterion <no-reply@example.org>"
    from: ""
    startTLS: true
  # --- Browser push notifications (web push) -----------------------
  # The VAPID contact push services may use to reach the operator
  # (mailto: or https: URL). The keypair itself is a secret —
  # secrets.auth.webpush below.
  webpush:
    subscriber: ""
  # --- Org launch limit defaults (cloud only) ----------------------
  # Platform-wide caps applied to orgs without a per-org override
  # (PATCH /api/admin/orgs/{id}). 0 = unlimited.
  orgDefaults:
    monthlyRunQuota: 0
    monthlyCostCapUsd: 0
    maxConcurrentRuns: 0
    launchRatePerMin: 0

# --- Secrets --------------------------------------------------------
# Two opt-in patterns:
#   1. secrets.create=true: the chart renders a Secret with the
#      values you pass below. Convenient for local dev but
#      discouraged in prod (state in values.yaml or in the release
#      record).
#   2. secrets.existingSecret=<name>: reference an out-of-band
#      Secret you manage with sealed-secrets / external-secrets /
#      etc. The chart wires SecretKeyRef envFrom entries.
secrets:
  llm:
    create: false
    existingSecret: ""
    anthropicApiKey: ""
    openaiApiKey: ""
  # Optional forfait credentials, managed MANUALLY in k8s (never created or
  # sealed by the chart): e.g. CLAUDE_CODE_OAUTH_TOKEN so claude_code runs
  # execute on the subscription instead of a metered API key. When enabled it
  # is mounted as an OPTIONAL envFrom on the runner (optional: true — a missing
  # secret never blocks startup). Enable per-environment; the secret's contents
  # are set by hand (kubectl), not by values.
  forfait:
    enabled: false
    existingSecret: ""
  # SMTP relay credentials (host/port/from live in config.smtp).
  smtp:
    create: false
    existingSecret: ""
    username: ""
    password: ""
  storage:
    create: false
    existingSecret: ""
    s3AccessKeyId: ""
    s3SecretAccessKey: ""
  # Auth bundle for the cloud-mode HTTP API + JWT signing + BYOK seal.
  # The server pod refuses to boot in cloud mode without
  # ITERION_JWT_SECRET + ITERION_SECRETS_KEY set (override only via
  # ITERION_DISABLE_AUTH=true for smoke tests). Production should keep
  # create=false and reference an externally-managed Secret holding
  # the same env-var keys. Only rendered + wired in when mode=cloud.
  auth:
    create: false
    existingSecret: ""
    # Base64 of >=32 random bytes — `openssl rand -base64 48`
    jwtSecret: ""
    # Base64 of exactly 32 random bytes — `openssl rand -base64 32`
    secretsKey: ""
    # Run-bundle key rotation ring: "id=base64,id=base64", with
    # secretsKeyID naming the key new bundles seal under (docs/
    # secrets-reference.md § rotating the run-bundle key).
    secretsKeys: ""
    secretsKeyID: ""
    # The authenticated Mongo URI the RUNNER works under (the server's
    # own comes from the same place). Rendered into the auth Secret when
    # set; runnerPools[] pods take it from here by key reference — a
    # pool pod without it fails at boot (the runner cannot reach the
    # store). Leave empty on installs whose auth Secret is
    # externally managed and already carries it.
    mongoURI: ""
    # First-boot super-admin email. When set on an empty users
    # collection the server creates the account with a one-time
    # random password printed at WARN level in the boot logs. Leave
    # empty in established deployments where users have been
    # provisioned through the admin UI.
    bootstrapAdminEmail: ""
    # HMAC key signing outbound run-completion callbacks
    # (X-Iterion-Signature). Read by both the server and the runner;
    # empty = unsigned callbacks. `openssl rand -base64 32`.
    completionWebhookSecret: ""
    # VAPID keypair for browser push notifications — generate ONCE with
    # `iterion server webpush-keys` and never rotate casually (rotation
    # invalidates every registered browser subscription; users must
    # re-enable notifications in their settings). Empty = feature off.
    webpush:
      vapidPublicKey: ""
      vapidPrivateKey: ""
    # OIDC client_secrets. Public client_ids and discovery URLs go
    # into the ConfigMap (values.config.auth.oidc) — the secret
    # bundle only carries the secrets that should not be readable
    # by anyone with `kubectl get configmap`.
    oidc:
      google:
        enabled: false
        clientSecret: ""
      github:
        enabled: false
        clientSecret: ""
      generic:
        enabled: false
        clientSecret: ""

# --- Local-mode persistence (PVC for .iterion/) ---------------------
# Only consulted when mode=local. Cloud mode keeps state in Mongo+S3
# and the pod is ephemeral.
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""    # empty → cluster default
  annotations: {}

# --- Health probes --------------------------------------------------
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    # Must exceed the server's per-dependency ping deadline (1s, applied
    # concurrently across Mongo/NATS/S3/Valkey — so the handler answers in
    # max(ping), not sum). At 1s the kubelet would abort a probe that was
    # about to report a merely-degraded backend, failing readiness on the
    # exact case the critical/degraded split exists to survive.
    timeoutSeconds: 3
    failureThreshold: 3
  # The boot budget. A cloud server connects NATS + S3 + Mongo and ensures
  # the schema of ~28 collections BEFORE it binds its listener, so on a cold
  # or contended Mongo it can outlast the liveness budget above (10s + 3×10s)
  # and get killed into a CrashLoop that reads like an application bug. While
  # a startupProbe is failing, liveness and readiness are suspended — so this
  # threshold, not theirs, is what bounds a slow boot.
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30 # 30 × 5s = 150s of boot budget
  # Belt-and-braces for ingress controllers that route to the Service
  # ClusterIP instead of to endpoints (nginx `service-upstream`), where the
  # readiness flip alone does not divert traffic. The hook runs BEFORE
  # SIGTERM, so its seconds ADD to config.server.shutdownDelay — hence the
  # default of 0 (the in-process window is the primary mechanism). If you
  # raise it, raise server.terminationGracePeriodSeconds by as much.
  preStopDelaySeconds: 0

# --- Pod security ---------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}     # IRSA / Workload Identity annotations land here

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # node_modules + git index need rw

# --- Network policy (egress allowlist) ------------------------------
networkPolicy:
  enabled: false
  egress:
    # Chart users add their LLM endpoints, Mongo URI host, NATS host,
    # S3 endpoint host here. Empty list = deny-all egress (rarely
    # what you want; opt-out of NetworkPolicy entirely instead).
    extraAllow: []

# --- Observability --------------------------------------------------
metrics:
  enabled: false
  podMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}
  # Alert packs: the control-plane starter (DLQ depth, heartbeat errors,
  # orphan recoveries, launch denials, webhook throttling), the backup
  # rules when backup.enabled, and the datastore pack below. Needs the
  # PrometheusRule CRD (prometheus-operator).
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # The datastore alert pack (#2014): the replicated stores the
    # deployment depends on. In the cloud deployment they are OTHER charts
    # (MongoDB, NATS, valkey, SeaweedFS), so this block names them for YOUR
    # cluster. A rule per store on kube_statefulset_status_replicas_ready <
    # kube_statefulset_replicas (kube-state-metrics, present on any
    # kube-prometheus) and on container restarts; then the store-level
    # signals, each from the exporter that produces it; and, per exporter
    # family, an absent() rule so a signal nobody scrapes pages instead of
    # staying silent. These stores survive ONE loss (quorum of three,
    # replication 002), not two: the alert must arrive during the first.
    datastores:
      enabled: false
      # The namespace the stores run in; "" = the release namespace.
      namespace: ""
      # StatefulSets to watch. match is a regex on the StatefulSet name
      # (and, with -[0-9]+ appended, on its pod names).
      statefulsets:
        - name: mongodb
          match: ".*-mongodb"
        - name: nats
          match: ".*-nats"
        - name: valkeyha
          match: ".*-valkeyha(-.*)?"
        - name: valkeyfiler
          match: ".*-valkeyfiler(-.*)?"
        - name: seaweedfs
          match: ".*-seaweedfs-(master|volume|filer|s3)"
      # How long a replica may be missing before the page (a rolling
      # update dips below the count for a minute or two).
      forDuration: 10m
      # Container restarts per hour, per pod, before the warning.
      restartsPerHour: 3
      # How long a store's series may be absent before the absent-signal
      # warning: the exporter is not scraped, or not deployed at all.
      absentFor: 30m
      # Each family: the PromQL label matchers (inside the braces) that
      # pick that exporter's series in your cluster — a pod regex, a job
      # name — joined with namespace=<namespace>.
      valkey:
        # valkeyfiler, the SeaweedFS filer store: redis_exporter series
        # (Valkey supported). connected_slaves below this number on the
        # primary, or an AOF write that failed.
        enabled: true
        selector: 'pod=~".*valkeyfiler.*"'
        minConnectedReplicas: 2
      seaweedfs:
        # Volumes registered across the volume servers below this number,
        # no master leader, volumes under their replica placement.
        enabled: true
        volumeSelector: 'pod=~".*seaweedfs-volume.*"'
        masterSelector: 'pod=~".*seaweedfs-master.*"'
        minVolumes: 4
      mongodb:
        # mongodb_exporter's replSetGetStatus view: a member unhealthy or
        # out of the set (neither PRIMARY, SECONDARY nor ARBITER), no
        # primary at all.
        enabled: true
        selector: 'pod=~".*mongodb.*"'

# --- Off-cluster copy of the artifact bucket (#2013) -----------------
# One CronJob per tier copies config.s3.bucket — the artifact store the
# server and runner write — to an S3-compatible bucket OUTSIDE the cluster
# (another region, another provider) with rclone, the tool and the pinned
# image of the production migration (ADR-107). Replication inside the
# cluster protects a disk or a node, not a deletion, a bad deleteGone or
# the loss of the cluster: this does. Off by default — the destination and
# its credentials are the operator's (docs/cloud-backup.md § Blob backup);
# no copy exists until they are set, and the render refuses an enabled
# backup without them.
backup:
  enabled: false
  image:
    repository: rclone/rclone
    # Required, the digest alone (sha256:…): a moving tag would make every
    # nightly copy a surprise. rclone 1.71.1, the release of the migration.
    digest: sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
    pullPolicy: IfNotPresent
  # The destination bucket. endpoint / region / provider / bucket are
  # configuration; the credentials come ONLY from an existing Secret (never
  # a value) carrying the two keys named below — sealed-secrets,
  # external-secrets, a Secret applied by hand.
  destination:
    endpoint: ""
    region: ""
    bucket: ""
    # rclone's S3 provider name: AWS, Ceph, Minio, Other (OVH, SeaweedFS…).
    provider: Other
    forcePathStyle: true
    existingSecret: ""
    accessKeyIdKey: RCLONE_CONFIG_DST_ACCESS_KEY_ID
    secretAccessKeyKey: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
  # One CronJob per tier. sync keeps <bucket>/<prefix>/ a mirror of the
  # source and moves what the sync would delete or overwrite under
  # <prefix>-deleted/<timestamp>/ (rclone --backup-dir): a deletion in the
  # source stays recoverable for keepDays. snapshot copies the whole bucket
  # under <prefix>/<timestamp>/, a dated full copy kept keepDays. Every run
  # ends with `rclone check` against the copy it made (checkArgs) — the Job
  # is red when a source object is missing from the destination — and
  # maxAgeHours is the staleness the alert pages on.
  tiers:
    - name: daily
      schedule: "30 2 * * *"
      mode: sync
      prefix: current
      keepDays: 7
      maxAgeHours: 36
    - name: weekly
      schedule: "0 3 * * 0"
      mode: snapshot
      prefix: weekly
      keepDays: 35
      maxAgeHours: 192
    - name: monthly
      schedule: "0 4 1 * *"
      mode: snapshot
      prefix: monthly
      keepDays: 400
      maxAgeHours: 800
  # rclone check flags: --one-way (every source object must exist at the
  # destination), --size-only (a multipart ETag is not an MD5).
  checkArgs: ["--one-way", "--size-only"]
  # Flags appended to every copy (--transfers, --bwlimit, --checksum…).
  extraArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # A copy running longer than this (seconds) is failed; 0 = no deadline.
  activeDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  podAnnotations: {}

# --- Sub-chart (off by default; values-dev.yaml turns it on) ---------
nats:
  enabled: false
  config:
    jetstream:
      enabled: true

# --- Dev-only in-cluster datastores (values-dev.yaml turns them on) ----
# First-party, single-replica stores for `task chart:kind`, the cloud-e2e CI
# job and ad-hoc experiments — the releases and digests of
# docker-compose.cloud.yml. Never for production (no replication, fixed dev
# identities); the cloud deployment's stores are their own charts.
devStack:
  mongodb:
    # A ONE-member replica set (change streams and transactions need a
    # replica set; failover does not exist here), initiated by its own
    # readiness probe like the compose stack, no authentication. Resolves
    # config.mongo.uri when that is empty.
    enabled: false
    image: mongo:8.3@sha256:44dce4b1688969ff3fdbfc438fd6113f734140ad96e3639ef17ee26a162dfb58
    replicaSetName: rs0
    resources: {}
    # emptyDir by default (the data lives as long as the pod); a PVC on request.
    persistence:
      enabled: false
      size: 8Gi
      storageClass: ""
  seaweedfs:
    # The object store, as in prod: SeaweedFS in one process (master +
    # volume + filer + S3 gateway). Its S3 identity is the chart's dev key
    # pair (secrets.storage.s3AccessKeyId / s3SecretAccessKey, create=true
    # required); the bucket config.s3.bucket is created by a post-install
    # hook with the backup CronJob's pinned rclone. Resolves
    # config.s3.endpoint when that is empty.
    enabled: false
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    resources: {}
    # emptyDir by default (the data lives as long as the pod); a PVC on request.
    persistence:
      enabled: false
      size: 8Gi
      storageClass: ""
