name: adr-cartograph
display_name: Adry
icon: 🗺️
version: 2.0.0
## 2.0.0 — RADICAL SIMPLIFICATION (ADR-058 minimal-framing). The
## deterministic machinery is KEPT (scan_adrs inventory + cache,
## survey_code read-only decision/gap survey, build_manifest differ that
## re-globs the live adr_dir each pass); the alternating cross-family
## review/fix relay (alt round_robin → reviewer_claude/gpt →
## streak_check + accumulators → fix_claude/gpt → prepare_commit →
## commit_changes → detect_changes → enforce_fix_scope) is replaced by
## ONE adaptive campaign agent that authors/refreshes ADRs one commit at
## a time in stride, files the handoff issues itself, and converges via
## deterministic gates (scope containment vs the run base + build gate +
## mechanical coverage ≥ target). 15 nodes → 10; runs in worktree: auto
## now that commits land in stride. See
## docs/references/productive-session-patterns.md.
description: |
  Observes the code-as-implemented and produces committable ADR markdown
  (Nygard format) in docs/adr/ — one capable agent over a deterministic
  drift manifest, minimal framing. Every ADR is a "constat" recording
  the decision the code embodies (decision-vs-mechanic three-check dam
  against ADR-spam), authored one `docs(adr):` commit at a time in
  stride. Also surfaces feature-completeness gaps.

  Idempotent: the manifest re-globs the live ADR directory each pass,
  so a converged tree yields no drift, no commits, and a fast exit; the
  sha-cache pre-verifies unchanged entries across runs.

  Read-only on code — a deterministic scope gate fails the run if
  anything outside docs/adr/*.md changed. Handoffs: files
  type:adr-rechallenge issues (aged ADRs) and type:feature-gap issues
  (medium/high gaps) to the board inbox.
when_to_use: |
  Run after a code-mutating session (feature_dev, branch-improve-loop,
  bmady) lands non-trivial decisions, before a release, or on a nightly
  cadence to keep docs/adr/ honest against the code. Use
  --var rechallenge_after_days=90 to invite re-challenge on ADRs older
  than that.
author: SocialGouv (devthejo) — adr-cartograph/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}
  issue_id: "{{issue.identifier}}"

invocations:
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: adry, aliases: [adr-cartograph], scope: any, min_replier_role: developer }
  - kind: schedule
    mode: board
    schedule: { suggested_cron: "0 5 * * 1" }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [scope_notes]
  hidden: [bundle_self_path]
