name: feature-dev
display_name: Featurly
icon: 🛠️
version: 2.3.0
## 2.3.0 — cross-model peer-reviewed plan phase (ADR-091): when a second
## model family is credentialed (plan_review auto→on, resolved at launch
## by pkg/reviewtopology), the plan is authored (claude, read-only),
## critiqued by a peer (claw + openai/gpt-5.6-sol), and revised by the
## SAME author session before the campaign implements. Off = the v2
## plan-in-stride shape unchanged. plan_review_policy wait|skip governs
## mid-run peer unavailability (wait = usage-window retry; skip = the
## reviewer's `action: skip` fallback route, loudly stamped).
## 2.2.0 — Persy, the perseverance-coach supervisor: a concurrent LLM
## watcher on the campaign node (docs/supervisors.md) that pushes back on
## premature infeasibility verdicts, expedient shortcuts, and unbanked
## state under budget pressure — give-up markers pre-seeded via the DSL
## `monitors:` list (armed from the first event) — plus a static
## PERSISTENCE clause in the campaign contract. Skippable per run with
## --supervisors off.
## 2.0.1 — ADR-082 Phase 2 (sandbox-by-default): removed the `sandbox:`
## block — isolation is the platform's job; gh/glab move to the bot's
## pinned devbox.json.
## 2.0.0 — RADICAL SIMPLIFICATION (ADR-058 minimal-framing). Replaces the
## v1 staged pipeline (plan → act → simplify session chain → alt condition
## router → reviewer_claude/reviewer_gpt → streak_check → fix_claude/
## fix_gpt → prepare_commit → commit_changes, 13 nodes) with ONE adaptive
## `campaign` agent given the feature prompt + a standing-autonomy
## contract (living todo of slices, one verified commit per slice in
## stride, ADR-authoring obligation, G5 baseline, findings→board
## handoff), a deterministic build/test gate, a bounded continuation
## loop, and the opt-in PR tail. The review_mode/mono_family topology
## vars are retired (ADR-052 no longer applies — no reviewer nodes). git
## is the durable state. See docs/references/productive-session-patterns.md.
description: |
  Autonomous end-to-end feature development — one capable agent, its
  natural flow, minimal framing. Takes a `feature_prompt` input; the
  campaign explores, builds a living todo of slices, and ships the
  feature one verified semantic commit at a time (tests included, ADRs
  authored for non-trivial decisions). A deterministic build/test gate +
  bounded continuation loop re-poke it until the feature is complete and
  the tree is green; an opt-in tail pushes the series and opens the
  pull request (PR; merge request on GitLab).
when_to_use: |
  Use when an item can be phrased as one feature with a clear,
  externally-visible "done" state (new endpoint, UI affordance, CLI
  flag). Also the route for "build a new bot" work — point
  feature_prompt at the new .bot file to author.
author: SocialGouv (devthejo) — feature-dev/main.bot
schema_version: 1

dispatch_vars:
  feature_prompt: |-
    {{issue.title}}

    {{issue.body}}
  ## Board/comment-dispatched runs open a pull request at the end
  ## and post the URL back onto the source issue. CLI runs keep the
  ## defaults (open_mr=false) so a plain local run just commits.
  open_mr: "true"
  source_issue_ref: "{{issue.id}}"

## Forge access for the PR push + creation + the issue back-link.
## The auto-provisioner requests these scopes and binds the connection
## token under `forge_token` (cross-ref main.bot `secrets: { forge_token }`).
forge:
  ## issue_labeled: labeling an issue (e.g. "implement") launches featurly
  ## to implement it and open a PR back-linked to the issue.
  ## pull_request_comment: the on-demand `/featurly <prompt>` slash command.
  events: [issue_labeled, pull_request_comment]
  token_scopes:
    pull_requests: write     # open the PR
    repository: write         # push the branch
    issues: write             # post the PR URL back onto the source issue
  secret: forge_token

invocations:
  - kind: command
    mode: board
    args_var: feature_prompt
    command: { name: featurly, aliases: [feature-dev], scope: any, min_replier_role: maintainer, opens_mr: true }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [feature_prompt]
  hidden: [source_issue_ref]
