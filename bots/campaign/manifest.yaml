name: campaign
display_name: Campy
icon: 🧭
version: 0.1.3
## 0.1.3 — finalize runs the repository's suites the contract declares
## (`suites:`, read the way modernize's lot_verify reads them) once on the
## final tree, reports them in the handoff, and requalifies a blocked lot only
## when its gate AND the suites are green there. Every command runs under the
## wall lot_verify gave it — a blocked lot's gate its lot's gate_timeout_s, the
## oracle and the suites the longest wall of any lot, the steward's rebaseline
## acts the lot's — instead of a fixed hour; a command past its wall is a red
## the handoff names, and output that is not UTF-8 is read with replacement
## characters: both crashed the node, which then wrote no handoff. A plan
## finalize cannot read is said in the handoff and the notice instead of
## counting as zero lots; a wall the steward cannot read is an escalation
## (`refused_unreadable_wall`), and a plan that is not a mapping
## `plan_unreadable` instead of a crash. finalize judges the committed tree as
## lot_verify does — the plan read at HEAD; index flags, every untracked file,
## submodules and replace refs counted — and runs the blocked lots' gates,
## then the suites, then the oracle, the tree measured again after the suites
## and HEAD re-read before the oracle — finalize has no next pass — each lot
## reading a shared run against its own wall, to the millisecond. Ids are held
## to be keys; the counter-test's writes are restored, green or red; commands
## run in a process group of their own, killed whole past their wall. The
## handoff and journal commits take their own files only; the notice and the
## commit subject carry the suites' verdict.
## 0.1.2 — preflight, the steward's observed writes and finalize no longer count
## iterion's `.claude/` scaffold as work in flight, and the steward's revert
## leaves that tree alone (#1364).
## 0.1.1 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks written inside two prompts (3 in all) now reach the model as blank
## lines instead of being folded away by the profile-1 lexer. No
## instruction changed.
description: |
  Supervises a WHOLE modernisation programme, lot after lot, by running the
  modernize bot as a subbot in a bounded loop — and holding the separation
  of powers a human supervisor held before it existed. Progress is judged by
  git, never by what a run says of itself: a child run that did not move
  HEAD landed nothing, and two still runs in a row end the campaign.

  The supervisor is DETERMINISTIC: not one LLM node of its own.
  Intelligence lives in the child bots, judgement lives in gates. Its
  steward half executes ledger re-baseline requests if and only if the
  observed reference diff equals the announced set exactly, with the full
  mutation counter-test replayed on the committed tree behind every act —
  a red counter-test unwinds the act. Contract extensions (a lot the worker
  added or reshaped in the plan) fall under a configured governance:
  accepted in flight and listed at the head of the final handoff (default),
  or paused for human approval every time. Other escalations either pause
  the run (interactive) or accumulate into the handoff (default) — and the
  campaign always ends on a committed handoff plus a human review node,
  with blocked lots requalified against the final tree.
when_to_use: |
  Use to carry a WHOLE programme unattended once its two prerequisites
  exist: a `.modernize/plan.yaml` contract and a behavioural net under
  `.golden-master/` (verify-oracle.sh). One `iterion run` then plays lot
  after lot where a human would have relaunched modernize by hand, judged
  progress in git, executed announced re-records between runs, and kept the
  journal.

  Do NOT use it to run a single lot (run modernize directly), to build the
  net (golden-master's job), or to decide WHAT to modernise — the programme
  is a human decision recorded in the contract, and this bot's whole
  authority over it is measuring whether it advances.
author: SocialGouv (devthejo) — campaign/main.bot
category: steer
tags: [programme]
schema_version: 1

launch:
  primary: [governance, escalation, max_lots, plan_path]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.141.0"
