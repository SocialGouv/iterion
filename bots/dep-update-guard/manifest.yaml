name: dep-update-guard
display_name: Vetty
icon: 💂
version: 2.7.0
## 2.7.0 — a lost alignment no longer merges as a clean bump. commit_check
## reads `align.applied` alongside the shas and routes the contradiction —
## align claimed edits, the head did not move — to a fifth verdict,
## `hold_lost_alignment`, blocking in the gate table and refused by
## arm_automerge. An unmoved head has two opposite causes ("nothing to
## align" and "the alignment vanished") and the shas alone cannot separate
## them; the second happens whenever a run dies between align and commit,
## since the runner re-clones on every claim while the checkpoint still
## replays applied=true. Cost of learning it: SocialGouv/iterion#400 merged
## an otel bump without the breaking-change fix this bot had written.
## 2.6.5 — Revi hardening of the loop-back: budget 2h → 4h/$25 (a
## fix_verify cycle re-runs verify_build+verify_run, 30–50m each on the
## measured heavy case — without the raise heavy bumps would trade
## hold_unstable for BUDGET_EXCEEDED); verify_build gains an input schema
## so the feedback wiring is compile-checked. rc=4 deliberately does NOT
## loop back: it is a DELTA check whose baseline swallows first-pass
## leftovers on retry (the loop would permanently defeat the gate), and
## its remedy — commit the regen output — belongs to the alignment, not
## to the verify script.
## 2.6.4 — the drift-gate precheck LOOPS BACK instead of discarding the
## run: rc=3 (verify.sh missing a CI-enforced drift gate) now re-enters
## verify_build with the exact rejection as feedback (bounded ×2, else →
## hold as before). Twice in one day the aligner's correct migration was
## thrown away because the precheck fired at verdict time — an authorship
## defect is now self-healed in-loop, and §1b is spelled repo-wide (never
## scoped out by bump relevance).
## 2.6.3 — verify.sh mirrors CI's exact strictness (skill §1c). Three
## consecutive re-audits of one PR produced three DIFFERENT authored
## verify.sh defects (env-dependent test, missing §1b drift gate, then
## eslint failed on 534 pre-existing warnings / 0 errors while CI was
## green): the aligner's work was discarded each time by a verify that
## disagreed with the repo's own definition of green. The skill + prompt
## now pin the litmus: no exit-relevant line without the CI step that
## reds on it.
## 2.6.2 — the escalate node could never fire: its llm half passed a bare
## "claude-opus-5" to the direct generation path, which requires
## provider/model-id — every needs_decision bump crashed the run instead of
## escalating (first exercised live 2026-08-04 on a plugin-react major).
## 2.6.1 — budget 75m → 2h: 75m killed the 15-module go workload at its
## LAST node (audit 5m + align 25m + verify 43m = 73m, dead at the commit
## with everything green behind it). The duration cap is a runaway guard,
## not a performance target; $20 stays the real spend bound.
## 2.6.0 — land on merge-queue repos, survive the heavy case. (a)
## `arm_automerge` arms FIRST (enablePullRequestAutoMerge — "merge when
## ready" on queue repos, so a queue-protected base enqueues instead of
## hitting the queue's direct-merge rejection); a queue refusal falls back
## to enqueuePullRequest pinned to the audited sha, and only a no-queue
## CLEAN refusal takes the pinned direct merge. (b) Budget 40m/$15 →
## 75m/$20: the clean npm re-audit already ran ~30m, and a 15-module go
## group with a needed alignment died mid-audit at 40m in production —
## with a required gate context, that left the PR silently unmergeable.
## 2.1.0 — classify, gate, arm. (a) The bump classifier only knew package
## manifests, so a PR moving a base-image digest, a devbox pin, a task-runner
## tool or a composite action matched nothing — and did not stop, because
## "no file changed" and "no manifest matched" were the same flag. Those runs
## reached the auditor with an EMPTY diff and came back "safe": a façade on a
## diff nobody read (3 of 4 open Renovate PRs on the first repo tried). The
## list now covers them, a content pass catches custom-manager pins on any
## filename, and when nothing matches `no_manifest` widens the scope to the
## full diff instead of handing over nothing. An unresolvable base likewise
## degrades loudly rather than reading as "nothing to do". (b) The verdict
## becomes a MERGE GATE: a commit status carrying it, via the server's
## publish endpoint (a run's forge_token can never post one). The state is a
## table over the verdict the graph already computed and fails closed on
## anything unexpected. `gate_context` is a var so several bots fill ONE
## required check, each for the PRs it owns. (c) `arm_automerge` (opt-in,
## default off): on a green verdict WITH a landed green gate, ask the forge
## to merge once ITS OWN required checks pass, or — when the forge already
## reports the PR clean, the state where it refuses to arm — merge the exact
## audited commit. Vetty never merges PAST a check: the immediate-merge
## endpoint is deliberately unreachable and the merge is pinned to the sha
## the gate landed on. (d) Skills gain
## the dependencies that are not packages (container digests, Nix pins, Helm
## charts, pinned Actions) and the bundle ships a devbox project for crane,
## since the sandbox image has no registry client.
##
## 2.0.0 — ADR-058 calibrated pass. The v1 `validate` agent (an LLM
## re-running the build and SELF-REPORTING stable:true) is replaced by
## the deterministic verify_build/verify_run gate shared with the other
## v2 bots — the REAL exit code of an out-of-tree verify.sh is now the
## only path to commit (fail-closed when no script was produced). The
## read-only security_audit DELIBERATELY stays a separate stage from the
## mutating align: that separation is a security property (the only
## agent exposed to hostile package content before mutation is
## authorized has no write tools, behind a deterministic verdict gate),
## not over-framing. align gains the G5 pre-existing-failure protocol;
## the unused pr_review_mode var is dropped.
description: |
  Reactive security + alignment guard for automated dependency-update
  PRs (Dependabot / Renovate). Triggered per PR, on the bot's own
  branch, Vetty: (1) audits the bump for supply-chain risk — known
  malware, typosquats, compromised-maintainer signals, and CVEs
  introduced vs resolved; (2) aligns the consuming code to any
  breaking change (a JS/TS lib API, Helm chart values, a Go module,
  …); (3) proves reliability through a DETERMINISTIC build/test gate
  (the real exit code of the repo's own commands — the only path to
  commit); (4) commits the alignment back onto the PR branch and posts
  a complete review comment with the verdict and evidence; and (5)
  escalates to a human when a structuring architectural decision is
  required. It never merges past a check: unless auto-merge arming is
  explicitly enabled, the merge stays a human call.

  Stack-agnostic by construction: the per-ecosystem scanner and
  build/test knowledge lives in the skills (package-managers,
  dependency-pr-guard), and one adaptive agent reads them and adapts
  to whatever repo the PR targets; deterministic gates verify the
  audit ran and the build is green before anything is committed.
when_to_use: |
  Use to guard a repository's automated dependency-update PRs. Enable
  it on a repo via the studio Integrations flow with author filtering
  to the dependency bots — it then reacts to each Dependabot/Renovate
  PR, posts a security + alignment verdict, and commits any code
  alignment onto the PR branch. Not for human PRs (use Revi /
  review-pr), and not for proactively opening update PRs (that is
  Renovacy / secured-renovacy).
author: SocialGouv (devthejo) — bots/dep-update-guard/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}

# Forge-access requirements for the studio Integrations auto-provisioner.
# Advisory + discovery-time — the runtime does not read this; pkg/forge
# reads it to compute the webhook events, request the token scopes, and
# build the matching webhooks.Config (incl. the author allowlist).
forge:
  events: [pull_request, pull_request_comment]  # PR open → guard ; /vetty note → re-run
  token_scopes:
    pull_requests: write     # post the review comment
    repository: write        # push the code alignment onto the PR branch
    statuses: write          # post the merge-gate commit status carrying the
                             # verdict (GitHub App perm "Commit statuses: Read
                             # and write"). Declaring it also tells the
                             # provisioner this bot can be a REQUIRED check, so
                             # the repo's webhook re-reviews on every push —
                             # a gate that does not follow the head SHA blocks
                             # the PR it guards.
  secret: forge_token
  webhook:
    # React ONLY to the dependency bots, never human PRs. Maps to
    # webhooks.Config.AuthorAllowlist via the orchestrator.
    #
    # The leading "*" is a suffix wildcard. Self-hosting Renovate/Dependabot
    # under an org GitHub App is the usual way to make their PRs trigger CI
    # (a GITHUB_TOKEN-authored PR does not), and doing so RENAMES the bot —
    # "acme-renovate[bot]" instead of "renovate[bot]". Matching the family
    # keeps those repos covered without naming any one organisation's App.
    author_allowlist:
      ["dependabot[bot]", "*dependabot[bot]", "renovate[bot]", "*renovate[bot]"]
    # These authors are MINE against any bot co-enabled on the same repo: a
    # general reviewer must not also review the PRs Vetty already guards.
    # Provisioning materialises this into the other bots' author denylist, so
    # a reviewer's manifest never has to know Vetty exists.
    author_scope: exclusive
    launch_vars:
      post_to_board: "false"
  rationale: |
    Vetty reads the PR's dependency bump, audits it for supply-chain
    risk, aligns consuming code, commits the alignment onto the PR
    branch, and posts a verdict comment. /vetty in a note re-runs it.

# Invocations: how Vetty can be triggered (typed routing contract).
invocations:
  - kind: forge
    mode: direct
    forge: { event: pull_request, actions: [opened, reopened] }
  - kind: command
    mode: direct
    command: { name: vetty, scope: pr, disambiguator: when_args_empty }

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [pr_url]
  hidden: [pr_author]
