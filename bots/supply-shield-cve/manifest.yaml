name: supply-shield-cve
display_name: Vulny
icon: 🚨
version: 0.1.5
## 0.1.4 — `${BUNDLE_SKILLS_DIR}` is constrained absolute at launch and
## re-checked by each reader that joins a skill name onto it, so it can be
## neither empty nor relative.
## 0.1.3 — the machine-readable `iterion:` data blocks are read from the
## engine-owned copy of the bundle's skills (`${BUNDLE_SKILLS_DIR}`) instead of
## `<workspace>/.claude/skills/`, which the audited checkout can write.
## 0.1.2 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside six prompts (33 in all) now reach the models
## as blank lines instead of being folded away by the profile-1 lexer.
## No instruction changed.
## 0.1.1 — ADR-082 Phase 2 (sandbox-by-default): sandbox block reduced to
## the sec-image pin + forge-token env passthrough (Phase 3 moves tokens to
## file secrets); claude install gate and ~/.claude mount removed.
description: |
  Global supply-chain CVE shield. PR / push-driven, diff-scoped CVE
  sibling of supply-shield (Shieldy): same pipeline, but the analysis
  axis is KNOWN VULNERABILITIES, not malware. It inspects only the
  dependency versions a change adds or upgrades (it diffs the changed
  lockfiles), matches each `(ecosystem, name, version)` against the
  advisory databases via a universal lockfile CVE floor (trivy fs +
  osv-scanner, no install needed) plus the per-ecosystem SCA scanners
  (npm audit / pip-audit / govulncheck), validates each advisory
  against the resolved version (affected range / fixed version / Go
  reachability) with an LLM reviewer, and reports confirmed CVEs back
  onto the PR (merge request on GitLab) via the native forge API
  (sticky comment, inline
  review, SARIF / code-scanning) and the kanban board. A deterministic
  coverage gate hard-fails when the CVE floor did not run so a missing
  scanner never reads as "0 CVEs found".

  Cross-run memory: verdicts are cached as `kind: cve` lines with a
  short TTL + `advisory_db_date`, because a clean-today version can gain
  a CVE tomorrow as advisories land. Point `cache_path` at
  `$HOME/.iterion/security-cache/packages.jsonl` for host-wide dedup.
when_to_use: |
  Use to gate dependency changes on a PR / push for KNOWN CVEs
  (vulnerable transitive/direct pins, advisories with an available fix).
  Diff-scoped by default; pass scope_mode=full for a whole-tree CVE
  baseline. Reports back on the forge and the board; does not fix. For a
  MALWARE-focused gate use the companion bot supply-shield (Shieldy).
author: SocialGouv (devthejo) — bots/supply-shield-cve/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}
    {{issue.body}}

invocations:
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: cve, aliases: [supply-shield-cve, shield-cve], scope: any, min_replier_role: developer }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [base_ref, pr_ref]
  hidden: [forge_marker]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  ## The floor `[matching: ...]` asks for (parser.VarMatchingSince, via
  ## bundle's syntax-floor table): below it the engine does not know the
  ## form and refuses the FILE as a parse error rather than the bundle as
  ## an unmet requirement. C252 asks for it; `cmd/release-floors` moves it
  ## at the cut.
  iterion: ">= 3.186.0"
