name: branch-improve-loop
display_name: Billy
icon: 🌿
version: 1.5.0
## 1.5.0 — the plan-phase budget guard reads the run itself. ONE `compute`
## (`plan_budget_gate`) compares `run.elapsed_seconds` / `run.cost_usd`
## against `run.max_duration_seconds` / `run.max_cost_usd` — the caps IN
## FORCE, after any `--max-duration` / `--max-cost-usd` override, the
## recipe, the platform ceiling and any live raise_budget. Gone with it:
## the two mirror vars (`budget_max_duration_minutes` /
## `budget_max_cost_usd`, which drifted from the `budget:` block in
## silence), `plan_scope_probe`'s self-measured `started_epoch`, and the
## `plan_cost_probe` relay whose nil-safe per-node cost sum the run's own
## figure supersedes. Both refusals are now NAMED fail nodes, so the code
## reaches the RUN (`failure_code` / `error`) instead of only the node
## output: `plan_exhausted` (PLAN_BUDGET_EXHAUSTED, **resumable** — widen
## the caps and resume, and the guard is re-evaluated rather than the plan
## phase re-paid) and `workspace_not_a_repo` (WORKSPACE_NOT_A_REPO,
## terminal — a launch to fix, not a budget).
## 1.4.0 — the plan phase runs by default on every deployment: `plan_review`
## gates ONLY the cross-model peer review (the plan_topology gate no longer
## skips planning when it resolves off); the new `plan_phase` (on|off) is
## the phase's own switch, and the campaign receives the authored triage
## stamped with its provenance (`plan_provenance`, relayed through
## plan_cost_probe/plan_budget_gate). `workspace_probe`, a deterministic
## entry precondition, refuses a launch whose workspace_dir is absent or
## not a git repository, OR whose base_ref resolves nowhere / shares no
## history with HEAD (typed WORKSPACE_NOT_A_REPO) before any LLM node
## spends — base_ref resolved as the bare name, then
## refs/remotes/origin/<base_ref> (a cloud PR checkout carries a
## non-default base only as a remote-tracking ref), never fetched;
## plan_scope_probe measures the diff against the same resolved base. Persy, the
## perseverance-coach supervisor on the campaign node + the contract's
## PERSISTENCE clause (fleet-wide, from feature-dev 2.2.0).
## 1.3.0 — plan-phase budget guard (native:695): a production run on a
## +3870/-273 diff spent the planning chain (plan -> plan_review ->
## plan_revise) for 150 min / $8.59 and never reached `campaign`. New
## `plan_scope_probe` (deterministic) captures the diff footprint + a
## large-diff classification + the chain's wall-clock start; `plan_gate`
## now also bypasses `plan_revise` on a large diff (not just a skipped
## peer); `plan_cost_probe` (nil-safe compute) sums the phase's own LLM
## spend; `plan_budget_gate` (deterministic, the sole choke point before
## `campaign`) compares real elapsed time + spend against
## `plan_budget_ratio` (default 0.3) of the run's ceilings and routes to a
## typed, early failure instead of letting `campaign` start on whatever
## budget the plan phase left behind — guaranteeing `campaign` at least
## (1-ratio) of the run's budget whenever it does start. `plan`/
## `plan_review` read a `git diff --stat` footprint instead of the full
## diff above `plan_large_diff_lines` (default 1500 added lines). See
## docs/bot-runs/branch-improve-loop.md.
## 1.2.1 — plan_review_policy defaults to "skip": the cross-model plan peer
## is an optional enrichment, and the Anthropic family alone must always
## suffice to fix a branch. A dead/parked peer (401 credential, shut forfait
## window, provider outage) completes plan_review with the `_skipped` stamp
## and the campaign proceeds, instead of parking the run — a fixer invoked
## on a PR that waits on an OPTIONAL reviewer holds the PR hostage. `wait`
## remains the per-run opt-in for the deliberate-spend posture.
## 1.1.1 — an advisory block before the report (`Fit` / `Rot` / `Ratchet`,
## the shape whole-improve-loop already carries): the last of the three asks
## for the cheap deterministic check that would have caught the issue just
## fixed, landed in the same commit or a follow-up one, NEVER by amending a
## commit already banked (the branch may be pushed). A check that can fail on
## code the branch did not touch goes in the summary instead. A check it
## declines is not itself a remaining issue, so it stays out of
## `issues_remaining` — but a fix shipped with no test at all still is one. A
## check landed by an earlier pass is not re-opened as a weak test — that relay
## is what fails to converge. Advisory only, and no new termination-contract field:
## the gate stays `verify_run.passed ∧ branch_clean ∧ review.clean`.
## See docs/improvement-ratchet.md.
## 1.1.0 — the operator picks where they sit in the loop (`pilot`: end reviews
## the result, middle arbitrates the plan before any edit), and the bot
## answers the review, and speaks for the head it pushes. Returns a
## `finding_ledger` (per finding id: fixed / refused-with-argument / deferred),
## rendered as a table on the PR and handed to the next review as pushback so a
## contested finding is not re-raised for free. The verdict comment becomes a
## DETERMINISTIC node (no LLM turn, server-side posting credential) that also
## carries the merge-gate status — a push moves the head, and a status left on
## the old one leaves the required check absent, which blocks the PR silently.
## The gate is a COUNT and is never green on an unresolved finding: a refusal
## is an argument for a human, never a way past the check.
## 1.0.1 — ADR-082 Phase 2 (sandbox-by-default): removed the `sandbox:`
## block — isolation is the platform's job; gh/glab move to the bot's
## pinned devbox.json.
## 1.0.0 — RADICAL SIMPLIFICATION (mechanism change, ADR-058). Replaces the v1
## chunked cross-family review loop (~11 nodes: plan_chunks → alt →
## reviewer_claude/reviewer_gpt → streak_check → fix_claude/fix_gpt →
## prepare_commit → commit_changes + the chunking + mono/dual topology vars)
## with ONE adaptive `campaign` agent given the branch diff + a
## standing-autonomy contract that reproduces the operator's proven manual
## session shape (read the branch diff → living todo of real issues → one
## verified commit per fix, in stride), a deterministic build/test gate, and a
## bounded continuation loop. The v1 graph over-framed the work; git is now the
## durable state (no chunk/worklist scratch), so a re-dispatch just re-runs the
## campaign, which reads `git log`, re-diffs the branch, and continues. See
## docs/references/productive-session-patterns.md. Sibling of whole-improve-loop
## v2 (same shape, branch-diff scope instead of a whole-codebase axis).
description: |
  Branch-scoped REVIEW-AND-IMPROVE campaign — one capable agent, its natural
  flow, minimal framing. Reviews and improves the changes THIS branch
  introduces over base_ref (default "main"): reads the diff
  `git diff $(git merge-base base_ref HEAD)` (merge-base vs WORKING TREE, so a
  prior pass's uncommitted fixes stay visible), finds the REAL issues the
  change introduces or leaves (bugs, regressions, missing/weak tests, unhandled
  errors, quality problems IN THE DIFF), and improves them — committing each
  fix in stride with a semantic message. It does NOT re-litigate code the
  branch didn't touch. A deterministic, stack-agnostic build/test gate
  re-checks the tree after each pass (the anti-Goodhart truth oracle: the agent
  can't self-certify); RED routes back with the failure log, green + branch
  clean converges. git IS the durable state — an interrupted / budget-capped
  run keeps every committed fix, and a re-dispatch re-runs the campaign. Bounded
  by a max_passes cap. An optional PR path (merge request on GitLab) ships the
  series of per-pass commits.
  Sibling of whole-improve-loop v2 (ADR-058). See
  docs/references/productive-session-patterns.md.
when_to_use: |
  Use when an existing branch/PR needs a rigorous review + fix + commit before
  merge. Scopes to the diff base_ref...HEAD (measured against the working tree)
  and commits each fix as a semantic commit in stride; pass base_ref for a
  non-main integration base. One capable agent reviews the branch diff and
  improves what it finds, converging when a fresh re-review is clean and a
  deterministic build/test gate is green. For a whole-codebase (not
  branch-scoped) cross-cutting improvement, use whole-improve-loop instead.
author: SocialGouv (devthejo) — branch-improve-loop/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}
  ## Board/comment-dispatched runs open a pull request at the end
  ## and post the URL back onto the source issue. CLI runs keep the
  ## defaults (open_mr=false) so a plain local run just commits.
  open_mr: "true"
  source_issue_ref: "{{issue.id}}"

## Forge access for the PR push + creation + the issue back-link.
## The auto-provisioner requests these scopes and binds the connection
## token under `forge_token` (cross-ref main.bot `secrets: { forge_token }`).
forge:
  events: [pull_request_comment]
  token_scopes:
    pull_requests: write     # open the PR
    repository: write         # push the branch
    issues: write             # post the PR URL back onto the source issue
    statuses: write          # post the merge-gate commit status on the head it
                             # pushed. Declaring this also makes provisioning
                             # derive review_on_sync ON for the repo, which is
                             # what gets the head this run created re-reviewed.
  secret: forge_token

# Start from a review of the same PR when one exists, instead of re-deriving
# it. Matched BY KIND, so whichever bot reviewed supplies it — Billy's manifest
# names no reviewer, and Billy still runs perfectly well with no prior review
# (the var defaults to empty and the campaign reviews from scratch).
consumes:
  - kind: review
    var: prior_review
    scope: pr

# The reply half: what became of each finding it was handed. A later review of
# the same PR is given this, so a finding it already contested (with an
# argument) is not re-raised for free — that relay is what fails to converge.
produces:
  - kind: review_ledger
    node: campaign

invocations:
  # Billy runs on a PR ONLY on this deliberate `/billy` (alias `/improve`)
  # slash-command, gated on the commenter's repo rights (min_replier_role).
  # There is NO PR-open auto-launch: opening a PR only ever auto-REVIEWS it.
  # `/billy` picks up where the review left off — the `consumes:` block above
  # is what seeds `prior_review` from it.
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: billy, aliases: [branch-improve-loop, improve], scope: any, min_replier_role: maintainer }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [base_ref, pilot]
  hidden: [source_issue_ref]
