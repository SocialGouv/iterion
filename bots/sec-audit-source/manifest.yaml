name: sec-audit-source
display_name: Seki
icon: 🛡️
version: 0.1.4
## 0.1.4 — a pass no longer publishes a neighbour's deepsec export as its own
## (deepsec_out becomes a per-run subdirectory keyed on {{run.id}}, #1322); the
## deep scan no longer counts toward the min_generic hard-fail floor so two
## dead always-on scanners still stop the run once deepsec is present (#1333);
## and a fully-analysed workspace whose persistent backlog is exhausted renders
## a plain note ("this pass added nothing; the findings below come from earlier
## passes over this workspace") rather than two coverage warnings at once
## (#1328). Follow-up (PR #1473, revi verdict 1): cap_findings now takes the
## producer's deepsec json_paths through an input schema and harvests the
## per-run export explicitly (the class fix's fifth reader — without it the
## array-shaped export disappears from findings_budget.inline, the only
## transport triage reads on non-sandboxed backends); RUN_ID rejects "." and
## ".." explicitly so those path-navigation segments cannot recreate the
## shared slot or place the export above scan_dir; scan_dir_ttl_days (default
## 30, 0 disables) prunes stale per-run subdirs at scanner entry.
## Follow-up (PR #1473, revi verdict 2): the per-run export subdir carries
## the deepsec-out- prefix so the retention sweep positively matches
## deepsec-out-* + deepsec-logs-* rather than deny-listing three names — an
## operator-set scan_dir now leaves every other directory alone (Re56aa9).
## Rule 3a is also suppressed when files_processed=0 && deepsec_finding_count>0
## so the healthiest fully-analysed state renders one NOTE (from 3b) rather
## than two banners.
## Follow-up (PR #1473, revi verdict 3): cap_findings sorts the harvest file
## list by basename after appending the deepsec path so the deep scan
## interleaves with the other scanners the way the pre-per-run glob did (an
## append-last order lets a generic layer that fills the budget cut the deep
## scan off inline entirely — R6ee3b1). The 3b NOTE drops the withdrawn
## "backlog exhausted" claim (no field distinguishes it from "nothing
## eligible"; R76c175) and names only the observable fact: this pass added
## nothing new, findings come from earlier passes. Rule 3a's EXCEPTION now
## also keys on the process step having succeeded — a run whose process
## failed at the first file while the export dumps prior findings must
## still show the ⚠ cap banner (revi verdict 3 question).
## Follow-up (PR #1473, revi verdict 4): cap_findings no longer has a read
## path to the pre-0.1.4 shared slot scan_dir/<basename(deepsec_out)> -- the
## deep scan enters its harvest only through the producer's json_paths, the
## envelope's deepsec_harvest names the file or the fact that none was
## published, and the two orphan guards of verdicts 1 and 3 go with the path
## they guarded (Rf73c6f). run_deepsec_scanner removes the pre-0.1.4 orphan
## file once a pass is past its preflight, whatever scan_dir_ttl_days says (the sweep prunes
## directories only). scan_health clamps a min_generic_scanners above the
## trio's size to 3 and says so (min_generic_requested / min_generic_clamped,
## a NOTE in the report) instead of hard-failing every run.
## 0.1.3 — prepare_branch no longer reads iterion's `.claude/` scaffold as the
## operator's work in flight, its stash leaves the scaffold in place and is recorded
## only once it is confirmed on top, and a finding's revert neither cleans nor checks
## that tree out (#1364).
## 0.1.2 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside nineteen prompts (129 in all) now reach
## the models as blank lines instead of being folded away by the profile-1
## lexer; and the fix loop's cap now leaves by the exit fan
## (`fix_ledger -> exit_router`) instead of killing the run with
## LOOP_EXHAUSTED (C145, #1293). No instruction changed.
## 0.1.1 — ADR-082 Phase 2 (sandbox-by-default): sandbox block reduced to
## the sec-image pin (scanner toolchain); claude install gate, ~/.claude
## mount and CLAUDE_CONFIG_DIR removed — platform defaults cover them.
description: |
  Universal source-code security auditor. Detects languages and
  frameworks, runs language-specific SAST (semgrep + gosec / bandit /
  npm audit) plus language-agnostic scanners (gitleaks for secrets,
  trivy fs for filesystem misconfig, semgrep --config=auto), triages
  the raw output with an LLM against a finding taxonomy, confronts
  candidates against `.sec-audit/fp-known.yaml` to suppress
  curated false positives, revalidates surviving candidates with a
  two-phase judge (anti-façade), then writes findings to the iterion
  native kanban board (one issue per finding, labelled by severity +
  type) and exports a markdown summary.

  Cross-run memory: false positives confirmed by the operator (or by
  the revalidate judge after explicit human reasoning) are written
  back to `.sec-audit/fp-known.yaml` in the repo so the next
  run does not re-surface them. Entries are reviewable + editable by
  humans.

  Per-language extensibility: ships JS/TS, Go, Python and a
  language-agnostic baseline. Add a language by dropping a
  `skills/lang-<id>.md` and an entry in the `lang_scan` router.
when_to_use: |
  Use for a READ-ONLY security audit of the source itself (injection,
  SSRF, IDOR, broken auth, hardcoded secrets, crypto misuse,
  deserialisation, path traversal, misconfig). Emits findings to the
  board; does not fix. Pre-release hardening / PR-scope review.
author: SocialGouv (devthejo) — bots/sec-audit-source/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}

invocations:
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: seki, aliases: [sec-audit-source], scope: any, min_replier_role: developer }
  - kind: schedule
    mode: board
    schedule: { suggested_cron: "0 2 * * 1" }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [scope_notes, severity_threshold]
  hidden: [scanner_version]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.141.0"
