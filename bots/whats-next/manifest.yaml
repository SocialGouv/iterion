name: whats-next
display_name: Nexie
icon: 🧭
version: 0.3.0
description: |
  Conversational co-CTO. ONE adaptive agent (claude_code + opus, full
  board capabilities, bundled skills) in a standing chat loop: the
  operator talks, Nexie analyses the board and the repo, recommends
  (recommendation-first, never raw dumps), creates/curates/dispatches
  tickets, verifies whether issues are still relevant against the
  code and git history, and keeps a cross-session CONTEXT_BRIEF.
  On roadmap-scale asks she leads the full study cycle end-to-end:
  parallel audit fan-out → chantiers with now/next/later tiering +
  quick-wins + blind spots → grouped operator arbitrage → framed
  tickets (context / done-criteria / verify) with a limited ready
  lot → factory observation + evidence-based bilan.
  Every turn ends at a budget-free chat pause — the session stays
  reachable for days; only an explicit "close" ends it. Direct action
  on targeted instructions; dry-run + confirmation before bulk or
  destructive board changes.
when_to_use: |
  Use to decide and drive what happens next on a repo: discuss the
  board, get a recommendation (quick wins, priorities), create or
  clean up tickets, and dispatch work to the right bot — all in one
  ongoing conversation. Also the entry point for a full roadmap
  study: ask "quels sont les prochains chantiers ?" (or dispatch a
  study-titled card) and Nexie runs the audit→synthesis→arbitrage→
  board→bilan cycle. The orchestrator / entry point, not a worker
  bot.
author: SocialGouv (devthejo) — whats-next/main.bot
schema_version: 1

dispatch_vars:
  initial_message: |-
    {{issue.title}}

    {{issue.body}}

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [initial_message]

## Nexie is a CONVERSATIONAL bot: the studio hosts her in the assistant
## dock rather than launching her through the generic run form. This block
## IS the studio's chat registry — before it, the surface was a const in
## studio/src/lib/whats-next/firstClassBots.ts with her id hard-coded, and
## a second chat bot needed a studio release to get a chat window.
chat:
  seed_var: initial_message
  nodes:
    ## Plumbing: the compute nodes that seed and project the loop.
    seed: {kind: silent}
    gate: {kind: silent}
    ## The working turn — a collapsible progress banner.
    nexie: {kind: banner, label: "Nexie is working"}
    ## The chat pause. No `prompt` on purpose: Nexie's reply IS the node's
    ## runtime-resolved `instructions:`, and a constant here would mask it.
    chat: {kind: human, text_field: message}
  launcher:
    prompt: "What do you want to look at?"
    description: "Pick a starting point or type your own — this is just the first message of the conversation."
    submit_label: "Start the conversation"
    presets:
      - value: "Fais le point sur le board et recommande la prochaine action."
        label: "What's next? (board + recommendation)"
        description: "Board state, quick wins, Nexie's pick."
      - value: "Quels tickets sont dispatchables maintenant ? Analyse et recommande lesquels pousser, puis attends ma confirmation."
        label: "Dispatch existing board items"
        description: "Shortlist + recommendation before anything moves."
      - value: "Surveye le repo et propose une roadmap courte (long terme / court terme / prochaine action) avec les bots à utiliser."
        label: "Survey the repo & propose a roadmap"
        description: "Read-only survey, then a structured proposal."
      - value: "Passe le backlog en revue : lesquels sont encore pertinents par rapport au code actuel ? Propose un nettoyage."
        label: "Clean up the board"
        description: "Relevance check against code + git history."
