name: rgaa-audit
display_name: Acci
icon: ♿
version: 3.0.3
## 3.0.3 — a citation snippet the adjudicator retyped is folded with its
## anchor's text (#2453): the fold accepted it through a fallback to the
## anchor, and every later trial, which grounds a conformity's citations as
## stored, refused it. fold_final gives each citation of a conformity that
## neither copies nor excerpts its anchor the snippet and selector of the
## anchor it stands on (the nearest when several share the line), has the
## engine judge both versions on copies of the audit, and keeps the restored
## text only where it accepts both and the text grounds as written: the
## fold's verdict stays the one on the text as written, a fabrication's
## included. Findings stay as written; a retyped recommendation takes the
## nearest anchor, a copied one stays as written; the annex names the
## criteria restored. A verdict is read as the engine reads it, trimmed and
## case-blind. A ledger can still hold a retyped citation (written before
## 3.0.3, or one whose restore the engine refused): the replay keeps it, so
## heal such an entry by hand (the studio's ledger is clean).
## 3.0.2 — the trial takes its conformities from the audit, the source the
## engine re-derives its coverage from (a replaying run wrote the ledger's
## capture anchors another way and left them « absent from the trial »).
## 3.0.1 — first dogfood on iterion's studio (#2346): a recommendation is an
## object anchored on the criterion's own evidence (a free-text one used to
## cost its verdict at the fold) and is never replayed from the ledger; a
## replayed verdict the engine's gate refuses is named, and a ledger the engine
## cannot read is LEDGER_INVALID with its own message; the trial reports what
## the engine pruned even when it refuses part of it, chains the engine's
## write, and says so at the human gate; a refused page-sample lint fails the
## rendered layer before any scan; the delivered ledger's anchors are
## workspace-relative.
## 3.0.0 — rebuilt on the ultra11y engine (SocialGouv/ultra11y 5.42.1, pinned
## by version and sha256). The engine finds, gates and reports; iterion
## orchestrates: criteria adjudicated in parallel batches by read-only agents,
## a bounded re-ask of what the engine's fold refuses, a second adversarial
## reader over the draft report, an optional human gate, a French coverage
## annex, the board transcription. The v2 `rgaa-criteria-*` paraphrases are
## gone — the engine writes one normative brief per criterion at run time.
description: |
  RGAA 4.1.2 / WCAG 2.2 AA accessibility audit (read-only) on the ultra11y
  engine. The engine's static rules produce the findings — anchored
  file:line, one per criterion, reproducible without a model — and hand the
  criteria a static pass cannot decide to read-only agents, one batch per
  theme, in parallel. The engine's own fold refuses an unjustified verdict,
  an uncited conformity or an ungroundable non-conformity by name; the
  refusals are re-asked once, then the real audit is folded exactly once. A
  second reader puts every stated non-conformity and every landed conformity
  on trial; a human gate is one var away. The run writes the dated French
  report, the per-page grid when pages were captured, a coverage annex that
  names every layer (static, rendered, ledger, adjudication, refutation,
  human review, report integrity) as ok, degraded or skipped, and the issue
  plan — one board issue per criterion, severity-sorted and capped, filed
  verbatim by a transcription judge with no other tool.

  The engine is pinned by version AND by the sha256 of its entry file,
  fingerprinted before anything of it runs and before every call. A
  committed verdict ledger is replayed, never believed: the engine
  re-grounds every entry and the stale ones go back to the agents.
when_to_use: |
  Use for a READ-ONLY accessibility conformance pass whose findings must be
  defensible: a dated RGAA (or WCAG) report with a conformance rate the
  engine can stand behind, board issues per criterion, and a ledger that
  makes the next run cheaper. Pre-release review, recurring conformance
  tracking, or a non-regression run after fixes. It reports and files; it
  does not fix — for FIXING, use Willy (whole-improve-loop) with the rgaa
  preset on the issues this bot files.
author: SocialGouv (devthejo) — bots/rgaa-audit/main.bot
category: verify
tags: [a11y, read-only]
schema_version: 1
triggers: [rgaa, wcag, accessibilité, accessibility, a11y, ultra11y]

capabilities: [board.create, board.label, board.read]

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}

## Invocations: a command, a weekly schedule, and the board. All three post
## their issue plan to the board; a plain `iterion run` keeps the default
## `post_to_board=false` (report only).
invocations:
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: acci, aliases: [rgaa-audit, a11y, ally, ultra11y], scope: any, min_replier_role: developer }
    context_vars: { post_to_board: "true" }
  - kind: schedule
    mode: board
    schedule: { suggested_cron: "0 5 * * 1" }
    context_vars: { post_to_board: "true" }
  - kind: board
    context_vars: { post_to_board: "true" }

## Studio launch-form hierarchy: `primary` inputs render top-level in the
## declared order; everything else stays out of the form (still settable via
## --var / bot_args).
launch:
  primary: [scope_notes, scope_globs, standard, rendered, post_to_board]

## The floor: `tools: []` is read as "no tools" from 3.190.0 (an older runner
## hands the transcription judge the whole CLI toolset); the `run.*` budget
## namespace, expression loop caps and compute collection literals all land
## before 3.225.0, which also reads category/tags.
requires:
  iterion: ">= 3.225.0"
