name: feature-gap-fill
display_name: Fini
icon: 🧩
version: 2.1.0
## 2.0.1 — ADR-082 Phase 2 (sandbox-by-default): removed the `sandbox:`
## block — isolation is the platform's job; the target repo's toolchain
## comes from its own devcontainer/devbox.json.
## 2.0.0 — RADICAL SIMPLIFICATION (ADR-058 minimal-framing). Replaces the
## v1 staged pipeline (survey_existing → plan → act → simplify → alternating
## Claude/GPT review-fix loop → prepare_commit → commit_changes, 12 nodes)
## with ONE adaptive `campaign` agent given the gap spec + a
## standing-autonomy contract (living todo from the missing items, one
## verified commit per item in stride, preservation discipline), a
## deterministic build/test gate, and a bounded continuation loop. git is
## the durable state — a re-dispatch re-runs the campaign, which reads
## `git log` and continues. See docs/references/productive-session-patterns.md.
description: |
  Gap-driven feature completer — one capable agent, its natural flow,
  minimal framing. The input is a STRUCTURED gap spec ("here is what's
  implemented, here is what's missing") rather than a feature description
  from zero. The campaign surveys the seams, closes the missing items one
  verified commit at a time (preserving what already works), and a
  deterministic build/test gate + bounded continuation loop re-poke it
  until the gap is closed and the tree is green. Use feature_dev for
  greenfield work; use Fini to FINISH an existing partial implementation
  without re-architecting what already works.
when_to_use: |
  Run on a type:feature-gap issue created by the adr-cartograph (Adry)
  bot, OR manually via --var gap_spec='<spec>' when an operator wants to
  close a specific gap on a feature. Prefer feature_dev when the work is
  greenfield (no existing partial implementation to preserve).
author: SocialGouv (devthejo) — feature-gap-fill/main.bot
schema_version: 1

dispatch_vars:
  gap_spec: |-
    {{issue.title}}

    {{issue.body}}

invocations:
  - kind: command
    mode: board
    args_var: gap_spec
    command: { name: fini, aliases: [feature-gap-fill], scope: any, min_replier_role: maintainer }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [gap_spec]
