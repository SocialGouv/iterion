name: bmady
display_name: Bmady
icon: 🎭
version: 0.1.3
## 0.1.2 — the deterministic commit stages everything but the `.claude/`
## scaffold iterion mirrors into the worktree (#1364).
## 0.1.1 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside fifteen prompts (71 in all) now reach the models
## as blank lines instead of being folded away by the profile-1 lexer.
## Two bounded loops gain their exhaustion exit (C145, #1293): the fifth
## PRD revision goes to the architect as it stands, the fifth architecture
## revision to story selection.
## No instruction changed.
description: |
  BMAD-METHOD-inspired agile delivery bot. Runs a structured
  multi-persona pipeline — Analyst → PM → Architect → Dev → QA —
  with a human collaboration gate between every phase. Each gate is
  a different kind of decision (free-text elicitation, an
  advanced-elicitation option menu, a document approve/reject, a
  story multi-select with priority + WIP, a ship/changes/hold
  sign-off) so the operator stays in the driver's seat from brief to
  commit.

  Vehicle for iterion's human-interaction surface: one run exercises
  every studio form widget (free-text, radio, select, checkbox
  multi-select, numeric, approve/reject).
when_to_use: |
  Use when you want a feature delivered the BMAD way — explicit
  human-approved planning artifacts (analysis, PRD, architecture)
  before any code is written, then an implement → QA → sign-off loop
  you steer at each step. Pick this over feature_dev when you want to
  collaborate on the plan rather than hand off an autonomous run.
author: SocialGouv (devthejo) — bmady/main.bot
schema_version: 1

triggers:
  - bmad
  - agile
  - plan-then-build
  - prd
  - architecture

dispatch_vars:
  brief: |-
    {{issue.title}}

    {{issue.body}}

invocations:
  - kind: command
    mode: board
    args_var: brief
    command: { name: bmady, scope: any, min_replier_role: maintainer }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [brief]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.141.0"
