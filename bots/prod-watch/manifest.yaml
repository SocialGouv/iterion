name: prod-watch
display_name: Argus
icon: 👁️
version: 0.4.0
## 0.4.0 — the digest and the session modes (#1701, #1708). `mode=digest`
## posts the daily digest — ALWAYS: its absence is the alert — carrying the
## watchdog's own health (ticks executed vs expected, lanes silent) and
## the window's signals read from the ledgers, plus the Prometheus ranges
## of config digest.prometheus.ranges; it writes nothing. `mode=session`
## is a DENSE cron inside a declared usage window (config
## session.active_windows): the lifecycle runs on a fork of the watch
## state under <state_dir>/session/ (its only writer) — immediate
## escalation, a heartbeat of positive numbers every
## session_heartbeat_minutes, one note at the analysis cap
## (max_analyses_per_session, the rest held and named in the summary), a
## summary when the window ends; a watch tick steps back inside a declared
## window, and past it only while the envelope is still open (the closing
## tick's grace plus its run budget). Every message now ends with the run that wrote it (#2430,
## the prod-watch half), its room reserved before the clip.
## 0.3.1 — the state push declares the paths it owns (DELIVERY_OWNED_PATHS):
## _staged_outside reads one tuple, so a path outside the state dir can
## never reach the push and the bot owes no delivery-permission preflight
## (#2437). Behaviour unchanged; the declaration is now readable by the
## class guard.
## 0.3.0 — the grafana-alerts lane (#2138): the Alertmanager built into the
## configured Grafana is polled (one GET of the alerts firing right now) —
## the rules the product team authors in Grafana's own UI become incidents
## here, with the lifecycle every lane has (new / reminder / escalation, a
## resolved note when a whole read no longer CONTAINS the alert — gone,
## not silenced or inhibited: a held alert is seen, never resolved, a
## refire as news). Severity from the alert's labels through the config's
## mapping; label and annotation keys and values are free text, scrubbed
## like a log line; a generatorURL is carried only on the Grafana's own
## origin and rendered as the bot's link, its text a label.
## 0.2.2 — the ledger bound (#2064): a ledger file past `ledger.max_bytes`
## (2 MB, 0 = off) rotates to a generation-named file and a fresh one
## starts; the newest `ledger.keep` (8, 0 = all) rotations stay in the
## working tree, older ones leave it (git history keeps every version).
## The rotation is said in the tick's summary. (Also carries the deferred
## bump of the minting-store caps, #2042/#2057, lost to the merge queue.)
## 0.2.0 — the Sentry lane (#1702): the org-scoped issue lists of one
## project and environment — NEW issues (first processed since the
## cursor), REGRESSED / ESCALATING ones dated by their activity (tracked
## or not), the alerted ones by id (sightings, "resolved in Sentry") —
## through the same redaction scan, lifecycle and delivery; a silent
## bootstrap per lane identity; alerts cut by the cap stay pending; issue
## text never persisted; one clickable link per Sentry alert. No event
## body is read (the analysis slice will).
## 0.1.0 — first slice: the deterministic, zero-LLM watch tick (Loki +
## Prometheus through the Grafana proxy, the app's own health probes, the
## redaction scan, the incident lifecycle, webhook delivery, git-backed
## state). The leak policy with its circuit-breaker, the analysis agent,
## Telegram, the forge issue reporter, the daily digest and the session
## mode are the next slices of the same epic.
category: operate
description: |
  Production watchdog for ONE deployed application (scheduled ticks,
  zero LLM in this slice — the compiled workflow contains no agent or
  judge node, so a tick can neither spend a token nor show a log line to
  a model). Three deterministic run modes over a git-versioned state in
  the target workspace (an ops repository, never the application's own):
  `watch`, the idle-profile tick; `digest`, the daily digest that always
  posts (the watchdog's own health, the window's signals, the ranges);
  `session`, a dense tick inside a declared usage window with immediate
  escalation, a heartbeat of positive numbers and a summary. The watch
  tick:

  - Loki through the Grafana datasource proxy: the configured error query
    and a full leak sweep, paged FORWARD over a frozen window with an
    ingestion lag, a persisted cursor and an explicit "partial coverage"
    flag whenever the window was truncated or a query failed.
  - Prometheus probes through the same proxy, each result typed
    healthy | breached | no_data | error — an absent metric is never read
    as a healthy one.
  - The application's own health URLs.
  - Sentry's issues for one project and environment, through the org-scoped
    API: issues first processed since the cursor (NEW), regressed or
    escalating ones dated by their own activity (posted whether tracked or
    not), the alerted ones read back by id (sightings, resolution). A
    silent bootstrap per lane identity; issue text is scrubbed like a log
    line and never persisted; no event body is fetched.
  - The Alertmanager built into the configured Grafana: the alerts firing
    right now, one GET — the rules stay authored in Grafana's own UI and
    Argus aggregates. Severity from the alert's labels through the
    config's mapping (default and cap included); label and annotation
    keys and values are scrubbed like a log line; a whole read that no
    longer CONTAINS an alerted incident says so (resolved — a silenced
    or inhibited alert is seen, never resolved); a partial or refused
    read never concludes.
  - A redaction scan that is the ONLY reader of the raw lines: secrets,
    JWTs, bearer tokens, NIR (key-validated), IBAN (mod-97), card numbers
    (Luhn), emails and phone numbers are replaced before anything is
    derived; error lines are fingerprinted into templates; raw values
    never reach a node output, an artifact, a checkpoint or an error.
  - An incident lifecycle that runs EVERY tick: new / escalated /
    reminder / not-observed, source-health staleness, a per-tick cap
    with an explicit overflow, and a dead lane that never counts as an
    absence of observation.
  - Deterministic delivery to Mattermost incoming webhooks with
    per-sink severity thresholds and required/optional sinks; the state
    advances only after delivery (at-least-once, never a silent loss);
    every message ends with the run that wrote it.

  Universal by design: no host, namespace, metric name, language or
  channel is baked in — everything comes from the workspace config
  (prod-watch.json) plus the `webhooks`, `grafana_token` and
  `sentry_token` secrets.
  Requires python3 (stdlib only) on the execution host.
when_to_use: |
  Use to watch ONE production (or production-like) deployment of an
  application from its logs (Loki), metrics (Prometheus), Sentry issues
  and health endpoints, with deterministic alerting to chat and a git-backed
  incident state — the "is prod healthy, and what just changed" tick.
  Requires the target workspace (an ops repo) to carry a prod-watch.json
  (see skills/argus-config.md) and a Grafana service-account token. Not a
  vulnerability watch (use vuln-watch), not an editorial digest (use
  feed-watch), not the instrumentation of the application itself (use
  instrument); it never edits code.
author: SocialGouv (devthejo) — bots/prod-watch/main.bot
schema_version: 1

invocations:
  ## The idle-profile tick: poll the lanes, run the incident lifecycle,
  ## deliver, commit the state. Zero LLM.
  - kind: schedule
    mode: direct
    context_vars: { mode: watch }
    schedule: { suggested_cron: "*/30 * * * *", default_vars: { state_commit: "true" } }
  ## The daily digest: always posted, writes nothing. Set
  ## config digest.tick_interval_minutes to the watch cron's cadence so
  ## the "ticks executed vs expected" line counts against the truth.
  - kind: schedule
    mode: direct
    context_vars: { mode: digest }
    schedule: { suggested_cron: "0 7 * * *" }
  ## The session tick: a DENSE cron covering the declared usage windows
  ## (config session.active_windows) plus one slot past their end, so the
  ## closing tick fires; outside a window the tick steps back for free.
  ## Schedule crons run in UTC: this one covers a Friday 13:00-19:00
  ## Europe/Paris window in both DST regimes (11:00-17:00 or 12:00-18:00
  ## UTC) with a slot past its end. The default overlap (skip) keeps at
  ## most one tick live.
  - kind: schedule
    mode: direct
    context_vars: { mode: session }
    schedule: { suggested_cron: "*/2 11-19 * * 5", default_vars: { state_commit: "true" } }

## A watch tick is a perishable observation: one that died on a provider
## quota window must NOT come back hours later carrying stale signals —
## the next tick produces a fresh one. (This slice has no LLM node; the
## setting is declared now so the analysis slice inherits it.)
retry:
  usage_window: off

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [mode, dry_run]
  hidden: [scratch_dir]

## Profile 2 (`dsl: 2`) and the typed `fail` node exist since 3.141.0; the
## floor is the release the bot was authored and verified against, not a
## named engine feature. A runner older than this release refuses the
## bundle at admission instead of failing mid-run.
requires:
  iterion: ">= 3.225.0"
