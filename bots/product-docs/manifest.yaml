name: product-docs
display_name: Prody
icon: 🧭
version: 1.3.0
## 1.3.0 — EXHAUSTIVENESS IS A GATE, not the agent's word. A new
## deterministic node, `coverage_check`, reads the product's
## golden-master net — `<oracle_dir>/feature-coverage.json` (covered
## features with the corpus entries that exercise them, exclusions with
## their written reason) and `<oracle_dir>/corpus.json` — and answers
## the one question a documentation bot cannot honestly ask itself: is
## everything documented, and does everything documented EXIST? Five
## named refusals (PHANTOM_DOC, GAP, CONCEALED_EXCLUSION,
## UNANCHORED_CHAPTER, NET_UNREADABLE), each one falsified by a test
## that reddens it and by nothing else; every emptiness is one of them,
## because a guard reading `if collection and …` is disabled exactly
## when the collection is empty. Convergence becomes `scope_ok ∧
## lint_ok ∧ coverage_ok ∧ docs_aligned`. The gate is ARMED only when
## catalog_ingest finds both artifacts (workspace first, then each
## source clone): with no net it is inert and the bot is byte-for-byte
## the one it was — a non-regression pinned by its own test. The
## exclusions chapter and the anchorless marker are DECLARED
## identifiers (`coverage_*` vars), not French literals, and the anchor
## vocabulary is read off the net rather than assumed. page_lint
## exempts exactly the declared marker, so the two gates cannot order
## the campaign to add and to remove the same characters.
## Also: a catalog entry may now name a source by `path` — a repository
## already on disk, RELATIVE to the workspace (`.` being the workspace
## itself), cloned locally with no forge, no network and no credential,
## then redacted like any other source. That is how a campaign
## documents its OWN repository.
## THE GATE PROVES A PRODUCT IS DOCUMENTED, not that an inventory is
## cited. A documentation made of an anchor table, of chapters suffixed
## with the anchorless marker and of invented screens described one
## sentence at a time used to score GREEN. Now: `GAP` asks for PROSE
## outside the references, in the BLOCK that carries them — a paragraph,
## a list item, a table row, each read on its own as markdown renders
## it, a heading documenting nothing — and a block that documents
## several features needs that prose FOR EACH (an index table with a
## descriptive column, and a paragraph of soft-wrapped index lines with
## no markup at all, were credited whole to every feature they listed);
## table pipes, HTML tags and link destinations are markup, not prose;
## `CONCEALED_EXCLUSION` reads the same block and asks for prose of its OWN,
## sharing vocabulary with the reason the net records, once per hole (a
## row of dots is length without words, and one sentence cannot answer
## for two, and a summary line naming two holes no longer locks the
## second out of its own paragraph); the anchorless marker has a CEILING
## (`coverage_max_anchorless`, default 2) which the anchor refusal
## HONOURS — it offers the marker only while headroom remains instead of
## naming a remedy the ceiling takes back, and never asks for a bigger
## ceiling (a launch var outside the writeable set); the exclusions
## chapter, anchored by its role, spends nothing, and a sub-heading
## repeating the declared token no longer closes the chapter early; the
## exclusions title is matched WHOLE ("Les exclusions de garantie" no
## longer opens the chapter of holes); and a REFERENCE IS WHAT THE PAGE SAYS
## IS ONE — `coverage_citation_open` + token +
## `coverage_citation_close` (`[[ref:001]]`), never a code span. The
## gate infers nothing in either direction: every citation is verified
## wherever it sits (an invented screen alone on its line is refused)
## and nothing else is ever looked at (an interface label, a file name,
## an inline `404` stay prose). That replaces a (length, character-class)
## shape inference no setting could settle — tightened it let an
## invention through, loosened it ordered the campaign to delete
## reader-facing prose. A TAIL
## WILDCARD (`/dashboard/**`) proves nothing on EITHER side — cited by a
## page or declared by the route table, one predicate governs both;
## `coverage_routes_file` is
## confined to the net, and the absence of any trace of the net's own
## gate is reported as `net_unproven`. The counts (`counts_line`) ride
## the run events and the PR body, so a declared-anchorless chapter
## costs its author something.
## page_lint stops treating the declared marker as a switch on every
## rule: the exemption is the html_comments rule, for a comment that IS
## the token, and it is armed by the NET rather than by the var — with
## no net the node is the one it was, value included.
## A net artifact whose top-level JSON is not an OBJECT is named at the
## one door both files come through, instead of answering a key lookup
## with a traceback; and an empty `coverage_exclusions_heading` while the
## net declares a hole stops the run, since no page could ever name one.
## PRE-FLIGHT vs CONVERGENCE. A cause whose repair lies OUTSIDE the
## writeable set (`<product_dir>/**/*.md`) — the net, a launch var, the
## catalog — stops the run by name instead of riding `fail_log`: left as
## a gate term it orders the campaign to fix what `scope_check` forbids
## it to touch, and the run burns every pass on two contradictory
## instructions. An ABSENT `exclusions` key is an empty list, as the net
## producer reads it; only a key that is there and mistyped refuses.
## SOURCE CONFINEMENT, one decision point. A source that names the
## FILESYSTEM is confined to the workspace whichever key carries it:
## `url` is read first, and an absolute path, a `file://` url or a
## relative value that resolves on disk is a local source under another
## name — same containment, same credential-free environment, same clone
## mode as `path`. A repository whose git dir, object directory or
## `objects/info/alternates` resolves outside the workspace is refused
## too: a clone serves the union of those stores, so confining the path
## alone confines nothing (`--no-local` does not change that — upload-pack
## serves the alternates as well). The inventory reports the decision each
## entry took (`local`).
## 1.1.1 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside six prompts (50 in all) now reach the models
## as blank lines instead of being folded away by the profile-1 lexer.
## No instruction changed.
## 1.1.0 — the publish tail is PLATFORM-AGNOSTIC. It used to speak one
## platform (SSP Cloud datalab S3 + a standing serve service, three STS
## secrets with a 7-day life that let the demo URL die by itself). It
## now builds the site, packages it as a non-root nginx image pushed to
## the operator's registry (`publish_image`, `registry_token`) and hands
## that image to the operator-attached `deploy-target` skill with a
## `deploy_credential` — the Appy pattern: the platform lives in the
## attached skill + the mounted credential, no platform literal in the
## DSL. publish_gate probes the generic preconditions (base URL, image,
## both credentials); verify_publish still refuses any URL outside
## `publish_base_url`. The schedule invocation now also defaults
## `open_mr` on: a scheduled run on an ephemeral clone delivers only
## through the PR tail.
## 1.0.0 — Functional (business-audience) product documentation,
## generated and maintained in a DEDICATED docs repository from a
## MULTI-REPO product catalog. Mirrors docs-refresh v3's topology (one
## capable claude_code agent + a mission + TRUTH gates only) with three
## deltas that make the cross-repo, non-technical case work:
##   - catalog_ingest, a deterministic front door that resolves the
##     product from a catalog YAML, shallow-clones its N source repos
##     OUT of the docs worktree, redacts secret-bearing files from the
##     clones, and reports a repo it could not read as an explicit
##     `degraded` inventory entry (never a silent skip);
##   - page_lint, a deterministic EDITORIAL gate — a published page
##     carries no working notes (no HTML comments, no "Sources" box, no
##     "Points à clarifier", no "Correspondance technique" annex);
##   - EDITORIAL SOVEREIGNTY: the docs repo's own `.product-docs/*.md`
##     override the bundle's default editorial skills wherever the two
##     disagree (ADR-092).
## Source deltas are git-native: every commit carries a
## `Product-Docs-Sources: <repo>@<sha>,…` trailer, so "what changed in
## the sources since we last documented them" survives a crashed run
## and a wiped scratch dir with no side-car state file.
description: |
  Functional documentation bot — one capable agent writes and maintains
  the BUSINESS-AUDIENCE documentation of a product ("what it does for
  its users") inside a DEDICATED documentation repository, grounded in
  the source code of the N repositories a product catalog names.

  It resolves the product from a catalog YAML (`catalog_path` +
  `product_id`), shallow-clones every source repo out of the docs
  worktree, redacts secret-bearing files from those clones, then reads
  what the sources actually implement — user-facing templates, i18n
  catalogs, form and validation rules, routes, API contracts, any
  framework — and writes the product's pages: a hub per user role or
  journey, one sub-page per step. Every page lands as its own
  `docs(...)` commit carrying a `Bot: product-docs` trailer and a
  `Product-Docs-Sources: <repo>@<sha>` trailer recording exactly which
  source commits it was written against.

  Sourced facts or `[à confirmer]` — never an invented business rule.
  Human-validated prose is preserved and touched only where the code
  contradicts it. A repository it could not clone is declared as a hole
  in the report, never documented from inference.

  The determinism is TRUTH-only: a scope gate fails the run if anything
  outside `<product_dir>/**/*.md` changed, an EDITORIAL LINT gate fails
  it if a published page still carries working notes, an
  EXHAUSTIVENESS gate fails it if the product carries a golden-master
  net and the pages do not account for it, and convergence is those
  three gates ∧ the campaign's honest `docs_aligned` contract — nothing
  else. A deterministic scan runs each pass as an ADVISORY hints
  producer (dead links, orphan pages, catalog surfaces no page
  covers): help the agent is free to contradict, never an obligation.

  EXHAUSTIVENESS IS NOT THE AGENT'S WORD. When the product commits a
  golden-master net, `coverage_check` reads its feature inventory and
  its capture corpus and refuses five ways, each cause named: a
  documented screen the net never saw, an inventoried feature no page
  documents, an exclusion the pages do not name as one, a chapter
  naming no reference it restitutes, and an inventory or a
  documentation too empty to judge. Without a net the node is inert
  and the bot is exactly the one it was.

  EDITORIAL SOVEREIGNTY: the bundle ships generic default editorial
  skills in French (documentary model, GitBook blocks, glossary, tone),
  but when the docs repo publishes its own `.product-docs/*.md` those
  are authoritative and override the defaults. The product team owns
  its editorial line; the bot brings a default, not a house style.

  Opt-in delivery: open_mr=true pushes the page series and opens ONE
  pull request at the end of the run — as a DRAFT by default, because
  functional documentation is validated by the product owners on the
  forge and marking it ready is their act, not the bot's. publish=true
  additionally builds the pages into a static site, packages it as a
  container image and puts it live through the operator-attached
  `deploy-target` skill, then verifies the URL from outside.
when_to_use: |
  Use to generate or maintain the FUNCTIONAL, non-technical
  documentation of a product — what it does for its users, role by
  role and journey by journey — when that documentation lives in its
  OWN repository and the code lives in one or more OTHER repositories
  named by a product catalog. Run it in the docs repo with
  `catalog_path` + `product_id`. It writes `.md` under the product's
  directory only, and never touches the source repositories.

  NOT for technical documentation living next to the code (that is
  docs-refresh / Doki, which aligns a repo's own README / docs/ in
  place), and NOT for a technical knowledge wiki (that is wiki-gen /
  Wikky, which owns a `wiki/` tree in the code repo). The
  distinguisher is the AUDIENCE first — a product's users, not its
  developers — and the topology second: docs repo here, N source
  repos there.
author: SocialGouv (devthejo) — product-docs/main.bot
schema_version: 1

triggers:
  - product-docs
  - functional-docs
  - doc-produit

## The catalog vars have no sensible default (see main.bot): a board
## dispatch that omits them fails LOUDLY in catalog_ingest rather than
## documenting the wrong product. Per-ticket `bot_args` supply them.
dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}

invocations:
  - kind: command
    mode: direct
    args_var: scope_notes
    command: { name: prody, aliases: [product-docs, doc-produit], scope: any, min_replier_role: developer }
  - kind: schedule
    mode: board
    ## A weekly reconciliation is INCREMENTAL by construction: it aligns
    ## the pages against the source commits landed since the last run,
    ## not the whole corpus. Declared here so the scheduled run actually
    ## carries it — a var only a human can pass is not a schedule.
    schedule: { suggested_cron: "0 5 * * 1", default_vars: { mode: incremental, open_mr: "true" } }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [catalog_path, product_id, scope_notes, open_mr]
  hidden: [workspace_dir, dismissed_path, scratch_dir, max_hints,
           oracle_dir, coverage_exclusions_heading, coverage_no_anchor_marker,
           coverage_routes_file, coverage_citation_open, coverage_citation_close,
           coverage_placeholders, coverage_min_prose, coverage_max_anchorless]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.141.0"
