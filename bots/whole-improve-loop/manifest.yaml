name: whole-improve-loop
display_name: Willy
icon: 🌍
version: 2.4.0
## 2.4.0 — the entry precondition's refusal is a NAMED fail node
## (`workspace_not_a_repo`, code WORKSPACE_NOT_A_REPO, terminal), so the
## code reaches the RUN's own `failure_code` / `error` — read by `iterion
## runs list`, the studio and the alert sinks — instead of sitting on the
## probe's output under the generic FAIL_NODE.
## 2.3.0 — the plan phase runs by default on every deployment: `plan_review`
## gates ONLY the cross-model peer review (the plan_topology gate no longer
## skips planning when it resolves off); the new `plan_phase` (on|off) is
## the phase's own switch, and the campaign receives the authored sweep
## plan stamped with its provenance (`plan_provenance`). `workspace_probe`,
## a deterministic entry precondition, refuses a launch whose workspace_dir
## is absent or not a git repository (typed WORKSPACE_NOT_A_REPO) before
## any LLM node spends. Persy, the perseverance-coach supervisor on the
## campaign node + the contract's PERSISTENCE clause (fleet-wide, from
## feature-dev 2.2.0).
## 2.2.1 — plan_review_policy defaults to "skip": the cross-model plan peer
## is an optional enrichment, and the primary family alone must always
## suffice. A dead/parked peer credential (401, shut forfait window,
## provider outage) completes plan_review with the `_skipped` stamp and
## the campaign proceeds, instead of parking the run. "wait" remains the
## per-run opt-in for the deliberate-spend posture.
## 2.0.2 — third advisory question before the report: `Ratchet` — the cheap
## deterministic check that would have caught the site it just fixed, landed
## in the same commit or a follow-up one, NEVER by amending a commit already
## banked. A check that can fail on code the pass did not touch (a lint rule,
## any repo-wide gate) goes in the summary instead, since it would red the
## deterministic gate on someone else's work. A check it declines is not
## itself a remaining site, so it stays out of `sites_remaining`; the one
## exception is an axis that IS about such checks, and even then the gate is
## landed only together with the fixes it demands — never before the pass that
## can green the tree with it. Advisory like `Fit` and `Rot`, and no new
## termination-contract field: the gate stays `axis_complete ∧ green`.
## See docs/improvement-ratchet.md.
## 2.0.1 — ADR-082 Phase 2 (sandbox-by-default): removed the `sandbox:`
## block — isolation is the platform's job; gh/glab move to the bot's
## pinned devbox.json.
## 2.0.0 — RADICAL SIMPLIFICATION (mechanism change). Replaces the v1
## axis-sweep (ADR-057, ~16 nodes: enumerate/next_item/transform/verify/
## review/commit/advance/re_enumerate + a worklist/cursor scratch state) with
## ONE adaptive `campaign` agent given the axis + a standing-autonomy contract
## that reproduces the operator's proven manual session shape (living todo
## list, one verified commit per site, in stride), a deterministic build/test
## gate, and a bounded continuation loop. The v1 graph over-framed the work
## and its BLOCKING upfront enumerate timed out on large repos; git is now the
## durable state (no worklist scratch), so a re-dispatch just re-runs the
## campaign, which reads `git log` and continues. See
## docs/references/productive-session-patterns.md.
## 1.0.1 — scratch files moved OUT-OF-TREE to scratch_dir (${PROJECT_SCRATCH_DIR}).
description: |
  Whole-codebase improvement CAMPAIGN on one axis — one capable agent, its
  natural flow, minimal framing. `improvement_prompt` is THE AXIS: one
  determined improvement applied everywhere it applies (e.g. "split every file
  over 600 lines into cohesive units", "converge duplicated X onto a shared
  helper", "make error handling use pattern Y"). It is a refactoring-campaign
  engine, not a scanner. A single adaptive agent (claude_code, full tools,
  whole-repo context) works exactly as in a productive human session: a LIVING
  todo list born from a brief exploration (never frozen upfront phases), and
  for each site the repeated unit locate → smallest change → build → test →
  COMMIT, ~a few edits per commit, validation BEFORE the commit, committing
  each site AS it finishes (never batch). A deterministic, stack-agnostic
  build/test gate re-checks the tree after each pass (the anti-Goodhart truth
  oracle: the agent can't self-certify); RED routes back to the agent with the
  failure log to fix what it broke, green + axis-complete converges. git IS the
  durable state — an interrupted / budget-capped run keeps every committed
  site, and a re-dispatch re-runs the campaign, which reads `git log` and
  continues (no worklist/cursor scratch). Bounded by a max_passes cap so a
  pathological axis terminates. An optional PR path (merge request on
  GitLab) ships the series of per-pass commits. Supersedes the v1 axis-sweep (ADR-057). See
  docs/references/productive-session-patterns.md.
when_to_use: |
  Use on EXISTING code to apply one determined, cross-cutting improvement AXIS
  across the whole codebase, site by site — the campaigns a human runs as a
  todo-list + frequent incremental commits (split the largest files, converge
  N call sites onto a shared primitive, make a pattern consistent everywhere).
  Pass the axis as improvement_prompt (empty = it picks the single
  highest-value cross-cutting improvement it can name). One capable agent
  commits each site in stride and the run converges when the agent reports the
  axis fully applied and a deterministic build/test gate is green, so long runs
  always leave landed, reviewable commits. For an open-ended "find whatever is
  wrong" production-readiness audit (no single axis), point a review-loop bot
  at the tree instead — this bot needs an axis to sweep.
author: SocialGouv (devthejo) — whole-improve-loop/main.bot
schema_version: 1

dispatch_vars:
  improvement_prompt: |-
    {{issue.title}}

    {{issue.body}}
  scope_notes: "{{issue.body}}"
  ## Board/comment-dispatched runs open a pull request at the end
  ## and post the URL back onto the source issue. CLI runs keep the
  ## defaults (open_mr=false) so a plain local run just commits.
  open_mr: "true"
  source_issue_ref: "{{issue.id}}"

## Forge access for the PR push + creation + the issue back-link.
## The auto-provisioner requests these scopes and binds the connection
## token under `forge_token` (cross-ref main.bot `secrets: { forge_token }`).
forge:
  events: [pull_request_comment]
  token_scopes:
    pull_requests: write     # open the PR
    repository: write         # push the branch
    issues: write             # post the PR URL back onto the source issue
  secret: forge_token

invocations:
  - kind: command
    mode: board
    args_var: improvement_prompt
    command: { name: willy, aliases: [whole-improve-loop], scope: any, min_replier_role: maintainer, opens_mr: true }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [improvement_prompt]
  hidden: [source_issue_ref]
