name: secured-renovacy
display_name: Renovacy
icon: ⬆️
version: 0.2.3
## 0.2.3 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside twenty-nine prompts (126 in all) now reach
## the models as blank lines instead of being folded away by the profile-1
## lexer; the files_lines join literal is re-spelled with its value unchanged.
## Two loops gain their exhaustion exits, at three loop-backs (C145, #1293),
## and their caps — fifty solos, twenty families, hardcoded — now sit one
## above max_packages_per_run: select_candidate's own exit reports the cap
## first, and a back-edge declined for budget hands the ledger to
## phase2_decider (solo, through solo_banked, which counts the pick just
## committed: select_candidate's count is the ledger before it) or the
## remaining packages to the solo loop (family) instead of dying
## LOOP_EXHAUSTED. No instruction changed.
## 0.2.2 — the verify gate's clean-tree precheck no longer counts the `.claude/`
## scaffold iterion mirrors into the worktree as the pass's uncommitted work;
## the deterministic commits, prepare_commit's file list and the commit
## instruction exclude it, and revert_changes' reset and clean leave that tree
## alone (#1364).
## 0.2.1 — ADR-082 Phase 2 (sandbox-by-default): sandbox block reduced to
## the image pin (`:latest` → `:edge`) + the load-bearing env (git
## identity, out-of-worktree toolchain caches) + corepack post_create;
## claude install gate, ~/.claude mount and `network: open` (now the
## default) removed.
## 0.2.0 — Phase 2 converted to ADR-058 minimal-framing (SCOPED pass:
## Phase 1's per-package pipeline is untouched — its security/CVE/
## revert/SBOM gates are deliberately reified in the graph, ADR-055
## unit-convergence at work). The Phase-2 alternating Claude/GPT
## review/fix relay (alt_review condition router, reviewer_claude/gpt,
## streak_check, fix_claude/gpt, review_commit_auto, review_mode/
## mono_family vars) is replaced by ONE p2_campaign agent reviewing the
## run's cumulative diff (git diff start_sha, fixes committed in
## stride) + the deterministic p2_verify_build/p2_verify_run build gate
## + a bounded review_pass_loop. 40 → 37 exec nodes.
description: |
  Multi-stack agentic dependency upgrade pipeline. Updates every kind of
  dependency (libs, languages, frameworks, devops, ci_cd) across every
  recognised package ecosystem, aligns consuming code on breaking
  changes, cross-references CVE feeds, and runs heuristic malware
  detection on the new versions + transitively-introduced libs. Phase 2
  closes with ONE review campaign over the run's cumulative diff,
  gated by a deterministic build/test verify (ADR-058) — fixes land as
  in-stride commits until the diff is clean and the tree is green.
when_to_use: |
  Use when dependency risk is the priority: CVE alerts, stale
  lockfiles, version bumps. MUTATES dependency manifests/lockfiles and
  aligns consuming code on breaking changes. Ask before running with
  major_policy: attempt.
author: SocialGouv (devthejo) — secured-renovacy/main.bot
schema_version: 1

dispatch_vars:
  user_prompt: |-
    {{issue.title}}

    {{issue.body}}

invocations:
  - kind: command
    mode: board
    args_var: user_prompt
    command: { name: renovacy, aliases: [secured-renovacy], scope: any, min_replier_role: maintainer }
  - kind: schedule
    mode: board
    schedule: { suggested_cron: "0 4 * * 1" }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [user_prompt]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.141.0"
