name: docs-refresh
display_name: Doki
icon: 📚
version: 2.1.0
## 2.1.0 — NOOP short-circuit (openwiki-inspired). scan_docs now skips
## the whole campaign when the docs are already aligned to the exact
## current HEAD: update_audit_cache persists git_head, and a matching
## HEAD on a clean tree with no explicit request (issue_id) routes
## scan_docs -> done with zero LLM cost — killing wasteful scheduled
## runs on an unchanged repo. Also fixes a latent bug: the inter-run
## cache default moved from a repo-root dotfile (silently ephemeral
## under `worktree: auto`, which omits untracked files) to the
## host-persistent ${PROJECT_SCRATCH_DIR}, so pre_verified + noop
## actually survive across runs.
## 2.0.0 — RADICAL SIMPLIFICATION (ADR-058 minimal-framing). The
## deterministic audit machinery is KEPT in full (scan_docs footprint,
## scan_code_surface, build_manifest anchor verification with the
## severity-sorted / doc-chunked bounded working set); the alternating
## cross-family review/fix assembly line (alt → reviewer_claude/gpt →
## streak_check + its dismissed-pairs/pushback/chronic accumulators →
## fix_claude/gpt → prepare_commit → commit_changes → detect_doc_changes)
## is replaced by ONE adaptive `campaign` agent that adjudicates the
## manifest's drift set and commits each aligned doc in stride. New
## deterministic gates: scope_check (writeable-set containment vs the
## run base) + the shared verify_build/verify_run build gate; the gate
## converges on docs_aligned ∧ scope_ok ∧ build green ∧ mechanical
## coverage ≥ target. The inter-run cache now records the manifest's
## MECHANICALLY verified pairs. 16 nodes → 11; review_mode/mono_family
## retired. See docs/references/productive-session-patterns.md.
description: |
  Documentation refresh bot — one capable agent over a deterministic
  drift manifest, minimal framing. Detects mismatches between project
  documentation (README, docs/*.md, CLAUDE.md, bundled skills, Go code
  comments) and the actual current state of the code, then fixes the
  DOCS (never the code), committing each aligned doc in stride. When a
  repo has NO documentation yet, it bootstraps an initial doc set
  (configurable docs_dir, default "docs") authored from the code, then
  refreshes it through the same campaign.

  Anti-Goodhart by construction: a deterministic scanner enumerates the
  immutable doc footprint; build_manifest mechanically verifies every
  code anchor and hands the campaign a bounded, severity-sorted drift
  working set; a deterministic scope gate fails the run if anything
  outside the doc writeable-set changed; and convergence requires the
  mechanical anchor coverage to meet its target — the agent cannot
  rubber-stamp its own alignment.

  The bot ships 5 skills capturing the discipline: docs-refresh
  (playbook), doc-mismatch-taxonomy, doc-scope-enumeration,
  anti-facade-fix-rules, doc-verification-checklist.
when_to_use: |
  Use when README / CLAUDE.md / docs/**/*.md / bundled skills are
  stale versus the code, before a release, or whenever a survey flags
  code↔doc drift — or when a repo has NO docs yet and needs an initial
  set authored from the code. Fixes the DOCS only (never code logic)
  and commits.
author: SocialGouv (devthejo) — docs-refresh/main.bot
schema_version: 1

dispatch_vars:
  scope_notes: |-
    {{issue.title}}

    {{issue.body}}
  issue_id: "{{issue.identifier}}"

invocations:
  - kind: command
    mode: board
    args_var: scope_notes
    command: { name: doki, aliases: [docs-refresh], scope: any, min_replier_role: developer }
  - kind: schedule
    mode: board
    schedule: { suggested_cron: "0 3 * * *" }
  - kind: board

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are internal plumbing kept out of
## the form (still settable via --var / bot_args).
launch:
  primary: [scope_notes]
  hidden: [bundle_self_path]
