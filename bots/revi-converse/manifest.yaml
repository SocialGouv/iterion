name: revi-converse
display_name: Revi (converse)
icon: 💬
version: 0.1.8
## 0.1.8 — the agent drafts, a deterministic node posts. converse_agent
## hands its answer back in converse_output.answer and never writes on the
## forge; publish_reply (no LLM) posts it in the thread with the forge_token
## — a GitHub review-thread reply or PR comment, a GitLab discussion note or
## MR note, a Forgejo PR comment — with the anti-trigger and GitLab
## quick-action guards and the run footer, then re-reads the note by its id;
## converse_health reads its result. Posting no longer depends on how many
## steps the model spent reading: on VAO !48 a reply that took 61 steps was
## drafted and never posted, the POST being the agent's last step. The
## forge-reply skill is folded into the prompt as reading and answer-shape
## guidance. And the run's duration budget follows the agent's tool loop:
## 30 minutes, not 10 — with tool_max_steps 60 (0.1.7) a step on the team
## gateway's deepseek takes ~10-15 s, and a question that needed ~50 steps
## died on its 10-minute budget before it posted (VAO !48).
## 0.1.7 — the converse agent declares its tools (bash, read_file, glob,
## grep): a routing cell that moves it to claw (the team gateway lanes) gave
## it NO tool, so it could neither read the diff nor post and answered a
## placeholder. Its tool loop is bounded at 60 steps, review-pr's
## reviewer_claude bound: claw's default of 5 stopped short of the
## forge-reply skill's VERIFY. converse_health reads a question as answered
## only when the agent posted AND returned an http(s) reply_url on the PR's
## host (it now receives pr_url): an unanswered question is always degraded
## (its skipped_reason, when given, is the banner), and a claimed post whose
## reply_url is not such a URL ("placeholder", another host) reads
## UNVERIFIED instead of OK.
## 0.1.6 — every body it posts on a forge ends with the run that wrote it:
## the evidence behind the text, and the way into the platform for a reader
## meeting it on their own repository (AGENTS.md, docs/agents/bots/run-link.md)
## 0.1.5 — the converse agent gets review-pr 0.9.12's Anthropic pin and GLM
## route, on the same dials (ITERION_VIBE_PROVIDER_CLAUDE,
## ITERION_VIBE_MODEL_CLAUDE_FALLBACK): unpinned, a forfait skipped at a
## closed window (a provider refusal, or an operator usage cap, soft or hard)
## left a z.ai key as the run's default, which accepts
## the claude id and answers with GLM under the claude label; and with no
## route, a spent forfait left a `/revi <question>` unanswered.
## 0.1.2 — DSL profile 2 (`dsl: 2` at the head of main.bot): the paragraph
## breaks the authors wrote inside two prompts (10 in all) now reach the models
## as blank lines instead of being folded away by the profile-1 lexer.
## No instruction changed.
description: |
  Conversational sibling of Revi (review-pr). Triggered when an
  authorized forge user asks a focused QUESTION on an open pull
  request (PR; merge request on GitLab) — `/revi <question>` (e.g.
  `/revi why is the SSRF critical?`). Reads the question + the PR
  diff against the branch's merge-base, formulates a CONCISE,
  GROUNDED answer (a senior code reviewer's follow-up — not a
  fresh full review), and posts the answer as a REPLY in the same
  discussion thread via the forge_token. Never edits, fixes, or
  commits code. When `/revi` is sent without a question, the
  webhook handler routes to review-pr for a fresh re-review
  instead.
when_to_use: |
  Use when an operator asks a follow-up question on an open PR
  about Revi's earlier findings or the diff itself — clarification,
  rationale, severity justification, alternative fixes. NOT for
  re-reviewing the PR (that is review-pr / Revi), NOT for editing
  code (that is Billy or Featurly), NOT for triaging issues on the
  board.
author: SocialGouv (devthejo) — revi-converse/main.bot
category: verify
tags: [code-review, conversational, read-only]
schema_version: 1
triggers: [revi-converse, ask, converse]

# Forge-access requirements for the studio Integrations auto-provisioner
# (advisory + discovery-time — the runtime does not read this).
forge:
  # pull_request_comment feeds /revi <question>; pull_request_review_comment
  # feeds reply-to-a-suggestion (the GitHub review-thread firehose — only
  # this bot's presence makes a repo subscribe it). No PR-open auto-trigger.
  events: [pull_request_comment, pull_request_review_comment]
  token_scopes:
    pull_requests: write     # reply in-thread via the forge_token
    repository: read
  secret: forge_token
  webhook:
    min_replier_role: developer
  rationale: |
    Revi-converse only answers focused /revi <question> notes on an
    open pull request. It never edits code or posts a fresh
    review.

invocations:
  - kind: command
    mode: direct
    args_var: converse_question
    command: { name: revi, scope: pr, disambiguator: when_args_present, min_replier_role: developer }

## Studio launch-form hierarchy: `primary` inputs render top-level in
## the declared order; `hidden` vars are dispatch/webhook plumbing kept
## out of the form (still settable via --var / bot_args).
launch:
  primary: [converse_question, pr_url]
  hidden: [discussion_id, trigger_note, thread_context, replier]

## Profile 2 (`dsl: 2` at the head of main.bot): a runner older than the
## release that reads the profile would refuse the header as an unknown
## declaration — the floor keeps such a runner from admitting the bundle.
requires:
  iterion: ">= 3.225.0"
